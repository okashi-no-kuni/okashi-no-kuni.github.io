<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>えいごの おかしの国 — UIイメージ</title>
<!-- 英語学習ゲームの UIイメージ（モック）。
     ここは「絵を 決めるため」の 板で、ゲーム本体では ありません。
     配色・角丸・かげ・文字づかいは CLAUDE.md の アートディレクションに そろえてあります。
     キャラは 既存の art/sprites/ を そのまま つかいます
     （新しく 絵を 出さずに 見た目を 決められるため）。 -->
<style>
  :root{
    --pink:#ff8fc4; --pink-d:#e05f9e; --pink-l:#ffd9ec;
    --lav:#c9a7ff;  --lav-d:#8f6fd6;
    --mint:#8fe3c4; --mint-d:#35a883;
    --cream:#fff6e9; --ink:#6b4a63; --aqua:#2e9fc9; --gold:#ffcf5a;
    --card:rgba(255,255,255,.72); --line:rgba(255,255,255,.9);
    --sh:rgba(120,90,120,.18);           /* かげは 黒では なく 紫がかった 半とうめい */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#f6eef7; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-weight:800; padding:26px; -webkit-font-smoothing:antialiased;
  }
  h1.pt{font-size:20px;color:var(--pink-d);margin-bottom:4px}
  p.pn{font-size:13px;font-weight:700;opacity:.7;margin-bottom:20px}
  .row{display:flex;flex-wrap:wrap;gap:26px}
  figure{width:393px}
  figcaption{font-size:13px;margin-top:8px;color:var(--pink-d);line-height:1.5}
  figcaption span{display:block;font-size:11.5px;font-weight:700;color:var(--ink);opacity:.72}

  /* ============ 画面のわく（iPhone 実寸 393x852） ============ */
  .phone{
    position:relative;width:393px;height:852px;overflow:hidden;border-radius:34px;
    /* 背景は 上から下へ ピンク → 藤 → 水色。radial を 重ねて 奥ゆきを 出す */
    background:
      radial-gradient(90% 60% at 20% 0%,  #fff0f8 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 28%, #eef0ff 0%, transparent 60%),
      linear-gradient(180deg,#ffe6f3 0%, #f3e8ff 55%, #e6f6ff 100%);
    box-shadow:0 14px 40px rgba(150,110,150,.28);
  }
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 10px 20px;gap:7px}

  /* ============ キラキラ（4方向に とがった 星） ============ */
  .sp{position:absolute;background:#fff;opacity:.85;
    clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
  .sp.p{background:var(--pink-l)} .sp.l{background:#e4d4ff} .sp.g{background:#ffe9b3}

  /* ============ 共通の 部品 ============ */
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;
    box-shadow:0 4px 14px rgba(190,140,180,.22)}
  .btn{border:none;border-radius:18px;color:#fff;font-family:inherit;font-weight:800;
    background:linear-gradient(180deg,#ffa6d0,var(--pink));
    box-shadow:0 4px 0 var(--pink-d), 0 6px 16px rgba(224,95,158,.3);
    padding:12px 18px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn.lav{background:linear-gradient(180deg,#dcc6ff,var(--lav));box-shadow:0 4px 0 var(--lav-d),0 6px 16px rgba(143,111,214,.28)}
  .btn.mint{background:linear-gradient(180deg,#aef0d6,var(--mint));box-shadow:0 4px 0 var(--mint-d),0 6px 16px rgba(53,168,131,.26)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:14px}

  /* HUD（3つの札）。中みが 出たり 消えたり しても 高さが 変わらない ように
     下の行は からでも 場所を とらせる */
  .hud{display:flex;gap:6px}
  .stat{flex:1;padding:5px 4px;text-align:center;line-height:1.12}
  .stat .k{font-size:10px;opacity:.6;letter-spacing:.06em}
  .stat .v{font-size:20px;display:flex;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:9.5px;color:#e0a52e;min-height:12px}
  .stat .sub.pk{color:var(--pink-d)}

  /* ステージの 帯 */
  .stage{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:16px}
  .stage .wv{font-size:12px;color:#fff;background:linear-gradient(180deg,#ffa6d0,var(--pink));
    border-radius:11px;padding:3px 9px;box-shadow:0 2px 0 var(--pink-d)}
  .stage .nm{font-size:14.5px}
  .stage .dots{margin-left:auto;display:flex;gap:4px}
  .stage .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:inset 0 0 0 2px rgba(224,95,158,.3)}
  .stage .dots i.on{background:var(--pink);box-shadow:0 2px 0 var(--pink-d)}
  .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(120,90,120,.2)}
  .bar i{display:block;height:100%;border-radius:9px;
    background:linear-gradient(90deg,var(--mint),#ffe07a 60%,var(--pink))}

  /* ============ マッチングの 盤面 ============ */
  .board{position:relative;flex:1;display:grid;grid-template-columns:168px 1fr 152px;
    grid-template-rows:repeat(4,1fr);gap:14px 0;margin-top:4px}
  .board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .mc{position:relative;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:18px;
    border:2px solid rgba(255,255,255,.95);
    box-shadow:0 4px 0 rgba(224,95,158,.18), 0 5px 12px var(--sh)}
  .mc.ja{background:linear-gradient(180deg,#fff,#ffeaf4)}
  .mc.en{background:linear-gradient(180deg,#fff,#efe6ff);justify-content:center}
  .mc img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 2px 3px var(--sh));flex:0 0 60px}
  .mc .w{font-size:20px;line-height:1.1;white-space:nowrap}
  .mc .en{font-size:24px;letter-spacing:.01em;color:#5d4a86}
  /* えらんでいる 札。ふちを こく して 光の わくを 出す */
  .mc.sel{border-color:var(--pink-d);box-shadow:0 0 0 4px rgba(255,143,196,.38),0 4px 0 var(--pink-d),0 8px 16px rgba(224,95,158,.3);
    transform:translateY(-1px)}
  /* そろった 札。ミントに して ✓。もう おせない ことを うすさでも 見せる */
  .mc.done{background:linear-gradient(180deg,#f2fffa,#d8f7ea);border-color:#eafff8;
    box-shadow:0 3px 0 rgba(53,168,131,.22),0 4px 10px var(--sh)}
  .mc.done .w,.mc.done .en{opacity:.75}
  .mc.done::after{content:"✓";position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-size:18px;color:var(--mint-d)}
  .mc.en.done::after{right:6px}
  .mc .sp{width:10px;height:10px}

  /* まん中の つなぎめ（マッチの しるし） */
  .knot{display:flex;align-items:center;justify-content:center;font-size:15px}

  /* ワザ的な 下のボタン列 */
  .tools{display:flex;gap:6px;align-items:center}
  .tool{flex:1;border-radius:15px;padding:7px 4px;text-align:center;font-size:11.5px;line-height:1.25;
    background:rgba(255,255,255,.7);border:2px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(224,95,158,.16)}
  .tool b{display:block;font-size:19px;line-height:1.25}
  .tool.on{background:linear-gradient(180deg,#fff,#ffeaf4);border-color:var(--pink);color:var(--pink-d)}
  .tool.off{opacity:.62}

  /* 足もとの ひとこと（マスコット） */
  .say{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px}
  .say img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 3px var(--sh))}
  .say p{font-size:13px;line-height:1.35}
  .say p b{color:var(--pink-d)}

  /* ============ 発音の 画面 ============ */
  .dim{position:absolute;inset:0;background:rgba(108,74,104,.36);backdrop-filter:blur(2px)}
  .pop{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);
    background:linear-gradient(180deg,#fffdfa,#fff2f9);border:3px solid #fff;border-radius:28px;
    box-shadow:0 16px 36px rgba(120,90,120,.34);padding:18px 16px 16px;text-align:center}
  .pop .yay{position:absolute;left:50%;top:-16px;transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe07a,var(--gold));color:#fff;font-size:15px;
    padding:5px 20px;border-radius:14px;box-shadow:0 4px 0 #e5a63c,0 6px 14px rgba(229,166,60,.34);white-space:nowrap}
  .pop>img{width:126px;height:126px;object-fit:contain;filter:drop-shadow(0 6px 8px var(--sh));margin:6px 0 2px}
  .pop .big{font-size:44px;color:#fff;letter-spacing:.02em;line-height:1.1;
    text-shadow:2px 2px 0 var(--pink), 0 5px 0 rgba(224,95,158,.42), 0 10px 16px rgba(224,95,158,.3)}
  .pop .ipa{font-size:14px;font-weight:700;color:var(--lav-d);margin-top:3px}
  .pop .ja{font-size:20px;color:var(--pink-d);margin-top:6px}
  /* 音が 鳴っている しるし。止まった 絵でも 分かるように わっかを 3つ 出す */
  .ring{position:relative;width:86px;height:86px;margin:34px auto 12px}
  .ring i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--mint);opacity:.55}
  .ring i:nth-child(2){inset:-12px;opacity:.3}
  .ring i:nth-child(3){inset:-24px;opacity:.16}
  .ring b{position:absolute;inset:8px;border-radius:50%;font-size:38px;color:#fff;
    background:linear-gradient(180deg,#aef0d6,var(--mint));display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 var(--mint-d),0 6px 14px rgba(53,168,131,.3)}
  .pop .btns{display:flex;gap:8px;margin-top:12px}
  .pop .btns .btn{flex:1}
  .pop .note{font-size:10.5px;font-weight:700;opacity:.62;margin-top:8px}

  /* ============ クリア画面 ============ */
  .clr{margin:auto 2px;text-align:center;padding:18px 14px 16px;border-radius:26px;
    background:linear-gradient(180deg,#fffdfa,#fff2f9);border:3px solid #fff;
    box-shadow:0 14px 32px rgba(120,90,120,.28)}
  .clr h2{font-size:27px;color:var(--pink-d);line-height:1.2}
  .clr .rank{font-size:13px;color:var(--gold);margin-top:2px}
  .sc{display:flex;gap:7px;margin:12px 0 4px}
  .sc div{flex:1;border-radius:15px;padding:7px 2px;background:rgba(255,255,255,.8);
    border:2px solid #fff;box-shadow:0 3px 0 rgba(224,95,158,.14)}
  .sc em{display:block;font-size:10px;font-style:normal;opacity:.6}
  .sc b{font-size:19px;color:var(--aqua)}
  .rew{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px;
    padding:9px;border-radius:16px;background:linear-gradient(180deg,#fff9e8,#ffefc9);border:2px solid #fff}
  .rew span{font-size:21px;color:#e0a52e}
  .nxt{margin-top:12px;padding:11px 10px;border-radius:18px;text-align:left;
    background:rgba(255,255,255,.78);border:2px dashed rgba(224,95,158,.35)}
  .nxt .h{font-size:11px;opacity:.6}
  .nxt .t{font-size:16px;color:var(--lav-d);margin:2px 0 5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12px;padding:3px 9px;border-radius:11px;background:#fff;color:#5d4a86;
    box-shadow:0 2px 0 rgba(143,111,214,.22)}
  .clr .btn{margin-top:13px;width:100%}

  /* ============ ウェーブの みちのり ============ */
  .head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:16px}
  .head h2{font-size:17px;color:var(--pink-d)}
  .head .x{margin-left:auto;width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.8);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--pink-d);
    box-shadow:0 3px 0 rgba(224,95,158,.18)}
  .wl{display:flex;flex-direction:column;gap:7px;overflow:hidden;position:relative}
  .wv1{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:17px;
    background:rgba(255,255,255,.72);border:2px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(224,95,158,.14)}
  .wv1 .n{flex:0 0 34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:0 3px 0 var(--pink-d)}
  .wv1.cur{border-color:var(--pink);background:linear-gradient(180deg,#fff,#ffeaf4);
    box-shadow:0 0 0 3px rgba(255,143,196,.3),0 4px 0 var(--pink-d)}
  .wv1.lock{opacity:.6}
  .wv1.lock .n{background:linear-gradient(180deg,#e8def5,#cdbfe0);box-shadow:0 3px 0 #b3a3c9}
  .wv1 .b1{font-size:14.5px;line-height:1.25}
  .wv1 .b2{font-size:11px;font-weight:700;opacity:.72;margin-top:1px}
  .wv1 .r{margin-left:auto;text-align:right;flex:0 0 auto}
  .wv1 .st{font-size:11px;color:var(--gold);letter-spacing:.5px}
  .wv1 .tag{font-size:10px;color:var(--mint-d)}
  .fade{position:absolute;left:0;right:0;bottom:0;height:46px;
    background:linear-gradient(180deg,transparent,#eaf1fb)}

  /* ============ おとの せってい ============ */
  .set{display:flex;flex-direction:column;gap:7px}
  .sw{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:17px;
    background:rgba(255,255,255,.74);border:2px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(224,95,158,.13)}
  .sw .ic{font-size:21px;flex:0 0 26px;text-align:center}
  .sw .t1{font-size:14.5px}
  .sw .t2{font-size:10.5px;font-weight:700;opacity:.65;margin-top:1px}
  .tg{margin-left:auto;flex:0 0 54px;width:54px;height:30px;border-radius:15px;position:relative;
    background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:inset 0 2px 4px rgba(224,95,158,.35)}
  .tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px var(--sh)}
  .tg.off{background:rgba(190,170,200,.45);box-shadow:inset 0 2px 4px rgba(120,90,120,.2)}
  .tg.off::after{right:auto;left:3px}
  .seg{display:flex;gap:5px;margin-left:auto}
  .seg b{font-size:11.5px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.9);color:#9a86a8;
    box-shadow:0 2px 0 rgba(120,90,120,.12)}
  .seg b.on{background:linear-gradient(180deg,#ffa6d0,var(--pink));color:#fff;box-shadow:0 2px 0 var(--pink-d)}
  .sl{padding:9px 12px 11px;border-radius:17px;background:rgba(255,255,255,.74);
    border:2px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(224,95,158,.13)}
  .sl .lb{display:flex;font-size:14.5px;align-items:center;gap:8px}
  .sl .lb em{margin-left:auto;font-style:normal;font-size:12px;color:var(--pink-d)}
  .track{position:relative;height:10px;border-radius:9px;margin:13px 4px 4px;
    background:rgba(190,170,200,.35);box-shadow:inset 0 1px 3px rgba(120,90,120,.18)}
  .track i{display:block;height:100%;width:46%;border-radius:9px;background:linear-gradient(90deg,var(--mint),var(--pink))}
  .track b{position:absolute;top:50%;left:46%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;
    background:#fff;box-shadow:0 3px 6px var(--sh),inset 0 0 0 3px var(--pink)}
  .track u{position:absolute;top:16px;font-size:10px;font-weight:700;opacity:.6;text-decoration:none}
  .tip{font-size:11px;font-weight:700;line-height:1.5;opacity:.72;padding:2px 6px}

  /* ============ コース選び（小学〜大学） ============ */
  .cs1{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:20px;
    background:rgba(255,255,255,.74);border:2px solid rgba(255,255,255,.95);
    box-shadow:0 4px 0 rgba(224,95,158,.14)}
  .cs1.cur{border-color:var(--pink);background:linear-gradient(180deg,#fff,#ffeaf4);
    box-shadow:0 0 0 3px rgba(255,143,196,.28),0 4px 0 var(--pink-d)}
  .cs1 img{width:56px;height:56px;object-fit:contain;flex:0 0 56px;filter:drop-shadow(0 2px 3px var(--sh))}
  .cs1 .b{flex:1;min-width:0}
  .cs1 .t{font-size:16px;line-height:1.2}
  .cs1 .g{font-size:10.5px;font-weight:700;opacity:.66;margin-top:2px}
  .cs1 .pb{height:7px;border-radius:8px;background:rgba(190,170,200,.3);margin-top:6px;overflow:hidden}
  .cs1 .pb i{display:block;height:100%;border-radius:8px;
    background:linear-gradient(90deg,var(--mint),#ffe07a 55%,var(--pink))}
  .cs1 .pn{font-size:10px;font-weight:700;color:var(--pink-d);margin-top:3px}
  .cs1 .lv{flex:0 0 auto;text-align:center;font-size:10px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#dcc6ff,var(--lav));border-radius:10px;padding:3px 7px;
    box-shadow:0 2px 0 var(--lav-d)}
  .cs1.lock{opacity:.66}
  .cs1.lock .lv{background:linear-gradient(180deg,#e8def5,#cdbfe0);box-shadow:0 2px 0 #b3a3c9}

  /* ============ 上級の 盤面（絵なし・6組） ============ */
  .board6{position:relative;flex:1;display:grid;grid-template-columns:1fr 46px 1fr;
    grid-template-rows:repeat(6,1fr);gap:9px 0;margin-top:4px}
  .board6 svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .mc.adv{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:6px 10px}
  .mc.adv .en{font-size:19px;line-height:1.15}
  .mc.adv .ipa2{font-size:10.5px;font-weight:700;color:#9a86a8;letter-spacing:.01em}
  .mc.adv.ja2{align-items:center}
  .mc.adv .jw{font-size:17px}
  .mc .tag{position:absolute;right:8px;top:6px;font-size:9.5px;padding:1px 6px;border-radius:8px;
    background:rgba(201,167,255,.3);color:#7a5fc0}
  .mc.done .tag{background:rgba(143,227,196,.34);color:var(--mint-d)}
  .mc.adv.done::after{right:9px;top:auto;bottom:6px;transform:none;font-size:15px}

  /* 例文（上級の 発音カード） */
  .ex{margin-top:10px;padding:9px 11px;border-radius:15px;text-align:left;
    background:rgba(255,255,255,.85);border:2px solid #fff}
  .ex .e1{font-size:14px;color:#5d4a86;line-height:1.35}
  .ex .e1 b{color:var(--pink-d)}
  .ex .e2{font-size:11.5px;font-weight:700;opacity:.68;margin-top:3px}
  .meta{display:flex;gap:5px;justify-content:center;margin-top:7px;flex-wrap:wrap}
  .meta b{font-size:10.5px;padding:2px 8px;border-radius:10px;background:rgba(201,167,255,.26);color:#7a5fc0}
  .meta b.g2{background:rgba(255,207,90,.3);color:#c68a12}

  /* ============ 表紙 ============ */
  .ttl{margin-top:146px;text-align:center}
  .ttl .sub2{font-size:13px;color:var(--lav-d);letter-spacing:.22em}
  .ttl .lg{font-size:41px;color:#fff;line-height:1.34;margin-top:8px;
    text-shadow:2px 2px 0 var(--pink), 0 6px 0 rgba(224,95,158,.4), 0 12px 20px rgba(224,95,158,.32)}
  .ttl .lg small{font-size:26px;display:block}
  .ttl .rom{font-size:11.5px;letter-spacing:.3em;color:var(--pink-d);margin-top:16px;opacity:.9}
  .ttl .age{display:flex;justify-content:center;gap:5px;margin-top:14px}
  .ttl .age b{font-size:11px;padding:4px 9px;border-radius:11px;background:rgba(255,255,255,.8);
    color:var(--pink-d);box-shadow:0 2px 0 rgba(224,95,158,.18)}
  /* にじ。まん中が あきすぎて さびしかったので、なかまの うしろに 敷く */
  .rainbow{position:absolute;left:50%;bottom:196px;transform:translateX(-50%);
    width:560px;height:330px;opacity:.55;pointer-events:none;
    background:radial-gradient(circle 300px at 50% 100%, transparent 0 48%,
      #ffd1e8 48% 56%, #ffe6b8 56% 63%, #d7f5e2 63% 70%, #cfe9ff 70% 77%, #e2d6ff 77% 84%, transparent 84%);
    -webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 96%);
            mask-image:linear-gradient(180deg,#000 52%,transparent 96%)}
  .cast{position:absolute;left:0;right:0;bottom:300px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .cast img{object-fit:contain;filter:drop-shadow(0 5px 7px var(--sh))}
  /* 表紙の「はじめる」は いつも 金の ふちで 光らせる（いちばん 押してほしい ところ）*/

</div>
<script>
/* リボン（正解の 組・いま つないでいる 線）は 札の いちを 測って 引く。
   札の 大きさを 変えるたびに 数字を 書きなおすと、かならず ずれるため。
   [左の行, 右の行, しゅるい] —— done＝ミントの リボン／now＝いま つないでいる 点線 */
const BOARDS = [
  { sel:'#f3 .board',  svg:'ribbon',  links:[[0,1,'done'],[2,0,'done'],[1,3,'now']] },
  { sel:'#f4 .board6', svg:'ribbon6', links:[[0,1,'done'],[2,0,'done'],[1,3,'now']] },
];
for (const B0 of BOARDS){
  const board = document.querySelector(B0.sel);
  const svg   = document.getElementById(B0.svg);
  /* 左の列＝1つめ、右の列＝2つめ。初級は 左が 日本語、上級は 左が 英語 */
  const cells = [...board.children].filter(n => n.classList.contains('mc'));
  const left  = cells.filter((_,i) => i % 2 === 0);
  const right = cells.filter((_,i) => i % 2 === 1);
  const B = board.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${B.width} ${B.height}`);
  const mid = el => { const r = el.getBoundingClientRect();
    return { l:r.left-B.left, r:r.right-B.left, y:r.top-B.top+r.height/2 }; };
  for (const [a,b,kind] of B0.links){
    const L = mid(left[a]), R = mid(right[b]);
    const x1 = L.r, x2 = R.l, cx = (x2-x1)*0.55;
    const ex = kind === 'now' ? x2 - 6 : x2;   /* つないでいる 線は 札の 手前で 止める */
    const d  = `M${x1} ${L.y} C${x1+cx} ${L.y} ${ex-cx} ${R.y} ${ex} ${R.y}`;
    const add = (w,c,dash,op) => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke',c);
      p.setAttribute('stroke-width',w); p.setAttribute('stroke-linecap','round');
      if (dash) p.setAttribute('stroke-dasharray',dash);
      p.setAttribute('opacity',op); svg.appendChild(p);
    };
    if (kind === 'done'){ add(8,'#8fe3c4',0,.95); add(2.5,'#fff',0,.7); }
    else {
      add(5,'#ff8fc4','9 8',1);
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',ex); c.setAttribute('cy',R.y); c.setAttribute('r',8);
      c.setAttribute('fill','#fff'); c.setAttribute('opacity','.92'); svg.appendChild(c);
    }
  }
}
</script>
