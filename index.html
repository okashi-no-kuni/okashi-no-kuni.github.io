<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd9ec">
<title>まほうのおかしの国をまもって</title>
<!-- ホーム画面に 追加したときの アイコン。
     apple-touch-icon が ないと、iPhone は ページの 縮小画像を アイコンに してしまう。
     絵は tools/make-icons.mjs が 作る（手で 画像を 作らないこと）-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おかしの国">
<style>
  :root{
    --pink:#ff8fc4;
    --pink-d:#e05f9e;
    --lav:#c9a7ff;
    --mint:#8fe3c4;
    --aqua:#2e9fc9;   /* いま持っている数につかう水色。白の上でも読めるこさにしてある */
    --cream:#fff6e9;
    --ink:#6b4a63;
    --card:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.9);
    /* 文字の 大きさの ばいりつ。ここ 1つで ぜんぶの 文字が かわる。
       絵文字アイコン（21px以上）は 入れものの 大きさが 決まっているので かけない */
    --fs:1.10;
    /* よこに 5つ ならぶ タイル（仲間バー・ワザ枠）の 中の 文字だけは
       別あつかい。はばが 画面の 5分の1で 決まっているので、少しでも
       大きくすると「キャンディ」「図鑑から貼る」が おりかえして
       5つの 高さが そろわなくなる。ここは 大きくできない */
    --fsT:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{
    margin:0;
    /* iOS と Android は 画面より ひろい ブロックの 中の 文字を
       かってに 大きくする。そうなると 札に 入るはずの 文字が はみ出すので
       止めておく */
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    font-weight:800;
    color:var(--ink);
    background:
      radial-gradient(90% 60% at 20% 0%,  #fff0f8 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 30%, #eef0ff 0%, transparent 60%),
      linear-gradient(180deg,#ffe6f3 0%, #f3e8ff 55%, #e6f6ff 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    overflow-x:hidden;user-select:none;
  }
  /* たての すきまと 余白は 1つ けずるごとに 盤面が 12ぶんの1マス 大きくなる
     （盤面は たて12マスで、下のUIの高さを 引いた のこりを つかうため）。
     よこの 10px は へらさない ——盤面は たて長で、あまるのは 横なので 意味がない */
  /* 下の 余白は 20px + セーフエリア。**5px では 足りなかった**（実機の 報告）。
     ボタンの かげ（box-shadow 0 4px 0 と そのしたの 0 6px 16px の ぼかし）は
     getBoundingClientRect() に 入らないので、resize() が 測る 高さより
     20pxほど 下に はみ出す。iPhoneの ホームバーの ぶんも いる。
     なお 実際の すき間は 「この余白 ＋ マスの 切り上げ ぶん（0〜11px）」。
     ここを 14px に しても 切り上げが 吸って 見た目が 変わらなかった */
  #app{width:100%;max-width:480px;padding:5px 10px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px}

  /* ---------- HUD ---------- */
  #hud{display:flex;gap:6px}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    box-shadow:0 4px 14px rgba(190,140,180,.22);backdrop-filter:blur(6px);
  }
  .stat{flex:1;padding:4px 4px;text-align:center;line-height:1.1}
  .stat .k{font-size:calc(10px * var(--fs));opacity:.6;letter-spacing:.06em}
  .stat .v{font-size:calc(19px * var(--fs));font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:3px}
  /* 3つの札とも かならず 1行 つくる。中みが 出たり 消えたり すると
     HUDの 高さが かわり、盤面が びくびく 動く（ウェーブのボタンと おなじ話）*/
  .stat .sub{font-size:calc(9px * var(--fs));color:#e0a52e;line-height:1.2;min-height:calc(11px * var(--fs))}
  /* げんき（たたかい中の たいりょく）。ばんめんの 上の バーは
     ステージ名が 見えにくいので 外し、ここに 出すことにした */
  .stat .sub.gk{color:var(--pink-d)}
  .stat .sub.gk.low{color:#e0466d;animation:blink .6s infinite alternate}
  #hpBox.low .v{color:#ff5a8a;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.45}}

  /* ---------- board ---------- */
  #wrap{position:relative;align-self:center}
  canvas{display:block;border-radius:20px;touch-action:none;
    box-shadow:0 8px 26px rgba(180,130,175,.3), inset 0 0 0 3px rgba(255,255,255,.85)}

  /* ---------- bottom panel ---------- */
  /* 高さを 決めうちにするのは、タワーを えらぶと ショップが 情報カードに
     入れかわるため。かわるたびに 盤面が のびちぢみして びくびく 動く */
  #panel{min-height:83px}
  /* おかし4つ＋なかまえらび で 5つ ならぶ */
  #shop{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:3px 5px}
  .tw{
    position:relative;border:2px solid transparent;border-radius:14px;padding:2px 2px 2px;
    background:rgba(255,255,255,.6);cursor:pointer;text-align:center;line-height:1.15;
    transition:transform .1s, border-color .1s;
  }
  .twC{color:var(--aqua);font-weight:800}
  .tw:active{transform:scale(.94)}
  .tw.sel{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px rgba(255,143,196,.28)}
  .tw.poor{opacity:.42}
  /* 絵の枠は高さを決めうちにして、まんなかにおく。
     こうしておくと 中の絵の大きさを変えても、下の名前とねだんの位置がずれない */
  .tw .ic{height:40px;display:flex;align-items:center;justify-content:center}
  .tw .ic canvas{display:block}
  .tw .nm{font-size:calc(10.5px * var(--fsT))}
  /* 「⭐110 ×2」が おりかえすと 4つの 高さが そろわないので おらせない */
  .tw .cs{font-size:calc(10.5px * var(--fsT));color:var(--pink-d);white-space:nowrap}

  #info{display:none;padding:7px 11px;gap:8px;align-items:center}
  #info.on{display:flex}
  #infoIc{font-size:31px}
  #infoTx{flex:1;font-size:calc(11.5px * var(--fs));line-height:1.5}
  #infoTx b{font-size:calc(14px * var(--fs))}
  .mini{border:none;border-radius:12px;padding:9px 11px;font:inherit;font-size:calc(12px * var(--fs));color:#fff;
    background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:0 3px 0 var(--pink-d);cursor:pointer}
  .mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
  .mini.gray{background:linear-gradient(180deg,#cfc4dd,#a898bd);box-shadow:0 3px 0 #857399}
  .mini:disabled{opacity:.4}

  /* ---------- なかまワザ（タスクバー：横スクロール・7スロット） ---------- */
  #skillBar{display:flex;gap:5px;padding:3px 5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;flex-shrink:0}
  .sk{flex:0 0 68px;scroll-snap-align:start;position:relative;border:none;border-radius:12px;
    padding:3px 2px 4px;font:inherit;background:rgba(255,255,255,.6);cursor:pointer;
    text-align:center;line-height:1.1;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:60px}
  .sk.empty{border:2px dashed rgba(185,138,224,.45);background:rgba(255,255,255,.3);color:#b98ae0}
  .sk.off{opacity:.45}
  .sk:active{transform:scale(.95)}
  .sk:disabled{opacity:.45}
  .sk canvas{display:block;margin:0 auto}
  .sk.it{background:linear-gradient(180deg,#fff6fb,#ffe9f4);box-shadow:0 3px 0 #f0c6dd}
  .sk.it.aim{outline:3px solid #ffd76e;outline-offset:-3px}
  .itIc{height:38px;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:38px}
  .itIc img{display:block;width:38px;height:38px}
  .skN{font-size:calc(9.5px * var(--fsT))}
  .skC{font-size:calc(9.5px * var(--fsT));color:var(--pink-d)}
  .skCd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.66);border-radius:12px;font-size:calc(17px * var(--fs));color:var(--pink-d)}
  .skStock{position:absolute;top:-4px;right:-3px;background:linear-gradient(180deg,#ffb3dc,var(--pink));
    color:#fff;font-size:calc(9px * var(--fs));border-radius:9px;padding:1px 4px;box-shadow:0 1px 0 var(--pink-d)}

  /* ---------- controls ---------- */
  #ctrl{display:flex;gap:6px}
  /* **高さは 決めうちにすること。**中みが 1行（次のウェーブ）から 2行
     （ウェーブN／進行中）に かわるたびに 行が のびて、盤面の 高さを
     はかり直していないので 下が 画面の 外に 出る（実機の 報告）。
     #panel の min-height と おなじ 考えかた */
  .btn{
    flex:1;border:none;border-radius:16px;padding:0 6px;height:46px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    line-height:1.15;overflow:hidden;
    font:inherit;font-size:calc(15px * var(--fs));color:#fff;
    background:linear-gradient(180deg,#ffb3dc,var(--pink));
    box-shadow:0 4px 0 var(--pink-d), 0 6px 16px rgba(224,95,158,.3);cursor:pointer;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
  .btn.sm{flex:0 0 50px;font-size:calc(17.5px * var(--fs));line-height:1.03;
    background:linear-gradient(180deg,#c9b6ff,#a586f5);box-shadow:0 4px 0 #7d5fd0}
  /* 2行の 知らせ（進行中・早よび・ボーナス）は 字を 小さく。
     「次のウェーブ」は いちばん おす ボタンなので 大きいまま のこす。
     waveBtn() が <br> を 見て この class を つける */
  #btnWave.two{font-size:calc(12px * var(--fs))}
  /* せまい画面では 左のボタンの はばが 足りず、字が 3行4行に 折れる。
     まるいボタンを つめて 字も 小さくし、2行までに おさめる */
  @media (max-width:389px){
    .btn.sm{flex:0 0 44px;font-size:calc(16px * var(--fs))}
    #btnWave{font-size:calc(13px * var(--fs))}
    #btnWave.two{font-size:calc(10.5px * var(--fs))}
  }
  @media (max-width:344px){
    .btn.sm{flex:0 0 40px}
    #btnWave{font-size:calc(11px * var(--fs))}
    #btnWave.two{font-size:calc(9.5px * var(--fs))}
  }
  .btn.sm:active{box-shadow:0 1px 0 #7d5fd0}
  /* いま ひらいている画面の ボタン。もう一度 おすと とじる目じるし */
  .btn.sm.on{background:linear-gradient(180deg,#ffa6d0,var(--pink));box-shadow:0 4px 0 var(--pink-d)}
  /* はじめての人にだけ、ガイドの ありかを 教える。
     場所を 1pxも とらない ように、文字では なく 光で 知らせる
     （説明文を 消したので、📕 が ゆいいつの 入り口になった）*/
  /* 金の ふちは ずっと 出しておく（うごきが 止まって見える 一しゅんでも
     気づけるように）。その上に 波紋を くりかえす */
  .btn.sm.hint{box-shadow:0 4px 0 #7d5fd0, 0 0 0 3px #ffd76e;
    animation:hintGlow 1.8s ease-out infinite}
  @keyframes hintGlow{
    0%  {box-shadow:0 4px 0 #7d5fd0, 0 0 0 3px #ffd76e, 0 0 0  3px rgba(255,199,64,.9)}
    70% {box-shadow:0 4px 0 #7d5fd0, 0 0 0 3px #ffd76e, 0 0 0 12px rgba(255,199,64,0)}
    100%{box-shadow:0 4px 0 #7d5fd0, 0 0 0 3px #ffd76e, 0 0 0 12px rgba(255,199,64,0)}
  }
  /* うごきを へらす せっていの人は ふちだけ（iOSの アクセシビリティ）*/
  @media (prefers-reduced-motion:reduce){ .btn.sm.hint{animation:none} }
  .mini.on{filter:brightness(1.1) saturate(1.15)}
  .btn:disabled{opacity:.45}

  /* ---------- overlay ---------- */
  /* ---------- 表紙（タイトル） ---------- */
  #titleOv{position:fixed;inset:0;z-index:40;display:none}
  #titleOv.on{display:block;animation:tFade .45s ease}
  @keyframes tFade{from{opacity:0}to{opacity:1}}
  #titleCv{position:absolute;inset:0;display:block}
  /* 文字は DOM。丸ゴシックが そのまま つかえて、どの 画面幅でも 読める。
     表紙だけは 盤面の ボタンと 書きぶりを 変えます ——
     こい色の 3D かげと 絵文字は「小さい子むけ」に 見えるので、
     字づめ・細いけい線・小さな ローマ字で 落ちつかせる */
  #titleIn{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;gap:0;
    padding:0 22px calc(30px + env(safe-area-inset-bottom));text-align:center}
  /* 読みあげ用にだけ のこす 題字（見た目は canvas がわ）*/
  .tSr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  #titleGo{position:relative;flex:0 0 auto;width:min(64%,262px);height:52px;
    border:2px solid rgba(214,166,84,.92);border-radius:999px;overflow:hidden;
    font-family:inherit;font-size:calc(16.5px * var(--fs));font-weight:700;color:#fff;
    letter-spacing:.10em;text-indent:.10em;cursor:pointer;
    background:linear-gradient(180deg,#ffb0d2,#f4789f);
    box-shadow:0 8px 22px rgba(190,105,150,.40),
               inset 0 1px 0 rgba(255,255,255,.70),
               inset 0 0 0 2px rgba(255,255,255,.55),
               0 0 0 1px rgba(255,236,196,.55);
    animation:tBob 3.2s ease-in-out infinite}
  /* 光が すべる。見本の ボタンの きらめき */
  #titleGo::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.72),rgba(255,255,255,0));
    transform:skewX(-18deg);animation:tSweep 3.6s ease-in-out infinite;pointer-events:none}
  @keyframes tSweep{0%{left:-60%}55%,100%{left:130%}}
  #titleGo:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(190,105,150,.34)}
  @keyframes tBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* 「はじめる」を おしたら 文字を すっと 消す（光の わっかは canvas がわ）*/
  #titleOv.out #titleIn{opacity:0;transform:translateY(-8px) scale(1.04);
    transition:opacity .30s ease,transform .46s cubic-bezier(.3,.9,.4,1)}
  @media (prefers-reduced-motion:reduce){
    #titleGo,#titleGo::after{animation:none} }
  @media (max-height:620px){ #titleGo{height:48px} }
  /* 1まいの 絵の モード。ボタンの 絵は 表紙に 焼きこまれているので、
     DOM の ボタンは **当たり判定と 読みあげだけ** のこして すきとおらせる
     （大きさと いちは titleBakePoster が 絵に 合わせて 入れます）。
     ふわふわ（tBob）は 止めること —— 絵の ボタンは 動かないので、
     DOM だけ 動くと 押せる ところが 絵から ずれます。
     光のすべり（::after）は のこす。絵の ボタンの 上を すべって 見えるので、
     これだけで 動きが 出て、ボタンだけの PNG（137KB）を 足さずに すむ */
  #titleOv.poster #titleGo{
    background:none;border:0;box-shadow:none;
    color:transparent;text-shadow:none;animation:none}
  /* すきとおっているので translateY では 押した ことが わからない。
     白く さっと 光らせて 手ごたえを 出す */
  #titleOv.poster #titleGo:active{
    transform:none;background:rgba(255,255,255,.30);box-shadow:none}

  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;
    gap:12px;border-radius:20px;background:rgba(255,240,250,.9);backdrop-filter:blur(5px);text-align:center;padding:22px}
  #ov.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  #ovT{font-size:calc(26px * var(--fs));color:var(--pink-d)}
  #ovB{font-size:calc(13.5px * var(--fs));line-height:1.7;opacity:.8}

  /* ---------- たまご ---------- */
  #eggOv{position:absolute;inset:0;display:none;flex-direction:column;gap:9px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:5}
  #eggOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #eggHead{display:flex;align-items:center;gap:8px;font-size:calc(14px * var(--fs));color:var(--pink-d)}
  #eggHead>div{flex:1}
  #eggBar{display:flex;gap:6px;font-size:calc(12px * var(--fs))}
  /* もちものが 4つに ふえたので、せまい画面では 2つずつ 2だんに おりかえす。
     よこに 4つ ならべると「おほしさま」が 2行になって 読みにくい */
  @media (max-width:390px){
    #eggBar{flex-wrap:wrap}
    #eggBar>div{flex:1 1 44%}
  }
  #eggBar>div{flex:1;background:rgba(255,255,255,.8);border-radius:12px;padding:7px;text-align:center}
  #eggBar b{display:block;font-size:calc(15px * var(--fs));color:var(--pink-d)}
  #eggList{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .eg{border:2px solid #ffd9ec;border-radius:16px;padding:9px 6px;text-align:center;cursor:pointer;
    background:rgba(255,255,255,.85);position:relative}
  .eg canvas{display:block;margin:0 auto}
  .egN{font-size:calc(11.5px * var(--fs));margin-top:3px}
  .egX{font-size:calc(9.5px * var(--fs));opacity:.6;line-height:1.35;margin-top:2px}
  .egSw{position:absolute;top:5px;right:7px;font-size:calc(10px * var(--fs));color:#b98ae0}
  /* ⭐と💎の 2つを よこに ならべる。カードの はばは 画面の 半分しか
     ないので、字づめを つめて 1行に おさめる */
  .egB{display:flex;gap:5px;margin-top:6px}
  .egPay{flex:1;min-width:0;border:none;border-radius:11px;padding:7px 2px;font:inherit;
    font-size:calc(11.5px * var(--fs));font-weight:800;color:#fff;cursor:pointer;white-space:nowrap}
  .egStar{background:linear-gradient(180deg,#ffd98a,#f0b83c);box-shadow:0 3px 0 #d09a24}
  .egGem{background:linear-gradient(180deg,#cdbcf5,#9d84e0);box-shadow:0 3px 0 #7d5fd0}
  .egPay:active{transform:translateY(2px);box-shadow:none}
  .egPay:disabled{opacity:.4;box-shadow:none;cursor:default}
  /* たて方向の flex では 中身が ちぢんで はみ出し、下の ぶんと 重なる。
     どれも ちぢませない */
  #eggOv>*{flex:0 0 auto}
  #eggStage{text-align:center}
  #eggRates{font-size:calc(9.5px * var(--fs));color:#8a7a94;background:rgba(255,255,255,.6);border-radius:10px;
    padding:7px 8px;line-height:1.7}
  #eggRates b{color:var(--pink-d)}

  /* ---------- アバターづくり ---------- */
  #avOv{position:absolute;inset:0;display:none;flex-direction:column;gap:7px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:4}
  #avOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #avHead{display:flex;align-items:center;gap:8px;font-size:calc(14px * var(--fs));color:var(--pink-d)}
  #avHead>div{flex:1}
  #avStage{display:flex;justify-content:center;flex:0 0 auto}
  #avCv{border-radius:20px}
  #avName{width:100%;box-sizing:border-box;border:2px solid #ffd9ec;border-radius:12px;
    padding:9px 12px;font:inherit;font-size:calc(15px * var(--fs));text-align:center;background:#fff;color:var(--ink)}
  .avRow{display:flex;align-items:center;gap:5px}

  #shopOv{position:absolute;inset:0;display:none;flex-direction:column;gap:9px;border-radius:20px;

  #shopOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}

  #shopHead>div:first-child{flex:1;white-space:nowrap}
  #shopGem{font-size:calc(13px * var(--fs));font-weight:800;color:#7d5fd0;background:rgba(255,255,255,.85);
    border:2px solid #ded4f6;border-radius:999px;padding:4px 10px;white-space:nowrap}
  #shopBody{display:flex;flex-direction:column;gap:9px}
  #shopBody>*{flex:0 0 auto}
  .spSec{font-size:calc(11px * var(--fs));color:var(--pink-d);font-weight:800;margin:2px 0 -3px}

  .spIc{font-size:26px;width:34px;text-align:center;flex:0 0 auto}

  .spN{font-size:calc(13.5px * var(--fs));font-weight:800;color:var(--pink-d)}
  .spD{font-size:calc(10.5px * var(--fs));opacity:.7;line-height:1.5}
  /* かくりつの 1行。品ものの すぐ下に つける（はなすと どれの話か 分からない）*/
  .spNote{font-size:calc(9.5px * var(--fs));line-height:1.5;color:#8a7a94;background:rgba(255,255,255,.6);
    border-radius:10px;padding:6px 10px;margin:-5px 4px 0}
  .spNote.poor{opacity:.5}
  .spP{flex:0 0 auto;font-size:calc(13px * var(--fs));font-weight:800;color:#7d5fd0;
    background:linear-gradient(180deg,#e6dcff,#cfc0f7);border-radius:999px;padding:7px 13px}
  .spSoon{background:rgba(255,255,255,.6);border:2px dashed #ded4f6;border-radius:16px;
    padding:11px 12px;font-size:calc(11px * var(--fs));line-height:1.6;opacity:.8}
  .gemPack .spP{background:linear-gradient(180deg,#ffe0f0,#ffc2de);color:var(--pink-d)}
  .ageBox{background:rgba(255,255,255,.8);border:2px solid #ded4f6;border-radius:16px;

  .ageRow{display:flex;gap:5px;margin-top:8px}

  .ageNote{margin-top:8px;font-size:calc(10px * var(--fs));line-height:1.6;opacity:.65}

  /* ---------- 今週のおだい ---------- */

  #pickOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;

  #pickOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #pickHead{display:flex;align-items:center;gap:8px;font-size:calc(14px * var(--fs));color:var(--pink-d)}
  #pickHead>div{flex:1}

  /* ---------- コレクション図鑑 ---------- */
  #colOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.96);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:2}
  #colOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #colHead{display:flex;align-items:center;gap:6px;font-size:calc(14px * var(--fs));color:var(--pink-d)}
  /* 見出しは スクロールしても のこす。ずかんも ガイドも たてに 長いので、
     下まで スクロールすると 「閉じる」が 見えなくなっていた（実機の 報告）。
     うわに 12px の padding があるので、top を -12px にして ぴたりと はりつける */
  #colHead, #colHeadH{position:sticky;top:-12px;z-index:4;
    background:rgba(255,244,251,.98);padding:12px 6px 8px;margin:-12px -6px 0;
    border-radius:0 0 12px 12px}
  /* 数は「そのタブの 中で いくつ 集めたか」なので、タブや 見出しの となりでは なく
     **かぞえている ならびの 真上**に 置く。タブを かえると 数も かわるため */
  /* たて方向の flex の中なので、ちぢませない（`flex:0 0 auto` が ないと
     高さ0に つぶれて **文字が まるごと 消える**。#colTabs と 同じ わな） */
  #colTtl{flex:0 0 auto;font-size:calc(13px * var(--fs));color:var(--pink-d);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  #colCount{font-size:calc(12px * var(--fs));opacity:.8}
  /* 見出しの 3つ（ショップ・おだい・合言葉）は **同じ幅**。flex:1 1 0 で
     のこりを 等分する。文字数が ちがっても はこの 大きさは そろう。
     入りきらないときは fitHead が 名前を みじかくする */
  #colHead .mini{flex:1 1 0;min-width:0;padding:0 4px;height:32px;
    font-size:calc(11px * var(--fs));
    display:inline-flex;align-items:center;justify-content:center;gap:2px;line-height:1;
    white-space:nowrap;overflow:hidden}
  /* ✕ の 大きさは 🎀📤 と そろえて --icoW（上で 決めうち）。
     **実寸を 測って 合わせては いけない** ——ひらいた 直後は まだ はばが
     決まっておらず、6px ずれた（じっさいに そうなった）。
     `#colHead .mini`（id+class）より 強く 書かないと 等分に 巻きこまれる */
  #colHead #colClose{font-size:calc(15px * var(--fs))}
  /* とても せまい 画面でも 見出しが 切れないように つめる */
  @media (max-width:359px){
    #colTtl{font-size:calc(12px * var(--fs))}
    #colHead .mini{padding:0 2px}
  }
  /* タブが12こに ふえたので、はみ出したぶんは 横に スクロールさせる */
  /* たて方向の flex の中では ちぢんで 消えてしまうので、ちぢませない */
  /* **`overflow-x:auto` を つけないこと。**スクロールわく に なると
     たてにも 切られて、🎀📤 の かげ（box-shadow:0 3px 0）が
     下で ちょん切れます（実機の 報告）。
     いまは タブが flex:1 1 0 で ちぢむので、はみ出すことは ありません */
  #colTabs{display:flex;gap:5px;flex:0 0 auto}
  /* タブの行。**名前のタブ5つ（仲間〜友だち）だけを 等分**し、
     🎀📤 は 絵文字ボタンなので 等分には 入れない（下の --icoW の 四角）。
     「アイテム」は 4文字あって そのままでは 入らないので、
     fitHead が --fsTab を さげて 入るまで 文字を 小さくする（fitStat と 同じ考え）*/
  #colTabs > *{height:32px;border-radius:11px;padding:0 2px;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
    font-size:calc(11px * var(--fs) * var(--fsTab, 1));
    white-space:nowrap;overflow:hidden}
  #colTabs .ctab{flex:1 1 0;min-width:0}
  /* 🎀📤 と ✕ は おなじ大きさの 四角。1か所（--icoW）で きめる */
  :root{--icoW:36px}
  #colTabs .mini, #colHead #colClose{flex:0 0 var(--icoW);width:var(--icoW);padding:0}
  .ctab{border:none;font:inherit;font-size:calc(11px * var(--fs) * var(--fsTab, 1));
    color:var(--ink);background:rgba(255,255,255,.65);cursor:pointer}
  /* えらんでいるタブは **うすいピンク**。ショップ・🎀📤 のような
     「おすと 何かが おきる」ボタンと 見た目を 分けるため。
     字は こいピンクに して、うすい 地でも 読めるようにする */
  .ctab.sel{background:linear-gradient(180deg,#ffe3f1,#ffcbe4);color:var(--pink-d);
    font-weight:700;box-shadow:0 2px 0 #f5b4d5}
  #colDone{background:linear-gradient(90deg,#ffe9b8,#ffd9ec);border-radius:12px;padding:8px;
    text-align:center;font-size:calc(12.5px * var(--fs))}
  #colGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .cCard{background:rgba(255,255,255,.85);border:2px solid #ffd9ec;border-radius:14px;
    padding:7px 3px 6px;text-align:center}
  .cCard.no{opacity:.6;filter:grayscale(.7)}
  /* まだ いない子は うすく。ただし カードごと すけさせると わくが 消えて、
     字だけが 宙に うかんで 見える。わくは のこして 中身だけ うすくする */
  .cCard.yet{background:rgba(255,255,255,.5);border-color:#f6e6f0;filter:grayscale(.45)}
  .cCard.yet canvas{opacity:.4}
  .cCard.yet .cNm{font-weight:400;color:#b5a2b3}
  .cCard.yet .cTt{color:#bdaaba;opacity:.85}
  /* 強さの わく。角丸と グラデの ふちを 両立させるため、
     border は とうめいに して background の 2枚がさねで ふちを ぬる */
  /* まだ居ない子（.yet）は 全体が 白っぽく なるので、わくの 色まで
     消えないように 色ぬきを よわめ、わくは 3pxに 太らせる */
  .cCard.tGold.yet,.cCard.tSilv.yet,.cCard.tRain.yet{filter:grayscale(.15)}
  .cCard.tGold.no,.cCard.tSilv.no,.cCard.tRain.no{filter:grayscale(.15);opacity:.85}
  .cCard.tGold,.cCard.tSilv,.cCard.tRain{border-width:3px}
  .cCard.tGold{border-color:transparent;
    background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)) padding-box,
               linear-gradient(135deg,#e8b84a,#fff3c0 30%,#d9a63a 55%,#ffe9a0 80%,#e8b84a) border-box}
  .cCard.tSilv{border-color:transparent;
    background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)) padding-box,
               linear-gradient(135deg,#aeb8c8,#f4f7fb 30%,#98a4b6 55%,#e8edf4 80%,#aeb8c8) border-box}
  .cCard.tRain{border-color:transparent;
    background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.9)) padding-box,
               linear-gradient(135deg,#ff9ec9,#ffd76e 25%,#8fe3c4 50%,#9ed8ff 70%,#c9a7ff 90%,#ff9ec9) border-box;
    box-shadow:0 0 10px rgba(201,167,255,.5)}
  .cCard canvas{display:block;margin:0 auto}
  .cNm{font-size:calc(11px * var(--fs));margin-top:2px}
  .cTt{font-size:calc(9px * var(--fs));opacity:.6;line-height:1.3}
  .cLv{font-size:calc(9px * var(--fs));color:#e0a52e;letter-spacing:.08em}
  .cGet{font-size:calc(8.5px * var(--fs));opacity:.5;line-height:1.3;margin-top:1px}
  .cWin{font-size:calc(10px * var(--fs));color:var(--pink-d);font-weight:700}
  .cWin span{color:#8fb0d8}
  .cMe{grid-column:1/-1;background:linear-gradient(90deg,#fff0f8,#f4ecff);
    border:2px solid #ffd9ec;border-radius:14px;padding:8px;display:flex;
    align-items:center;gap:8px;text-align:left}
  .cMe canvas{flex:0 0 auto}
  /* まん中を ちぢめられるように しないと、ボタンに 字が かぶる */
  .cMe>div:nth-child(2){min-width:0}
  .cMe .cNm,.cMe .cTt{text-align:left}
  .cMe button{flex:0 0 auto;white-space:nowrap;font-size:calc(11px * var(--fs));padding:7px 10px}
  .cCard{position:relative}
  .cPin{position:absolute;top:-7px;right:-5px;font-size:calc(15px * var(--fs));filter:drop-shadow(0 1px 1px rgba(120,90,120,.4))}
  #colHint{text-align:center;font-size:calc(10px * var(--fs));color:#b98ae0;background:rgba(255,255,255,.55);
    border-radius:10px;padding:5px 4px}

  /* ---------- おかしの国のパノラマ ---------- */
  #kingOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:4}
  #kingOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #kingCv{width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(180,130,175,.35)}
  #kingCap{text-align:center;font-size:calc(11px * var(--fs));opacity:.7;line-height:1.5}

  /* ---------- 合言葉・着せかえ ---------- */
  /* ショップ・今週のおだい・合言葉は 図鑑（👑）の 中に 入れてある。
     ここは 盤面の 高さを 1pxも 取らないので、そのぶん マスが 大きい。
     見出しの 名前は **出したあとに 測って きめる**（fitHead）。
     決めうちの @media では 実機で はみ出す ——Linuxで 測った幅は
     iPhoneの 丸ゴシックより せまく、393pxでは 余裕が 25pxしか ない。
     はみ出すと ✕が 画面の 外に 出て「戻れない」に なる */
  .pwTx{margin-left:3px}
  #colTabs .mini{font-size:calc(14px * var(--fs))}
  #pwOv{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:14px;overflow-y:auto;z-index:5}
  #pwOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  #pwBody{background:rgba(255,255,255,.8);border:2px solid #ffd9ec;border-radius:14px;padding:11px}

  /* ---------- 遊びかたガイド ---------- */
  #helpOv{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;border-radius:20px;
    background:rgba(255,244,251,.97);backdrop-filter:blur(6px);padding:12px;overflow-y:auto;z-index:3}
  #helpOv.on{display:flex;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
  .hSec{background:rgba(255,255,255,.8);border:2px solid #ffd9ec;border-radius:14px;padding:9px 11px}
  .hSec h3{margin:0 0 5px;font-size:calc(13px * var(--fs));color:var(--pink-d)}
  .hSec p, .hSec li{font-size:calc(11px * var(--fs));line-height:1.6;margin:0}
  .hSec ul{margin:0;padding-left:0;list-style:none}
  .hSec li{margin-bottom:4px}
  .hSec b{color:var(--pink-d)}
  #colTotal{text-align:center;font-size:calc(11px * var(--fs));opacity:.7;padding:2px 0 4px}
  #colStats{display:flex;gap:6px}
  .cst{flex:1;min-width:0;background:rgba(255,255,255,.8);border:2px solid rgba(255,255,255,.9);
    border-radius:12px;padding:6px 2px;text-align:center;line-height:1.25}
  .cst .ck{font-size:calc(9px * var(--fs));opacity:.6}
  /* おりかえさせない。おりかえると その札だけ 数字が 下がる。
     入りきらないぶんは fitStat() が 文字を 小さくして あわせる */
  .cst .cn{font-size:calc(15px * var(--fs));color:var(--pink-d);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .cst.best{background:linear-gradient(135deg,#fff3cf,#ffe2f0);border-color:#ffd76e}
  .cst.best .cn{color:#c9821e}

  /* 行間を つめてある。ここが ひろいと いちばん下の1行が 画面から はみ出す。
     ばんめんの 大きさは いじりたくないので、下の 文字がわで つめる */

  /* たてが みじかい 端末（SEなど）は もっと つめる */
  @media (max-height:720px){
    .mini{padding:7px 9px}
  }
  /* 下の3つは よこに ならぶので、せまい画面では 文字を 小さくせずに
     まわりの あきだけ つめる。文字を 小さくすると 読めなくなる */
  @media (max-width:370px){
  }

  /* ---------- 画面ぜんたいにあふれる紙吹雪 ---------- */
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
  /* 紙吹雪あらため「銀のきらめき」。おちる（外）・よこゆれ（中）・またたき（内）の
     3枚がさね。transform のアニメは 1要素に 1本しか かけられない */
  .cf{position:absolute;top:-8vh;will-change:transform;animation:confFall linear forwards}
  @keyframes confFall{to{transform:translateY(120vh)}}
  .cfS{display:block;animation:confSway ease-in-out infinite alternate}
  @keyframes confSway{from{transform:translateX(calc(var(--sw) * -1))}to{transform:translateX(var(--sw))}}
  .cfT{display:block;background-size:contain;background-repeat:no-repeat;
       animation:confTw ease-in-out infinite alternate}
  @keyframes confTw{from{opacity:.25;transform:scale(.55)}to{opacity:1;transform:scale(1.06)}}

<script>
(() => {
"use strict";

/* iOSでピンチやダブルタップで画面が拡大したまま戻らなくなるのを防ぐ */
for (const ev of ['gesturestart','gesturechange','gestureend'])
  document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ==========================================================
   マップ
   ========================================================== */
const COLS = 9, ROWS = 12;
/* ==========================================================
   道（周ごとに 作りかえる）
   ----------------------------------------------------------
   ウェーブに 終わりが ないので、道の形も 手で ぜんぶ 用意することは
   できない。周ばんごうを たねにした 乱数で その場で 作る。
   おなじ周なら いつでも おなじ形が 出るので、セーブとも ずれない。

   どの形も つぎを まもる（道で むずかしさが 変わらないように）：
     ながさ    28〜36マス   みじかい道 ＝ てきが すぐ ゴールに つく
     おけるマス 72〜82      すくない ＝ なかまを ならべられない
   はんいに 入るまで たねを ずらして 作りなおす。
   ========================================================== */
/* 1周 ＝ 国を ひとめぐり。国を ふやしたら ここも のびる。
   そろえないと 1周したときに 通らない国が できて、
   ステージ番号と 国が 合わなくなる（なかまも てきも ずれる） */
const STAGE_WAVES = 20;
const THEME_COUNT = 12;
const LAP_WAVES = STAGE_WAVES * THEME_COUNT;
const lapOf = w => Math.floor(Math.max(0, w - 1) / LAP_WAVES);
/* さいしょの1周は 手で 作った道。はじめての人が 見る 画面なので */
const FIRST_WAY = [[1,-1],[1,2],[7,2],[7,5],[1,5],[1,8],[7,8],[7,12]];

/* 点から 線ぶんまでの きょり。道の しるしづけと 道づくりの 両方で つかう */
function segDist(px, py, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
  const t = L2 ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / L2)) : 0;
  return Math.hypot(px - (ax+dx*t), py - (ay+dy*t));
}
function wayMeasure(way){
  let len = 0;
  for (let i=0;i<way.length-1;i++)
    len += Math.hypot(way[i+1][0]-way[i][0], way[i+1][1]-way[i][1]);
  let free = 0;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    let on = false;
    for (let i=0;i<way.length-1 && !on;i++)
      if (segDist(c, r, way[i][0], way[i][1], way[i+1][0], way[i+1][1]) < 0.62) on = true;
    if (!on) free++;
  }
  return { len, free };
}
/* たてに だんを おりながら よこに わたる。ななめに わたる形も 作る。
   だんの 間かくは 2いじょう（1だんだと 道どうしが くっついて 見える） */
function wayServant(R, diag){
  const runs = 3 + (R()*3|0);
  const left = (R()*3|0), right = COLS-1 - (R()*3|0);
  if (right - left < 4) return null;
  const top = 1 + (R()*2|0);
  const gap = Math.floor((ROWS-2-top) / runs);
  if (gap < 2) return null;
  let side = R() < 0.5 ? left : right;
  const way = [[side, -1]];
  for (let i=0;i<runs;i++){
    const other = side === left ? right : left, row = top + gap*i;
    if (diag && i > 0) way.push([other, row]);
    else { way.push([side, row]); way.push([other, row]); }
    side = other;
  }
  way.push([side, ROWS]);
  return way;
}
/* くしがた。たてに 何本も おりかえす */
function wayComb(R){
  const n = 2 + (R()*2|0);
  const topR = 1 + (R()*2|0), botR = ROWS-2 - (R()*2|0);
  if (botR - topR < 4) return null;
  const step = Math.floor((COLS-1) / (n*2));
  if (step < 2) return null;
  const cols = [];
  for (let i=0;i<=n*2;i++) cols.push(step*i);
  const way = [[cols[0], -1]];
  let down = R() < 0.5;
  for (let i=0;i<cols.length;i++){
    way.push([cols[i], down ? botR : topR]);
    if (i < cols.length-1) way.push([cols[i+1], down ? botR : topR]);
    down = !down;
  }
  way.push([cols[cols.length-1], down ? topR : botR]);
  way.push([cols[cols.length-1], ROWS]);
  return way;
}
const WAY_FAM = [ R => wayServant(R, false), R => wayServant(R, true), R => wayComb(R) ];
/* たねつき乱数。Math.random だと 開くたびに 道が 変わってしまう */
const wayRng = s => () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;

function makeWay(lap){
  if (lap === 0) return FIRST_WAY;
  for (let t=0;t<400;t++){
    const R = wayRng((lap*7919 + t*104729 + 12345) >>> 0);
    let way = WAY_FAM[(lap + t) % WAY_FAM.length](R);
    if (!way) continue;
    // 左右を ひっくり返して 形の かずを ふやす（たては 返さない＝てきは いつも 上から）
    if (R() < 0.5) way = way.map(([c,r]) => [COLS-1-c, r]);
    const m = wayMeasure(way);
    if (m.len >= 28 && m.len <= 36 && m.free >= 72 && m.free <= 82) return way;
  }
  return FIRST_WAY;                    // ここには 来ない はずだが、来ても あそべるように
}
const wayCache = {};
const wayOf = w => {
  const lap = lapOf(w);
  return wayCache[lap] || (wayCache[lap] = makeWay(lap));
};
let WAY = FIRST_WAY;

/* ==========================================================
   おかし（タワー）の設定
   ========================================================== */
/* art は コレクションの どの 絵を つかうか。
   TOWERS と CREATURES は 別の しくみで、名前は 同じでも 中みは 別もの。
   絵まで 別だと おなじ「キャンディ」が ゲームの中で 2しゅるいの
   見た目に なるので、コレクションの 絵を つかいまわす。
   キー名は そろっていない（タワーの ice ＝ コレクションの icecream）*/
const TOWERS = {
  candy: { name:'キャンディ', ic:'🍬', art:'candy', cost:50,  dmg:9,  rate:0.45, range:2.3, color:'#ff8fc4', dark:'#e05f9e',
           desc:'すばやく1体を狙う' },
  ice:   { name:'アイス',     ic:'🍧', art:'icecream', cost:70,  dmg:5,  rate:0.70, range:2.0, color:'#8fd8ff', dark:'#4aa8dd',
           slow:0.45, slowT:1.4, desc:'当てた敵を遅くする' },
  choco: { name:'チョコ',     ic:'🍫', art:'choco', cost:110, dmg:16, rate:1.10, range:1.9, color:'#d09a6a', dark:'#a06a3c',
           splash:0.95, desc:'まわりの敵もまとめて攻撃' },
  star:  { name:'スター',     ic:'⭐', art:'star', cost:160, dmg:34, rate:1.50, range:3.6, color:'#ffd76e', dark:'#e0a52e',
           desc:'遠くまで届く強力な一撃' },
};
const ORDER = ['candy','ice','choco','star'];
/* 強化の ねだん = cost × upMul(いまのレベル)。
   1レベルごとに ねだんは ×1.55、こうげきは ×1.78 のびるので、
   レベルが 上がるほど ⭐あたりの つよさが よくなる。
   これが ないと てきの 複利に おいつけず、ウェーブ60あたりで 頭うちになる */
const upMul = lv => 0.8 * Math.pow(1.55, lv - 1);
/* レベルの 上限は もぐった ウェーブで のびる。自己ベストで しばると
   はじめての人が ずっと Lv3の ままに なるので、そのプレイの ウェーブで 決める */
const maxLv = () => 3 + Math.floor(wave / 10);

/* ==========================================================
   敵の設定
   ========================================================== */
const ENEMIES = {
  slime:   { name:'ぷりんぼう', hp:28,  spd:1.15, gold:5,   r:0.30, color:'#c9a7ff', dark:'#9a72e0' },
  fast:    { name:'あいすぼう', hp:20,  spd:2.20, gold:7,   r:0.26, color:'#ffa8c8', dark:'#e06f9c' },
  tank:    { name:'まかろん',   hp:115, spd:0.62, gold:15,  r:0.38, color:'#8fe3c4', dark:'#4fb392' },
  crystal: { name:'かきごおり', hp:80,  spd:0.95, gold:14,  r:0.32, color:'#bfe8ff', dark:'#6fa8d8', armor:6 },
  bat:     { name:'よるクッキー', hp:60,  spd:1.85, gold:14,  r:0.27, color:'#d8c6ff', dark:'#8f6fd8' },
  golem:   { name:'どすんケーキ', hp:420, spd:0.45, gold:45,  r:0.44, color:'#c09068', dark:'#7a5030', armor:4 },
  boss:    { name:'ケーキだいおう', hp:700, spd:0.50, gold:120, r:0.50, color:'#ffb36e', dark:'#dd8028' },
};

/* とつぜんの ウェーブ。1周（240）に 10こほど、むずかしい・やさしいが まざる。
   ウェーブ番号から きめる（乱数だと セーブや ともだちとの 話が 合わなくなる）。
   ステージクリア（%20=0）・ともだちバトル（%20=10）・はじめの14ウェーブは さける */
const WAVE_MODS = [
  { name:'⚡ とつげきラッシュ！', spd:1.35, count:1.5, col:'#e0a52e' },
  { name:'🛡 がんこな大群！',     hp:1.9,              col:'#8f66d8' },
  { name:'🌸 そよかぜタイム',     hp:0.5,   gold:1.6,  col:'#e05f9e' },
];
/* 1周に かならず 10こ。「周の 中で 何番目か」で 決めるので、
   ハッシュの かたよりで 周ごとに 6こや 15こに なることがない
   （番号だけで 決めていたら 周1が8こ、周3が15こに なった）。
   ステージクリア（%20=0）・ともだちバトル（%20=10）・はじめの14は さける */
const WMOD_N = 10;
/* どの しゅるいに するかは 決めうちの ならび。ハッシュで えらんでいたら
   周2が やさしい7・むずかしい3に なって、その周だけ 楽に なっていた。
   1周は かならず むずかしい7（ラッシュ4・がんこ3）・やさしい3。
   周ごとに ならびを 1つ ずらすので、おなじ ならびは くり返さない */
const WMOD_PAT = [0, 1, 2, 0, 1, 0, 2, 1, 0, 2];
function waveMod(n){
  const i = ((n - 1) % LAP_WAVES) + 1;                  // 周の 中の いち（1〜240）
  if (i < 15 || i % STAGE_WAVES === 0 || i % STAGE_WAVES === 10) return null;
  const seed = lapOf(n) * 7919;
  const rnd  = k => ((Math.imul(k ^ 0x9e3779, 2654435761) >>> 0) % 1000) / 1000;
  /* 周の あたまで その周の 10こを 決める。おなじ周なら いつも おなじ
     （セーブや ともだちと 話が 合わなくなるので 乱数は つかわない） */
  const slot = Math.floor((i - 15) / ((LAP_WAVES - 14) / WMOD_N));   // 0〜9 の わく
  if (slot < 0 || slot >= WMOD_N) return null;
  const lo = 15 + Math.ceil(slot * (LAP_WAVES - 14) / WMOD_N);
  const hi = 14 + Math.floor((slot + 1) * (LAP_WAVES - 14) / WMOD_N);
  // わくの 中で 1つだけ えらぶ。ダメな いちに 当たったら 次へ ずらす
  let pick = lo + Math.floor(rnd(seed + slot) * (hi - lo + 1));
  for (let t = 0; t < hi - lo + 1; t++){
    const j = lo + ((pick - lo + t) % (hi - lo + 1));
    if (j % STAGE_WAVES !== 0 && j % STAGE_WAVES !== 10){ pick = j; break; }
  }
  if (i !== pick) return null;
  return WAVE_MODS[WMOD_PAT[(slot + lapOf(n)) % WMOD_PAT.length]];
}

function waveList(n){
  const out = [];
  // 数はほどほどで打ち止めにして、後半はHP・敵の種類で手強くする
  const total = 8 + Math.min(28, n*2);
  for (let i=0;i<total;i++){
    let t = 'slime';
    if (n >= 2  && i%4 === 3) t = 'fast';
    if (n >= 4  && i%6 === 5) t = 'tank';
    if (n >= 9  && i%7 === 2) t = 'crystal';
    if (n >= 16 && i%5 === 4) t = 'bat';
    if (n >= 28 && i%9 === 8) t = 'golem';
    out.push(t);
  }
  if (n % 10 === 0) out.push('boss');
  if (n % 10 === 0 && n >= 40) out.push('boss');
  return out;
}
/* ウェーブに 終わりは ない。どこかで かならず おいつかれる「かべ」が
   来て、そこが その日の きろくになる。
   かべの ばしょは 手で えらばず、tools/sim.mjs の モデルで はかって
   ウェーブ380あたりに なるように 決めた。
     HP    25をこえたら 1.020の 複利
     ⭐    30をこえたら 1.004の 複利（HPより ゆっくり ＝ じわじわ おいつかれる）
   数字を いじるときは かならず sim を かけなおすこと */
/* 1周（LAP_WAVES）ごとの 段差。複利の 坂だけだと「スターを ならべておけば
   自動で すすむ」時間が ながく つづくので、周の かわりめで がくんと 上げる。

     1. アプリが Transaction / AppTransaction の JWS を うけとる
     2. **サーバーへ おくる**。端末の中で たしかめても、その こたえ
        じたいを 書きかえられるので 意味がない
     3. サーバーが App Store Server API で しらべる
        （/inApps/v1/transactions/{id}。verifyReceipt は 古い API）

        ・bundleId と environment（Sandbox / Production）を 見る

   ないものは 持っていない あつかいに なる**——ここが 書きかえ対策の 本体。
   ========================================================== */
function receiptOwned(){
  try{
    const r = JSON.parse(localStorage.getItem('sweetTD.receipt') || 'null');
    // at（たしかめた 時こく）が ないものは、たしかめて いないのと 同じ
    if (r && r.at && Array.isArray(r.own)) return r;
  }catch(e){}
  return null;
}

const owns = id => {

  return r ? r.own.includes(id) : bought.includes(id);
};

   もう一度 お金を はらわせては いけない。Apple は そのための ボタンを

const REGEN_MIN = 5, REGEN_MS = REGEN_MIN*60*1000;

function nextHeartAt(){ try{ return +localStorage.getItem('sweetTD.lifeAt') || 0; }catch(e){ return 0; } }

/* たまった時間ぶん💗をふやす。満タンになったら回復おわり。ふえたら true */
function applyRegen(){
  let at = nextHeartAt();
  if (!at) return false;
  const cap = maxHearts();
  let changed = false;
  while (at && Date.now() >= at && hearts < cap){
    hearts++; changed = true;
    at = (hearts < cap) ? at + REGEN_MS : 0;   // 満タンなら回復おわり(0)
  }
  if (changed){ setNextHeartAt(at); saveRest(); }
  return changed;
}

const key = (c,r) => c + ',' + r;

function roundRect(x,y,w,h,rad){
  const k = Math.min(rad, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.arcTo(x+w,y,x+w,y+h,k); ctx.arcTo(x+w,y+h,x,y+h,k);
  ctx.arcTo(x,y+h,x,y,k);     ctx.arcTo(x,y,x+w,y,k);
  ctx.closePath();
}

/* 4方向にとがったキラキラ */
function sparkle(x,y,r,rot,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.fillStyle = color||'#fff';
  ctx.beginPath();
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* おけない ますを 決める。
   道は「まがり角を つないだ 折れ線」を ふとく なぞって えがいている。
   ますを たどって しるしを つける やりかたでは、ななめの 道で
   線の 下に あるのに おけて しまう ますが 出る。
   ますの まん中から 折れ線までの きょりで 決めれば、
   ななめでも 曲がりくねっても おなじ しくみで 合う */
function buildPath(){
  pathCells.clear();
  const near = 0.62;                    // 道はば（マス）の はんぶんより 少し ひろめ
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    for (let i=0;i<WAY.length-1;i++){
      const [c0,r0] = WAY[i], [c1,r1] = WAY[i+1];
      if (segDist(c, r, c0, r0, c1, r1) < near){ pathCells.add(key(c,r)); break; }
    }
  }
}
/* pathPts は CELL を つかった **ピクセル**の いち。CELL が 変わったら
   はかりなおさないと、敵だけ 古い ますの 大きさで えがかれて 道から はずれる。
   はかった ときの CELL と 道の 形を おぼえておいて、ずれたら 自分で 直す */
let pathCell = 0, pathWay = '';
function measurePath(){
  pathCell = CELL; pathWay = WAY.join(';');
  pathPts = WAY.map(([c,r]) => ({ x:cx(c), y:cy(r) }));
  segLen = []; pathLen = 0;
  for (let i=0;i<pathPts.length-1;i++){
    const L = Math.hypot(pathPts[i+1].x-pathPts[i].x, pathPts[i+1].y-pathPts[i].y);
    segLen.push(L); pathLen += L;
  }
}
function posAt(d){
  let left = d;
  for (let i=0;i<segLen.length;i++){
    if (left <= segLen[i]){
      const t = segLen[i] ? left/segLen[i] : 0;
      return { x: pathPts[i].x + (pathPts[i+1].x-pathPts[i].x)*t,
               y: pathPts[i].y + (pathPts[i+1].y-pathPts[i].y)*t };
    }
    left -= segLen[i];
  }
  return pathPts[pathPts.length-1];
}

let actx = null, sndOn = true;
/* iPhoneでは、画面をさわる前に音の箱（AudioContext）を作ると
   とまったまま（suspended）になって、あとから鳴らなくなることがある。
   さわるたびに 起こしなおして、確実に音が出るようにしておく。
   すでに動いていれば なにもしないので、毎回よんでも重くない */
function wakeAudio(){
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
  }catch(e){}
}
for (const ev of ['pointerdown','touchend'])
  document.addEventListener(ev, wakeAudio, { capture:true, passive:true });
function beep(f, dur, type='sine', vol=0.05, slide=1.4){
  if (!sndOn) return;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*slide, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

/* --- コードのかきかた -------------------------------------
   "C" "Am" "F#m7" のように 文字でかく。数字のならびだと
   あとから ならびかえるときに どこが何の和音か 分からなくなるから */
const NOTE_BASE  = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const CHORD_KIND = { '':[0,4,7], m:[0,3,7], M7:[0,4,7,11], m7:[0,3,7,10],
                     '7':[0,4,7,10], sus4:[0,5,7], add9:[0,4,7,14] };
const chordCache = {};
function chordOf(name){
  let c = chordCache[name];
  if (c) return c;
  const m = /^([A-G])([#b]?)(.*)$/.exec(name) || [];
  const root = ((NOTE_BASE[m[1]] || 0) + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  c = chordCache[name] = { root, iv: CHORD_KIND[m[3]] || CHORD_KIND[''] };
  return c;
}

const midiF = m => 440 * Math.pow(2, (m-69)/12);

/* --- 音のとおり道をつくる（さいしょの1回だけ） --------------
   ひびきと やまびこを通すと、おなじ楽譜でも
   「部屋で鳴っている音」に きこえて やわらかくなる */
function bgmSetup(){
  if (bgmBus) return;
  const rate = actx.sampleRate;

  // BGMは こうかおん（beep）の下に しずめる。同じ大きさだと
  // タップの音や こうげきの音が きこえなくなってしまう
  bgmBus = actx.createGain(); bgmBus.gain.value = 0.55;
  // かさねた音が われないように、さいごに かるく ならしておく
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 4;
  comp.attack.value = 0.005; comp.release.value = 0.2;
  bgmBus.connect(comp); comp.connect(actx.destination);

  // ひびき：ノイズを減衰させた擬似インパルス応答。音源ファイルなしで部屋鳴りが作れる
  const len = Math.floor(rate * 1.7);
  const ir = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++){
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.6) * 0.7;
  }
  const conv = actx.createConvolver(); conv.buffer = ir;
  bgmWet = actx.createGain(); bgmWet.gain.value = 0.5;   // ひびきへ送るつまみ
  bgmWet.connect(conv); conv.connect(bgmBus);

  // やまびこ：メロディだけに かけて きらきらを のばす
  bgmSend = actx.createGain(); bgmSend.gain.value = 0.28;
  bgmDelayNode = actx.createDelay(1.2); bgmDelayNode.delayTime.value = 0.3;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const dlLp = actx.createBiquadFilter(); dlLp.type = 'lowpass'; dlLp.frequency.value = 2600;
  bgmSend.connect(bgmDelayNode);
  bgmDelayNode.connect(dlLp); dlLp.connect(fb); fb.connect(bgmDelayNode);
  dlLp.connect(bgmBus); dlLp.connect(bgmWet);

  // ドラム用のノイズ。毎回つくると おもいので 1つを つかいまわす
  bgmNoise = actx.createBuffer(1, Math.floor(rate * 0.5), rate);
  const nd = bgmNoise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
}

/* メロディ：オルゴール風。基音に すこしずらした音と 倍音をかさねると、
   1本のオシレーターでは出ない ふくらみが生まれる */
function bgmBell(f, t, dur, vol){
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(vol, t + 0.012);
  out.gain.exponentialRampToValueAtTime(vol*0.3, t + Math.min(dur*0.3, 0.2));
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  // 時間とともに 高い成分が消えていくと、はじいた楽器らしく きこえる
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5400, t);
  lp.frequency.exponentialRampToValueAtTime(1500, t + dur);
  out.connect(lp);
  lp.connect(bgmBus); lp.connect(bgmWet); lp.connect(bgmSend);
  const P = [[1, 1, 'triangle'], [1.004, .55, 'triangle'], [2.01, .2, 'sine'], [3.02, .06, 'sine']];
  for (const [mul, amp, wv] of P){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = wv; o.frequency.value = f*mul; g.gain.value = amp;
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.1);
  }
}

/* 和音のしきもの。メロディの下に ずっと鳴っていると
   すきまが うまって さみしくならない */
function bgmPad(freqs, t, dur, vol){
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.linearRampToValueAtTime(vol, t + dur*0.3);
  out.gain.setValueAtTime(vol, t + dur*0.65);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;
  out.connect(lp); lp.connect(bgmBus); lp.connect(bgmWet);
  const amp = 0.34 / Math.sqrt(freqs.length);
  for (const f of freqs){
    for (const dt of [-3, 3]){          // 2つを ほんの少しずらすと ゆれて あつみが出る
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f; o.detune.value = dt;
      g.gain.value = amp;
      o.connect(g).connect(out);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }
}

/* ベース：サイン波だけだと ぼやけるので 三角波をすこし足して 芯をつくる */
function bgmBass(f, t, dur, vol){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(vol*0.45, t + dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480;
  g.connect(lp); lp.connect(bgmBus);
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const o2 = actx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 5;
  const g2 = actx.createGain(); g2.gain.value = 0.3;
  o.connect(g); o2.connect(g2).connect(g);
  o.start(t); o.stop(t + dur + 0.05);
  o2.start(t); o2.stop(t + dur + 0.05);
}

/* きらきらの うわもの（対旋律）。メロディが やすんでいる うら拍に
   和音の音を ならべると、すきまが うまって にぎやかになる。
   和音の中の音しか つかわないので、どこで鳴っても にごらない */
function bgmArp(f, t, dur, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bgmBus); g.connect(bgmWet); g.connect(bgmSend);
  o.start(t); o.stop(t + dur + 0.05);
}

/* サビでメロディに そえる「3度下」。和音にふくまれる音だけを えらぶので、
   どの曲でも かならず きれいに かさなる */
function harmonyBelow(n, C){
  for (let d = 3; d <= 5; d++)
    if (C.iv.some(v => (((n - d) - C.root - v) % 12 + 12) % 12 === 0)) return n - d;
  return 0;
}

/* ドラム。うら拍にも音があると 曲が前へすすんで ねむくならない */
function bgmKick(t, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.09);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(g).connect(bgmBus);
  o.start(t); o.stop(t + 0.19);
}
function bgmNoiseHit(t, vol, type, freq, dec, wet){
  const s = actx.createBufferSource(); s.buffer = bgmNoise;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 1.1;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  s.connect(f).connect(g); g.connect(bgmBus);
  if (wet) g.connect(bgmWet);
  // 毎回おなじ場所から鳴らすと 機械っぽくなるので 読みだす位置をずらす
  s.start(t, Math.random()*0.35); s.stop(t + dec + 0.03);
}
const bgmClap = (t, vol) => bgmNoiseHit(t, vol, 'bandpass', 1900, 0.13, true);
const bgmHat  = (t, vol, open) => bgmNoiseHit(t, vol, 'highpass', open ? 7000 : 9500, open ? 0.14 : 0.04, false);

function bgmTick(){
  if (!sndOn || !actx) return;
  bgmSetup();
  // ミュートしていた間のぶんを一気に鳴らさないための巻きなおし
  if (bgmNext < actx.currentTime - 0.1) bgmNext = actx.currentTime + 0.05;
  // いまのステージの曲（ウェーブが変わると自動でつぎの曲へ。きせかえ中はその曲）
  const B = themeOverride ? themeOverride.bgm
    : BGMS[Math.max(0, Math.ceil(Math.max(wave,1)/STAGE_WAVES)-1) % BGMS.length];
  const stepDur = 60 / B.bpm / 2;    // 8分音符
  // やまびこの間かくは 付点8分。テンポに合わせないと リズムから ずれてしまう
  bgmDelayNode.delayTime.setTargetAtTime(stepDur*1.5, actx.currentTime, 0.08);
  const ML = B.mel.length, CL = B.ch.length;
  const dr = B.dr === undefined ? 1 : B.dr, ar = B.ar === undefined ? 1 : B.ar;
  while (bgmNext < actx.currentTime + 0.25){
    const i = bgmStep % ML, s = i % 8, bar = ((i - s) / 8) % CL;
    const C = chordOf(B.ch[bar]);
    // うしろ半分が サビ。ここだけ ハモリを足して 曲がもりあがるようにする
    const sabi = bar >= CL/2;
    const n = B.mel[i];
    // -1 は「まえの音をのばす」。おなじ長さの音がならぶと のっぺりするので、
    // のばす・やすむ を入れて リズムをつける
    if (n > 0){
      let hold = 1;
      while (hold < 16 && B.mel[(i + hold) % ML] === -1) hold++;
      // 音符の長さより すこし長く残す。鐘の音は 自然に消えていくものだから
      const dur = stepDur*(hold + 0.9);
      bgmBell(midiF(n), bgmNext, dur, B.vol);
      if (sabi){
        const h = harmonyBelow(n, C);
        if (h) bgmBell(midiF(h), bgmNext, dur, B.vol*0.42);
      }
    } else if (ar > 0 && s % 2 === 1){
      // メロディがない うら拍にだけ 置く。かさねすぎると うるさくなるから
      const tone = C.iv[((bgmStep / 2) | 0) % C.iv.length];
      bgmArp(midiF(72 + C.root + tone), bgmNext, stepDur*1.6, B.vol*0.3*ar);
    }
    if (s === 0){
      bgmPad(C.iv.map(v => midiF(60 + C.root + v)), bgmNext, stepDur*7.6, B.vol*0.42);
      bgmBass(midiF(36 + C.root), bgmNext, stepDur*3.6, B.vol*1.1);
    }
    // 小節のなかばで 5度へうごかすと、ベースが歩いているように きこえる
    if (s === 4) bgmBass(midiF(36 + C.root + 7), bgmNext, stepDur*3.6, B.vol*0.9);
    if (dr > 0){
      if (s === 0 || s === 4) bgmKick(bgmNext, B.vol*1.6*dr);
      if (s === 2 || s === 6) bgmClap(bgmNext, B.vol*0.7*dr);
      bgmHat(bgmNext, B.vol*(s % 2 ? 0.3 : 0.16)*dr, s === 7);
    }
    bgmStep++; bgmNext += stepDur;
  }
}
function bgmStart(){
  if (bgmTimer) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    bgmSetup();
  }catch(e){ return; }
  bgmNext = actx.currentTime + 0.1; bgmStep = 0;
  bgmTimer = setInterval(bgmTick, 120);
}
function bgmStop(){ if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }

   ゲーム開始
   ========================================================== */
/* 道を いまの ウェーブの ものに 合わせる。かえたら {moved,back}、そのままなら false。
   てきが 1体も いない ウェーブの さかいめでだけ よぶこと。
   とちゅうで かえると 道の ながさが 変わり、まだ とちゅうの子が
   いっせいに ゴールに 入って げんきが 一気に へってしまう */
function applyLayout(w){
  const nw = weekly ? weekWay() : wayOf(w);
  if (nw === WAY) return false;
  WAY = nw;
  buildPath(); measurePath();
  // あたらしい道の 上に なった なかまは、こちらの つごうなので 全がく もどす
  let back = 0, moved = 0;
  for (let i = towers.length - 1; i >= 0; i--){
    const t = towers[i], sp = tSpan(t);
    let on = false;
    for (let dc = 0; dc < sp; dc++) for (let dr = 0; dr < sp; dr++)
      if (pathCells.has(key(t.c + dc, t.r + dr))) on = true;
    if (!on) continue;
    back += Math.round(sellOf(t) / 0.6);
    towers.splice(i, 1); moved++;
  }
  if (moved){ stars += back; selTower = null; closeInfo(); syncHUD(); }
  bakeGround();
  return { moved, back };
}

function reset(){
  towers = []; enemies = []; shots = []; parts = []; floats = []; rings = [];
  WAY = FIRST_WAY;
  hearts = maxHearts(); life = maxLife(); stars = 250 + todayStartStars(); wave = 0;   // ログインボーナスぶんを上のせ
  selTool = null; selTower = null; running = false; over = false;
  spawnQ = []; spawnT = 0; speed = 1; flash = 0; nextT = 0;
  btnSpd.textContent = '1x';
  buildPath(); measurePath(); makeSparks();
  for (const k in skCd) skCd[k] = 0;

/* ==========================================================
   コレクションの あつめかた（たまご・かけら）
   ------------------------------------------------------------
   いずれ App Store で 課金を 入れるので、そこを 見すえた 形にする。

   ・Apple では ゲーム内の デジタル商品は かならず In-App Purchase になる。
     だから 買いものは 1か所（buyEgg）に まとめておき、
     あとで「⭐をはらう」を「💎をはらう」に さしかえるだけで すむようにする
   ・ガチャの かくりつ表示は Apple の 審査でも 日本の 法律でも 必要。
     だから「おなじ★の子から 均等に 1人」に して、
     どの子も おなじ かくりつだと 1行で 言いきれる形に した
   ・「◯体そろえたら 特典」は 日本では コンプガチャに あたるので 作らない。
     ずかんの「かんせい」は お祝いの 画面だけで、もらえる ものは ない
   ========================================================== */
/* cost は ⭐、gem は 💎。どちらで はらっても 出かたは まったく 同じ。
   ⭐は あそんで ためるもの、💎は 買うもの。両方 のこすのは、
   💎だけに すると あそんで 集められなくなり、⭐だけに すると
   はじめたばかりの人が いつまでも 1人も 増やせないため */
const EGGS = [
  { id:'e13', name:'ふつうの たまご',   lv:[1,2,3], cost:400,  gem:5,  c1:'#fff0f7', c2:'#ff8fc4' },
  { id:'e45', name:'きらきら たまご',   lv:[4,5],   cost:1200, gem:12, c1:'#eef7ff', c2:'#9ed8ff' },
  { id:'e6',  name:'伝説の たまご', lv:[6],     cost:3000, gem:25, c1:'#fff8e4', c2:'#ffd76e' },
];
/* ダブりが 出たときに もらえる かけら と、かけらで 交換するのに いる数 */
const SHARD_GET  = { 1:1, 2:1, 3:1, 4:2, 5:2, 6:4 };
const SHARD_COST = { 1:5, 2:5, 3:5, 4:12, 5:12, 6:30 };

let shards = 0;
try{ shards = +localStorage.getItem('sweetTD.shards') || 0; }catch(e){}
function saveShards(){ try{ localStorage.setItem('sweetTD.shards', String(shards)); }catch(e){} }

/* ==========================================================
   💎ジュエル（いずれの 課金つうか）
   ----------------------------------------------------------
   ⭐と かけらは「あそんで ためる」もの。💎だけが 買うもの。
   ここを 混ぜると、あとで 課金を 入れるときに 直せなくなる。

   買いものは buyGem() の 1か所だけを とおす。
   App Store に 出すときは、この中を Apple の IAP に さしかえる。
   localStorage は 書きかえ放題なので、そのときは レシートで
   もういちど たしかめること（CLAUDE.md の きまりごと）。
   ========================================================== */
let gems = 0;
try{ gems = +localStorage.getItem('sweetTD.gems') || 0; }catch(e){}
function saveGems(){ try{ localStorage.setItem('sweetTD.gems', String(gems)); }catch(e){} }
/* 💎を つかう ゆいいつの 入口。たりなければ false */
function payGems(n){
  if (gems < n){ beep(160,.09,'square',.03,.7); return false; }
  gems -= n; saveGems();
  return true;
}

/* ==========================================================
   未成年の 月あたりの 上限
   ----------------------------------------------------------
   しばりが かかるのは「💎を お金で 買うとき」だけ。
   持っている💎を つかうのは 何回でも できる（買ったあとに
   つかえなくなるほうが 混乱するし、返金の話にもなる）。

   金がくは JOGA／CESA の 目やすに あわせている。
     16歳未満     … 月 5,000円
     16〜19歳     … 月 20,000円
     20歳以上     … 上限なし

   **localStorage は 書きかえ放題なので、これは あくまで 画面がわの
   歯どめ**。ほんとうの しばりは、Apple の ファミリー共有／承認と
   サーバーがわの レシート確認で かける。ここを 本気の 防止だと
   思わないこと。
   ========================================================== */
const AGE_BANDS = [
  { id:'u16',   name:'16歳未満',  cap:5000  },
  { id:'u20',   name:'16〜19歳',  cap:20000 },
  { id:'adult', name:'20歳以上',  cap:0     },   // 0 = 上限なし
];
function ageBand(){
  try{ return AGE_BANDS.find(a => a.id === localStorage.getItem('sweetTD.age')) || null; }catch(e){ return null; }
}
function setAgeBand(id){ try{ localStorage.setItem('sweetTD.age', id); }catch(e){} }
const monthKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
/* 今月 いくら つかったか。月が かわると まっさらに もどる */
function monthSpent(){
  try{
    const r = JSON.parse(localStorage.getItem('sweetTD.spend') || 'null');
    if (r && r.m === monthKey()) return r.yen | 0;
  }catch(e){}
  return 0;
}
function addSpent(yen){
  try{ localStorage.setItem('sweetTD.spend', JSON.stringify({ m: monthKey(), yen: monthSpent() + yen })); }catch(e){}
}
/* あと いくら 買えるか。上限なしは Infinity */
function spendLeft(){
  const a = ageBand();
  if (!a || !a.cap) return Infinity;
  return Math.max(0, a.cap - monthSpent());
}
/* お金の 入り口。ほんとうの 買いものは この 2つで はさむ。

     const r = canPayYen(n); if (!r.ok) return …    ← 買う前に しらべる
     …Apple の 買いもの…
     recordYen(n);                                  ← はらえてから 記録

   1つの関数に まとめて 先に 記録すると、買いものを とちゅうで やめたり
   しっぱいしたときに、はらっていない お金が 上限から 引かれてしまう。
   いまは お金の やりとりが ないので recordYen() は まだ よばれない */
function canPayYen(n){
  if (!ageBand()) return { ok:false, why:'age' };          // まだ 年れいを 聞いていない
  if (n > spendLeft()) return { ok:false, why:'cap' };
  return { ok:true };
}
function recordYen(n){ addSpent(n); }
const yen = n => '¥' + n.toLocaleString();

/* その たまごから 出る子。なかま（味方）だけ */
const eggPool = e => GEN_LIST.filter(o => o.side === 'ch' && e.lv.includes(o.lv));
const hasGen  = o => !!dex[o.id];

/* たまごを ひらく。まだ いない子を ゆうせんし、ぜんぶ いるなら かけらに する。
   「まだ いない子ゆうせん」は 親切なうえに、ダブり待ちの ストレスを なくす */
/* にじの わく（DEX_LEGEND）の子は「運が よければ」の あつかい。
   たまごの 中で あわせて 5% しか 出ない。かくりつ表示（eggRates）と
   ここの 数字は かならず そろえること（Apple 3.1.1／景品表示法） */
const LEG_RATE  = 0.05;
/* 金の わく（DEX_GOLD）は にじの 下、銀の 上。にじを のぞいた のこりの 20%。
   **この数字は 金の 人数で 変わる。**きらきら たまごは にじ2人・金6人なので、
   15% だと 金ひとりが 2.4%、にじ ひとりが 2.5% で **金の ほうが めずらしく**
   なって ならびが ひっくり返った。tools/check-chars.mjs の
   「たまごの ならび」が ふつう > 金 > にじ を 毎回 たしかめる */
const GOLD_RATE = 0.20;
/* たおしたとき 図鑑に 入る かくりつ。ふつうは 1（かならず 入る）。
   わくの色と 手に入りにくさを そろえる ための 数字 */
const LEG_KEEP  = 0.25;
const GOLD_KEEP = 0.60;

/* たまごの 出かたは ここ 1か所。えらぶ側（eggPick）も かくりつ表示（eggRates）も
   これを 見るので、数字が ずれようが ない（Apple 3.1.1／景品表示法で
   表示が ずれるのは いちばん まずい）。
   にじが まず 5% を とり、のこりを 金と ふつうで 分ける。
   ふつうが 1人も いない たまご（伝説のたまご＝★6は 金3人＋にじ1人）では
   金が のこり ぜんぶを とる ——にじを 増やして しまわない ため */
function eggOdds(pool){
  const leg  = pool.filter(o =>  DEX_LEGEND.has(artKeyOf(o)));
  const gold = pool.filter(o => !DEX_LEGEND.has(artKeyOf(o)) &&  DEX_GOLD.has(artKeyOf(o)));
  const norm = pool.filter(o => !DEX_LEGEND.has(artKeyOf(o)) && !DEX_GOLD.has(artKeyOf(o)));
  const pL = leg.length ? (gold.length || norm.length ? LEG_RATE : 1) : 0;
  const rest = 1 - pL;
  const pG = !gold.length ? 0 : norm.length ? rest * GOLD_RATE : rest;
  return { leg, gold, norm, pL, pG, pN: rest - pG };
}
function eggPick(list){
  const o = eggOdds(list);
  const one = a => a[(Math.random() * a.length) | 0];
  const r = Math.random();
  if (r < o.pL) return one(o.leg);
  if (r < o.pL + o.pG) return one(o.gold);
  return one(o.norm.length ? o.norm : o.gold.length ? o.gold : o.leg);
}
function eggDraw(e){
  const pool = eggPool(e);
  const news = pool.filter(o => !hasGen(o));
  if (news.length){
    const o = eggPick(news);
    unlock(o.id);
    return { o, dup: false };
  }
  const o = eggPick(pool);
  const n = SHARD_GET[o.lv] || 1;
  shards += n; saveShards();
  return { o, dup: true, shard: n };
}

/* ---------- たまごの 絵 ---------- */
function eggThumb(e, size, cracked){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size+'px'; c.style.height = size+'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const M = size/2, R = size*0.3;
  // たまごの 形（下が まるく、上が ほそい）
  g.beginPath();
  g.moveTo(M, M - R*1.28);
  g.bezierCurveTo(M + R*0.98, M - R*0.66, M + R*1.02, M + R*0.72, M, M + R*1.16);
  g.bezierCurveTo(M - R*1.02, M + R*0.72, M - R*0.98, M - R*0.66, M, M - R*1.28);
  g.closePath();
  const gr = g.createRadialGradient(M - R*0.34, M - R*0.5, R*0.1, M, M, R*1.3);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, e.c1); gr.addColorStop(1, e.c2);
  g.fillStyle = gr; g.fill();
  // もよう
  g.save(); g.clip();
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (let i=0;i<3;i++){
    g.beginPath(); g.ellipse(M, M - R*0.3 + i*R*0.52, R*1.1, R*0.13, 0, 0, GTAU); g.fill();
  }
  g.fillStyle = e.c2;
  for (let i=0;i<7;i++){
    const a = i*2.399;
    gspark(g, M + Math.cos(a)*R*0.62, M + Math.sin(a)*R*0.72, R*0.13, a, e.c2);
  }
  if (cracked){                         // われめ
    g.strokeStyle = 'rgba(120,90,120,.45)'; g.lineWidth = size*0.022; g.lineJoin='round';
    g.beginPath();
    g.moveTo(M - R, M - R*0.1);
    for (let i=0;i<6;i++) g.lineTo(M - R + i*R*0.34, M - R*0.1 + (i%2 ? R*0.2 : -R*0.2));
    g.stroke();
  }
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.6)';  // つや
  g.beginPath(); g.ellipse(M - R*0.36, M - R*0.62, R*0.24, R*0.13, -0.5, 0, GTAU); g.fill();
  return c;
}

  eggRates.innerHTML = '<b>出てくる確率</b><br>' + EGGS.map(e => {
    const pool = eggPool(e);

    // わくが 1しゅるいしか ない たまごは「どの子も同じ確率」で 言いきれる
    if (!od.pL && !od.pG)
      return head + 'どの子も同じ確率（' + (100/pool.length).toFixed(1) + '%）';
    // わくごとに「あわせて何%・1人あたり何%」。eggPick と 同じ数字を つかう
    const part = (ic, nm, a, p) => !a.length ? '' :

/* かけらで 好きな子と こうかん */
function buildShardBox(){
  eggStage.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'background:rgba(255,255,255,.75);border-radius:14px;padding:9px;font-size:calc(11px * var(--fs))';
  wrap.innerHTML = '<div style="color:var(--pink-d);font-weight:700;margin-bottom:5px">' +
    '🩷 かけらで交換（いま ' + shards + 'こ）</div>' +
    '<div style="font-size:calc(10px * var(--fs));opacity:.7;margin-bottom:6px">' +
    '欲しい★を選ぶと、まだいない子から1人もらえます</div>';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;justify-content:center';
  for (const lv of [1,2,3,4,5,6]){
    const need = SHARD_COST[lv];
    const left = GEN_LIST.filter(o => o.side === 'ch' && o.lv === lv && !hasGen(o)).length;
    const b = document.createElement('button');
    b.className = 'mini' + (shards < need || !left ? ' gray' : '');
    b.style.cssText = 'font-size:calc(10.5px * var(--fs));padding:6px 8px';
    b.textContent = '★' + lv + '・🩷' + need;
    b.disabled = shards < need || !left;
    b.onclick = () => {
      const pool = GEN_LIST.filter(o => o.side === 'ch' && o.lv === lv && !hasGen(o));
      if (!pool.length || shards < need) return;
      shards -= need; saveShards();
      const o = pool[(Math.random() * pool.length) | 0];
      unlock(o.id);
      showEggResult({ o, dup: false }, true);
    };
    row.append(b);
  }
  wrap.append(row);
  eggStage.append(wrap);
}

/* 買う。はらいかたは ⭐か💎の 2つだけで、出かたは まったく同じ。
   課金を 入れるときは ここの payGems() を Apple の IAP に さしかえる */
function buyEgg(e, pay){
  const no = t => {
    beep(160,.09,'square',.03,.7);
    eggStage.innerHTML = '<div style="font-size:calc(12px * var(--fs));color:#e06f9c">' + t + '</div>';
  };
  /* おだい中は 開けない。おだいで つかった ⭐は 出るときに ふだんの ぶんへ
     もどるので、ここで つかっても タダに なってしまう（仲間だけ 残る）*/
  if (weekly){ no('今週のおだい中は たまごを開けません'); return; }
  if (pay === 'gem'){
    if (!payGems(e.gem)){ no('💎が足りません（💎' + e.gem + '）'); return; }
  } else {
    if (stars < e.cost){ no('おほしさまが足りません（⭐' + fmtN(e.cost) + '）'); return; }
    stars -= e.cost;
    /* ⭐は saveRun でしか のこらない。ここで 書かないと、
       開いたあと 読みこみ直すだけで ⭐が もどってくる（仲間は 残る）*/
    saveRun();
  }
  syncHUD(); syncShop();
  showEggResult(eggDraw(e), false, e);
}

/* ==========================================================
   アバターづくり（じぶんと ともだち）
   ------------------------------------------------------------
   このゲームは サーバーの ない 1まいの HTML なので、
   リアルタイムの 通信たいせんは できない。
   そのかわり アバターを みじかい「あいことば」に して LINEで おくり、
   うけとった人の ゲームに その人が とうじょうする かたちにする。
   （既にある あいことばの しくみと おなじ考えかた）
   ========================================================== */
let avMe = null, avFriends = [];
try{
  const raw = JSON.parse(localStorage.getItem('sweetTD.av') || 'null');
  if (raw){ avMe = raw.me || null; avFriends = raw.fr || []; }
}catch(e){}
function avSave(){
  try{ localStorage.setItem('sweetTD.av', JSON.stringify({ me: avMe, fr: avFriends })); }catch(e){}
}

/* あいことばの 形： av.<8もじ>.<なまえ>
   1もじ1こうもく（36しんほう）。みじかいほど LINEで おくりやすい */
const AV_KEYS = ['s','h','hc','e','m','w','wc','a'];
function avEncode(a){
  const body = AV_KEYS.map(k => (a[k] || 0).toString(36)).join('');
  return 'av.' + body + '.' + encodeURIComponent(a.n || 'ともだち');
}
function avDecode(code){
  const m = String(code || '').trim().match(/^av\.([0-9a-z]{8})\.(.+)$/i);
  if (!m) return null;
  const a = avDefault();
  AV_KEYS.forEach((k, i) => { a[k] = parseInt(m[1][i], 36) || 0; });
  try{ a.n = decodeURIComponent(m[2]).slice(0, 8); }catch(e){ a.n = m[2].slice(0, 8); }
  return a;
}
/* ともだちを むかえる。おなじ人は 見た目だけ 上書きする
   （きせかえを おくりなおしても、たたかった きろくは のこす）*/
function avAddFriend(a){
  if (!a || !a.n) return false;
  const i = avFriends.findIndex(f => f.n === a.n);
  if (i >= 0){
    const old = avFriends[i];
    avFriends[i] = { ...a, w: old.w || 0, l: old.l || 0, bw: old.bw || 0, d: old.d || dateStr() };
  } else {
    avFriends.push({ ...a, w: 0, l: 0, bw: 0, d: dateStr() });
  }
  if (avFriends.length > 12) avFriends.shift();   // ためすぎない
  avSave();
  return true;
}
/* たたかいの きろく。おなじ人が 何人も わくので、なまえで さがして 数える */
function avResult(av, won){
  const f = avFriends.find(x => x.n === av.n);
  if (!f) return null;
  if (won){ f.w = (f.w || 0) + 1; f.bw = Math.max(f.bw || 0, wave); }
  else f.l = (f.l || 0) + 1;
  avSave();
  return f;
}

/* じぶんの アバターは ★7あつかいの つよい なかま。
   じぶんが いちばん つよいほうが うれしいし、2×2の 見せ場にもなる */
const AV_TOWER_KEY = '__me';
const AV_TOWER = { name:'じぶん', ic:'🎀', cost:700, dmg:52, rate:0.62, range:3.2,
                   color:'#ff8fc4', dark:'#e05f9e', splash:0.9, cells:4, avatar:true,
                   role:'範囲', desc:'自分のアバター。まわりの敵もまとめて（4マス使用）' };
TOWERS[AV_TOWER_KEY] = AV_TOWER;
/* 見た目は まいフレーム えがくと 重いので、コレクションと おなじく 焼いておく */
const avSpriteCache = new Map();
function avKey(a){ return AV_KEYS.map(k => a[k] || 0).join('') + '|' + (a.n || ''); }
function avSprite(a, px){
  px = Math.max(24, Math.round(px / 8) * 8);
  const k = avKey(a) + '@' + px;
  const hit = avSpriteCache.get(k);
  if (hit) return hit;
  const c = document.createElement('canvas');
  const d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = px*d; c.height = px*d;
  const g = c.getContext('2d');
  g.setTransform(d,0,0,d,0,0); drawAvatar(g, px, a);
  g.setTransform(d,0,0,d,0,0); portraitShade(g, px);
  avSpriteCache.set(k, c);
  return c;
}
function avThumb(a, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size+'px'; c.style.height = size+'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); drawAvatar(g, size, a);
  g.setTransform(dpr,0,0,dpr,0,0); portraitShade(g, size);
  return c;
}

/* えらぶ ボタンの ならび。色は まるい 見本、それ以外は ことばで */
function avBuildRows(){

/* はじめて あそぶ人に ★1の なかまを 5人 わたす。
   1人も いないと ばんめんに 何も おけず、いきなり つまってしまう */
function giveStarters(){
  try{ if (localStorage.getItem('sweetTD.starter')) return; }catch(e){ return; }
  const pool = GEN_LIST.filter(o => o.side === 'ch' && o.lv === 1);
  for (let i = 0; i < 5 && pool.length; i++){
    const k = (Math.random() * pool.length) | 0;
    unlock(pool[k].id);
    pool.splice(k, 1);
  }
  try{ localStorage.setItem('sweetTD.starter', dateStr()); }catch(e){}
}

function avFromLink(){
  const m = location.search.match(/[?&]f=([^&]+)/);
  if (!m) return;
  const a = avDecode(decodeURIComponent(m[1]));
  if (!a) return;
  if (avAddFriend(a)){
    // ばんめんが できてから 知らせる（起動ちょくごは まだ 何も 見えていない）
    setTimeout(() => floatTx(cx(4), cy(5), a.n + 'が遊びに来た！', '#b98ae0'), 900);
  }
  // dbg など ほかの しるしは のこす（f= だけ 消す）
  try{
    const q = location.search.replace(/([?&])f=[^&]*&?/, '$1').replace(/[?&]$/, '');
    history.replaceState(null, '', location.pathname + q);
  }catch(e){}
}

/* ---------- なかまえらび ----------
   なかまは 77体いるので 買いものバーには のらない。★べつの 別画面から えらぶ。
   えらぶと ふつうの おかしと おなじように ばんめんに おける */
const pickOv = $('pickOv'), pickGrid = $('pickGrid'), pickTabs = $('pickTabs'), pickHint = $('pickHint');
let pickLv = 1, pickIo = null;
for (const b of pickTabs.children) b.onclick = () => {
  pickLv = +b.dataset.p;
  for (const x of pickTabs.children) x.classList.toggle('sel', x === b);
  buildPick(); beep(660,.06,'triangle',.03);
};
function openPick(){ togglePanel('pickOv', buildPick); }
/* 仲間を選ぶ・たまご・アバターは 画面ぜんぶを おおうので、下のボタンが 見えない。
   ここだけは「閉じる」で ばんめんに もどす（ほかの画面は 下のボタンで 行き来する） */
$('pickClose').onclick = () => closePanels();
function buildPick(){
  // もっている子だけ。もっていない子を ならべても おけないので まぎらわしい
  const all  = GEN_LIST.filter(o => o.side === 'ch' && o.lv === pickLv);
  const list = all.filter(o => dex[o.id]);
  pickHint.innerHTML = '★' + pickLv + 'の仲間 ' + list.length + ' / ' + all.length + '人　' +
    '⭐' + ALLY_COST[pickLv] + 'で設置' +
    '<br>いない子は 🥚たまご か 敵を倒して仲間にしよう';
  if (pickIo) pickIo.disconnect();
  pickIo = new IntersectionObserver(es => {
    for (const e of es){
      if (!e.isIntersecting || !e.target.__draw) continue;
      const f = e.target.__draw; e.target.__draw = null;
      pickIo.unobserve(e.target); f();
    }
  }, { root: pickOv, rootMargin: '240px' });
  pickGrid.innerHTML = '';
  // たまごの 入り口
  {
    const d = document.createElement('div');
    d.className = 'pk';
    d.style.cssText = 'grid-column:1/-1;display:flex;align-items:center;gap:10px;' +
      'text-align:left;padding:7px 10px;background:linear-gradient(90deg,#fff0f8,#f4ecff)';
    const c = document.createElement('div');
    c.style.cssText = 'width:52px;height:52px;flex:0 0 52px';
    c.append(eggThumb(EGGS[0], 52));
    d.append(c);
    const left = GEN_LIST.filter(o => o.side === 'ch' && !dex[o.id]).length;
    d.insertAdjacentHTML('beforeend',
      '<div style="flex:1;min-width:0"><div class="pkN">🥚 たまごを開く</div>' +
      '<div class="pkS">残り ' + left + '人　🩷かけら ' + shards + 'こ</div></div>' +
      '<div style="font-size:calc(11px * var(--fs));color:#b98ae0;white-space:nowrap">開く ▶</div>');
    d.onclick = () => { pickOv.classList.remove('on'); openEggScreen('pick'); };
    pickGrid.append(d);
  }
  // じぶんの アバターは ★に かかわらず いちばん上（すぐ おけるように）
  {
    const d = document.createElement('div');
    d.className = 'pk' + (avMe && stars < AV_TOWER.cost ? ' poor' : '');
    d.style.gridColumn = '1/-1';
    d.style.display = 'flex'; d.style.alignItems = 'center'; d.style.gap = '10px';
    d.style.textAlign = 'left'; d.style.padding = '7px 10px';
    if (avMe){
      const c = document.createElement('div');
      c.style.cssText = 'width:56px;height:56px;flex:0 0 56px';
      c.append(avThumb(avMe, 56));
      d.append(c);
      d.insertAdjacentHTML('beforeend',
        '<div style="flex:1"><div class="pkN">🎀 ' + avMe.n + '（自分）</div>' +
        '<div class="pkC">⭐' + AV_TOWER.cost + '</div>' +
        '<div class="pkS">' + AV_TOWER.role + '・攻撃' + AV_TOWER.dmg +
        '・範囲' + AV_TOWER.range.toFixed(1) + '・2×2</div></div>' +
        '<div style="font-size:calc(11px * var(--fs));color:#b98ae0">作り直す ▶</div>');
      d.onclick = ev => {
        if (ev.target.textContent === '作り直す ▶'){ openAvatar('pickOv'); return; }
        selTool = AV_TOWER_KEY; selTower = null;
        pickOv.classList.remove('on'); syncShop(); beep(700,.08,'triangle',.04);
        floatTx(cx(4), cy(6), avMe.n + 'を置く場所をタップ（2×2）', '#b98ae0');
      };
    } else {
      d.insertAdjacentHTML('beforeend',
        '<div style="font-size:30px;flex:0 0 56px;text-align:center">🎀</div>' +
        '<div style="flex:1"><div class="pkN">アバターを作る</div>' +
        '<div class="pkS">顔・髪型・服を選んで<br>自分を盤面に出そう</div></div>' +
        '<div style="font-size:calc(11px * var(--fs));color:#b98ae0">作る ▶</div>');
      d.onclick = () => openAvatar('pickOv');
    }
    pickGrid.append(d);
  }
  if (!list.length){
    const d = document.createElement('div');
    d.className = 'pk';
    d.style.cssText = 'grid-column:1/-1;cursor:default;padding:14px 8px';
    d.innerHTML = '<div style="font-size:24px">🥚</div>' +
      '<div class="pkN">★' + pickLv + 'の仲間は まだいません</div>' +
      '<div class="pkS">たまごを開くか、敵を倒して<br>仲間にしよう</div>';
    pickGrid.append(d);
  }
  for (const o of list){
    const T = TOWERS[o.id];
    const d = document.createElement('div');
    d.className = 'pk' + (stars < T.cost ? ' poor' : '');
    const box = document.createElement('div');
    box.style.cssText = 'width:56px;height:56px;margin:0 auto';
    box.__draw = () => box.replaceWith(genThumb(o, 56));
    pickIo.observe(box);
    d.append(box);
    d.insertAdjacentHTML('beforeend',
      '<div class="pkN">' + o.name + '</div>' +
      '<div class="pkC">⭐' + T.cost + '</div>' +
      '<div class="pkS">' + T.role + '<br>攻撃' + T.dmg + '・範囲' + T.range.toFixed(1) +
      (o.cells >= 4 ? '・2×2' : '') + '</div>');
    d.onclick = () => {
      // ⭐が たりないのに えらべてしまうと、おけると おもって タップしてしまう
      if (stars < T.cost){
        beep(160,.09,'square',.03,.7);
        pickHint.innerHTML = 'おほしさまが たりない…（' + o.name + 'は ⭐' + T.cost + '）<br>' +
          'あと ⭐' + (T.cost - stars) + ' 貯めよう';
        return;
      }
      selTool = o.id; selTower = null;
      pickOv.classList.remove('on');
      syncShop(); beep(700,.08,'triangle',.04);
      floatTx(cx(4), cy(6), o.name + 'を置く場所をタップ', '#b98ae0');
    };
    pickGrid.append(d);
  }
}
function syncShop(){
  for (const el of shopEl.children){
    if (el.dataset.k === '__pick'){
      // なかまを えらんでいる あいだは この ボタンを 光らせる
      const on = !!(selTool && TOWERS[selTool] && (TOWERS[selTool].ally || (TOWERS[selTool].avatar && avMe)));
      el.classList.toggle('sel', on);
      el.classList.remove('poor');
      el.querySelector('.twC').textContent = '';
      el.querySelector('.nm').textContent =
        on ? (TOWERS[selTool].avatar ? (avMe ? avMe.n : 'じぶん') : TOWERS[selTool].name) : '仲間';
      const ic = el.querySelector('.ic');
      if (on){
        ic.textContent = ''; ic.style.fontSize = '';
        ic.append(TOWERS[selTool].avatar ? avThumb(avMe, 42) : genThumb(TOWERS[selTool].gen, 42));
      } else if (!ic.dataset.plain){
        ic.textContent = '🧸'; ic.style.cssText = 'font-size:32px;line-height:46px';
      }
      ic.dataset.plain = on ? '' : '1';
      continue;
    }
    const T = TOWERS[el.dataset.k];
    el.classList.toggle('sel', selTool === el.dataset.k);
    el.classList.toggle('poor', stars < T.cost);
    // ねだんのよこに、いま持っている数（盤面においてある数）。置く・売るでかわる。
    // つづきからで再開したあとも、のこっているおかしはそのまま数える
    const n = towers.filter(t => t.k === el.dataset.k).length;
    el.querySelector('.twC').textContent = ' ×' + n;
  }
}
