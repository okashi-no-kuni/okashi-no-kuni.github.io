/* カードの 数字は ウェーブや ⭐で 毎回 変わるので、絵とは 分けて 出しなおす。
   むかしは openInfo でしか 書かず、**タップしたときの まま 固まって**いた。
   レベル上限（maxLv）は ウェーブで 上がるのに ボタンは「最大レベル」の まま
   おせなくなり、⭐だけ たまっていく（実機の 報告。ウェーブ85・Lv9で
   上限は 11 だった）。だから syncHUD から 毎回 よぶ */
function syncInfo(){
  const t = selTower; if (!t || !infoEl.classList.contains('on')) return;
  const T = TOWERS[t.k];
  const up = t.lv < maxLv() ? Math.round(T.cost * upMul(t.lv)) : null;
  infoTx.innerHTML =
    `<b>${T.name} Lv.${t.lv}</b>　攻撃 ${fmtN(dmgOf(t))}　範囲 ${rangeOf(t).toFixed(1)}<br>` +
    `<span style="opacity:.65">${T.desc}</span>`;
  btnUp.disabled = !up || stars < up;
  /* レベルに 上限は ない（上限は ウェーブで のびつづける）ので、
     「最大レベル」とは 書かない ——うそに なるうえ、そこで 手が 止まる。
     つぎの レベルが 開く ウェーブを 出す。Lv L は ウェーブ (L-3)*10 から */
  btnUp.textContent = up ? `強化 ⭐${fmtN(up)}` : `W${(t.lv-2)*10}でLv${t.lv+1}`;
  btnSell.textContent = `売る ⭐${fmtN(sellOf(t))}`;
}
function closeInfo(){
  infoEl.classList.remove('on'); shopEl.style.display = '';
  selTower = null;
}

// なかまの「おうえん」ボーナス（ずっと有効）と、ワザの一時バフ（数秒だけ）
/* レベル8より 先は うつ間かくを つめない。つめつづけると 1びょうに
   何百発も とんで 重くなるため。そのぶんを こうげき力に まわすので、
   まいびょうの ダメージは これまでと おなじ（1レベルで ×1.78） */
const RATE_LV = 8;
const spdLv   = t => Math.min(t.lv - 1, RATE_LV - 1);
/* t.rb は にじいろの秘薬をのんだ しるし。そのプレイの あいだ こうげき2倍 */
const dmgOf   = t => TOWERS[t.k].dmg   * (t.rb ? 2 : 1) * Math.pow(1.6, t.lv-1) * Math.pow(1/0.9, (t.lv-1) - spdLv(t)) * (hasCh('king')  ? 1.1  : 1) * (buffs.dmg > 0 ? 2   : 1);
const rangeOf = t => TOWERS[t.k].range * Math.pow(1.12, t.lv-1) * (hasCh('fairy') ? 1.05 : 1) * (buffs.rng > 0 ? 1.4 : 1);
const rateOf  = t => TOWERS[t.k].rate  * Math.pow(0.9, spdLv(t))  * (hasCh('taffy') ? 0.93 : 1) * (buffs.spd > 0 ? 0.5 : 1);
const sellOf  = t => {
  let paid = TOWERS[t.k].cost;
  for (let i=1;i<t.lv;i++) paid += Math.round(TOWERS[t.k].cost*upMul(i));
  return Math.round(paid*0.6);
};

btnUp.onclick = () => {
  const t = selTower; if (!t || t.lv >= maxLv()) return;
  const c = Math.round(TOWERS[t.k].cost * upMul(t.lv));
  if (stars < c) return;
  stars -= c; t.lv++; t.pulse = 1;
  // ずかんに「ここまで育てた」記録を残す
  const rc = dex['tw_' + t.k];
  if (rc && (rc.lv || 1) < t.lv){ rc.lv = t.lv; saveDex(); }
  const px = tcx(t), py = tcy(t);
  ring(px, py, '#ffffff', CELL*1.5);
  ring(px, py, t.lv >= 5 ? '#ffd76e' : TOWERS[t.k].color, CELL*2.1);
  for (let i=0;i<18;i++) puff(px, py, '#fff2a8');
  for (let i=0;i<10;i++) puff(px, py, '#ffffff');
  for (let i=0;i<8;i++) mote(px, py - CELL*0.2, '#ffe27a');
  floatTx(px, py - CELL*0.65, t.lv >= 5 ? '最強！' : 'レベルアップ！', '#ffb43f');
  if (t.lv >= 5) celebrate({ conf: 60, rays: 2 });        // さいきょうはひときわ祝う
  else if (t.lv >= 3) celebrate({ conf: 30 });
  beep(620,.12,'triangle',.06);
  setTimeout(()=>beep(830,.12,'triangle',.06),110);
  setTimeout(()=>beep(1050,.22,'triangle',.07),220);
  saveRun();
  syncHUD(); openInfo(t);
};
btnSell.onclick = () => {
  const t = selTower; if (!t) return;
  stars += sellOf(t);
  towers = towers.filter(x => x !== t);
  beep(420,.15,'sine',.05,.6);
  for (let i=0;i<12;i++) puff(tcx(t), tcy(t), '#ffd7ec');
  closeInfo(); saveRun(); syncHUD(); syncShop();
};

/* ==========================================================
   HUD
   ========================================================== */
function syncHUD(){
  syncInfo();                     // カードの ⭐・レベル上限も いっしょに 最新にする
  vHp.textContent = Math.max(0, hearts);
  // げんき（たたかい中の たいりょく）。0で ゲームオーバーなので かならず 見せる
  {
    const mx = maxLife(), v = Math.max(0, Math.min(mx, life | 0));
    vLf.textContent = 'げんき ' + v;
    vLf.classList.toggle('low', v <= mx * 0.3);
  }
  vSt.textContent = fmtN(stars);
  vWv.textContent = wave;
  vBw.textContent = rec.bw > 0 ? '🏆 ベスト ' + rec.bw : '';
  hpBox.classList.toggle('low', hearts <= 3);
  syncShop();
  syncSkills();
}

/* ==========================================================
   入力
   ========================================================== */
/* 盤面のタップ。px,py は 盤面の左上を原点とした CSSピクセル */
function boardTap(px, py){
  if (over) return;
  const c = Math.floor(px/CELL), r = Math.floor(py/CELL);
  if (c<0||c>=COLS||r<0||r>=ROWS) return;

  // ボーナス中は、ふってくるおかしのキャッチ専用
  if (bonus){
    for (let i=bonus.items.length-1;i>=0;i--){
      const it = bonus.items[i];
      if (Math.hypot(px-it.x, py-it.y) <= CELL*0.62){
        bonus.items.splice(i,1); bonus.got++;
        for (let j=0;j<8;j++) puff(it.x, it.y, '#ff9ec9');
        sparkle(it.x, it.y, CELL*0.2, 0, '#fff');
        floatTx(it.x, it.y - CELL*0.4, 'ゲット！', '#ffb43f');
        beep(760,.08,'triangle',.05);
        return;
      }
    }
    return;
  }

  const hit = towerAt(c, r);
  // にじいろの秘薬を えらんでいる あいだは、仲間を タップ＝かける
  if (aimItem === 'elixir'){
    if (hit && !hit.rb){ applyElixir(hit); return; }
    if (hit){ floatTx(tcx(hit), tcy(hit) - CELL, 'もう にじいろです', '#b98ae0'); return; }
    aimItem = null; syncSkills();
    floatTx(px, py, 'やめました', '#b98ae0');
    return;
  }
  if (hit){ selTool = null; selTower = hit; tapSel(); syncShop(); openInfo(hit); return; }

  if (!selTool){ closeInfo(); return; }

  // 4マスの子は 2×2 ぶん あいている ひつようがある
  const sp = spanOf(selTool);
  for (let dc=0; dc<sp; dc++) for (let dr=0; dr<sp; dr++){
    const c2 = c+dc, r2 = r+dr;
    if (c2 >= COLS || r2 >= ROWS || pathCells.has(key(c2,r2)) || towerAt(c2,r2)){
      beep(160,.09,'square',.03,.7);
      floatTx(cx(c), cy(r) - CELL*0.9, sp > 1 ? '2×2ぶん 空いていません' : 'ここには置けません', '#e06f9c');
      return;
    }
  }

  const T = TOWERS[selTool];
  if (stars < T.cost){
    // だまって いると「タップが きいていない」と おもわれる
    beep(160,.09,'square',.03,.7);
    floatTx(cx(c), cy(r) - CELL*0.9,
            'おほしさまが足りません（⭐' + T.cost + '）', '#e06f9c');
    return;
  }

  stars -= T.cost;
  towers.push({ k:selTool, c, r, lv:1, cd:0, ang:-Math.PI/2, pulse:1, ph:Math.random()*6.3 });
  // なかまの id は そのまま（c_xxx）。'tw_' を つけると ありもしない id が
  // ずかんに たまり、なかまは 一生 とうろくされない
  const dexId = T.avatar ? null : (T.ally ? selTool : 'tw_' + selTool);
  if (dexId && unlock(dexId)){
    if (!T.ally) dex[dexId].lv = 1;
    saveDex();
    floatTx(cx(c), cy(r) - CELL*0.95, '図鑑に登録！', '#b98ae0');
  }
  beep(620,.16,'triangle',.05);
  for (let i=0;i<14;i++) puff(cx(c), cy(r), T.color);
  saveRun();
  syncHUD();
}

/* ==========================================================
   ウェーブ
   ========================================================== */
/* ウェーブ開始。early=true なら「はやよび」で、のこり秒数ぶんのボーナス⭐ */
const NEXT_WAIT = 10;          // つぎのウェーブが自動ではじまるまでの秒数
function startWave(early){
  if (running || over) return;
  if (early && nextT > 0 && wave > 0){
    const b = Math.ceil(nextT * (2 + wave*0.4));
    stars += b;
    floatTx(COLS*CELL/2, CELL*1.4, '早よび +⭐' + fmtN(b), '#ffb43f');
  }
  nextT = 0;
  wave++;
  // LAP_WAVES ごとに 道が かわる。てきが 1体も いない ここでだけ 切りかえる
  const chg = applyLayout(wave);
  if (chg){
    floatTx(COLS*CELL/2, CELL*3.0, '🍭 新しい道ができた！', '#b98ae0');
    if (chg.moved)
      floatTx(COLS*CELL/2, CELL*3.9, '道の上の仲間' + chg.moved + '人は ⭐' + fmtN(chg.back) + 'で戻しました', '#e05f9e');
  }
  bgmStart();          // 最初のウェーブからBGM開始（タップ後なので再生できる）
  spawnQ = waveList(wave).slice();
  // とつぜんの ウェーブ。waveList そのものは いじらない（tools/sim.mjs が つかうため）
  wmod = weekly ? null : waveMod(wave);
  if (wmod){
    if (wmod.count){
      const base = spawnQ.slice(), add = Math.round(base.length * (wmod.count - 1));
      for (let i = 0; i < add; i++) spawnQ.push(base[i % base.length]);
    }
    floatTx(COLS*CELL/2, CELL*3.0, wmod.name, wmod.col);
    iflash = 0.7; iflashCol = hexRgb(wmod.col);
    vib([25, 30, 25]);
    beep(wmod.hp && wmod.hp < 1 ? 780 : 300, .16, 'triangle', .06);
  }
  if (weekly){
    // おだいの ぶん。waveList そのものは いじらない（tools/sim.mjs が つかうため）
    if (weekly.many){
      const base = spawnQ.slice(), add = Math.round(base.length * (weekly.many - 1));
      for (let i = 0; i < add; i++) spawnQ.push(base[i % base.length]);
    }
    if (weekly.boss && wave % weekly.boss === 0) spawnQ.push('boss');
  }
  spawnSeq = 0;      // ウェーブごとに 0にもどす（おなじウェーブは いつも おなじ顔ぶれ）
  // ともだちが いると、ステージの まん中の ウェーブが「ともだちバトル」になる
  friendWave = isFriendWave(wave);
  if (friendWave){
    spawnQ = [];
    for (const f of avFriends){ spawnQ.push('golem'); spawnQ.push('fast'); spawnQ.push('slime'); }
    spawnQ.push('boss');
    floatTx(COLS*CELL/2, CELL*2.2, '👭 友だちバトル！', '#ff5f8a');
  }
  spawnT = 0; running = true;
  btnWave.disabled = true;
  waveBtn('ウェーブ' + wave + '<br>進行中');
  // 新しいステージの最初のウェーブでは、景色の名前をお披露目する
  if ((wave-1) % STAGE_WAVES === 0)
    floatTx(COLS*CELL/2, CELL*2.2, '「' + themeOf(wave).name + '」', '#b98ae0');
  beep(560,.2,'triangle',.06);
  syncHUD();
}
btnWave.onclick = () => startWave(true);
btnSpd.onclick = () => { speed = speed % 5 + 1; btnSpd.textContent = speed + 'x'; };
btnSnd.onclick = () => { sndOn = !sndOn; btnSnd.style.opacity = sndOn ? 1 : .45; if (sndOn) beep(600,.1); };

/* ==========================================================
   エフェクト
   ========================================================== */
function puff(x,y,color){
  const a = Math.random()*6.3, s = 20 + Math.random()*90;
  parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-20, life:.4+Math.random()*.4, age:0,
               r:1.5+Math.random()*3.5, color, rot:Math.random()*6.3 });
}
function floatTx(x,y,text,color){ floats.push({ x, y, text, color, age:0, life:.75 }); }
function ring(x,y,color,max){ rings.push({ x, y, r:4, max:max||CELL*1.4, age:0, life:.5, color }); }
function mote(x,y,color){
  parts.push({ x: x+(Math.random()-0.5)*CELL*0.55, y, vx:(Math.random()-0.5)*9,
               vy:-(14+Math.random()*24), g:0, life:.8+Math.random()*.5, age:0,
               r:1.2+Math.random()*2.4, color, rot:Math.random()*6.3 });
}

/* ==========================================================
   お祝いエンジン（達成の瞬間を画面いっぱいに祝う）
   ========================================================== */
const confettiEl = document.getElementById('confetti');
/* 4条の きらめき（シリーズの星形）。ぼかしフィルタは 重いので、
   にじみの まるは SVG の グラデーションで 先に 焼きこんでおく */
const CONF_STAR = 'url("data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">' +
  '<radialGradient id="g"><stop offset="0" stop-color="#fff" stop-opacity=".95"/>' +
  '<stop offset=".55" stop-color="#eaf2ff" stop-opacity=".35"/>' +
  '<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
  '<circle cx="20" cy="20" r="15" fill="url(%23g)"/>' +
  '<path d="M20 1 L22.6 17.4 L39 20 L22.6 22.6 L20 39 L17.4 22.6 L1 20 L17.4 17.4 Z" fill="#fff"/>' +
  '<path d="M29.5 10.5 L20 20 M10.5 29.5 L20 20" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>' +
  '</svg>') + '")';
/* 画面ぜんたいに 銀のきらめきを 舞いおろす。
   まえは 絵文字を 0.5秒で どさっと 落としていて うるさかった。
   いまは 星・光の粒・銀の紙ふぶきを 時間差で ゆっくり ふらせて、
   おちながら またたく（お手本：夜空に ふる 白い きらめき） */
function confettiBurst(n){
  n = Math.min(n, 200 - confettiEl.children.length);   // 出しすぎて重くならないように
  for (let i=0;i<n;i++){
    const fall = document.createElement('span');       // おちる
    const sway = document.createElement('span');       // よこに ゆれる
    const body = document.createElement('span');       // またたく・かたち
    fall.className = 'cf'; sway.className = 'cfS'; body.className = 'cfT';
    const r = Math.random();
    if (r < 0.40){                                     // 大きめの きらめき
      const px = 14 + Math.random()*16;
      body.style.width = body.style.height = px + 'px';
      body.style.backgroundImage = CONF_STAR;
    } else if (r < 0.85){                              // 小さな 光の粒
      const px = 4 + Math.random()*6;
      body.style.width = body.style.height = px + 'px';
      body.classList.add('cfDot');
    } else {                                           // 銀の 紙ふぶき
      body.classList.add('cfPp');
      body.classList.remove('cfT');                    // またたきの かわりに ひらひら
      body.style.width = (5 + Math.random()*4) + 'px';
      body.style.height = (9 + Math.random()*5) + 'px';
    }
    fall.style.left = (Math.random()*100) + '%';
    fall.style.setProperty('--sw', (6 + Math.random()*22) + 'px');
    // ばらばらに 出はじめて、ゆっくり おちる。「どさっと」に しないための 2つ
    fall.style.animationDuration = (4.2 + Math.random()*3.2) + 's';
    fall.style.animationDelay = (Math.random()*1.8) + 's';
    sway.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    sway.style.animationDelay = (-Math.random()*2) + 's';
    body.style.animationDuration = (0.55 + Math.random()*0.9) + 's';
    body.style.animationDelay = (-Math.random()*1.2) + 's';
    fall.addEventListener('animationend', () => fall.remove());
    sway.append(body); fall.append(sway); confettiEl.append(fall);
  }
}
/* 豪華なファンファーレ（big=true でさらに長く） */
function fanfare(big){
  beep(660,.12,'triangle',.06);
  setTimeout(()=>beep(830,.12,'triangle',.06),110);
  setTimeout(()=>beep(990,.14,'triangle',.06),220);
  setTimeout(()=>beep(1320,.25,'triangle',.07),340);
  if (big){
    setTimeout(()=>beep(990,.1,'triangle',.05),560);
    setTimeout(()=>beep(1180,.12,'triangle',.06),660);
    setTimeout(()=>beep(1580,.35,'triangle',.07),780);
  }
}
/* 演出の重ねがけ： {rays:秒, conf:枚数, rings:true, flash:true, fanfare:1|2, x,y} */
function celebrate(o){
  o = o || {};
  if (o.rays) celebT = Math.max(celebT, o.rays);
  if (o.conf) confettiBurst(o.conf);
  if (o.flash) wflash = 1;
  if (o.rings){
    const x = o.x !== undefined ? o.x : COLS*CELL/2;
    const y = o.y !== undefined ? o.y : ROWS*CELL/2;
    ring(x, y, '#ffffff', CELL*3);
    setTimeout(()=>ring(x, y, '#ffd76e', CELL*4.2), 120);
    setTimeout(()=>ring(x, y, '#ff9ec9', CELL*5.4), 240);
  }
  if (o.fanfare) fanfare(o.fanfare >= 2);
}

/* ==========================================================
   ボーナスウェーブ（空からおかしが降ってくる！ぜんぶタップで💗+1）
   20ウェーブごと、ステージクリアのお祝いのあとに開く。
   1こでも取りのがしたら その場で「ざんねん〜」でおしまい。
   ウェーブ数にはカウントしない。落ちる速さはゲーム速度に関係なく一定
   ========================================================== */
const BONUS_EMO = ['🍬','🍩','🍪','🧁','🍓','🍭','🍰','🍮'];
function startBonus(){
  bonus = { spawnLeft: 30, total: 30, spT: 0.4, items: [], got: 0 };
  btnWave.disabled = true;
  waveBtn('🎁 ボーナスタイム！<br>お菓子をタップ！');
  floatTx(COLS*CELL/2, ROWS*CELL*0.35, '🎁 ボーナスウェーブ！', '#ff8fc4');
  floatTx(COLS*CELL/2, ROWS*CELL*0.45, '全部タップ！ひとつも落とさないで', '#b98ae0');
  beep(700,.12,'triangle',.06);
  setTimeout(()=>beep(930,.15,'triangle',.06),130);
}
function bonusUpdate(dt){
  // ずかんなどを見ているあいだは止めてあげる
  const busy = ov.classList.contains('on') || colOv.classList.contains('on') ||
      helpOv.classList.contains('on') || kingOv.classList.contains('on') ||
      pwOv.classList.contains('on');
  // よやくしたボーナスは、クリアのお祝いのパレードを見せてから始める。
  // ここは実時間で動くので、2x・5xにしても ま の長さは変わらない
  if (!bonus){
    if (bonusWait > 0 && !busy && !running && !over && !pendingComplete){
      bonusWait -= dt;
      if (bonusWait <= 0){ bonusWait = 0; startBonus(); }
    }
    return;
  }
  if (busy) return;
  // 「ざんねん〜」を見せているあいだは、おかしを動かさずに待つ
  if (bonus.fail){
    bonus.failT -= dt;
    if (bonus.failT <= 0) endBonus();
    return;
  }
  const H = ROWS*CELL;
  if (bonus.spawnLeft > 0){
    bonus.spT -= dt;
    if (bonus.spT <= 0){
      bonus.spT = 0.55;                       // 出てくる間かく（毎回同じ）
      bonus.spawnLeft--;
      bonus.items.push({ x: CELL*(0.8 + Math.random()*(COLS-1.6)), y: -CELL*0.4,
                         vy: H/3.2,           // 上から下まで約3.2秒（毎回同じ）
                         em: BONUS_EMO[(Math.random()*BONUS_EMO.length)|0],
                         ph: Math.random()*6.3 });
    }
  }
  for (let i=bonus.items.length-1;i>=0;i--){
    const it = bonus.items[i];
    it.y += it.vy*dt; it.ph += dt*4;
    if (it.y > H + CELL*0.4){
      bonus.items.splice(i,1);
      failBonus(it.x, H - CELL*0.5);   // 1こでも おとしたら そこでおしまい
      return;
    }
  }
  if (bonus.spawnLeft === 0 && !bonus.items.length) endBonus();
}
/* 1こでも取りのがしたら、のこりは出さずに「ざんねん〜」画面へ切りかえる */
function failBonus(x, y){
  bonus.fail = true;
  bonus.failT = 2.2;          // この秒数だけ見せてから ステージにもどる
  bonus.spawnLeft = 0;
  bonus.items.length = 0;     // 落ちかけのおかしも消して、あとからタップできないように
  waveBtn('💧 ざんねん〜');
  floatTx(x, y, 'あっ…', '#b98ae0');
  beep(430,.18,'sine',.05,.7);
  setTimeout(()=>beep(330,.26,'sine',.05,.7),170);
}
function endBonus(){
  const perfect = bonus.got >= bonus.total;
  bonus = null;
  waveBtn('次のウェーブ ' + PLAY);   // カウントダウン表示がすぐ引きつぐ
  if (perfect){
    hearts = Math.min(HEART_STOCK_MAX, hearts + 1);   // ごほうびはいつもの上限をこえてためられる
    syncHUD();
    saveRun();                                        // ためた💗をすぐ保存して、とじても消えないように
    // おうじさまとおひめさまが お祝いにかけつける
    // 2人とも ふきだしを出すので、かさならないよう 間をひろめにとる
    paraders.push({ pid:'prince', x:-CELL*1.2, y:ROWS*CELL - CELL*0.85, vx:CELL*2.1, ph:0,   msg:'やったね！' });
    paraders.push({ pid:'apple',  x:-CELL*5.0, y:ROWS*CELL - CELL*0.85, vx:CELL*2.1, ph:2.2, msg:'💗をプレゼントします' });
    floatTx(COLS*CELL/2, ROWS*CELL*0.4, 'パーフェクト！💗+1', '#ff6f9c');
    celebrate({ rays: 2.5, conf: 90, rings: true, fanfare: 1 });
  }
  // しっぱいのときは「ざんねん〜」画面で もう伝えているので、ここでは何も出さない
}

/* ---------- なかまの応援パレード ---------- */
const pcache = {};
function portraitOf(pid){
  if (!pcache[pid]) pcache[pid] = charThumb({ pid }, 44);
  return pcache[pid];
}
const CHEERS = ['やったね！','すごーい！','さすが✨','おめでとう🎉','かっこいい！','だいすき💗'];
/* あつめたなかまが下を行進してお祝いしてくれる（all=true で全員：撮影用） */
function parade(all){
  const got = dexList().filter(o => o.cat === 'ch' && (all || dex[o.id])).map(o => o.pid);
  got.slice(0, 8).forEach((pid, i) => {
    // ふきだしは3体おきだけ。ぜんいんに出すと 横にならんで つぶし合って読めない。
    // のこりの子は だまって歩く（にぎやかさは そのままで、文字だけ読みやすくなる）
    paraders.push({ pid, x: -CELL*(1.2 + i*1.4), y: ROWS*CELL - CELL*0.85,
                    vx: CELL*2.4, ph: Math.random()*6.3,
                    msg: (i % 3 === 0) ? CHEERS[(Math.random()*CHEERS.length)|0] : '' });
  });
}
/* ボス撃破などで、ひとりだけぴょこっと出てくる */
function cheerOne(x, y){
  const got = dexList().filter(o => o.cat === 'ch' && dex[o.id]).map(o => o.pid);
  if (!got.length) return;
  paraders.push({ pid: got[(Math.random()*got.length)|0],
                  x: Math.min(Math.max(x, CELL), COLS*CELL - CELL),
                  y: Math.min(y, ROWS*CELL - CELL*0.85),
                  vx: 0, ph: Math.random()*6.3, msg: 'ナイス✨', life: 1.5 });
}

/* ==========================================================
   更新
   ========================================================== */
function update(dt){
  time += dt;
  if (flash > 0) flash = Math.max(0, flash - dt*2.2);
  if (wflash > 0) wflash = Math.max(0, wflash - dt*1.8);
  if (iflash > 0) iflash = Math.max(0, iflash - dt*1.6);
  if (iSweep > 0) iSweep = Math.max(0, iSweep - dt*1.1);
  if (celebT > 0) celebT = Math.max(0, celebT - dt);

  // 全キャラコンプリートのお披露目は、たたかいと他の画面が落ちついてから
  if (pendingComplete && !running &&
      !ov.classList.contains('on') && !colOv.classList.contains('on') &&
      !helpOv.classList.contains('on') && !kingOv.classList.contains('on') &&
      !pwOv.classList.contains('on'))
    showComplete();

  // 応援パレードのなかまたち
  for (let i=paraders.length-1;i>=0;i--){
    const p = paraders[i];
    p.ph += dt*8;
    if (p.vx){ p.x += p.vx*dt; if (p.x > COLS*CELL + CELL*1.5) paraders.splice(i,1); }
    else { p.life -= dt; if (p.life <= 0) paraders.splice(i,1); }
  }

  // そらをとぶでんせつ。出会う前は影だけがよぎって期待をさそう
  if (!flyer){
    flyT -= dt;
    if (flyT <= 0){
      flyT = 22 + Math.random()*18;
      const owned = LEGENDS.filter(l => dex['lg_' + l.id]);
      const next = LEGENDS.find(l => !dex['lg_' + l.id]);
      let pick = null, sil = false;
      // 予告の影は「いまの プレイで ちかづいたとき」だけ 出す。
      // 自己ベストで はんていすると、あたらしく はじめた ウェーブ1から
      // クジラの影が とんでしまい、ウェーブ60の おどろきが なくなる
      const near = next && wave >= next.wave - 15;
      // あつめた でんせつは ごほうびとして そらを とぶが、
      // はじまってすぐは 画面を しずかに しておく
      const canOwned = owned.length && wave >= 5;
      if (canOwned && Math.random() < 0.7) pick = owned[(Math.random()*owned.length)|0];
      else if (near){ pick = next; sil = true; }
      else if (canOwned) pick = owned[(Math.random()*owned.length)|0];
      if (pick){
        const dir = Math.random() < .5 ? 1 : -1;
        flyer = { pid: pick.id, sil, dir,
                  x: dir > 0 ? -CELL*2 : COLS*CELL + CELL*2,
                  y: CELL*(1.2 + Math.random()*2),
                  v: CELL*(1.2 + Math.random()*0.8) };
        if (sil) floatTx(COLS*CELL/2, CELL*1.2, '…なにかが みている✨', '#b98ae0');
      }
    }
  } else {
    flyer.x += flyer.dir * flyer.v * dt;
    if (flyer.x < -CELL*3 || flyer.x > COLS*CELL + CELL*3) flyer = null;
  }

  // なかまワザのクールダウンと一時バフ（表示は1秒きざみで十分）
  let cdMoved = false;
  for (const k in skCd) if (skCd[k] > 0){ skCd[k] = Math.max(0, skCd[k] - dt); cdMoved = true; }
  for (const k in buffs) if (buffs[k] > 0) buffs[k] = Math.max(0, buffs[k] - dt);
  if (cdMoved && (time*2|0) !== skTick){ skTick = time*2|0; syncSkills(); }

  // つぎのウェーブへのカウントダウン（画面を見ているときだけ進む。
  // はやよびすると のこり秒数ぶんボーナス⭐がもらえる）
  if (!running && !over && wave > 0 && nextT > 0 && !bonus && bonusWait <= 0 &&
      !ov.classList.contains('on') && !colOv.classList.contains('on') &&
      !helpOv.classList.contains('on') && !kingOv.classList.contains('on') &&
      !pwOv.classList.contains('on')){
    nextT -= dt;
    if (nextT <= 0){
      nextT = 0;
      startWave(false);
    } else if ((time*4|0) !== wvTick){
      wvTick = time*4|0;
      const b = Math.ceil(nextT * (2 + wave*0.4));
      waveBtn(PLAY + ' 早よび +⭐' + fmtN(b) + '<br>あと' + Math.ceil(nextT) + 'びょう');
    }
  }

  // 敵の出現（ウェーブが進むと間かくが少しずつ短くなる）
  if (running && spawnQ.length){
    spawnT -= dt;
    if (spawnT <= 0){
      const k = spawnQ.shift();
      spawnEnemy(k, 0);
      spawnT = (k === 'boss' || k === 'golem') ? 1.2 : Math.max(0.4, 0.62 - wave*0.004);
    }
  }

  // 敵の移動
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i], E = ENEMIES[e.k];
    if (e.slow > 0) e.slow -= dt;
    if (e.stun > 0) e.stun -= dt;                    // まもりのたての足止め
    // ボスは ぷりんぼうを しょうかんしてくる（数がふえすぎたら休む）
    if (e.k === 'boss'){
      e.sum = (e.sum === undefined ? 3 : e.sum) - dt;
      if (e.sum <= 0 && enemies.length < 60){
        e.sum = 4;
        const p = posAt(e.d);
        for (let j=0;j<2;j++) spawnEnemy('slime', Math.max(0, e.d - CELL*(0.6 + j*0.5)));
        ring(p.x, p.y, ENEMIES.boss.dark, CELL*1.6);
        floatTx(p.x, p.y - CELL*0.9, 'しょうかん！', '#dd8028');
        beep(240,.15,'square',.04,.8);
      }
    }
    const mul = e.stun > 0 ? 0 : (e.slow > 0 ? (1 - e.slowAmt) : 1);
    e.d += E.spd * CELL * mul * dt * (weekly && weekly.spd ? weekly.spd : 1) * (wmod && wmod.spd ? wmod.spd : 1);
    e.wob += dt*9;
    if (e.d >= pathLen){
      enemies.splice(i,1);
      if (e.av){
        avResult(e.av, false);
        floatTx(COLS*CELL/2, ROWS*CELL - CELL*1.2, e.av.n + 'に通された…', '#b98ae0');
      }
      life -= (e.k === 'boss' ? 5 : 1);
      flash = 1; beep(200,.28,'sawtooth',.06,.5);
      if (life <= 0){
        // ふしちょうのしゅくふく：1プレイに1回だけふみとどまる
        if (hasLg('phoenix') && !phoenixUsed){
          phoenixUsed = true; life = 1;
          celebrate({ conf: 50, rings: true, fanfare: 1 });
          floatTx(COLS*CELL/2, ROWS*CELL/2, 'ふしちょうの ごかご！🔥', '#ff8a3a');
        } else {
          syncHUD(); gameOver(); return;
        }
      }
      syncHUD();
    }
  }

  // タワーの攻撃
  for (const t of towers){
    if (t.lv >= 2 && Math.random() < dt*(t.lv-1)*1.7)
      mote(tcx(t), tcy(t) - CELL*0.08, t.lv >= 4 ? '#ffe27a' : '#ffffff');
    if (t.pulse > 0) t.pulse = Math.max(0, t.pulse - dt*2.6);
    t.cd -= dt;
    const R = rangeOf(t)*CELL, ox = tcx(t), oy = tcy(t);
    let best = null, bestD = -1;
    for (const e of enemies){
      const p = posAt(e.d);
      if (Math.hypot(p.x-ox, p.y-oy) <= R && e.d > bestD){ best = e; bestD = e.d; }
    }
    if (!best) continue;
    const p = posAt(best.d);
    t.ang = Math.atan2(p.y-oy, p.x-ox);
    if (t.cd > 0) continue;
    t.cd = rateOf(t);
    t.pulse = 0.5;
    shots.push({ k:t.k, x:ox, y:oy, target:best, dmg:dmgOf(t), lv:t.lv, life:0, trail:[] });
    beep(t.k==='star'?880:t.k==='choco'?300:660, .07, 'triangle', .028);
  }

  // 弾
  for (let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    s.life += dt;
    if (!enemies.includes(s.target) || s.life > 2.2){ shots.splice(i,1); continue; }
    const p = posAt(s.target.d);
    const dx = p.x-s.x, dy = p.y-s.y, L = Math.hypot(dx,dy) || 1;
    const sp = (s.k==='star' ? 15 : 11) * CELL;
    s.trail.push({x:s.x,y:s.y}); if (s.trail.length > 3 + s.lv*3) s.trail.shift();
    if (L <= sp*dt){ hitTarget(s, p); shots.splice(i,1); continue; }
    s.x += dx/L*sp*dt; s.y += dy/L*sp*dt;
  }

  // パーティクル
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.age += dt;
    if (p.age >= p.life){ parts.splice(i,1); continue; }
    p.vy += (p.g === 0 ? 0 : 130)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*4;
  }
  for (let i=rings.length-1;i>=0;i--){
    const rg = rings[i]; rg.age += dt;
    if (rg.age >= rg.life){ rings.splice(i,1); continue; }
    const k = rg.age/rg.life;
    rg.r = rg.max * (1 - (1-k)*(1-k));
  }
  for (let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.age += dt; f.y -= dt*34;
    if (f.age >= f.life) floats.splice(i,1);
  }
  for (const s of sparks){
    s.y -= s.sp*dt; s.ph += dt*3;
    if (s.y < -8){ s.y = ROWS*CELL+8; s.x = Math.random()*COLS*CELL; }
  }

  // プレゼントキャンディがワザバーへ飛んでいく（山なりの軌道）
  for (let i=gifts.length-1;i>=0;i--){
    const gf = gifts[i]; gf.t += dt;
    const k = Math.min(1, gf.t/gf.life), e2 = k*k*(3-2*k);
    gf.x = gf.sx + (gf.tx-gf.sx)*e2;
    gf.y = gf.sy + (gf.ty-gf.sy)*e2 - Math.sin(k*Math.PI)*CELL*1.6;
    gf.rot += dt*6;
    if (k >= 1){
      gifts.splice(i,1);
      if (gf.it){
        const it = ITEM_BY_ID[gf.it];
        giveItem(it.id, 1);
        floatTx(gf.tx, ROWS*CELL - CELL*0.6, it.ic + ' ' + it.name + ' +1', '#b98ae0');
        beep(660,.08,'triangle',.05); setTimeout(()=>beep(990,.12,'triangle',.05),90);
        vib([15]);
        buildSkillBar();   // はじめて 手に 入れたときは ボタンごと ふえる
      } else {
        skStock[gf.ch] = Math.min(ITEM_MAX, skStock[gf.ch]+1);
        saveSkStock();
        floatTx(gf.tx, ROWS*CELL - CELL*0.6, '+1 ' + SKILLS.find(s=>s.ch===gf.ch).name, '#b98ae0');
        beep(880,.08,'triangle',.04);
        syncSkills();
      }
    }
  }

  // ウェーブ終了
  if (running && !spawnQ.length && !enemies.length){
    running = false;
    const bonus = Math.round((20 + wave*4) * goldWave(wave) * (hasCh('cake') ? 1.2 : 1));
    stars += bonus;
    floatTx(COLS*CELL/2, ROWS*CELL/2, '+⭐'+fmtN(bonus), '#ffb43f');
    beep(700,.15,'triangle',.06); setTimeout(()=>beep(940,.22,'triangle',.06),130);
    btnWave.disabled = false;
    waveBtn('次のウェーブ ' + PLAY);
    nextT = NEXT_WAIT + (hasLg('chronos') ? 3 : 0);   // クロノスのしゅくふくで じっくり
    if (!weekly){ rec.bw = Math.max(rec.bw, wave); saveRec(); }
    syncHUD();
    // 10ウェーブの節目はちいさなお祝い（クリアの節目はstageClearが盛大にやる）
    if (wave % 10 === 0 && wave % STAGE_WAVES !== 0) celebrate({ conf: 30, fanfare: 1 });
    if (wave % STAGE_WAVES === 0) stageClear();
    else checkLegends();
    // ボーナスウェーブは20ウェーブごと（ウェーブ数にはカウントしない）。
    // クリアのお祝いと同じ回なので、ここでは よやくだけして、
    // お祝いの画面がとじてパレードを見せてから始める（下のまちうけ処理）
    if (wave % 20 === 0 && !weekly){
      bonusWait = 2.4;
      btnWave.disabled = true;                       // まちのあいだ はやよびで飛ばされないように
      waveBtn('🎁 このあと<br>ボーナスタイム！');
    }
    saveRun();   // ここまでの進行をオートセーブ
  }
}

// アーマーもちの敵はダメージを軽減する（最低1は通す）
const dmgTo = (e, d) => Math.max(1, d - (ENEMIES[e.k].armor || 0));

function hitTarget(s, p){
  const T = TOWERS[s.k];
  const dead = [];
  if (T.splash){
    const R = T.splash*CELL*Math.pow(1.1, s.lv-1);
    for (const e of enemies){
      const q = posAt(e.d);
      if (Math.hypot(q.x-p.x, q.y-p.y) <= R){ e.hp -= dmgTo(e, s.dmg); if (e.hp <= 0) dead.push(e); }
    }
    for (let i=0;i<10+5*s.lv;i++) puff(p.x, p.y, '#f0c08a');
    if (s.lv >= 3){ for (let i=0;i<6;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, '#f0c08a', CELL*1.7); }
  } else {
    s.target.hp -= dmgTo(s.target, s.dmg);
    if (T.slow){ s.target.slow = T.slowT; s.target.slowAmt = T.slow; }
    if (s.target.hp <= 0) dead.push(s.target);
    for (let i=0;i<3+3*s.lv;i++) puff(p.x, p.y, T.color);
    if (s.lv >= 3){ for (let i=0;i<4;i++) puff(p.x, p.y, '#ffffff'); ring(p.x, p.y, T.color, CELL*1.1); }
  }
  for (const e of dead) killEnemy(e, p.x, p.y);
}

/* 敵をひとり道においてスタートさせる（通常出現とボスのしょうかんで共用） */
let spawnSeq = 0;                                     // ウェーブ内での 何ばんめか
let friendWave = false;                               // いまが ともだちバトルか
let legMissWave = -1;                                 // にじの子に にげられた ウェーブ（お知らせは 1回）
let wmod = null;                                      // いまの「とつぜんの ウェーブ」（waveMod）
const nameRects = [];                                 // ともだちの なまえを おいた ばしょ
/* ともだちが いれば、ステージの まん中で「ともだちバトル」を ひらく。
   ステージクリアの ウェーブと ぶつからないように 10の ところに おく */
const isFriendWave = n => avFriends.length > 0 && n >= 10 && n % STAGE_WAVES === 10;
function spawnEnemy(k, d0){
  const E = ENEMIES[k];
  const hp = E.hp * hpScale(wave) * (weekly && weekly.hp ? weekly.hp : 1) * (wmod && wmod.hp ? wmod.hp : 1);
  const i = spawnSeq++;
  // ともだちバトルでは 'golem'（おもい役）が ともだち本人になる
  const av = (friendWave && k === 'golem') ? avFriends[(i/3|0) % avFriends.length] : null;
  enemies.push({ k, d: d0 || 0, hp: hp*(av?1.4:1), max: hp*(av?1.4:1), slow:0, slowAmt:0,
                 av, gi: av ? null : enemyLook(k, wave, i),
                 wob: Math.random()*6.3, ph: Math.random()*6.3 });
}

/* 敵をたおしたときの共通処理（ごほうび・エフェクト・ずかん） */
function killEnemy(e, px, py){
  const idx = enemies.indexOf(e);
  if (idx < 0) return;
  enemies.splice(idx,1);
  if (unlock('en_' + e.k))
    floatTx(px, py - CELL*0.7, '図鑑に登録！', '#b98ae0');
  if (e.gi){
    /* にじ（25%）と 金（60%）の わくの子は たおしても ときどきしか
       図鑑に 入らない。「運が よければ」の 手ざわり。
       おなじ ウェーブで 何度も「にげた」と 言うと うるさいので 1回だけ */
    const gk = artKeyOf(e.gi);
    const keep = DEX_LEGEND.has(gk) ? LEG_KEEP : DEX_GOLD.has(gk) ? GOLD_KEEP : 1;
    if (dex[e.gi.id] || Math.random() < keep){
      if (unlock(e.gi.id))
        floatTx(px, py - CELL*1.2, e.gi.name + 'が仲間になった！', '#b98ae0');
    } else if (legMissWave !== wave){
      legMissWave = wave;
      floatTx(px, py - CELL*1.2, '✨' + e.gi.name + 'は にげてしまった…', '#b98ae0');
    }
  }
  if (e.av){
    stars += 60;
    const f = avResult(e.av, true);
    shards += 1; saveShards();
    floatTx(px, py - CELL*1.2,
            e.av.n + 'に勝った！ +⭐60 +🩷1' + (f ? '（通算 ' + f.w + '勝）' : ''), '#ff5f8a');
    celebrate({ conf: 30, rings: true, x: px, y: py, fanfare: 1 });
  }
  const g = goldOf(e.k);
  stars += g;
  rec.kills++;                                            // じぶんきろく（保存はウェーブ終了時）
  floatTx(px, py, '+'+g, '#ffb43f');
  if (e.k === 'boss'){
    // ボス撃破は小さなお祝い＋なかまがひとかけつけてくれる
    celebrate({ conf: 36, rings: true, x: px, y: py, fanfare: 1 });
    cheerOne(px, py + CELL*1.2);
  }
  if (Math.random() < dropRate(e.k)) spawnGift(px, py);   // ときどきワザのプレゼントを落とす
  for (let i=0;i<14;i++) puff(px, py, e.gi ? e.gi.pal[0] : ENEMIES[e.k].color);
  beep(520,.1,'sine',.035);
  syncHUD();
}

function gameOver(){
  if (weekly) return weeklyOver();   // おだいは 別の結果画面（自己ベストを 動かさない）
  over = true; running = false;
  closePanels();   // 結果の画面が 図鑑などの うしろに かくれないように
  bgmStop();           // しずかに結果とむきあう
  const newRec = wave > 0 && wave > rec.bw;      // 更新前のベストとくらべて新記録か
  if (!weekly){ rec.plays++; rec.bw = Math.max(rec.bw, wave); saveRec(); }
  ovT.textContent = 'おかしの国が…！';
  const badge = 'display:inline-block;background:linear-gradient(90deg,#ffe9b8,#ffd9ec);' +
    'border:2px solid #ffd76e;border-radius:999px;padding:7px 16px;margin:7px 0;' +
    'color:#c9821e;font-size:calc(16px * var(--fs));opacity:1';
  ovB.innerHTML = 'ウェーブ <b>'+wave+'</b> まで守りぬいた！<br>' +
    (newRec
      ? '<span style="' + badge + ';animation:blink .5s infinite alternate">✨ 新記録！ ウェーブ' + rec.bw + ' ✨</span>'
      : '<span style="' + badge + '">🏆 自己ベスト ウェーブ' + rec.bw + '</span>') +
    '<br><span style="opacity:.7">倒した数：' + rec.kills + '　ランキング：上位' + rankPct() + '%くらい（目安）</span><br>' +
    'もう一度 挑戦してみよう ✨';
  // 💗は「あと なんかい あそべるか」。まけた ときに 1こだけ つかう。
  // てきが ゴールに 入っても へらない（へるのは げんきのバー）
  hearts = Math.max(0, hearts - 1);
  life = maxLife();                 // つぎの プレイは げんき満タンから
  syncHUD();
  saveRun(Math.max(0, wave - 1));   // たおれたウェーブをやりなおせる状態で保存
  ovBtn.disabled = false;
  if (hearts >= 1){
    ovB.innerHTML += '<br><span style="opacity:.75">💗を1こ使いました（残り ' + hearts + '）</span>';
  } else {
    // つかいきったら、時間で少しずつ回復。1こでもたまれば再開できる
    if (!nextHeartAt()) setNextHeartAt(Date.now() + REGEN_MS);
    ovB.innerHTML += '<br><span style="opacity:.75">💗を使いきりました…！ ' + REGEN_MIN + '分ごとに1こずつ回復（最大' + maxHearts() + '）</span>';
  }
  armLifeButton(false);
  ovAlt.textContent = '最初からやり直す';
  ovAlt.style.display = '';
  ovAlt.onclick = () => { clearRun(); reset(); };
  ovShare.style.display = '';
  ov.classList.add('on');
  if (newRec){
    // まけても新記録はしっかり祝う（「もう1回」の気持ちにつながる）
    celebrate({ rays: 2.5, conf: 90, fanfare: 1 });
  } else {
    beep(180,.5,'sawtooth',.06,.4);
  }
}
/* ==========================================================
   コレクションのキャラ（148体）
   ------------------------------------------------------------
   おかしの形だけでは 200種類も 見わけがつかないので、
   からだの「型」（quad=けもの / fowl=とり / bug=むし / hero=人 ほか）に
   みみ・しっぽ・つの などの ちがいを さして 1体ずつ 作りわけている。

   色は その生きもの じしんの色にする（シャチなら 黒と白）。
   レベルでは 変えない。ほんとうの色でないと ただの色ちがいに 見えるから。
   レベル7だけは 例外で にじいろにする。

   えがく じゅんばんが 大事：
     drawGen()      → 平らな色で かたちを つくる
     portraitShade()→ 光と かげを かぶせて 立体にする
     drawGenFx()    → にじいろ・金・キラキラを のせる
   portraitShade は 絵を くらくするので、にじいろは そのあとに かける。
   ========================================================== */
/* ==========================================================
   キャラの部品（たくさんの子を 組みあわせでつくる）

   1体ずつ 手で描いていると 300体で5000行をこえてしまう。
   そこで「からだ（おかしの形）」「あたま」「せなか」「もちもの」を
   部品にして、レシピから 組み立てる。

   色は べたぬりでよい。立体感と つやは portraitShade が
   あとから ぜんぶの子に まとめてのせるため、ここでグラデを
   焼きこむと その子だけ 立体感が二重になってしまう。

   レベルの差は 彩度ではなく かざり（キラキラ・金のふち・かんむり）で
   出す。彩度を上げるとパステルでなくなり、シリーズの見た目が崩れるため。
   ========================================================== */
const GTAU = 6.2832;

/* レベル1〜7の いろ。上へいくほど 色がすこし濃く、
   キラキラ(sp)と 金のふち(metal)が ふえる。7は にじいろ */
const LV = [ null,
  { c:['#ffeef5','#eaf6ff','#edfaef','#fff9e9','#f4efff'], ink:'#cdb2c4', sp:0, metal:null },
  { c:['#ffdcea','#d9eeff','#dbf5e4','#fff2ce','#e7ddff'], ink:'#c49cb4', sp:1, metal:null },
  { c:['#ffc2da','#bfe2ff','#bdeed4','#ffe6ae','#d3bfff'], ink:'#bb87a4', sp:2, metal:null },
  { c:['#ffa5c9','#9fd4ff','#96e5c6','#ffd873','#c4a3ff', ], ink:'#ae7292', sp:3, metal:null },
  { c:['#ff85b8','#78c3ff','#66d9ae','#ffc84a','#ab88ff'], ink:'#9f5f80', sp:5, metal:'#ffd76e' },
  { c:['#ff5fa6','#4aabff','#38cb98','#ffb61f','#8f66ff'], ink:'#8e4a70', sp:7, metal:'#ffd76e' },
  // 7は 形と かおが 見えるように いちど ふつうの色でぬり、
  // 立体感のあとから にじいろを「色相だけ」かける（drawGenFx）
  // 下地は こく。ここが うすいと 色相をかえたあと Lv6より 弱く見えてしまう
  { c:['#ff4f9e','#3aa2ff','#25c592','#ffae14','#8558ff'],
    rainbow:true,                                          ink:'#9a6fb0', sp:12, metal:'#fff0a0' },
];

/* ぬりの色。レベル7だけ にじいろのグラデにする */
function gcol(g, lv, i, S){
  const L = LV[lv];
  if (!L.rainbow) return L.c[i % L.c.length];
  const r = g.createLinearGradient(S*0.16, S*0.16, S*0.84, S*0.84);
  const stops = ['#ffb3d1','#ffd9a3','#fff3a8','#a8f0c8','#a8dcff','#c9b3ff','#ffb3e6'];
  // レシピごとに にじの まわりぐあいを ずらして、全員おなじ色にしない
  for (let k = 0; k < stops.length; k++)
    r.addColorStop(k/(stops.length-1), stops[(k + i) % stops.length]);
  return r;
}

/* ---------- からだ（おかしの形）。ぜんぶ (g,S,x,y,r,col) ---------- */
const gRR = (g,x,y,w,h,rad) => {
  const k = Math.min(rad, w/2, h/2);
  g.beginPath(); g.moveTo(x+k,y);
  g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
  g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k); g.closePath();
};
const GBODY = {
  ball: (g,S,x,y,r,c) => { g.fillStyle=c; g.beginPath(); g.arc(x,y,r,0,GTAU); g.fill(); },

  candy: (g,S,x,y,r,c) => {                       // つつみキャンディ
    g.fillStyle = c;
    for (const s of [-1,1]){
      g.beginPath(); g.moveTo(x+s*r*0.78,y);
      g.lineTo(x+s*r*1.42, y-r*0.56); g.lineTo(x+s*r*1.42, y+r*0.56);
      g.closePath(); g.fill();
    }
    g.beginPath(); g.ellipse(x,y,r,r*0.86,0,0,GTAU); g.fill();
  },

  icecream: (g,S,x,y,r,c) => {                    // コーンの上に まるいアイス
    g.fillStyle = '#e8b979';
    g.beginPath(); g.moveTo(x-r*0.66,y+r*0.28);
    g.lineTo(x+r*0.66,y+r*0.28); g.lineTo(x,y+r*1.5); g.closePath(); g.fill();
    g.fillStyle = c;
    g.beginPath(); g.arc(x, y-r*0.16, r*0.9, 0, GTAU); g.fill();
  },

  choco: (g,S,x,y,r,c,m,c2) => {                  // 板チョコ（つつみ紙は 銀いろに して チョコと 分ける）
    // 銀紙。パレットの こい色を つかうと ぜんたいが 黒い箱に 見えてしまう
    g.fillStyle = '#dfe4ec';
    g.beginPath();
    g.moveTo(x-r*1.1,y+r*0.94); g.lineTo(x-r*0.98,y-r*0.5);
    g.lineTo(x+r*1.02,y-r*0.66); g.lineTo(x+r*1.14,y+r*0.78);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(150,160,180,.35)';         // 銀紙の しわ
    for (let i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(x+r*i*0.42-r*0.03, y-r*0.58); g.lineTo(x+r*i*0.42+r*0.04, y+r*0.86);
      g.lineTo(x+r*i*0.42+r*0.1, y+r*0.86); g.lineTo(x+r*i*0.42+r*0.03, y-r*0.58);
      g.closePath(); g.fill();
    }
    // 中みの チョコ。銀紙から 上に すこし 出す
    const bx = x-r*0.92, by = y-r*0.86, bw = r*1.84, bh = r*1.34;
    g.fillStyle = c;
    gRR(g, bx, by, bw, bh, r*0.08); g.fill();
    // ３×２の ブロック。みぞと ふちの てりで 立体に する
    for (let a2=0;a2<3;a2++) for (let b2=0;b2<2;b2++){
      const px = bx + r*0.06 + a2*(bw-r*0.12)/3, py = by + r*0.06 + b2*(bh-r*0.12)/2;
      const pw = (bw-r*0.12)/3 - r*0.07, ph = (bh-r*0.12)/2 - r*0.07;
      g.fillStyle = 'rgba(255,255,255,.2)';        // 上と 左の ふち
      gRR(g, px, py, pw, ph, r*0.05); g.fill();
      g.fillStyle = c2 || 'rgba(70,40,22,.55)';    // ブロックの おもて
      gRR(g, px+r*0.05, py+r*0.05, pw-r*0.07, ph-r*0.07, r*0.04); g.fill();
      g.fillStyle = 'rgba(255,255,255,.14)';       // つや
      gRR(g, px+r*0.1, py+r*0.09, pw-r*0.3, ph*0.28, r*0.03); g.fill();
    }
  },

  star: (g,S,x,y,r,c) => {                        // ほしのクッキー
    g.fillStyle = c; g.beginPath();
    for (let i=0;i<10;i++){
      const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.46 : r*1.08;
      i ? g.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr)
        : g.moveTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);
    }
    g.closePath(); g.fill();
  },

  macaron: (g,S,x,y,r,c) => {                     // マカロン（上下の生地とクリーム）
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y-r*0.42,r*0.98,r*0.54,0,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x,y+r*0.42,r*0.98,r*0.54,0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.7)';
    gRR(g, x-r*0.9, y-r*0.2, r*1.8, r*0.4, r*0.18); g.fill();
  },

  cake: (g,S,x,y,r,c,m,c2) => {                   // ショートケーキ（いちごたっぷり）
    const berry = (bx,by,br) => {                 // いちご（つぶつぶと へた つき）
      g.fillStyle = '#ff3f6b';
      g.beginPath();
      g.moveTo(bx, by+br*1.15);
      g.bezierCurveTo(bx-br*1.1, by+br*0.5, bx-br*0.95, by-br*0.75, bx, by-br*0.7);
      g.bezierCurveTo(bx+br*0.95, by-br*0.75, bx+br*1.1, by+br*0.5, bx, by+br*1.15);
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,240,180,.85)';
      for (const [dx,dy] of [[-0.4,-0.1],[0.4,-0.1],[0,0.35],[-0.28,0.6],[0.28,0.6]]){
        g.beginPath(); g.arc(bx+br*dx, by+br*dy, br*0.11, 0, GTAU); g.fill();
      }
      g.fillStyle = '#5fb35f';                    // へた
      for (let i=0;i<5;i++){
        const a2 = -Math.PI/2 + i*GTAU/5;
        g.beginPath();
        g.moveTo(bx, by-br*0.62);
        g.lineTo(bx+Math.cos(a2)*br*0.62, by-br*0.62+Math.sin(a2)*br*0.4);
        g.lineTo(bx+Math.cos(a2+0.5)*br*0.3, by-br*0.5+Math.sin(a2+0.5)*br*0.24);
        g.closePath(); g.fill();
      }
    };
    // スポンジ 2だん、あいだに いちごの だんめん
    g.fillStyle = c;
    gRR(g, x-r*1.0, y-r*0.02, r*2.0, r*1.0, r*0.14); g.fill();
    gRR(g, x-r*0.7, y-r*0.9, r*1.4, r*0.9, r*0.12); g.fill();
    g.fillStyle = '#ff7f9e';                      // だんめんの いちご
    for (let i=-2;i<=2;i++){
      g.beginPath(); g.ellipse(x+r*i*0.34, y+r*0.3, r*0.13, r*0.16, 0,0,GTAU); g.fill();
    }
    for (let i=-1;i<=1;i++){
      g.beginPath(); g.ellipse(x+r*i*0.36, y-r*0.56, r*0.12, r*0.15, 0,0,GTAU); g.fill();
    }
    g.fillStyle = c2 || 'rgba(255,255,255,.92)';  // 生クリームの そう
    gRR(g, x-r*1.02, y-r*0.14, r*2.04, r*0.26, r*0.13); g.fill();
    gRR(g, x-r*0.72, y-r*1.0, r*1.44, r*0.24, r*0.12); g.fill();
    for (let i=-3;i<=3;i++){                      // すその しぼりクリーム
      g.beginPath(); g.arc(x+r*i*0.28, y+r*0.98, r*0.15, Math.PI, 0); g.fill();
    }
    berry(x, y-r*1.34, r*0.3);                    // てっぺんの いちご
    berry(x-r*0.52, y-r*1.16, r*0.19);
    berry(x+r*0.52, y-r*1.16, r*0.19);
    g.fillStyle = '#8fd8c4';                      // ミントの は
    g.beginPath(); g.ellipse(x+r*0.26, y-r*1.5, r*0.16, r*0.08, -0.5, 0, GTAU); g.fill();
    g.fillStyle = '#ffd76e';                      // まわりの きんの つぶ
    for (const [dx,dy] of [[-0.8,-0.34],[0.8,-0.34]]){
      g.beginPath(); g.arc(x+r*dx, y+r*dy, r*0.08, 0, GTAU); g.fill();
    }
  },

  wedding: (g,S,x,y,r,c,m,c2) => {                // ウエディングケーキ（3だん・レース・花）
    const tier = (ty, hw, hh) => {
      g.fillStyle = c;
      gRR(g, x-r*hw, y+r*ty, r*hw*2, r*hh, r*0.08); g.fill();
      g.fillStyle = c2 || '#ffd0e2';               // ふちの レース
      for (let i=-6;i<=6;i++){
        const px = x + r*i*(hw*2/13);
        if (Math.abs(px-x) > r*hw) continue;
        g.beginPath(); g.arc(px, y+r*(ty+hh), r*hw*0.1, Math.PI, 0, true); g.fill();
      }
      g.fillStyle = 'rgba(255,255,255,.6)';        // 上ぶちの クリーム
      gRR(g, x-r*hw, y+r*ty, r*hw*2, r*0.1, r*0.04); g.fill();
    };
    tier(0.5, 1.06, 0.62);
    tier(-0.2, 0.78, 0.62);
    tier(-0.88, 0.5, 0.6);
    // 花かざり（だんの あいだに）
    g.fillStyle = m || '#ff9ec9';
    for (const [dx,dy,rr] of [[-0.8,0.46,0.11],[0.8,0.46,0.11],[-0.56,-0.24,0.1],
                              [0.56,-0.24,0.1],[-0.3,-0.92,0.09],[0.3,-0.92,0.09]]){
      for (let k=0;k<5;k++){
        const a2=k*GTAU/5;
        g.beginPath(); g.arc(x+r*dx+Math.cos(a2)*r*rr*0.9, y+r*dy+Math.sin(a2)*r*rr*0.9, r*rr*0.6, 0, GTAU); g.fill();
      }
    }
    // てっぺんの ハート
    g.fillStyle = '#ff5f8a';
    const hx2=x, hy2=y-r*1.34, k2=r*0.22;
    g.beginPath(); g.moveTo(hx2, hy2+k2*0.75);
    g.bezierCurveTo(hx2-k2*1.5, hy2-k2*0.5, hx2-k2*0.3, hy2-k2*1.3, hx2, hy2-k2*0.4);
    g.bezierCurveTo(hx2+k2*0.3, hy2-k2*1.3, hx2+k2*1.5, hy2-k2*0.5, hx2, hy2+k2*0.75);
    g.fill();
  },

  watame: (g,S,x,y,r,c) => {                      // わたあめ（もこもこ）
    g.strokeStyle = '#e0b98a'; g.lineWidth = r*0.13; g.lineCap='round';
    g.beginPath(); g.moveTo(x-r*0.1,y+r*0.6); g.lineTo(x-r*0.34,y+r*1.6); g.stroke();
    g.fillStyle = c;
    // ふちを もこもこにする。まるを かさねるより 波のほうが わたあめらしい
    g.beginPath();
    for (let i=0;i<=14;i++){
      const a = i/14*GTAU, rr = r*(1.0 + 0.1*Math.sin(i*2.6));
      const px = x+Math.cos(a)*rr*1.02, py = y+Math.sin(a)*rr*1.06;
      i ? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
  },

  /* --- いきもの。形は リアル寄りに。
         まるを ならべるのではなく、その生きものの プロポーションと
         とくちょう（ひれの位置・もよう・羽のかさなり）を なぞる。
         色は べたぬりのまま。立体感は portraitShade が あとでのせる --- */

  orca: (g,S,x,y,r,c) => {                        // シャチ
    const dk = 'rgba(90,70,110,.3)';
    g.fillStyle = c;
    // むなびれ（大きな パドル形。からだの下の 前より）
    g.beginPath();
    g.moveTo(x+r*0.34,y+r*0.4);
    g.quadraticCurveTo(x+r*0.02,y+r*1.12, x-r*0.42,y+r*1.16);
    g.quadraticCurveTo(x-r*0.08,y+r*0.74, x+r*0.16,y+r*0.5);
    g.closePath(); g.fill();
    // せびれ（高く、後ろへ すこし たおれる。からだの まん中より すこし前）
    g.beginPath();
    g.moveTo(x+r*0.16,y-r*0.54);
    g.quadraticCurveTo(x+r*0.06,y-r*1.5, x-r*0.44,y-r*1.5);
    g.quadraticCurveTo(x-r*0.3,y-r*0.86, x-r*0.5,y-r*0.5);
    g.closePath(); g.fill();
    // からだ。前が ふとく、しっぽの つけねで きゅっと 細くなる
    g.beginPath();
    g.moveTo(x+r*1.16,y+r*0.02);                  // はな先
    g.bezierCurveTo(x+r*1.14,y-r*0.5,  x+r*0.66,y-r*0.7,  x+r*0.16,y-r*0.68);
    g.bezierCurveTo(x-r*0.5,y-r*0.66,  x-r*0.92,y-r*0.4,  x-r*1.06,y-r*0.14);
    g.bezierCurveTo(x-r*0.94,y+r*0.06, x-r*0.94,y+r*0.1,  x-r*1.06,y+r*0.2);
    g.bezierCurveTo(x-r*0.86,y+r*0.5,  x-r*0.4,y+r*0.7,   x+r*0.16,y+r*0.7);
    g.bezierCurveTo(x+r*0.72,y+r*0.7,  x+r*1.1,y+r*0.48,  x+r*1.16,y+r*0.02);
    g.closePath(); g.fill();
    // おびれ（よこに ひろがり、まん中が くびれる）
    g.beginPath();
    g.moveTo(x-r*0.98,y+r*0.02);
    g.quadraticCurveTo(x-r*1.4,y-r*0.24, x-r*1.72,y-r*0.62);
    g.quadraticCurveTo(x-r*1.4,y-r*0.16, x-r*1.24,y+r*0.04);
    g.quadraticCurveTo(x-r*1.4,y+r*0.26, x-r*1.72,y+r*0.66);
    g.quadraticCurveTo(x-r*1.36,y+r*0.3, x-r*0.98,y+r*0.14);
    g.closePath(); g.fill();
    // おなかの白。あご下から しっぽへ ほそくのびる
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.beginPath();
    g.moveTo(x+r*1.0,y+r*0.24);
    g.bezierCurveTo(x+r*0.6,y+r*0.72, x-r*0.4,y+r*0.72, x-r*0.98,y+r*0.16);
    g.bezierCurveTo(x-r*0.5,y+r*0.46, x+r*0.4,y+r*0.46, x+r*1.0,y+r*0.24);
    g.closePath(); g.fill();
    // 目のうしろの 白いもよう（シャチの めじるし）
    g.beginPath(); g.ellipse(x+r*0.5,y-r*0.34,r*0.3,r*0.15,-0.22,0,GTAU); g.fill();
    // せなかの うすい サドルもよう
    g.fillStyle = dk;

    g.bezierCurveTo(x+r*1.2,y+r*0.06, x+r*1.06,y-r*0.04, x+r*0.9,y-r*0.16);

  turtle: (g,S,x,y,r,c) => {                      // かめ
    g.fillStyle = c;
    for (const [dx,dy,rot,sx,sy] of [                 // あし（前は大きく、後ろは小さく）
      [0.66,0.64,-0.35,0.36,0.24],[-0.72,0.6,0.4,0.3,0.2],[-0.96,0.06,0.15,0.26,0.18]]){

      g.beginPath(); g.ellipse(0,0,r*sx,r*sy,0,0,GTAU); g.fill();
      g.restore();
    }
    g.beginPath();                                // しっぽ
    g.moveTo(x-r*0.86,y+r*0.14);
    g.quadraticCurveTo(x-r*1.28,y+r*0.22, x-r*1.2,y+r*0.44);
    g.quadraticCurveTo(x-r*1.0,y+r*0.34, x-r*0.84,y+r*0.36);
    g.closePath(); g.fill();
    g.beginPath();                                // こうら（後ろが すこし ひろい たまご形）
    g.moveTo(x+r*0.86,y+r*0.06);
    g.bezierCurveTo(x+r*0.84,y-r*0.56, x+r*0.3,y-r*0.86, x-r*0.16,y-r*0.84);
    g.bezierCurveTo(x-r*0.72,y-r*0.82, x-r*1.06,y-r*0.44, x-r*1.06,y+r*0.06);
    g.bezierCurveTo(x-r*1.06,y+r*0.44, x-r*0.6,y+r*0.62, x-r*0.1,y+r*0.62);
    g.bezierCurveTo(x+r*0.44,y+r*0.62, x+r*0.86,y+r*0.42, x+r*0.86,y+r*0.06);
    g.closePath(); g.fill();
    // こうらの もよう。まん中のれつ と ふちのれつ（かめの こうらの つくり）
    g.strokeStyle = 'rgba(255,255,255,.72)'; g.lineWidth = r*0.07;
    g.beginPath(); g.ellipse(x-r*0.1,y-r*0.1,r*0.52,r*0.42,0,0,GTAU); g.stroke();
    for (let i=0;i<7;i++){
      const a2 = i*GTAU/7 + 0.4;
      g.beginPath();
      g.moveTo(x-r*0.1+Math.cos(a2)*r*0.52, y-r*0.1+Math.sin(a2)*r*0.42);
      g.lineTo(x-r*0.1+Math.cos(a2)*r*0.92, y-r*0.1+Math.sin(a2)*r*0.74);
      g.stroke();
    }
    g.fillStyle = c;                              // くび と あたま（こうらの あと）
    g.beginPath(); g.ellipse(x+r*0.82,y+r*0.06,r*0.26,r*0.2,-0.3,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x+r*1.06,y-r*0.16,r*0.44,r*0.38,0,0,GTAU); g.fill();
  },

  bird: (g,S,x,y,r,c) => {                        // ことり

    }
    g.fillStyle = c;
    g.beginPath();                                // おびれ（羽が 3まい かさなる）
    g.moveTo(x-r*0.52,y+r*0.06);
    g.lineTo(x-r*1.5,y-r*0.3); g.lineTo(x-r*1.4,y+r*0.02);
    g.lineTo(x-r*1.56,y+r*0.24); g.lineTo(x-r*1.4,y+r*0.34);

  dragon: (g,S,x,y,r,c,m,c2) => {                 // ドラゴン
    const ac = c2 || c;
    g.fillStyle = c;
    g.beginPath();                                // しっぽ（S字に うねって さきが やじり）
    g.moveTo(x-r*0.5,y+r*0.24);
    g.bezierCurveTo(x-r*1.16,y+r*0.26, x-r*1.4,y+r*0.7, x-r*1.26,y+r*1.06);
    g.bezierCurveTo(x-r*1.14,y+r*0.72, x-r*0.92,y+r*0.58, x-r*0.44,y+r*0.62);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x-r*1.3,y+r*0.96); g.lineTo(x-r*1.76,y+r*0.78);
    g.lineTo(x-r*1.52,y+r*1.04); g.lineTo(x-r*1.68,y+r*1.34);
    g.closePath(); g.fill();
    // つばさ（こうもり型）。これが ないと ただの トカゲに 見える
    g.fillStyle = ac;
    g.beginPath();
    g.moveTo(x-r*0.2,y-r*0.3);
    g.bezierCurveTo(x-r*1.0,y-r*1.34, x-r*1.7,y-r*1.22, x-r*1.66,y-r*0.86);
    g.lineTo(x-r*1.16,y-r*0.86); g.lineTo(x-r*1.34,y-r*0.44);
    g.lineTo(x-r*0.76,y-r*0.6); g.lineTo(x-r*0.86,y-r*0.16);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(90,70,110,.3)'; g.lineWidth = r*0.05;   // つばさの ほね
    for (const [ex,ey] of [[-1.6,-0.88],[-1.28,-0.5],[-0.82,-0.2]]){
      g.beginPath(); g.moveTo(x-r*0.24,y-r*0.34); g.lineTo(x+r*ex,y+r*ey); g.stroke();
    }
    g.fillStyle = ac;
    for (let i=0;i<5;i++){                        // せなかの とげ
      const k = 1 - i*0.15;
      g.beginPath();
      g.moveTo(x-r*(0.0+i*0.28), y-r*0.5);
      g.lineTo(x-r*(0.16+i*0.28), y-r*(0.5+0.46*k));
      g.lineTo(x-r*(0.34+i*0.28), y-r*0.44);
      g.closePath(); g.fill();
    }
    g.fillStyle = c;
    g.beginPath();                                // からだ
    g.ellipse(x-r*0.12,y+r*0.2,r*0.8,r*0.72,0.06,0,GTAU); g.fill();
    g.beginPath();                                // あし（かぎづめ つき）
    g.ellipse(x+r*0.34,y+r*0.74,r*0.3,r*0.2,-0.26,0,GTAU); g.fill();
    g.ellipse(x-r*0.58,y+r*0.74,r*0.28,r*0.18,0.28,0,GTAU); g.fill();
    g.fillStyle = '#fdfaff';
    for (const [bx,s2] of [[0.56,1],[-0.8,-1]])
      for (let i=-1;i<=1;i++){
        g.beginPath();
        g.moveTo(x+r*bx, y+r*0.8); g.lineTo(x+r*(bx+s2*0.16), y+r*(0.86+i*0.06));
        g.lineTo(x+r*bx, y+r*0.9); g.closePath(); g.fill();
      }
    g.fillStyle = c;
    g.beginPath();                                // くび（太くして あたまを 胴から はなす）
    g.moveTo(x+r*0.2,y-r*0.4);
    g.bezierCurveTo(x+r*0.78,y-r*0.54, x+r*0.94,y-r*0.86, x+r*0.9,y-r*1.14);
    g.bezierCurveTo(x+r*0.4,y-r*0.94, x+r*0.16,y-r*0.5, x-r*0.14,y-r*0.24);
    g.closePath(); g.fill();
    g.beginPath();                                // あたま（大きく して 竜らしく）
    g.ellipse(x+r*0.72,y-r*1.16,r*0.6,r*0.5,0.12,0,GTAU); g.fill();
    g.fillStyle = ac;                             // あたまの つの（うしろへ そる）
    for (const s2 of [-1,1]){
      g.beginPath();
      g.moveTo(x+r*(0.5+s2*0.06), y-r*1.5);
      g.quadraticCurveTo(x+r*(0.06+s2*0.06), y-r*(1.9+s2*0.12), x+r*(0.2+s2*0.06), y-r*1.5);
      g.closePath(); g.fill();
    }
    g.fillStyle = c;
    g.beginPath();                                // はな先（あごが 前に つき出す）
    g.moveTo(x+r*1.02,y-r*1.46);
    g.quadraticCurveTo(x+r*1.72,y-r*1.3, x+r*1.6,y-r*0.98);
    g.lineTo(x+r*1.0,y-r*0.88);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.3)';         // はなの あたま側の てり
    g.beginPath(); g.ellipse(x+r*1.2,y-r*1.34,r*0.24,r*0.07,-0.1,0,GTAU); g.fill();
    g.fillStyle = '#4a3a4a';
    g.beginPath(); g.ellipse(x+r*1.5,y-r*1.24,r*0.07,r*0.06,0,0,GTAU); g.fill();
    g.fillStyle = c;
    g.fillStyle = '#fdfaff';                      // きば
    for (const s2 of [0,1]){
      g.beginPath();
      g.moveTo(x+r*(1.14+s2*0.26), y-r*0.94); g.lineTo(x+r*(1.2+s2*0.26), y-r*0.68);
      g.lineTo(x+r*(1.28+s2*0.26), y-r*0.96); g.closePath(); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.55)';        // おなかの もよう（横しま）
    g.save();
    g.beginPath(); g.ellipse(x-r*0.06,y+r*0.46,r*0.48,r*0.32,0,0,GTAU); g.clip();
    for (let i=0;i<4;i++){
      g.beginPath(); g.ellipse(x-r*0.06, y+r*(0.2+i*0.2), r*0.48, r*0.07, 0, 0, GTAU); g.fill();
    }
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.22)';      // うろこ
    g.lineWidth = r*0.04;
    for (let a2=0;a2<3;a2++) for (let b2=0;b2<3;b2++){
      g.beginPath();
      g.arc(x-r*(0.62-a2*0.34), y-r*(0.24-b2*0.28), r*0.16, Math.PI*1.05, Math.PI*1.95); g.stroke();
    }
  },

  fairy: (g,S,x,y,r,c,m,c2) => {                  // ようせい：はねが 主役。虹いろの まく に すじが とおる
    // はね（上が大きく、下が小さい。うすく すきとおらせる）
    const wing = (sx, sy, w, h, rot, al) => {
      g.save(); g.translate(x + r*sx, y + r*sy); g.rotate(rot);
      const wg = g.createLinearGradient(0, -h*r, 0, h*r);
      const st = ['#ffc2e0','#ffe6b8','#fbffbf','#bff0d8','#bfe4ff','#dcc8ff'];
      for (let k=0;k<st.length;k++) wg.addColorStop(k/(st.length-1), st[k]);
      g.globalAlpha = al;
      g.fillStyle = wg;
      g.beginPath(); g.ellipse(0, 0, w*r, h*r, 0, 0, GTAU); g.fill();
      g.globalAlpha = al*0.8;                     // はねの すじ
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = r*0.035;
      for (let i=-2;i<=2;i++){
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(w*r*0.5, h*r*i*0.3, w*r*0.94, h*r*i*0.28);
        g.stroke();
      }
      g.restore();
    };
    wing(-0.5, -0.62, 0.66, 0.4, -0.55, 0.85);    // 左上
    wing( 0.5, -0.62, 0.66, 0.4,  0.55+Math.PI, 0.85);
    wing(-0.44, -0.02, 0.44, 0.28, -0.3, 0.75);   // 左下
    wing( 0.44, -0.02, 0.44, 0.28,  0.3+Math.PI, 0.75);
    // スカート（花びらを かさねた形）
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.1, y+r*0.1);
    for (let i=-3;i<=3;i++){
      g.lineTo(x + r*i*0.16, y + r*(0.72 + 0.14*Math.cos(i*1.1)));
    }
    g.lineTo(x+r*0.1, y+r*0.1); g.closePath(); g.fill();
    g.fillStyle = c2 || c;                        // 上の花びら
    g.beginPath();
    g.moveTo(x-r*0.06, y+r*0.1);
    for (let i=-2;i<=2;i++) g.lineTo(x + r*i*0.14, y + r*(0.5 + 0.1*Math.cos(i*1.2)));
    g.lineTo(x+r*0.06, y+r*0.1); g.closePath(); g.fill();
    // からだ と あたま
    g.fillStyle = '#ffe4d0';
    g.beginPath(); g.ellipse(x, y+r*0.02, r*0.2, r*0.26, 0, 0, GTAU); g.fill();
    for (const s2 of [-1,1]){                     // あし
      g.beginPath(); g.ellipse(x+s2*r*0.12, y+r*0.92, r*0.07, r*0.22, s2*0.2, 0, GTAU); g.fill();
    }
    g.beginPath(); g.arc(x, y-r*0.44, r*0.36, 0, GTAU); g.fill();
    g.fillStyle = m || '#d8a860';                 // かみ。かおに かからないよう 外がわだけ
    g.beginPath(); g.arc(x, y-r*0.44, r*0.44, Math.PI*1.06, Math.PI*1.94); g.fill();
    for (const [dx,dy,rr] of [[-0.42,-0.44,0.18],[0.42,-0.44,0.18],
                              [-0.34,-0.72,0.17],[0.34,-0.72,0.17],[0,-0.8,0.19]])
      { g.beginPath(); g.arc(x+r*dx, y+r*dy, r*rr, 0, GTAU); g.fill(); }
  },

  butterfly: (g,S,x,y,r,c,m,c2) => {              // ちょうちょ：4まいばね、すじ入り
    const wing = (sx, sy, w, h, rot, al) => {
      g.save(); g.translate(x + r*sx, y + r*sy); g.rotate(rot);

      for (let k=0;k<st.length;k++) wg.addColorStop(k/(st.length-1), st[k]);
      g.globalAlpha = al; g.fillStyle = wg;

      g.beginPath(); g.ellipse(0,0,w*r,h*r,0,0,GTAU); g.stroke();
      g.lineWidth = r*0.025;                      // はねの すじ
      for (let i=-2;i<=2;i++){
        g.beginPath(); g.moveTo(-w*r*0.9, 0);
        g.quadraticCurveTo(0, h*r*i*0.34, w*r*0.86, h*r*i*0.3);
        g.stroke();
      }
      g.restore();
    };
    wing(-0.72,-0.36, 0.74, 0.46, -0.42, 0.92);   // うわばね

  unicorn: (g,S,x,y,r,c,m,c2,rc) => {             // ユニコーン：たてがみと しっぽが ながれる
    const uo = (rc && rc.opt) || {};
    if (uo.wing){                                 // ペガサスの つばさ
      g.fillStyle = 'rgba(255,255,255,.95)';
      for (const s2 of [-1,1]){
        g.beginPath();
        g.moveTo(x-r*0.1,y-r*0.16);
        g.bezierCurveTo(x+s2*r*0.9,y-r*1.5, x+s2*r*1.5,y-r*0.66, x+s2*r*1.16,y-r*0.1);
        g.bezierCurveTo(x+s2*r*0.8,y-r*0.4, x+s2*r*0.4,y-r*0.34, x-r*0.06,y-r*0.06);
        g.closePath(); g.fill();
      }
    }
    g.fillStyle = c2 || '#c9a7ff';                // しっぽ（うねる）
    g.beginPath();
    g.moveTo(x-r*0.66, y+r*0.02);
    g.bezierCurveTo(x-r*1.5,y-r*0.2, x-r*1.5,y+r*0.72, x-r*1.02,y+r*0.96);
    g.bezierCurveTo(x-r*1.16,y+r*0.5, x-r*0.92,y+r*0.36, x-r*0.6,y+r*0.4);
    g.closePath(); g.fill();
    g.fillStyle = c;
    for (const [dx,rot] of [[-0.42,0.12],[0.3,-0.1],[-0.14,0.06],[0.56,-0.14]]){  // あし
      g.save(); g.translate(x+r*dx, y+r*0.72); g.rotate(rot);
      g.beginPath(); g.ellipse(0,0,r*0.13,r*0.34,0,0,GTAU); g.fill();
      g.restore();
    }
    g.beginPath();                                // どうたい
    g.ellipse(x-r*0.06, y+r*0.16, r*0.78, r*0.52, -0.06, 0, GTAU); g.fill();
    g.beginPath();                                // くび
    g.moveTo(x+r*0.32,y-r*0.16);
    g.bezierCurveTo(x+r*0.72,y-r*0.3, x+r*0.86,y-r*0.7, x+r*0.8,y-r*0.98);
    g.bezierCurveTo(x+r*0.56,y-r*0.72, x+r*0.36,y-r*0.36, x+r*0.2,y-r*0.1);
    g.closePath(); g.fill();
    g.beginPath();                                // あたま（はなさきが 長い）
    g.ellipse(x+r*0.86,y-r*1.0,r*0.42,r*0.3,0.5,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x+r*1.1,y-r*0.76,r*0.2,r*0.16,0.6,0,GTAU); g.fill();
    g.beginPath();                                // みみ
    g.moveTo(x+r*0.66,y-r*1.2); g.lineTo(x+r*0.7,y-r*1.56);
    g.lineTo(x+r*0.88,y-r*1.24); g.closePath(); g.fill();
    g.fillStyle = c2 || '#c9a7ff';                // たてがみ
    g.beginPath();
    g.moveTo(x+r*0.62,y-r*1.2);
    g.bezierCurveTo(x+r*0.1,y-r*1.4, x-r*0.3,y-r*0.9, x-r*0.16,y-r*0.28);
    g.bezierCurveTo(x-r*0.02,y-r*0.7, x+r*0.3,y-r*0.86, x+r*0.5,y-r*0.86);
    g.closePath(); g.fill();
    g.fillStyle = m || '#ffd76e';                 // つの（らせんの みぞ）
    g.beginPath();
    g.moveTo(x+r*0.78,y-r*1.3); g.lineTo(x+r*0.98,y-r*1.3);
    g.lineTo(x+r*0.96,y-r*2.0); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = r*0.04;
    for (let i=1;i<=3;i++){
      const t2=i/4;
      g.beginPath();
      g.moveTo(x+r*(0.78+0.18*t2), y-r*(1.3+0.7*t2));
      g.lineTo(x+r*(0.98-0.02*t2), y-r*(1.34+0.7*t2));
      g.stroke();
    }
  },

  /* --- 人のキャラ。まるい体に かざりを のせるのではなく、
         その役らしい すがた（ぼうし・マント・ほうき・ドレス）を ちゃんと つくる --- */

  witch: (g,S,x,y,r,c,m,c2) => {                  // まじょ
    const skin = '#ffe0c8';
    // ほうき（ななめ うしろに かまえる）
    g.strokeStyle = '#b98a5a'; g.lineWidth = r*0.1; g.lineCap='round';
    g.beginPath(); g.moveTo(x-r*1.24,y+r*1.16); g.lineTo(x+r*0.9,y-r*0.18); g.stroke();
    g.fillStyle = '#e8c489';                      // ほ（ひろがった たば）
    g.beginPath();
    g.moveTo(x+r*0.74,y-r*0.08);
    g.lineTo(x+r*1.42,y-r*0.62); g.lineTo(x+r*1.5,y-r*0.16);
    g.lineTo(x+r*1.36,y+r*0.16); g.closePath(); g.fill();
    g.strokeStyle='rgba(150,110,70,.5)'; g.lineWidth=r*0.03;
    for (let i=0;i<4;i++){
      g.beginPath(); g.moveTo(x+r*0.82,y-r*0.06);
      g.lineTo(x+r*(1.38-i*0.02), y-r*(0.54-i*0.2)); g.stroke();
    }
    g.strokeStyle = '#8a6440'; g.lineWidth = r*0.06;
    g.beginPath(); g.moveTo(x+r*0.7,y+r*0.02); g.lineTo(x+r*0.84,y-r*0.14); g.stroke();
    // マント（うしろに ひろがる）
    g.fillStyle = c2 || '#6b4f8a';
    g.beginPath();
    g.moveTo(x-r*0.32,y-r*0.28);
    g.bezierCurveTo(x-r*1.2,y+r*0.1, x-r*1.16,y+r*0.86, x-r*0.86,y+r*1.06);
    g.lineTo(x+r*0.1,y+r*0.9); g.closePath(); g.fill();
    // ローブ（すそが ぎざぎざ）
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.26,y-r*0.16); g.lineTo(x+r*0.26,y-r*0.16);
    g.lineTo(x+r*0.62,y+r*0.92);
    for (let i=4;i>=0;i--) g.lineTo(x+r*(0.62-i*0.31), y+r*(0.92 + (i%2?0.16:0)));
    g.closePath(); g.fill();
    // あし（しましまタイツ と とんがりぐつ）
    for (const s2 of [-1,1]){
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(x+s2*r*0.2, y+r*1.14, r*0.1, r*0.24, 0,0,GTAU); g.fill();
      g.fillStyle = c2 || '#6b4f8a';
      for (let i=0;i<3;i++){
        g.beginPath();
        g.ellipse(x+s2*r*0.2, y+r*(1.0+i*0.16), r*0.1, r*0.045, 0,0,GTAU); g.fill();
      }
      g.beginPath();                              // さきの とがった くつ
      g.moveTo(x+s2*r*0.1,y+r*1.34);
      g.lineTo(x+s2*r*0.3,y+r*1.34); g.lineTo(x+s2*r*0.5,y+r*1.5);
      g.lineTo(x+s2*r*0.08,y+r*1.5); g.closePath(); g.fill();
    }
    // うで（ほうきを もつ）
    g.strokeStyle = skin; g.lineWidth = r*0.14; g.lineCap='round';
    g.beginPath(); g.moveTo(x+r*0.16,y+r*0.02); g.lineTo(x+r*0.6,y+r*0.08); g.stroke();
    // あたま
    g.fillStyle = skin;
    g.beginPath(); g.arc(x, y-r*0.46, r*0.38, 0, GTAU); g.fill();
    // かみ（ながく うねる）
    g.fillStyle = m || '#6b4a3a';
    g.beginPath();
    g.moveTo(x-r*0.38,y-r*0.5);
    g.bezierCurveTo(x-r*0.66,y+r*0.1, x-r*0.5,y+r*0.4, x-r*0.3,y+r*0.34);
    g.bezierCurveTo(x-r*0.34,y-r*0.06, x-r*0.3,y-r*0.3, x-r*0.2,y-r*0.5);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x+r*0.38,y-r*0.5);
    g.bezierCurveTo(x+r*0.62,y+r*0.06, x+r*0.46,y+r*0.36, x+r*0.28,y+r*0.3);
    g.bezierCurveTo(x+r*0.32,y-r*0.08, x+r*0.28,y-r*0.3, x+r*0.18,y-r*0.5);
    g.closePath(); g.fill();
    // ぼうし（つばが ひろく、さきが しなる）
    g.fillStyle = c2 || '#6b4f8a';
    g.beginPath(); g.ellipse(x, y-r*0.8, r*0.86, r*0.2, -0.04, 0, GTAU); g.fill();
    g.beginPath();
    g.moveTo(x-r*0.42,y-r*0.84);
    g.bezierCurveTo(x-r*0.2,y-r*1.6, x+r*0.22,y-r*1.9, x+r*0.6,y-r*1.82);
    g.bezierCurveTo(x+r*0.3,y-r*1.4, x+r*0.4,y-r*0.98, x+r*0.42,y-r*0.84);
    g.closePath(); g.fill();
    g.fillStyle = m || '#ffd76e';                 // ぼうしの バンドと 星
    gRR(g, x-r*0.44, y-r*1.0, r*0.88, r*0.18, r*0.08); g.fill();
    g.save(); g.translate(x+r*0.28, y-r*1.06);
    g.beginPath();
    for (let i=0;i<10;i++){
      const a2=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.06:r*0.15;
      i? g.lineTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2) : g.moveTo(Math.cos(a2)*rr2,Math.sin(a2)*rr2);
    }
    g.closePath(); g.fill(); g.restore();
  },

  princess: (g,S,x,y,r,c,m,c2) => {               // おひめさま
    const skin = '#ffe4d0';
    // ドレス（3だんの ふくらみ）
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.24,y-r*0.1); g.lineTo(x+r*0.24,y-r*0.1);
    g.bezierCurveTo(x+r*0.9,y+r*0.6, x+r*0.96,y+r*1.1, x+r*0.86,y+r*1.28);
    g.bezierCurveTo(x, y+r*1.5, x-r*0.86,y+r*1.28, x-r*0.86,y+r*1.28);
    g.bezierCurveTo(x-r*0.96,y+r*1.1, x-r*0.9,y+r*0.6, x-r*0.24,y-r*0.1);
    g.closePath(); g.fill();
    g.fillStyle = c2 || '#ffffff';                // すその フリル
    for (let i=-3;i<=3;i++){
      g.beginPath();
      g.arc(x+r*i*0.26, y+r*1.28, r*0.16, 0, Math.PI); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.5)';         // まえの きりかえ
    g.beginPath();
    g.moveTo(x, y+r*0.1);
    g.bezierCurveTo(x+r*0.4,y+r*0.7, x+r*0.42,y+r*1.1, x+r*0.34,y+r*1.28);
    g.lineTo(x-r*0.34,y+r*1.28);
    g.bezierCurveTo(x-r*0.42,y+r*1.1, x-r*0.4,y+r*0.7, x, y+r*0.1);
    g.closePath(); g.fill();
    // ぱふスリーブ と うで
    g.fillStyle = c;
    for (const s2 of [-1,1]){
      g.beginPath(); g.arc(x+s2*r*0.34, y-r*0.06, r*0.19, 0, GTAU); g.fill();
    }
    g.strokeStyle = skin; g.lineWidth = r*0.12; g.lineCap='round';
    for (const s2 of [-1,1]){
      g.beginPath(); g.moveTo(x+s2*r*0.38,y+r*0.02); g.lineTo(x+s2*r*0.52,y+r*0.32); g.stroke();
    }
    // からだ と あたま
    g.fillStyle = skin;
    g.beginPath(); g.ellipse(x, y-r*0.12, r*0.2, r*0.16, 0,0,GTAU); g.fill();
    g.beginPath(); g.arc(x, y-r*0.5, r*0.38, 0, GTAU); g.fill();
    // かみ（たてロールっぽく まく）
    g.fillStyle = m || '#f0c46a';
    g.beginPath(); g.arc(x, y-r*0.56, r*0.44, Math.PI*1.02, Math.PI*1.98); g.fill();
    for (const s2 of [-1,1]){
      g.beginPath();
      g.moveTo(x+s2*r*0.4,y-r*0.62);
      g.bezierCurveTo(x+s2*r*0.72,y-r*0.1, x+s2*r*0.6,y+r*0.36, x+s2*r*0.34,y+r*0.3);
      g.bezierCurveTo(x+s2*r*0.5,y-r*0.06, x+s2*r*0.34,y-r*0.4, x+s2*r*0.24,y-r*0.6);
      g.closePath(); g.fill();
      g.beginPath(); g.arc(x+s2*r*0.44, y+r*0.24, r*0.16, 0, GTAU); g.fill();
    }
    // ティアラ
    g.fillStyle = '#ffd76e';
    g.beginPath();
    g.moveTo(x-r*0.34,y-r*0.84);
    g.quadraticCurveTo(x, y-r*1.3, x+r*0.34,y-r*0.84);
    g.quadraticCurveTo(x, y-r*1.02, x-r*0.34,y-r*0.84);
    g.closePath(); g.fill();
    g.fillStyle = '#ff8fc4';
    g.beginPath(); g.arc(x, y-r*1.06, r*0.08, 0, GTAU); g.fill();
  },

  prince: (g,S,x,y,r,c,m,c2) => {                 // おうじさま

  starfish: (g,S,x,y,r,c,m,c2) => {               // ヒトデ
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<5;i++){
      const a1=-Math.PI/2+i*GTAU/5, a2=a1+GTAU/10;
      const p1x=x+Math.cos(a1)*r*1.24, p1y=y+Math.sin(a1)*r*1.24;
      i? g.lineTo(p1x,p1y) : g.moveTo(p1x,p1y);
      g.quadraticCurveTo(x+Math.cos(a2)*r*0.3, y+Math.sin(a2)*r*0.3,
                         x+Math.cos(a1+GTAU/5)*r*1.24, y+Math.sin(a1+GTAU/5)*r*1.24);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.5)';   // つぶつぶ
    for (let i=0;i<5;i++){
      const a1=-Math.PI/2+i*GTAU/5;
      for (let k=1;k<=2;k++){
        g.beginPath();
        g.arc(x+Math.cos(a1)*r*k*0.36, y+Math.sin(a1)*r*k*0.36, r*0.08, 0, GTAU); g.fill();
      }
    }
  },

  clownfish: (g,S,x,y,r,c,m,c2) => {              // カクレクマノミ
    g.fillStyle = c;
    g.beginPath();                                // せびれ・はらびれ
    g.moveTo(x-r*0.1,y-r*0.5); g.lineTo(x+r*0.2,y-r*0.96);
    g.lineTo(x+r*0.44,y-r*0.44); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x-r*0.1,y+r*0.5); g.lineTo(x+r*0.1,y+r*0.92);
    g.lineTo(x+r*0.4,y+r*0.44); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(x+r*0.06,y,r*1.0,r*0.62,0,0,GTAU); g.fill();
    g.beginPath();                                // おびれ
    g.moveTo(x-r*0.86,y);
    g.lineTo(x-r*1.46,y-r*0.5); g.lineTo(x-r*1.32,y);
    g.lineTo(x-r*1.46,y+r*0.5); g.closePath(); g.fill();
    g.fillStyle = '#ffffff';                      // 白い3本の帯
    for (const [dx,w] of [[0.56,0.16],[0.0,0.2],[-0.6,0.13]]){
      g.save();
      g.beginPath(); g.ellipse(x+r*0.06,y,r*1.0,r*0.62,0,0,GTAU); g.clip();
      gRR(g, x+r*dx-r*w/2, y-r*0.7, r*w, r*1.4, r*0.05); g.fill();
      g.restore();
    }
    g.strokeStyle = c2 || '#2f2f3a'; g.lineWidth = r*0.05;
    g.beginPath(); g.ellipse(x+r*0.06,y,r*1.0,r*0.62,0,0,GTAU); g.stroke();
  },

  hermit: (g,S,x,y,r,c,m,c2) => {                 // ヤドカリ
    g.fillStyle = c2 || '#ff8a6b';                // からだ と はさみ
    g.beginPath(); g.ellipse(x+r*0.7,y+r*0.3,r*0.42,r*0.34,0,0,GTAU); g.fill();
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(x+r*(0.9+0.2*s2), y+r*(0.68+0.1*s2), r*0.22, r*0.16, s2*0.5,0,GTAU); g.fill();
    }
    for (const s2 of [-1,1]){                     // あし
      g.strokeStyle=c2||'#ff8a6b'; g.lineWidth=r*0.08; g.lineCap='round';
      g.beginPath(); g.moveTo(x+r*0.5,y+r*0.5); g.lineTo(x+r*(0.4+s2*0.2),y+r*0.98); g.stroke();
    }
    g.fillStyle = c;                              // まきがい（うずまき）
    g.beginPath(); g.arc(x-r*0.16,y-r*0.06,r*0.86,0,GTAU); g.fill();
    g.strokeStyle = 'rgba(140,100,70,.55)'; g.lineWidth = r*0.07;
    g.beginPath();
    for (let i=0;i<=40;i++){
      const t2=i/40, a2=t2*GTAU*1.6, rr=r*0.82*(1-t2*0.86);
      const px=x-r*0.16+Math.cos(a2)*rr, py=y-r*0.06+Math.sin(a2)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.stroke();
  },

  seahorse: (g,S,x,y,r,c,m,c2) => {               // タツノオトシゴ
    g.fillStyle = c;
    g.beginPath();                                // からだ（S字）と まいたしっぽ
    g.moveTo(x+r*0.1,y-r*1.0);
    g.bezierCurveTo(x+r*0.62,y-r*0.7, x+r*0.5,y-r*0.1, x+r*0.16,y+r*0.3);
    g.bezierCurveTo(x-r*0.1,y+r*0.62, x+r*0.2,y+r*0.9, x+r*0.34,y+r*0.74);
    g.bezierCurveTo(x+r*0.16,y+r*1.0, x-r*0.34,y+r*0.86, x-r*0.22,y+r*0.42);
    g.bezierCurveTo(x-r*0.12,y+r*0.02, x-r*0.1,y-r*0.6, x-r*0.28,y-r*0.96);
    g.closePath(); g.fill();
    g.beginPath();                                // はなさき
    g.moveTo(x-r*0.24,y-r*1.02); g.lineTo(x-r*0.9,y-r*0.86);
    g.lineTo(x-r*0.24,y-r*0.7); g.closePath(); g.fill();
    g.fillStyle = c2 || '#ffb43f';                // せびれの ぎざぎざ
    for (let i=0;i<4;i++){
      g.beginPath();
      g.moveTo(x+r*(0.3-i*0.06), y-r*(0.8-i*0.34));
      g.lineTo(x+r*(0.62-i*0.06), y-r*(0.72-i*0.34));
      g.lineTo(x+r*(0.32-i*0.06), y-r*(0.56-i*0.34));
      g.closePath(); g.fill();
    }
  },

  crab: (g,S,x,y,r,c,m,c2) => {                   // カニ
    g.fillStyle = c;
    for (const s2 of [-1,1]){                     // あし（3本ずつ）
      g.strokeStyle=c; g.lineWidth=r*0.1; g.lineCap='round';
      for (let i=0;i<3;i++){
        g.beginPath();
        g.moveTo(x+s2*r*0.6, y+r*(0.1+i*0.16));
        g.quadraticCurveTo(x+s2*r*1.06, y+r*(0.3+i*0.2), x+s2*r*1.1, y+r*(0.66+i*0.16));
        g.stroke();
      }
      g.beginPath();                              // はさみ
      g.moveTo(x+s2*r*0.66,y-r*0.16);
      g.lineTo(x+s2*r*1.2,y-r*0.6); g.stroke();
      g.beginPath(); g.ellipse(x+s2*r*1.34,y-r*0.72,r*0.28,r*0.2,s2*0.5,0,GTAU); g.fill();
      g.fillStyle='#fff';
      g.beginPath(); g.ellipse(x+s2*r*1.42,y-r*0.66,r*0.14,r*0.05,s2*0.5,0,GTAU); g.fill();
      g.fillStyle=c;
    }
    g.beginPath(); g.ellipse(x,y+r*0.06,r*0.92,r*0.62,0,0,GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(x,y+r*0.2,r*0.62,r*0.24,0,0,GTAU); g.fill();
  },

  /* 正面をむいて 二本足で 立つ けもの（クマ・パンダ）。
     よこ向きの 四つ足だと 顔が よく見えないので、この2体だけ 正面にする。
     opt: earC 耳の中 / snoutC 口もと / limbC 手足 / patch 目のまわりの もよう */
  teddy: (g,S,x,y,r,c,m,c2,rc) => {
    const o = (rc && rc.opt) || {};
    const limb = o.limbC || c;
    const hy = y - r*0.52, hr = r*0.74;           // あたま：大きめ（正面の かわいさは 頭の大きさで 決まる）
    const ear = o.ear || 'round';
    /* もこもこ。まるを ふちに ならべて シルエットそのものを ぎざぎざに する。
       上から もようを のせる やりかたでは、小さくしたとき ただの まるに 見える */
    const fluff = (cx, cy, rad, n, br) => {
      g.beginPath();
      for (let i=0;i<n;i++){
        const a = GTAU*i/n, px = cx+Math.cos(a)*rad, py = cy+Math.sin(a)*rad;
        g.moveTo(px+br, py); g.arc(px, py, br, 0, GTAU);
      }
      g.fill();
    };
    g.fillStyle = limb;                           // あし
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(x+s2*r*0.3, y+r*1.06, r*0.27, r*0.19, 0, 0, GTAU); g.fill();
    }
    g.fillStyle = limb;                           // うで：からだの ふちより 外に 出して 見えるように
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(x+s2*r*0.62, y+r*0.62, r*0.18, r*0.32, s2*0.55, 0, GTAU); g.fill();
    }
    g.fillStyle = c;                              // からだ：頭より 小さく
    g.beginPath(); g.ellipse(x, y+r*0.6, r*0.5, r*0.5, 0, 0, GTAU); g.fill();
    if (o.wool){ g.fillStyle = o.wool; fluff(x, y+r*0.6, r*0.42, 9, r*0.19); }
    if (o.belly){
      g.fillStyle = o.belly;
      g.beginPath(); g.ellipse(x, y+r*0.66, r*0.3, r*0.34, 0, 0, GTAU); g.fill();
    }
    // みみ。かたちだけで どの子か わかるように、まる／ながい／たれる を 分ける
    if (ear === 'long'){                          // ウサギ
      for (const s2 of [-1,1]){
        g.save(); g.translate(x+s2*r*0.3, hy-r*0.66); g.rotate(s2*0.15);
        g.fillStyle = o.earOut || c;
        g.beginPath(); g.ellipse(0, 0, r*0.16, r*0.5, 0, 0, GTAU); g.fill();
        g.fillStyle = o.earC || '#ffc2d4';
        g.beginPath(); g.ellipse(0, r*0.03, r*0.085, r*0.38, 0, 0, GTAU); g.fill();
        g.restore();
      }
    } else if (ear === 'droop'){                  // ヒツジ：よこに たれる
      for (const s2 of [-1,1]){
        g.save(); g.translate(x+s2*r*0.8, hy+r*0.22); g.rotate(s2*0.42);
        g.fillStyle = o.earOut || c;
        g.beginPath(); g.ellipse(0, 0, r*0.27, r*0.13, 0, 0, GTAU); g.fill();
        g.fillStyle = o.earC || '#ffc2d4';
        g.beginPath(); g.ellipse(s2*r*0.03, 0, r*0.17, r*0.07, 0, 0, GTAU); g.fill();
        g.restore();
      }
    } else {
      g.fillStyle = o.earOut || c;
      for (const s2 of [-1,1]){
        g.beginPath(); g.arc(x+s2*r*0.56, hy-r*0.52, r*0.27, 0, GTAU); g.fill();
      }
      g.fillStyle = o.earC || '#ffc2d4';
      for (const s2 of [-1,1]){
        g.beginPath(); g.ellipse(x+s2*r*0.59, hy-r*0.52, r*0.14, r*0.17, s2*0.4, 0, GTAU); g.fill();
      }
    }
    g.fillStyle = c;                              // あたま
    g.beginPath(); g.arc(x, hy, hr, 0, GTAU); g.fill();
    if (o.wool){ g.fillStyle = o.wool; fluff(x, hy, hr*0.86, 11, r*0.2); }
    if (o.horn === 'spiral'){                     // ヒツジの まきづの
      // **もこもこの あとに** えがく。うしろへ まわすと まきの 内がわが 毛に かくれて、
      // ただの かぎ に 見えてしまう
      g.strokeStyle = o.hornC || '#f0c351'; g.lineWidth = r*0.12; g.lineCap = 'round';
      for (const s2 of [-1,1]){
        g.beginPath();
        for (let i=0;i<=28;i++){
          // 左右は **横だけ** うつす。角度ごと 反転すると 上下が ひっくり返って、
          // 片がわだけ 下むきの つのに なってしまう
          const t2 = i/28, a = -1.6 + t2*6.0, rad = r*(0.32 - t2*0.19);
          const px = x + s2*(r*0.7 + Math.cos(a)*rad), py = hy - r*0.3 + Math.sin(a)*rad;
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.stroke();
      }
    }
    if (o.patch){                                 // パンダの 目のまわり
      g.fillStyle = o.patchC || c2;
      for (const s2 of [-1,1]){
        g.beginPath(); g.ellipse(x+s2*r*0.25, y-r*0.585, r*0.2, r*0.19, s2*0.3, 0, GTAU); g.fill();
      }
    }
    if (o.face){                                  // ヒツジ：もこもこの 中の すべすべの かお
      g.fillStyle = o.face;
      g.beginPath(); g.ellipse(x, y-r*0.47, r*0.46, r*0.42, 0, 0, GTAU); g.fill();
    }
    // 口もとの まるは おかない。この かおは 目と口の あいだが せまいので、
    // まるを おくと 目まで のみこんで しまう。はなだけ 入れる
    g.fillStyle = o.noseC || '#4a3348';
    g.beginPath(); g.ellipse(x, y - r*0.485, r*0.085, r*0.065, 0, 0, GTAU); g.fill();
  },

  penguin: (g,S,x,y,r,c,m,c2) => {                // ペンギン
    g.fillStyle = '#ffb43f';
    for (const s2 of [-1,1]){                     // あし
      g.beginPath(); g.ellipse(x+s2*r*0.28,y+r*1.06,r*0.24,r*0.11,s2*0.2,0,GTAU); g.fill();
    }
    g.fillStyle = c;                              // からだ
    g.beginPath(); g.ellipse(x,y+r*0.16,r*0.82,r*0.94,0,0,GTAU); g.fill();
    for (const s2 of [-1,1]){                     // つばさ
      g.beginPath(); g.ellipse(x+s2*r*0.82,y+r*0.24,r*0.22,r*0.56,s2*0.24,0,GTAU); g.fill();
    }
    g.fillStyle = '#ffffff';                      // おなかの白
    g.beginPath(); g.ellipse(x,y+r*0.3,r*0.56,r*0.72,0,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x,y-r*0.5,r*0.44,r*0.4,0,0,GTAU); g.fill();
    g.fillStyle = '#ffb43f';                      // くちばし
    g.beginPath();
    g.moveTo(x-r*0.14,y-r*0.4); g.lineTo(x+r*0.24,y-r*0.32);
    g.lineTo(x-r*0.14,y-r*0.2); g.closePath(); g.fill();
  },

  octopus: (g,S,x,y,r,c,m,c2) => {                // タコ
    g.fillStyle = c;
    for (let i=-3;i<=3;i++){                      // あし8本ぶん（見えるのは 7本）
      g.save();
      g.beginPath();
      g.moveTo(x+r*i*0.26, y+r*0.28);
      g.bezierCurveTo(x+r*(i*0.32+0.16), y+r*0.86, x+r*(i*0.34-0.14), y+r*1.06, x+r*(i*0.38), y+r*1.3);
      g.lineTo(x+r*(i*0.38+0.16), y+r*1.26);
      g.bezierCurveTo(x+r*(i*0.34+0.06), y+r*0.98, x+r*(i*0.32+0.3), y+r*0.8, x+r*(i*0.26+0.18), y+r*0.28);
      g.closePath(); g.fill();
      g.restore();
    }
    g.beginPath(); g.ellipse(x,y-r*0.16,r*0.86,r*0.8,0,0,GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.4)';   // きゅうばん
    for (let i=-2;i<=2;i++)
      for (let k=0;k<2;k++){
        g.beginPath(); g.arc(x+r*i*0.28, y+r*(0.62+k*0.26), r*0.06, 0, GTAU); g.fill();
      }
  },

  seal: (g,S,x,y,r,c,m,c2) => {                   // アザラシ
    g.fillStyle = c;
    g.beginPath();                                // おびれ（うしろに ひらく）
    g.moveTo(x-r*0.78,y+r*0.3);
    g.lineTo(x-r*1.44,y-r*0.02); g.lineTo(x-r*1.24,y+r*0.42);
    g.lineTo(x-r*1.42,y+r*0.84); g.closePath(); g.fill();
    g.beginPath();                                // からだ（首がなく、なめらかに あたまへ つづく）
    g.moveTo(x+r*1.12,y-r*0.36);
    g.bezierCurveTo(x+r*1.24,y+r*0.16, x+r*0.9,y+r*0.6, x+r*0.2,y+r*0.66);
    g.bezierCurveTo(x-r*0.5,y+r*0.72, x-r*0.9,y+r*0.6, x-r*0.98,y+r*0.36);
    g.bezierCurveTo(x-r*1.0,y+r*0.04, x-r*0.6,y-r*0.36, x+r*0.1,y-r*0.5);
    g.bezierCurveTo(x+r*0.66,y-r*0.62, x+r*1.04,y-r*0.6, x+r*1.12,y-r*0.36);
    g.closePath(); g.fill();
    for (const s2 of [-1,1]){                     // まえびれ
      g.beginPath();
      g.moveTo(x+r*0.1, y+r*(0.4+s2*0.1));
      g.quadraticCurveTo(x-r*0.2, y+r*(0.9+s2*0.1), x-r*0.5, y+r*(0.84+s2*0.1));
      g.quadraticCurveTo(x-r*0.24, y+r*(0.56+s2*0.1), x+r*0.06, y+r*(0.34+s2*0.1));
      g.closePath(); g.fill();
    }
    g.fillStyle = c2 || 'rgba(255,255,255,.6)';   // おなかの 白
    g.beginPath(); g.ellipse(x-r*0.06,y+r*0.4,r*0.66,r*0.22,0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(120,120,140,.35)';        // まだらもよう
    for (const [dx,dy] of [[-0.44,-0.2],[0.0,-0.3],[-0.68,0.1],[0.34,-0.06],[-0.2,0.06]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*0.11,0,GTAU); g.fill();
    }
    g.fillStyle = '#4a4450';                      // 黒い はな
    g.beginPath(); g.ellipse(x+r*1.0,y-r*0.24,r*0.11,r*0.09,0,0,GTAU); g.fill();
    g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=r*0.035; g.lineCap='round';
    for (let i=-1;i<=1;i++){                      // ひげ
      g.beginPath(); g.moveTo(x+r*0.94,y-r*0.16);
      g.lineTo(x+r*1.5,y-r*(0.24+i*0.18)); g.stroke();
    }
  },

  shark: (g,S,x,y,r,c,m,c2) => {                  // サメ
    g.fillStyle = c;
    g.beginPath();                                // せびれ（大きな三角）
    g.moveTo(x+r*0.2,y-r*0.5); g.lineTo(x-r*0.22,y-r*1.4);
    g.lineTo(x-r*0.5,y-r*0.46); g.closePath(); g.fill();
    g.beginPath();                                // からだ（とがった はな先）
    g.moveTo(x+r*1.3,y-r*0.06);
    g.bezierCurveTo(x+r*1.0,y-r*0.56, x+r*0.2,y-r*0.66, x-r*0.4,y-r*0.56);
    g.bezierCurveTo(x-r*0.9,y-r*0.46, x-r*1.06,y-r*0.16, x-r*1.1,y+r*0.02);
    g.bezierCurveTo(x-r*0.98,y+r*0.4, x-r*0.3,y+r*0.66, x+r*0.4,y+r*0.56);
    g.bezierCurveTo(x+r*0.98,y+r*0.46, x+r*1.22,y+r*0.2, x+r*1.3,y-r*0.06);
    g.closePath(); g.fill();
    g.beginPath();                                // おびれ（上が長い）
    g.moveTo(x-r*1.02,y+r*0.02);
    g.lineTo(x-r*1.66,y-r*0.86); g.lineTo(x-r*1.34,y+r*0.06);
    g.lineTo(x-r*1.6,y+r*0.62); g.closePath(); g.fill();
    g.beginPath();                                // むなびれ
    g.moveTo(x+r*0.3,y+r*0.4); g.lineTo(x-r*0.2,y+r*1.0);
    g.lineTo(x+r*0.46,y+r*0.6); g.closePath(); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.8)';   // おなかの白
    g.beginPath();
    g.moveTo(x+r*1.12,y+r*0.14);
    g.bezierCurveTo(x+r*0.4,y+r*0.62, x-r*0.5,y+r*0.6, x-r*1.0,y+r*0.14);
    g.bezierCurveTo(x-r*0.4,y+r*0.38, x+r*0.5,y+r*0.36, x+r*1.12,y+r*0.14);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth=r*0.04;  // えら
    for (let i=0;i<3;i++){
      g.beginPath();
      g.moveTo(x+r*(0.5-i*0.14), y-r*0.3); g.lineTo(x+r*(0.44-i*0.14), y+r*0.1); g.stroke();
    }
  },

  manta: (g,S,x,y,r,c,m,c2) => {                  // マンタ
    g.fillStyle = c;
    g.beginPath();                                // ひろがった むなびれ（ひし形に ちかい）
    g.moveTo(x,y-r*0.66);
    g.bezierCurveTo(x+r*0.5,y-r*0.6, x+r*1.5,y-r*0.1, x+r*1.66,y+r*0.36);
    g.bezierCurveTo(x+r*1.0,y+r*0.3, x+r*0.5,y+r*0.5, x,y+r*0.62);
    g.bezierCurveTo(x-r*0.5,y+r*0.5, x-r*1.0,y+r*0.3, x-r*1.66,y+r*0.36);
    g.bezierCurveTo(x-r*1.5,y-r*0.1, x-r*0.5,y-r*0.6, x,y-r*0.66);
    g.closePath(); g.fill();
    for (const s2 of [-1,1]){                     // あたまの ひれ（つの のよう）
      g.beginPath();
      g.moveTo(x+s2*r*0.16,y-r*0.6);
      g.lineTo(x+s2*r*0.4,y-r*0.98); g.lineTo(x+s2*r*0.46,y-r*0.56);

    g.beginPath(); g.moveTo(x,y+r*0.56); g.lineTo(x-r*0.1,y+r*1.5); g.stroke();
    g.fillStyle = c2 || 'rgba(255,255,255,.75)'; // おなかの白
    g.beginPath(); g.ellipse(x,y+r*0.16,r*0.52,r*0.34,0,0,GTAU); g.fill();
  },

  whale: (g,S,x,y,r,c,m,c2) => {                  // クジラ
    g.fillStyle = c2 || 'rgba(190,225,255,.85)';  // しおふき
    for (const [dx,dy,rr] of [[0.36,-1.14,0.16],[0.2,-1.4,0.12],[0.52,-1.4,0.1]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*rr,0,GTAU); g.fill();
    }
    g.fillStyle = c;
    g.beginPath();                                // からだ（あごが 大きい）
    g.moveTo(x+r*1.24,y+r*0.1);
    g.bezierCurveTo(x+r*1.16,y-r*0.5, x+r*0.4,y-r*0.76, x-r*0.24,y-r*0.68);
    g.bezierCurveTo(x-r*0.86,y-r*0.6, x-r*1.06,y-r*0.24, x-r*1.06,y+r*0.02);
    g.bezierCurveTo(x-r*0.96,y+r*0.44, x-r*0.2,y+r*0.76, x+r*0.5,y+r*0.66);
    g.bezierCurveTo(x+r*1.0,y+r*0.58, x+r*1.24,y+r*0.36, x+r*1.24,y+r*0.1);
    g.closePath(); g.fill();
    g.beginPath();                                // おびれ
    g.moveTo(x-r*0.98,y+r*0.02);
    g.quadraticCurveTo(x-r*1.44,y-r*0.3, x-r*1.74,y-r*0.6);
    g.quadraticCurveTo(x-r*1.4,y-r*0.16, x-r*1.26,y+r*0.08);
    g.quadraticCurveTo(x-r*1.4,y+r*0.34, x-r*1.72,y+r*0.7);
    g.quadraticCurveTo(x-r*1.36,y+r*0.36, x-r*0.98,y+r*0.16);
    g.closePath(); g.fill();
    g.beginPath();                                // むなびれ
    g.moveTo(x+r*0.34,y+r*0.5); g.lineTo(x-r*0.14,y+r*1.02);
    g.lineTo(x+r*0.5,y+r*0.66); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.82)';        // おなかの すじ
    g.save();
    g.beginPath(); g.ellipse(x+r*0.2,y+r*0.3,r*0.9,r*0.4,0.06,0,GTAU); g.clip();
    for (let i=0;i<5;i++){
      gRR(g, x-r*0.7, y+r*(0.04+i*0.16), r*1.9, r*0.07, r*0.03); g.fill();
