/* ごほうびは かけら。⭐は ふだんのプレイに ひびくので わたさない */
const WEEK_PRIZE = [ {w:10, n:2}, {w:20, n:5}, {w:30, n:10}, {w:40, n:20} ];

let weekly = null;      // おだい中なら ルール。ふだんは null

/* ---------- ショップ ---------- */
const shopOv = $('shopOv'), shopBody = $('shopBody'), shopGem = $('shopGem');
/* 売りもの。ここに 足していけば ショップに 出る。
   ⭐は 単品で 売らない。後半は 1ウェーブで 何万も 手に入るので、
   買った ⭐が すぐ 値うちを なくして「損した」に なるため。
   ⭐は はじめてパックの 中身としてだけ 出す */
const PACK_STARS = 3000;              // 伝説のたまご 1こぶん。はじめの 1歩として ちょうどいい
const PACK_LV    = 4;                 // わたす なかまの ★
/* きょうの 日づけ（端末のローカル）。アイテムセットの 1日1回に つかう */
const dayKey = () => { const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
let itDay = {};
try{ itDay = JSON.parse(localStorage.getItem('sweetTD.itDay') || '{}'); }catch(e){}
function saveItDay(){ try{ localStorage.setItem('sweetTD.itDay', JSON.stringify(itDay)); }catch(e){} }
/* はじめてパックからは にじの子は 出ない（かんたんな 近道に しない） */
const packPool   = () => GEN_LIST.filter(o => o.side === 'ch' && o.lv === PACK_LV
                                           && !DEX_LEGEND.has(artKeyOf(o)));
const SHOP_ITEMS = [
  /* 1回だけの はじめてパック。ランダムが 入るので、たまごと おなじ
     「おなじ★の子から 均等に 1人」に して かくりつを 1行で 言いきれる形に する。
     おだい中は 買えない。あそこの ⭐は もどるときに 消えるので、
     買った ⭐が そのまま きえてしまう */
  { id:'pack_start', sec:'はじめての方に', ic:'🎁', name:'はじめてパック',
    desc:'⭐' + PACK_STARS.toLocaleString() + ' ＋ ★' + PACK_LV + 'のなかま1人。1回だけ',
    note: () => {
      const n = packPool().length;
      return '★' + PACK_LV + 'の' + n + '人から1人。どの子も同じ確率（' +
        (100/n).toFixed(1) + '%）。すでに全員そろっているときは かけら🩷' +
        (SHARD_GET[PACK_LV] || 1) + 'こ になります';
    },
    cost: 30,
    can:  () => !owns('pack_start') && !weekly,
    done: () => owns('pack_start'),
    poor: () => owns('pack_start') ? 'もう買いました' : '今週のおだい中は買えません',
    buy: () => {
      addOwn('pack_start');
      stars += PACK_STARS; saveRun(); syncHUD(); syncShop();
      const news = packPool().filter(o => !hasGen(o));
      if (news.length){
        const o = news[(Math.random() * news.length) | 0];
        unlock(o.id);
        return '⭐' + PACK_STARS.toLocaleString() + ' と ★' + PACK_LV + '「' + o.name + '」が仲間に！';
      }
      const n = SHARD_GET[PACK_LV] || 1;
      shards += n; saveShards();
      return '⭐' + PACK_STARS.toLocaleString() + '！ ★' + PACK_LV +
             'は全員そろっていたので かけら🩷' + n + 'こ';
    } },
  /* 30日パスポート。買いなおすと のこりに たされる。
     ⭐や 攻撃力は 上げない。強さを 売ると、子どもも あそぶゲームで
     いちばん 言われる「課金しないと 勝てない」に なってしまう */
  { id:'pass', sec:'はじめての方に', ic:'🎫', name:'30日パスポート',
    desc:'毎日 かけら🩷' + PASS_SHARDS + ' ＋ 💗が満タンに。' + PASS_DAYS + '日ぶん',
    note: () => passOn()
      ? 'のこり ' + passLeft() + '日。いま買うと そこから ' + PASS_DAYS + '日 たされます'
      : '買ったその日から すぐ1回ぶん。強さは 変わりません',
    cost: 90,
    buy: () => {
      setPassUntil(Math.max(Date.now(), passUntil()) + PASS_DAYS*86400000);
      // 買ったその日から つかえるように、1回ぶんは すぐ わたす
      shards += PASS_SHARDS; saveShards();
      hearts = maxHearts(); setNextHeartAt(0); saveRun(); syncHUD();
      return '🎫 パスポート ' + passLeft() + '日ぶん！ かけら🩷+' + PASS_SHARDS + '・💗満タン';
    } },
  /* アイテムの パック。**消耗品**なので、買わなくても ドロップと
     ステージクリアで たまる。「待てば無料」を くずさないための 線引き。
     強さそのもの（攻撃力・⭐）は 売らない、という きまりは まもっている */
  /* アイテムは 金の わく＝レア。お金で かんたんに 山づみ できないよう、
     セットは **1日1回ずつ**。日づけは 端末の ローカル日で 見る */
  { id:'it_set', sec:'あそぶ', ic:'🎒', name:'おたすけセット',
    desc: () => ITEMS.map(it => it.ic).join('') + ' 6しゅるい ×1こずつ',
    note: () => '1日1回まで。アイテムは 敵からも 落ちます（' + Math.round(ITEM_DROP*100) + '%）。' +
                'ステージクリアでも 1こ もらえます',
    cost: 20,
    can:  () => itDay.set !== dayKey(),
    poor: () => 'きょうは もう 買いました。また あした',
    buy: () => { for (const it of ITEMS) giveItem(it.id, 1); buildSkillBar();
                 itDay.set = dayKey(); saveItDay();
                 return '🎒 6しゅるいの アイテムが 1こずつ！'; } },
  { id:'it_big', sec:'あそぶ', ic:'🌈', name:'にじいろセット',
    desc: () => ITEMS.map(it => it.ic).join('') + ' 6しゅるい ×3こずつ',
    note: () => '1日1回まで。おたすけセット3こぶん',
    cost: 55,
    can:  () => itDay.big !== dayKey(),
    poor: () => 'きょうは もう 買いました。また あした',

                 itDay.big = dayKey(); saveItDay();
                 return '🌈 6しゅるいの アイテムが 3こずつ！'; } },
  { id:'heart', sec:'あそぶ', ic:'💗', name:'ハートぜんかい',
    desc:'あと何回あそべるかが 満タンに もどります', cost:10,

    done: () => hearts >= maxHearts(),
    poor: () => 'もう満タンです',
    buy: () => {
      hearts = maxHearts(); setNextHeartAt(0); saveRun(); syncHUD();
      return '💗が満タンに！';
    } },
  /* 着せかえは ランダムなしの 買いきり。買ったら すぐ その見た目に する。

  ...SHOP_THEMES.map(({ id, ic }) => ({
    id: 'th_' + id, sec:'着せかえ', ic, name:'「' + SP_THEMES[id].th.name + '」',
    desc:'ステージの見た目とBGMが変わります', cost: 60,
    can:  () => !hasTheme(id),
    done: () => hasTheme(id),
    poor: () => 'もう持っています',
    buy: () => {
      addOwn(id);

      return '「' + SP_THEMES[id].th.name + '」に着せかえました！';
    } })),
];
/* 💎の パック。ねだんは App Store に 出すときに 決めるので、
   ここでは 目やすとして 出しておく。買うのは payYen() を とおす */
const GEM_PACKS = [
  { id:'g1', gems:60,  yen:320,  ic:'💎' },
  { id:'g2', gems:200, yen:980,  ic:'💎' },
  { id:'g3', gems:550, yen:2500, ic:'💎' },
];
function buildGemSection(){
  const a = ageBand(), left = spendLeft();
  let h = '<div class="spSec">💎ジュエル</div>';
  for (const g of GEM_PACKS)
    h += '<div class="spIt gemPack" data-pack="' + g.id + '">' +
      '<div class="spIc">' + g.ic + '</div>' +
      '<div class="spTx"><div class="spN">💎' + g.gems + '</div>' +
      '<div class="spD">1つあたり 約¥' + (g.yen / g.gems).toFixed(1) + '（ねだんは目やす）</div></div>' +
      '<div class="spP">' + yen(g.yen) + '</div></div>';
  // Apple は 非消費型を 売る アプリに 復元ボタンを 出すことを もとめている
  h += '<button class="mini gray" id="restoreBtn" style="width:100%;margin-top:2px">' +
       '↺ 買ったものを復元</button>';
  h += '<div class="spSoon">💎を ほんとうに 買えるようになるのは、' +
    '<b>App Store に出すとき</b>です。いまは押しても お金は かかりません。<br>' +
    'いまは <b>毎日のログインボーナスで 💎+2</b> もらえます。' +
    'ここで買ったものは、アプリ版でもそのまま引きつげるように作ってあります。</div>';
  // 年れいと 今月の のこりを 出す。未成年の 上限は 出しておかないと 意味がない
  h += '<div class="spSec">年齢と ひと月の上限</div>';
  h += '<div class="ageBox">' +
    (a
      ? '<div><b>' + a.name + '</b>' + (a.cap
          ? '：ひと月 ' + yen(a.cap) + 'まで<br><span class="ageLeft">今月あと ' + yen(left) +
            '（つかった額 ' + yen(monthSpent()) + '）</span>'
          : '：上限なし') + '</div>'
      : '<div>💎を買う前に 年齢を えらんでください。<br>' +
        '<span class="ageLeft">未成年は ひと月に つかえる額が 決まっています</span></div>') +
    '<div class="ageRow">' +
    AGE_BANDS.map(x => '<button class="mini' + (a && a.id === x.id ? '' : ' gray') +
      '" data-age="' + x.id + '">' + x.name + '</button>').join('') +
    '</div>' +
    '<div class="ageNote">この設定は この端末に だけ 残ります。' +
    'ほんとうの 制限は App Store の ファミリー共有と レシート確認で かけます。' +
    'おうちの人と 相談してから 買ってください。</div>' +
    '</div>';
  return h;
}
function buildShopScreen(){
  shopGem.textContent = '💎 ' + fmtN(gems);
  let h = '', sec = '';
  for (const it of SHOP_ITEMS){
    if (it.sec !== sec){ sec = it.sec; h += '<div class="spSec">' + sec + '</div>'; }
    const ok = (!it.can || it.can()) && gems >= it.cost;
    const got = it.done ? it.done() : false;
    h += '<div class="spIt' + (ok ? '' : ' poor') + '" data-id="' + it.id + '">' +
      '<div class="spIc">' + it.ic + '</div>' +
      '<div class="spTx"><div class="spN">' + it.name + '</div>' +
      // desc は 文字でも 関数でも よい（中みが 変わる 品ものが あるため）
      '<div class="spD">' + ((it.can && !it.can()) ? it.poor()
                             : (typeof it.desc === 'function' ? it.desc() : it.desc)) + '</div></div>' +
      '<div class="spP">' + (got ? '✓' : '💎' + it.cost) + '</div></div>' +
      // ランダムが 入るものは かくりつを かならず 出す（Apple 3.1.1／景品表示法）
      // 品ものが うすくなるときは 説明も いっしょに うすくする
      (it.note ? '<div class="spNote' + (ok ? '' : ' poor') + '">' + it.note() + '</div>' : '');
  }
  h += buildGemSection();
  h += '<div id="shopMsg" style="font-size:calc(12px * var(--fs));color:var(--pink-d);text-align:center;min-height:18px"></div>';
  shopBody.innerHTML = h;
  // 買ったものの 復元
  $('restoreBtn').onclick = () => {
    const r = restorePurchases();
    buildShopScreen();                 // ✓の つきかたを 出しなおす
    const got = [];
    if (r.pack) got.push('はじめてパック');
    if (r.themes.length) got.push('着せかえ ' + r.themes.length + '種（' + r.themes.join('・') + '）');
    if (r.pass) got.push('パスポート のこり' + r.pass + '日');
    $('shopMsg').innerHTML = got.length
      ? '復元しました：' + got.join('／')
      : 'この端末に 買ったものは ありませんでした';
    beep(700,.08,'triangle',.04);
  };
  // 年れいの えらびボタン
  shopBody.querySelectorAll('[data-age]').forEach(el => {
    el.onclick = () => {
      setAgeBand(el.dataset.age);
      buildShopScreen();
      $('shopMsg').textContent = '年齢を「' + ageBand().name + '」にしました';
      beep(700,.08,'triangle',.04);
    };
  });
  // 💎パック。まだ お金は かからないが、上限の 通り道は 本番と 同じにしておく
  shopBody.querySelectorAll('.gemPack').forEach(el => {
    el.onclick = () => {
      const g = GEM_PACKS.find(x => x.id === el.dataset.pack);
      const msg = $('shopMsg');
      const r = canPayYen(g.yen);
      if (!r.ok){
        msg.textContent = r.why === 'age'
          ? 'さきに 年齢を えらんでください'
          : '今月の上限に とどきました（あと ' + yen(spendLeft()) + '）';
        beep(160,.09,'square',.03,.7);
        return;
      }
      /* ここで Apple の 買いものを よぶ。いまは お金の やりとりが ないので
         💎も ふやさない。ふやすと ただで 手に入る 抜け道に なる */
      buildShopScreen();
      $('shopMsg').innerHTML = 'App Store 版で ' + yen(g.yen) + ' の 💎' + g.gems +
        ' が買えるようになります<br><span style="opacity:.7">（いまは お金は かかっていません）</span>';
      beep(520,.09,'triangle',.04);
    };
  });
  shopBody.querySelectorAll('.spIt:not(.gemPack)').forEach(el => {
    el.onclick = () => {
      const it = SHOP_ITEMS.find(x => x.id === el.dataset.id);
      const msg = $('shopMsg');
      if (it.can && !it.can()){ msg.textContent = it.poor(); beep(160,.09,'square',.03,.7); return; }
      if (!payGems(it.cost)){ msg.textContent = '💎が足りません（あと ' + (it.cost - gems) + '）'; return; }
      const done = it.buy();
      beep(760,.12,'triangle',.05); setTimeout(()=>beep(980,.16,'triangle',.05),110);
      celebrate({ conf: 40, fanfare: 1 });
      buildShopScreen();              // 作りなおすので、文は そのあとに 入れる
      $('shopMsg').textContent = done;
    };
  });
}
$('btnShop').onclick = () => togglePanel('shopOv', buildShopScreen);
$('shopClose').onclick = () => closePanels();

/* ---------- 今週のおだい：入る・出る・結果・画面 ---------- */
const wkOv = $('wkOv'), wkBody = $('wkBody');
/* 週が かわるまでの 日かず（月曜はじまり） */
function weekDaysLeft(){
  const d = new Date();
  return 7 - ((d.getDay() + 6) % 7);       // 月曜=7、日曜=1
}
function enterWeekly(){
  saveRun();                    // ふだんの進行を のこす（weekly を 立てる前に）
  const hp = hearts;            // 💗は 共通。リセットで 満タンに しない
  weekly = weekRule();
  closePanels();
  reset();
  hearts = Math.min(HEART_STOCK_MAX, hp);
  WAY = weekWay(); buildPath(); measurePath(); bakeGround();
  life = maxLife();
  syncHUD();
  floatTx(COLS*CELL/2, ROWS*CELL/2, '🏅 ' + weekly.name, '#e05f9e');
  celebrate({ conf: 70, rings: true, fanfare: 1 });
}
function leaveWeekly(){
  const hp = hearts;            // おだいで つかった ぶんを もちこす
  weekly = null;
  reset();
  tryResume();                  // ふだんの進行に もどす（道も ここで そろう）
  hearts = Math.min(HEART_STOCK_MAX, hp);
  saveRun();
  bakeGround();
  syncHUD();
}
/* おだいの 結果。ふだんの gameOver とは 別（自己ベストを 動かさない） */
function weeklyOver(){
  over = true; running = false;
  bgmStop();
  const r = weekRec(), best = wave > r.bw;
  if (best) r.bw = wave;
  let gain = 0; const names = [];
  for (const p of WEEK_PRIZE)
    if (wave >= p.w && !r.got.includes(p.w)){ r.got.push(p.w); gain += p.n; names.push('ウェーブ' + p.w); }
  if (gain){ shards += gain; saveShards(); }
  saveWeekRec(r);
  hearts = Math.max(0, hearts - 1);
  life = maxLife();
  if (hearts < 1 && !nextHeartAt()) setNextHeartAt(Date.now() + REGEN_MS);
  syncHUD();
  const badge = 'display:inline-block;background:linear-gradient(90deg,#ffe9b8,#ffd9ec);' +
    'border:2px solid #ffd76e;border-radius:999px;padding:7px 16px;margin:7px 0;color:#c9821e';
  ovT.textContent = '🏅 今週のおだい おわり';
  ovB.innerHTML = '「<b>' + weekly.name + '</b>」で ウェーブ <b>' + wave + '</b> まで！<br>' +
    (best ? '<span style="' + badge + ';animation:blink .5s infinite alternate">✨ 今週の新記録！ ✨</span>'
          : '<span style="' + badge + '">🏅 今週のベスト ウェーブ' + r.bw + '</span>') +
    (gain ? '<br>🩷 かけら +' + gain + '（' + names.join('・') + ' 達成）' : '') +
    '<br><span style="opacity:.75">💗を1こ使いました（残り ' + hearts + '）</span>';
  ovBtn.disabled = false;
  ovBtn.textContent = 'ふだんの国へ戻る';
  ovBtn.onclick = () => { ov.classList.remove('on'); leaveWeekly(); };
  ovAlt.textContent = 'もう一度 挑戦';
  ovAlt.style.display = hearts >= 1 ? '' : 'none';
  ovAlt.onclick = () => { ov.classList.remove('on'); enterWeekly(); };
  ovShare.style.display = '';
  ov.classList.add('on');
  if (best) celebrate({ rays: 2.5, conf: 110, fanfare: 1 });
  else beep(180,.5,'sawtooth',.06,.4);
}
function buildWeek(){
  const R = weekRule(), r = weekRec();
  wkBody.innerHTML =
    '<div class="wkCard"><div class="wkR">' + R.name + '</div>' +
    '<div class="wkD">' + R.desc + '</div></div>' +
    '<div class="wkB">' +
      '<div><div class="wkK">今週のベスト</div><div class="wkN">' +
        (r.bw ? 'ウェーブ' + r.bw : '—') + '</div></div>' +
      '<div><div class="wkK">おだいの残り</div><div class="wkN">' + weekDaysLeft() + '日</div></div>' +
    '</div>' +
    '<div class="wkM">' + WEEK_PRIZE.map(p => {
      const got = r.got.includes(p.w);
      return '<div><b>ウェーブ' + p.w + '</b><span>🩷 かけら ' + p.n + '</span>' +
             '<span class="got">' + (got ? ' 達成 ✓' : '') + '</span></div>';
    }).join('') + '</div>' +
    '<button class="btn" id="wkGo" style="width:100%">🏅 挑戦する（💗1）</button>' +
    '<div class="wkD">おだいと道は毎週かわります。世界じゅうで同じおだいです。<br>' +
    'ふだんの進行や自己ベストにはひびきません（💗だけ共通）</div>';
  $('wkGo').disabled = hearts < 1;
  $('wkGo').onclick = () => enterWeekly();
}
$('btnWk').onclick = () => togglePanel('wkOv', buildWeek);
$('wkClose').onclick = () => closePanels();

/* ==========================================================
   おかしの国のパノラマ（あつめたなかまが住みつく一枚絵）
   ========================================================== */
const kingOv = $('kingOv'), kingCv = $('kingCv'), kingCap = $('kingCap');

function drawKingdom(g, W, H){
  const TAU = 6.2832;
  const ell = (x,y,rx,ry,col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill(); };
  const rr2 = (x,y,w,h,r) => {
    const k = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y);
    g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
    g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k);
    g.closePath();
  };
  const star4 = (x,y,r,col,a) => {
    g.save(); g.translate(x,y); g.rotate(a||0); g.fillStyle = col;
    g.beginPath();
    for (let i=0;i<4;i++){
      const t = i*Math.PI/2;
      g.lineTo(Math.cos(t)*r, Math.sin(t)*r);
      g.quadraticCurveTo(0,0, Math.cos(t+Math.PI/4)*r*0.22, Math.sin(t+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  };
  // きまった見た目になるよう、種つきの乱数
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

  /* --- そら --- */
  const sky = g.createLinearGradient(0,0,0,H*0.62);
  sky.addColorStop(0,'#a8d4f2'); sky.addColorStop(0.5,'#ffd9ec'); sky.addColorStop(1,'#fff0d6');
  g.fillStyle = sky; g.fillRect(0,0,W,H*0.62);
  const sun = g.createRadialGradient(W*0.78,H*0.28,0, W*0.78,H*0.28,W*0.32);
  sun.addColorStop(0,'rgba(255,246,205,.95)'); sun.addColorStop(0.25,'rgba(255,232,170,.45)'); sun.addColorStop(1,'rgba(255,232,170,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,H*0.62);
  ell(W*0.78,H*0.28,W*0.042,W*0.042,'#fff8dd');
  // くも（やわらかいブロッブの重なり）
  const cloud = (x,y,s,a) => {
    g.globalAlpha = a;
    for (const [dx,dy,r] of [[-1,0,0.55],[0,-0.32,0.7],[1,0.02,0.5],[0.1,0.18,0.85]])
      ell(x+dx*s, y+dy*s*0.6, s*r*1.5, s*r*0.75, '#ffffff');
    g.globalAlpha = 1;
  };
  cloud(W*0.16,H*0.13,W*0.05,.9); cloud(W*0.5,H*0.08,W*0.04,.7); cloud(W*0.9,H*0.18,W*0.045,.8);

  // かんせいの国には にじがかかる
  const complete = dexList().every(o => dex[o.id]);
  if (complete){
    const rb = ['#ffb3c8','#ffd9a8','#fff3b0','#c8ecc8','#b8d8f8','#d8c8f0'];
    g.lineWidth = W*0.012; g.globalAlpha = 0.55; g.lineCap = 'butt';
    for (let i=0;i<rb.length;i++){
      g.strokeStyle = rb[i];
      g.beginPath(); g.arc(W*0.5, H*0.62, W*0.42 - i*W*0.012, Math.PI*1.05, Math.PI*1.95); g.stroke();
    }
    g.globalAlpha = 1;
  }

  /* --- とおくのアイスのやま（かすみで遠近感） --- */
  const scoop = (x,y,r,c1,c2,haze) => {
    const gr = g.createLinearGradient(0,y-r,0,y);
    gr.addColorStop(0,c1); gr.addColorStop(1,c2);
    g.fillStyle = gr;
    g.beginPath(); g.arc(x,y,r,Math.PI,0); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.93)';
    g.beginPath(); g.arc(x,y-r*0.02,r,Math.PI,Math.PI*1.35);
    g.quadraticCurveTo(x-r*0.3,y-r*0.55,x-r*0.15,y-r*0.75);
    g.quadraticCurveTo(x+r*0.15,y-r*0.95,x+r*0.4,y-r*0.72);
    g.quadraticCurveTo(x+r*0.75,y-r*0.5,x+r*0.7,y-r*0.28);
    g.arc(x,y-r*0.02,r,Math.PI*1.9,0);
    g.lineTo(x+r*0.6,y-r*0.1);
    g.quadraticCurveTo(x+r*0.5,y-r*0.35,x+r*0.2,y-r*0.2);
    g.quadraticCurveTo(x-r*0.2,y-r*0.05,x-r*0.5,y-r*0.3);
    g.closePath(); g.fill();
    if (haze){
      g.fillStyle = 'rgba(255,236,246,' + haze + ')';
      g.beginPath(); g.arc(x,y,r*1.02,Math.PI,0); g.closePath(); g.fill();
    }
  };
  scoop(W*0.1, H*0.47, W*0.17, '#f6a8c8','#e989b2', 0.4);
  scoop(W*0.33,H*0.48, W*0.12, '#c3aaea','#a98fd8', 0.5);
  scoop(W*0.92,H*0.47, W*0.15, '#a8dfc0','#86c9a4', 0.4);

  /* --- じめん（ミントの丘） --- */
  const gnd = g.createLinearGradient(0,H*0.45,0,H);
  gnd.addColorStop(0,'#d9f4e2'); gnd.addColorStop(0.5,'#c3edd3'); gnd.addColorStop(1,'#a9e0bd');
  g.fillStyle = gnd;
  g.beginPath(); g.moveTo(0,H*0.52);
  g.quadraticCurveTo(W*0.25,H*0.455,W*0.5,H*0.5);
  g.quadraticCurveTo(W*0.75,H*0.545,W,H*0.5);
  g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();

  /* --- チョコのかわ とワッフルばし --- */
  const rivGr = g.createLinearGradient(W*0.6,0,W*0.95,0);

  g.fillStyle = rivGr;
  g.beginPath();
  g.moveTo(W*0.66,H*0.52);
  g.quadraticCurveTo(W*0.78,H*0.62,W*0.68,H*0.72);
  g.quadraticCurveTo(W*0.56,H*0.82,W*0.72,H);
  g.lineTo(W*0.95,H);
  g.quadraticCurveTo(W*0.8,H*0.8,W*0.9,H*0.68);
  g.quadraticCurveTo(W*0.98,H*0.58,W*0.8,H*0.52);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,236,205,.35)'; g.lineWidth = W*0.007; g.lineCap = 'round';
  for (const t of [0.58,0.66,0.76,0.87]){
    g.beginPath(); g.moveTo(W*0.68,H*t); g.quadraticCurveTo(W*0.76,H*(t+0.03),W*0.84,H*(t-0.01)); g.stroke();
  }
  // ワッフルばし

  g.strokeStyle = 'rgba(120,70,30,.4)'; g.lineWidth = W*0.004;
  for (let i=1;i<6;i++){

  }

  /* --- クッキーのみち（お城の門へ） --- */
  const path = g.createLinearGradient(0,H*0.56,0,H);
  path.addColorStop(0,'#e2b384'); path.addColorStop(1,'#f0c99b');
  g.fillStyle = path;
  g.beginPath();
  g.moveTo(W*0.36,H);
  g.quadraticCurveTo(W*0.44,H*0.72,W*0.49,H*0.565);
  g.lineTo(W*0.575,H*0.565);
  g.quadraticCurveTo(W*0.6,H*0.72,W*0.68,H);
  g.closePath(); g.fill();
  for (let i=0;i<40;i++){
    const t = rnd(), u = rnd();
    const y2 = H*(0.58 + t*0.4);

  /* --- おしろ --- */
  const cxK = W*0.53, byK = H*0.575;
  const towerK = (x,yb,w,h,roofCol) => {
    const tg = g.createLinearGradient(x-w/2,0,x+w/2,0);

    rr2(x-w/2, yb-h, w, h, w*0.12); g.fill();
    // かべのアイシング

    // まど（あたたかい光）

    rr2(x-w*0.11, yb-h*0.5-w*0.16, w*0.22, w*0.3, w*0.11); g.fill();
    g.strokeStyle = 'rgba(160,100,50,.5)'; g.lineWidth = 1;
    rr2(x-w*0.11, yb-h*0.5-w*0.16, w*0.22, w*0.3, w*0.11); g.stroke();
    // クリームのやね（ソフトクリームのうずまき）
    for (let i=0;i<3;i++){
      const rrr = w*(0.62 - i*0.16), yy = yb-h - w*0.12 - i*w*0.3;

  towerK(cxK-W*0.085, byK, W*0.075, H*0.17, '#ffb9d4');

  // もん（アーチとキャンディけーンのはしら）
  g.fillStyle = '#7a4c28';
  g.beginPath(); g.arc(cxK, byK, W*0.026, Math.PI, 0); g.lineTo(cxK+W*0.026,byK); g.lineTo(cxK-W*0.026,byK); g.closePath(); g.fill();
  for (const s of [-1,1]){
    const px2 = cxK + s*W*0.037;

      g.fillRect(-W*0.02,-H*0.003,W*0.04,H*0.006); g.restore();
    }
    g.restore();

  // はた

  g.beginPath(); g.moveTo(cxK, byK-H*0.23-W*0.11); g.lineTo(cxK, byK-H*0.23-W*0.16); g.stroke();

  /* --- ジンジャーブレッドのおうち --- */
  const house = (x,yb,s) => {

    g.fillStyle = '#96613a';
    g.beginPath(); g.moveTo(x-s*1.15,yb-s*1.05); g.lineTo(x,yb-s*1.8); g.lineTo(x+s*1.15,yb-s*1.05); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.beginPath(); g.moveTo(x-s*1.15,yb-s*1.05);
    for (let i=0;i<5;i++) g.arc(x-s*1.15+s*2.3*(i+0.5)/5, yb-s*1.05, s*0.23, Math.PI, 0, true);
    g.lineTo(x+s*1.15,yb-s*0.95); g.lineTo(x-s*1.15,yb-s*0.95); g.closePath(); g.fill();
    // ドアとまど
    g.fillStyle = '#5f3a20';
    rr2(x-s*0.22, yb-s*0.55, s*0.44, s*0.55, s*0.22); g.fill();
    g.fillStyle = '#ffd98a';
    ell(x-s*0.6, yb-s*0.7, s*0.16, s*0.16, '#ffd98a');
    ell(x+s*0.6, yb-s*0.7, s*0.16, s*0.16, '#ffd98a');
    // ガムドロップ
    for (let i=0;i<4;i++)
      ell(x-s*0.8+i*s*0.53, yb-s*1.35-(i%2?s*0.12:0), s*0.09, s*0.11, ['#ff8fc4','#8fe3c4','#ffd76e','#9ed8ff'][i]);
  };
  house(W*0.15, H*0.66, W*0.055);
  house(W*0.87, H*0.62, W*0.042);

  /* --- わたあめの木 と ロリポップ --- */
  const tree = (x,yb,s,col1,col2) => {
    g.fillStyle = '#8a5a34';
    rr2(x-s*0.08, yb-s*0.8, s*0.16, s*0.8, s*0.08); g.fill();
    for (const [dx,dy,r] of [[-0.45,-0.95,0.5],[0.45,-0.95,0.5],[0,-1.3,0.62],[0,-0.85,0.55]]){
      const cg = g.createRadialGradient(x+dx*s-s*0.15, yb+dy*s-s*0.15, s*0.05, x+dx*s, yb+dy*s, s*r*1.25);
      cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.5,col1); cg.addColorStop(1,col2);
      g.fillStyle = cg;
      g.beginPath(); g.arc(x+dx*s, yb+dy*s, s*r, 0, TAU); g.fill();
    }
  };
  tree(W*0.06,H*0.85,W*0.05,'#ffc2da','#f39ec0');
  tree(W*0.3, H*0.66,W*0.035,'#c9ecd8','#a3d9ba');
  tree(W*0.95,H*0.9, W*0.055,'#d8c6f2','#b9a0e2');
  const lolli = (x,yb,s,col) => {
    g.strokeStyle = '#fff'; g.lineWidth = s*0.16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x,yb); g.lineTo(x,yb-s*1.1); g.stroke();
    const lg2 = g.createRadialGradient(x-s*0.2,yb-s*1.1-s*0.5*0.4,0, x,yb-s*1.1-s*0.35,s*0.62);
    lg2.addColorStop(0,'#ffffff'); lg2.addColorStop(1,col);
    g.fillStyle = lg2;
    g.beginPath(); g.arc(x,yb-s*1.1-s*0.3,s*0.55,0,TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = s*0.12;
    g.beginPath();
    for (let i=0;i<18;i++){
      const a2 = i*0.5, r2 = i*s*0.028;
      g.lineTo(x+Math.cos(a2)*r2, yb-s*1.1-s*0.3+Math.sin(a2)*r2);
    }
    g.stroke();
  };
  lolli(W*0.23,H*0.95,W*0.035,'#ff8fc4');
  lolli(W*0.78,H*0.97,W*0.04,'#8fd8ff');
  lolli(W*0.09,H*0.73,W*0.022,'#ffd76e');

  /* --- まえのマカロンいし と おはな --- */
  for (const [x,y,s,c1,c2] of [[0.33,0.97,0.02,'#ffd0df','#e8a5be'],[0.62,0.93,0.016,'#c9ecd8','#9cd0ae']]){
    ell(W*x,H*y,W*s,W*s*0.6,c2); ell(W*x,H*(y-0.008),W*s,W*s*0.55,c1);
  }
  for (let i=0;i<14;i++){
    const x2 = W*rnd(), y2 = H*(0.6+rnd()*0.38);
    if (x2 > W*0.36 && x2 < W*0.7) continue;   // みちとかわは avoid ざっくり
    g.fillStyle = ['#ff9ec9','#fff','#ffe08a'][(rnd()*3)|0];
    for (let p2=0;p2<5;p2++){
      const a2 = p2*TAU/5;
      ell(x2+Math.cos(a2)*W*0.005, y2+Math.sin(a2)*W*0.005, W*0.004, W*0.004, g.fillStyle);
    }
    ell(x2,y2,W*0.003,W*0.003,'#ffb43f');
  }

  /* --- ひかりのすじ と キラキラ --- */
  g.save(); g.translate(W*0.78,H*0.28);
  g.fillStyle = 'rgba(255,246,210,.10)';
  for (let i=0;i<5;i++){
    g.rotate(0.5);
    g.beginPath(); g.moveTo(0,0); g.arc(0,0,W*0.9,-0.05,0.05); g.closePath(); g.fill();
  }
  g.restore();
  for (let i=0;i<26;i++)
    star4(W*rnd(), H*rnd(), W*(0.004+rnd()*0.007), 'rgba(255,255,255,' + (0.5+rnd()*0.5) + ')', rnd()*3);

  const put = (pid, x, y, s) => {

    g.drawImage(charThumb({ pid }, s), W*x - s/2, H*y - s/2, s, s);
  };
  const S1 = W/420;   // 420px基準の大きさ調整
  const spots = [
    ['purin',0.3,0.84,56],['choco',0.5,0.9,58],['gumgum',0.66,0.85,54],
    ['donut',0.13,0.77,52],['taffy',0.84,0.78,50],['cake',0.41,0.76,48],

  ];
  let got = 0;

  if (complete){

    ]) put(pid, x, y, s*S1);
    // よぞらの花火
    const firework = (x,y,r,col) => {
      const fg = g.createRadialGradient(x,y,0, x,y,r);

  }

  /* --- しあげ：ふちのビネットとタイトル --- */
  const vg = g.createRadialGradient(W/2,H*0.55,H*0.3, W/2,H*0.55,H*0.95);
  vg.addColorStop(0,'rgba(120,80,120,0)'); vg.addColorStop(1,'rgba(120,80,120,.16)');
  g.fillStyle = vg; g.fillRect(0,0,W,H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = "800 " + (W*0.055) + "px 'Hiragino Maru Gothic ProN',sans-serif";
  g.lineWidth = W*0.014; g.strokeStyle = 'rgba(255,255,255,.9)';
  g.strokeText('まほうのおかしの国', W/2, H*0.058);
  g.fillStyle = '#e05f9e';
  g.fillText('まほうのおかしの国', W/2, H*0.058);

  /* --- かんせいのあかし：きんの額ぶち・リボン・日付 --- */
  if (complete){
    g.strokeStyle = 'rgba(255,200,90,.9)'; g.lineWidth = W*0.009;
    g.strokeRect(W*0.012, H*0.016, W*0.976, H*0.968);
    g.strokeStyle = 'rgba(255,238,180,.95)'; g.lineWidth = W*0.003;
    g.strokeRect(W*0.028, H*0.036, W*0.944, H*0.928);
    const rbg = g.createLinearGradient(0, H*0.085, 0, H*0.085 + H*0.055);
    rbg.addColorStop(0,'#ffe9b8'); rbg.addColorStop(1,'#ffd06e');
    g.fillStyle = rbg;
    rr2(W/2 - W*0.155, H*0.085, W*0.31, H*0.055, H*0.028); g.fill();
    g.strokeStyle = '#d99a1e'; g.lineWidth = W*0.0025;
    rr2(W/2 - W*0.155, H*0.085, W*0.31, H*0.055, H*0.028); g.stroke();
    g.font = "800 " + (W*0.03) + "px 'Hiragino Maru Gothic ProN',sans-serif";
    g.fillStyle = '#a06a10';
    g.fillText('🎉 全員 大集合！ 🎉', W/2, H*0.113);
    let doneD = '';
    try{ doneD = localStorage.getItem('sweetTD.done') || ''; }catch(e){}
    if (doneD){
      g.font = "800 " + (W*0.022) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      g.fillStyle = 'rgba(107,74,99,.75)';
      g.textAlign = 'right';
      g.fillText('完成 ' + doneD, W*0.955, H*0.955);
      g.textAlign = 'center';
    }
  }
  return { got, lgGot, complete };
}

function buildKingdom(){
  const w = kingOv.clientWidth - 24 || 380;
  const h = Math.round(w * 0.78);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  kingCv.width = w*dpr; kingCv.height = h*dpr;
  kingCv.style.height = h + 'px';
  const g = kingCv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const r = drawKingdom(g, w, h);
  kingCap.textContent = r.complete
    ? '🏆 図鑑コンプリート！ ようせいも 敵のみんなも おまつり 🎉'
    : r.got >= 12 && r.lgGot >= 3
    ? '🏰 大にぎわい！ 図鑑をコンプリートすると 完成の一枚に…✨'
    : '仲間 ' + r.got + '/12・伝説 ' + r.lgGot + '/3 が暮らしています。集めるほど にぎやかに✨';
}

/* ---------- なかまの似顔絵（Canvasに直接描く） ---------- */
function charThumb(ch, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  drawPortrait(g, ch.pid || ch.id, size);
  portraitShade(g, size);   // えがき終わった絵に あとから光をあてて立体にする
  return c;
}

/* 似顔絵の立体感。
   図鑑の子は1体ずつ形がちがうので、かたちごとに描きかえるのではなく、
   えがき終わった絵の上から 光・かげ・つやを かぶせている。
   これで どんな形の子でも 同じ当たりかたの光になる。

   かげは「かけ算（multiply）」でのせるのがミソ。白い色を うすくかぶせて
   暗くすると 色まで あせてしまうが、かけ算なら 色がこいまま ふかくなる。
   かけ算は絵の外にもはみ出すので、さいごに もとの形で切りぬいている */
function portraitShade(g, S){
  const M = S/2, TAU = 6.2832, cv = g.canvas;
  // いまの絵をとっておく（さいごの切りぬきに使う）
  const mask = document.createElement('canvas');
  mask.width = cv.width; mask.height = cv.height;
  mask.getContext('2d').drawImage(cv, 0, 0);

  // ① かげ。左上は白（そのまま）、外にいくほど こい色をかけて ふかくする
  g.save();
  g.globalCompositeOperation = 'multiply';
  const mg = g.createRadialGradient(M-S*0.17, M-S*0.21, S*0.03, M-S*0.02, M-S*0.02, S*0.56);
  mg.addColorStop(0,   '#ffffff');
  mg.addColorStop(0.3, '#f0e4ee');
  mg.addColorStop(0.66,'#c6a7c3');
  mg.addColorStop(1,   '#8a6d8d');
  g.fillStyle = mg; g.fillRect(0,0,S,S);
  g.restore();

  // ② 光と つや。ひかえめにして、色をあせさせない
  g.save();
  const lg = g.createRadialGradient(M-S*0.19, M-S*0.23, 0, M-S*0.05, M-S*0.05, S*0.5);
  lg.addColorStop(0,'rgba(255,255,255,.35)');
  lg.addColorStop(0.45,'rgba(255,255,255,.07)');
  lg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = lg; g.fillRect(0,0,S,S);
  // 下からの照りかえし
  const bg = g.createRadialGradient(M+S*0.15, M+S*0.22, 0, M+S*0.09, M+S*0.15, S*0.4);
  bg.addColorStop(0,'rgba(255,255,255,.28)');
  bg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = bg; g.fillRect(0,0,S,S);
  // つや。ぼんやりした光の中に つよい芯
  g.save();
  g.translate(M-S*0.13, M-S*0.18); g.rotate(-0.55); g.scale(1,0.52);
  const hg = g.createRadialGradient(0,0,0, 0,0,S*0.16);
  hg.addColorStop(0,'rgba(255,255,255,.85)');
  hg.addColorStop(0.5,'rgba(255,255,255,.24)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = hg;
  g.beginPath(); g.arc(0,0,S*0.16,0,TAU); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.95)';
  g.beginPath(); g.ellipse(M-S*0.155, M-S*0.2, S*0.046, S*0.024, -0.55, 0, TAU); g.fill();
  g.restore();

  // ③ もとの形で切りぬく。かけ算と光が 絵の外にも のっているため
  g.save();
  g.globalCompositeOperation = 'destination-in';
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(mask, 0, 0);
  g.restore();
}

/* まだ出会っていないでんせつの、うすむらさきの影 */
function silhouetteThumb(pid, size){
  const c = charThumb({ pid }, size);
  const g = c.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#c3b3d6';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

function drawPortrait(g, id, S){
  const TAU = 6.2832, M = S/2, R = S*0.27;
  /* 絵が ある子は はって おしまい。tw_ や 手がきの 分岐より 先に 見る */
  {
    const ak = DEX_ART[id];
    if (ak && ART_SPRITE[ak]){
      const px = R*TOWER_PX;
      g.drawImage(ART_SPRITE[ak], M-px/2, M-px/2, px, px);
      return;
    }
  }
  const rrect = (x,y,w,h,r) => {
    const k = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y);
    g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
    g.arcTo(x,y+h,x,y,k);     g.arcTo(x,y,x+w,y,k);
    g.closePath();
  };
  /* まるい体。ここでは 単色でぬるだけにしておく。
     立体感は portraitShade があとから ぜんぶの子に まとめてのせる。
     ここでグラデを焼きこむと、この子たちだけ立体感が強くなって
     他の形の子と差がついてしまう（dark はもう使わないが、
     呼びだし側をぜんぶ書きかえないで済むよう 引数はのこしてある） */
  const ball = (x,y,r,col,dark) => {
    g.fillStyle = col;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  };
  /* 顔。図鑑のカードは小さいので、点の目とシンプルなほっぺで
     やさしい見た目にしてある（盤面のおかしはもっと作りこんだ顔） */
  const face = (x,y,r,mood) => {
    g.fillStyle = 'rgba(255,120,165,.4)';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.5, y+r*0.18, r*0.16, 0, TAU); g.fill(); }
    // まゆ。おこりは きつく、いじわるは ゆるく つりあげる
    if (mood === 'angry' || mood === 'naughty'){
      const k = mood === 'angry' ? 1 : 0.6;
      g.strokeStyle = '#4a3348'; g.lineWidth = r*0.08; g.lineCap = 'round';
      for (const s of [-1,1]){
        g.beginPath();
        g.moveTo(x+s*r*0.44, y-r*(0.36+0.06*k));
        g.lineTo(x+s*r*0.15, y-r*(0.34-0.05*k));
        g.stroke();
      }
    }
    g.fillStyle = '#503a52';
    for (const s of [-1,1]){ g.beginPath(); g.ellipse(x+s*r*0.26, y-r*0.05, r*0.09, r*0.13, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#fff';
    for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.22, y-r*0.1, r*0.045, 0, TAU); g.fill(); }
    // わるいこは 目のうえに まぶたをかぶせて ほそめる
    if (mood === 'angry' || mood === 'naughty'){
      g.fillStyle = '#503a52';
      for (const s of [-1,1]){
        g.beginPath();
        g.ellipse(x+s*r*0.26, y-r*(mood === 'angry' ? 0.15 : 0.13), r*0.15, r*0.06, s*0.35, 0, TAU);
        g.fill();
      }
    }
    g.strokeStyle = '#503a52'; g.lineWidth = r*0.06; g.lineCap = 'round';
    if (mood === 'angry'){
      g.beginPath(); g.arc(x, y+r*0.38, r*0.13, Math.PI*1.15, Math.PI*1.85); g.stroke();
    } else if (mood === 'naughty'){
      // にやり＋ちいさなキバ
      g.beginPath();
      g.moveTo(x-r*0.18, y+r*0.18);
      g.quadraticCurveTo(x, y+r*0.34, x+r*0.21, y+r*0.11);
      g.stroke();
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(x+r*0.04, y+r*0.2); g.lineTo(x+r*0.15, y+r*0.16); g.lineTo(x+r*0.09, y+r*0.31);
      g.closePath(); g.fill();
    } else {
      g.beginPath(); g.arc(x, y+r*0.16, r*0.13, Math.PI*0.15, Math.PI*0.85); g.stroke();
    }
  };
  const star = (x,y,r,col) => {
    g.save(); g.translate(x,y); g.fillStyle = col;
    g.beginPath();
    for (let i=0;i<4;i++){
      const a = i*Math.PI/2;
      g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      g.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  };
  g.clearRect(0,0,S,S);

  if (id.slice(0,3) === 'tw_'){
    /* ---- おかし（タワー）のようせい ---- */
    const key = id.slice(3), T = TOWERS[key];
    // はね（カードの白地でも見えるようにうすいラベンダー）。
    // 絵が ある子は じぶんの すがたが あるので つけない
    if (!(T.art && ART_SPRITE[T.art])){
    g.fillStyle = 'rgba(201,167,255,.4)';
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(M+s*R*0.95, M-R*0.15, R*0.5, R*0.28, s*0.6, 0, TAU); g.fill();
    }
    // マカロンのだい
    g.fillStyle = '#fff';
    rrect(M-R*0.95, M+R*0.6, R*1.9, R*0.5, R*0.25); g.fill();
    g.fillStyle = 'rgba(224,95,158,.15)';
    rrect(M-R*0.95, M+R*0.82, R*1.9, R*0.28, R*0.14); g.fill();
    g.strokeStyle = 'rgba(160,120,160,.35)'; g.lineWidth = 1.2;
    rrect(M-R*0.95, M+R*0.6, R*1.9, R*0.5, R*0.25); g.stroke();
    }
    // ばんめんと 同じ 絵を つかう。絵が なければ これまでどおり sweetBody
    if (T.art && ART_SPRITE[T.art]){
      const px = R*TOWER_PX;
      g.drawImage(ART_SPRITE[T.art], M-px/2, M-px/2, px, px);
    } else {
      // 図鑑は あとから portraitShade が光をのせるので flat でぬる
      g.save(); g.translate(M, M);
      sweetBody(g, key, R, T.color, T.dark, true);
      g.restore();
      face(M, M, R*SWEET_FACE[key]);
    }
  } else if (id.slice(0,3) === 'en_'){
    /* ---- てき ---- */
    const key = id.slice(3), E = ENEMIES[key];
    const angry = key === 'boss' || key === 'golem';
    // 盤面とおなじ てきの形（enemyBody）。図鑑は とまった絵なので ゆれは0
    g.save(); g.translate(M, M);
    enemyBody(g, key, R, E.color, E.dark, true, 0);
    g.restore();
    face(M, M + R*ENEMY_FACE[key][1], R*ENEMY_FACE[key][0], angry ? 'angry' : 'naughty');
  } else if (id === 'whale'){
    /* ---- ほしのクジラ ---- */
    const y = M + S*0.02;
    const gr = g.createLinearGradient(0, y - R, 0, y + R);
    gr.addColorStop(0,'#8fb0e8'); gr.addColorStop(1,'#5a7fc8');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(M - S*0.02, y, R*1.3, R*0.85, 0, 0, TAU); g.fill();
    // しっぽ
    g.beginPath();
    g.moveTo(M + R*1.1, y - R*0.05);
    g.quadraticCurveTo(M + R*1.65, y - R*0.75, M + R*1.8, y - R*0.35);
    g.quadraticCurveTo(M + R*1.6, y - R*0.02, M + R*1.5, y + R*0.12);
    g.quadraticCurveTo(M + R*1.72, y + R*0.55, M + R*1.45, y + R*0.6);
    g.quadraticCurveTo(M + R*1.2, y + R*0.32, M + R*1.1, y + R*0.15);
    g.closePath(); g.fill();
    // しろいおなか
    g.fillStyle = '#dfe9fb';
    g.beginPath(); g.ellipse(M - S*0.02, y + R*0.38, R*1.1, R*0.4, 0, 0, TAU); g.fill();
    // ほしもよう
    star(M - R*0.55, y - R*0.35, S*0.032, '#fff');
    star(M + R*0.25, y - R*0.48, S*0.042, '#ffe27a');
    star(M - R*0.05, y - R*0.05, S*0.026, '#fff');
    // あたまのうえの ほしのしお
    g.strokeStyle = '#bfe0ff'; g.lineWidth = S*0.014; g.lineCap = 'round';
    g.beginPath(); g.moveTo(M - R*0.5, y - R*0.82); g.lineTo(M - R*0.5, y - R*1.1); g.stroke();
    star(M - R*0.5, y - R*1.28, S*0.05, '#bfe0ff');
    face(M - R*0.55, y + R*0.02, R*0.52);
  } else if (id === 'phoenix'){
    /* ---- ふしちょう ---- */
    const y = M + S*0.03;
    for (const s of [-1,1]){
      g.save(); g.translate(M + s*R*0.75, y - R*0.1); g.rotate(s*0.5);
      g.fillStyle = 'rgba(255,170,80,.95)';
      g.beginPath(); g.ellipse(0, 0, R*0.7, R*0.35, s*0.5, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,214,110,.9)';
      g.beginPath(); g.ellipse(s*R*0.1, R*0.12, R*0.45, R*0.22, s*0.5, 0, TAU); g.fill();
      g.restore();
    }
    // しっぽのほのお
    g.lineCap = 'round';
    g.strokeStyle = '#ff9a4a'; g.lineWidth = S*0.024;
    g.beginPath(); g.moveTo(M - R*0.05, y + R*0.6); g.quadraticCurveTo(M - R*0.5, y + R*1.1, M - R*0.75, y + R*0.9); g.stroke();
    g.strokeStyle = '#ffd76e'; g.lineWidth = S*0.02;
    g.beginPath(); g.moveTo(M + R*0.1, y + R*0.6); g.quadraticCurveTo(M + R*0.5, y + R*1.15, M + R*0.72, y + R*0.95); g.stroke();
    ball(M, y, R*0.85, '#ffb35a', '#e07028');
    // あたまのかざりばね
    g.strokeStyle = '#ffd76e'; g.lineWidth = S*0.018;
    for (const [dx,len] of [[-0.25,0.5],[0,0.65],[0.25,0.5]]){
      g.beginPath();
      g.moveTo(M + dx*R*0.6, y - R*0.72);
      g.quadraticCurveTo(M + dx*R, y - R*(0.72+len), M + dx*R*1.4, y - R*(0.55+len));
      g.stroke();
    }
    face(M, y, R*0.7);
  } else if (id === 'chronos'){
    /* ---- クロノスちょうろう（とけいのこうらのカメ） ---- */
    const y = M + S*0.05;
    g.fillStyle = '#9bc48f';
    for (const dx of [-0.85, 0.85]){
      g.beginPath(); g.ellipse(M + dx*R, y + R*0.5, R*0.26, R*0.18, 0, 0, TAU); g.fill();
    }
    const gr2 = g.createRadialGradient(M - R*0.3, y - R*0.5, R*0.2, M, y, R*1.3);
    gr2.addColorStop(0,'#cfe8b8'); gr2.addColorStop(1,'#7fae6a');
    g.fillStyle = gr2;
    g.beginPath(); g.ellipse(M + R*0.1, y - R*0.05, R*1.05, R*0.8, 0, 0, TAU); g.fill();
    g.strokeStyle = '#5f8a4e'; g.lineWidth = S*0.012;
    g.beginPath(); g.ellipse(M + R*0.1, y - R*0.05, R*1.05, R*0.8, 0, 0, TAU); g.stroke();

/* ==========================================================
   描画
   ========================================================== */
/* じめんと道は うごかないので、1回だけ テクスチャに焼く。
   トッピングだけで110個あり、毎フレーム描きなおすのは むだだから */
function drawGround(){
  const TH = themeOf(wave);   // いまのステージのテーマ色

  // じめん
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    ctx.fillStyle = (r+c)%2 ? TH.g1 : TH.g2;
    ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
  }

  // 道（クッキー）
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = TH.p1; ctx.lineWidth = CELL*0.94;
  ctx.beginPath();
  pathPts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.stroke();
  ctx.strokeStyle = TH.p2; ctx.lineWidth = CELL*0.78;
  ctx.stroke();

  // 道の上のカラースプレー（道に沿って等間隔に散らす）
  const cols = TH.spr;
  const N = 110;
  for (let i=0;i<N;i++){
    const d = (i+0.5)/N * pathLen;
    const a = posAt(d), b2 = posAt(Math.min(pathLen, d+2));
    const dx = b2.x-a.x, dy = b2.y-a.y, L = Math.hypot(dx,dy) || 1;
    const off = (((i*37) % 100)/100 - 0.5) * CELL*0.62;   // 道幅の中でずらす
    const x = a.x - dy/L*off, y = a.y + dx/L*off;
    ctx.save(); ctx.translate(x,y); ctx.rotate((i*97 % 360)/180*Math.PI);
    ctx.fillStyle = cols[i%4];
    ctx.fillRect(-CELL*0.055, -CELL*0.02, CELL*0.11, CELL*0.04);
    ctx.restore();
  }

}

/* 焼いたじめんの上に かさねる、うごくもの */
function drawBoardOverlay(){
  const W = COLS*CELL, H = ROWS*CELL;
  const TH = themeOf(wave);

  // 背景のキラキラ
  for (const s of sparks){
    ctx.globalAlpha = 0.35 + Math.sin(s.ph)*0.3;
    sparkle(s.x, s.y, s.r, s.ph*0.4, '#ffffff');
  }
  ctx.globalAlpha = 1;

  /* げんきのバー（💗＋ピンクの帯）は ここに あったが、ステージ名が
     見えにくいので 外した。げんきの のこりは HUD の ハートの札に 出す */

  // いまのステージ名（右上のかわいいラベル。左上は敵の入り口なので避ける）
  {
    const stN = Math.max(1, Math.ceil(Math.max(wave,1)/STAGE_WAVES));
    const label = friendWave ? '👭 友だちバトル！' : '🍭 ステージ' + stN + '・' + TH.name;
    ctx.font = "800 " + (CELL*0.27) + "px 'Hiragino Maru Gothic ProN','Noto Sans JP',system-ui,sans-serif";
    const lw = ctx.measureText(label).width;
    const bx = COLS*CELL - CELL*0.22 - lw - CELL*0.56;
    const ly = CELL*0.18;   // バーを 外したので うえに つめた
    // まるいピル（ピンクのふちどり＋ふんわり影）
    ctx.save();
    ctx.shadowColor = 'rgba(190,140,180,.4)'; ctx.shadowBlur = CELL*0.12; ctx.shadowOffsetY = CELL*0.04;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    roundRect(bx, ly, lw + CELL*0.56, CELL*0.6, CELL*0.3); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,143,196,.75)'; ctx.lineWidth = 2;
    roundRect(bx, ly, lw + CELL*0.56, CELL*0.6, CELL*0.3); ctx.stroke();
    // 白フチつきのピンク文字
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.lineWidth = CELL*0.09; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
    ctx.strokeText(label, bx + CELL*0.28, ly + CELL*0.31);
    ctx.fillStyle = '#e05f9e';
    ctx.fillText(label, bx + CELL*0.28, ly + CELL*0.31);
    // ゆれるキラキラをそえる
    sparkle(bx - CELL*0.12, ly + CELL*0.16 + Math.sin(time*2.5)*CELL*0.05, CELL*0.09, time*2, '#ffd76e');
  }

  // そらをとぶでんせつ
  if (flyer){
    const fb = Math.sin(time*2 + 1) * CELL*0.12;
    const fy = flyer.y + fb;
    if (flyer.sil){
      // 出会う前は「かたちの わからない かげ」だけを よぎらせる。
      // すがたが 見えてしまうと、ウェーブ60で はじめて 会う おどろきが なくなる
      ctx.save();
      const rg = ctx.createRadialGradient(flyer.x, fy, 0, flyer.x, fy, CELL*0.62);
      rg.addColorStop(0,    'rgba(140,116,164,.46)');
      rg.addColorStop(0.55, 'rgba(154,132,178,.22)');
      rg.addColorStop(1,    'rgba(170,150,190,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(flyer.x, fy, CELL*0.62, CELL*0.3 + Math.sin(time*3)*CELL*0.04, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
      sparkle(flyer.x - flyer.dir*CELL*0.5, fy - CELL*0.12, CELL*0.07, time*3, 'rgba(201,167,224,.75)');
    } else {
      ctx.globalAlpha = 0.95;
      ctx.drawImage(portraitOf(flyer.pid), flyer.x - 26, fy - 26, 52, 52);
      ctx.globalAlpha = 1;
      sparkle(flyer.x - flyer.dir*CELL*0.75, fy, CELL*0.09, time*5, '#ffffff');
    }
  }

  // 置ける場所のうっすらしたガイド
  if (selTool){
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      if (pathCells.has(key(c,r)) || towers.some(t=>t.c===c&&t.r===r)) continue;
      roundRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6, 8); ctx.stroke();
    }
  }
}

/* まばたき：ときどきぱちっと目を閉じる（1=ひらく 0=とじる） */
function blinkK(ph){
  const t = (time + ph*0.57) % 3.6;
  if (t > 0.22) return 1;
  return Math.min(1, Math.abs(t/0.11 - 1));
}

/* つやつやのまるい体（ラジアルグラデ＋りんかく＋ハイライト） */
/* ---------- 立体感の共通部品 ----------
   タワー・敵・図鑑で同じ見え方にそろえるため、ここにまとめてある。
   ひかりは いつも左上から当たっているものとして描く */

/* 地の色。白い芯 → 色 → かげ のグラデーション */
function ballGrad(R, color, dark){
  const g = ctx.createRadialGradient(-R*0.38,-R*0.48,R*0.03, -R*0.05,-R*0.05,R*1.25);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(0.07,'#ffffff');
  g.addColorStop(0.36,color);
  g.addColorStop(0.9,dark);
  g.addColorStop(1,dark);
  return g;
}
/* いま描いたかたちの中に、照りかえしと ふちのまわりこみを重ねる。
   fill() のすぐあとに呼ぶ（パスはのこっているので そのまま clip できる）。
   右下のふちが明るくなるのが きいていて、これがあると 平たいシールに見えなくなる */
function shade3d(R){
  ctx.save(); ctx.clip();
  const bg = ctx.createRadialGradient(R*0.5,R*0.62,R*0.02, R*0.32,R*0.42,R*0.92);
  bg.addColorStop(0,'rgba(255,255,255,.72)');
  bg.addColorStop(0.4,'rgba(255,255,255,.24)');
  bg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = bg; ctx.fillRect(-R*1.7,-R*1.7,R*3.4,R*3.4);
  const tg = ctx.createRadialGradient(0,0,R*0.5, 0,0,R);
  tg.addColorStop(0,'rgba(74,38,66,0)');
  tg.addColorStop(0.7,'rgba(74,38,66,.16)');
  tg.addColorStop(1,'rgba(74,38,66,.42)');
  ctx.fillStyle = tg; ctx.fillRect(-R*1.7,-R*1.7,R*3.4,R*3.4);
  // 接地のかげ。地面とふれるあたりを暗くすると、おいてある感じが強くなる
  const og = ctx.createRadialGradient(0,R*1.0,0, 0,R*1.0,R*0.9);
  og.addColorStop(0,'rgba(58,26,50,.34)');
  og.addColorStop(1,'rgba(58,26,50,0)');
  ctx.fillStyle = og; ctx.fillRect(-R*1.7,-R*1.7,R*3.4,R*3.4);
  ctx.restore();
}
/* つや。ぼんやりした光の中に つよい芯があると、つやのある球に見える */
function ballGloss(R){
  ctx.save();
  ctx.translate(-R*0.3,-R*0.44); ctx.rotate(-0.55); ctx.scale(1,0.6);
  const hg = ctx.createRadialGradient(0,0,0, 0,0,R*0.44);
  hg.addColorStop(0,'rgba(255,255,255,.62)');
  hg.addColorStop(0.5,'rgba(255,255,255,.2)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0,0,R*0.44,0,6.3); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.98)';
  ctx.beginPath(); ctx.ellipse(-R*0.38,-R*0.54,R*0.105,R*0.055,-0.55,0,6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(R*0.44,-R*0.24,R*0.075,0,6.3); ctx.fill();
}
/* 地面におちる影。ふちをぼかすと、地面においてある感じが出る */
function softShadow(x, y, R, a){
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, 0.31);
  const sg = ctx.createRadialGradient(0,0,0, 0,0,R);
  sg.addColorStop(0,'rgba(120,90,120,'+a+')');
  sg.addColorStop(0.5,'rgba(120,90,120,'+(a*0.5)+')');
  sg.addColorStop(1,'rgba(120,90,120,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
  ctx.restore();
}
/* ==========================================================
   おかしの形。まるい玉ではなく、そのおかしの形そのものをえがく。
   盤面（ctx）と 図鑑・ショップ（g）で 同じ形をつかいたいので、
   えがくキャンバスを c でうけとる。
   flat のときは単色でぬる（図鑑は あとから portraitShade が光をのせるため、
   ここでグラデを焼きこむと 二重になって白とびする）
   ========================================================== */
/* 形ごとに 顔をのせられる広さがちがうので、顔の大きさをここで決める */
const SWEET_FACE = { candy:0.92, ice:0.86, choco:0.86, star:0.74 };
function sweetBody(c, kind, R, color, dark, flat){
  const TAU = 6.2832;
  // 地の色。左上から光があたっているグラデ（flat のときは単色）
  const paint = () => {
    if (flat) return color;
    const g = c.createRadialGradient(-R*0.38,-R*0.48,R*0.03, -R*0.05,-R*0.05,R*1.35);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.07,'#ffffff');
    g.addColorStop(0.36,color); g.addColorStop(0.9,dark); g.addColorStop(1,dark);
    return g;
  };
  const rr = (x,y,w,h,rad) => {
    const k = Math.min(rad, w/2, h/2);
    c.beginPath();
    c.moveTo(x+k,y);
    c.arcTo(x+w,y,x+w,y+h,k); c.arcTo(x+w,y+h,x,y+h,k);
    c.arcTo(x,y+h,x,y,k);     c.arcTo(x,y,x+w,y,k);
    c.closePath();
  };

  if (kind === 'candy'){
    // つつみキャンディ：左右にひろがる つつみのひだ
    c.fillStyle = dark;
    for (const s of [-1,1]){
      c.beginPath();
      c.moveTo(s*R*0.6, 0);
      c.lineTo(s*R*1.5, -R*0.7);
      c.lineTo(s*R*1.2, 0);
      c.lineTo(s*R*1.5, R*0.7);
      c.closePath(); c.fill();
    }
    c.fillStyle = color;
    for (const s of [-1,1]){
      c.beginPath();
      c.moveTo(s*R*0.6, 0);
      c.lineTo(s*R*1.36, -R*0.5);
      c.lineTo(s*R*1.12, 0);
      c.lineTo(s*R*1.36, R*0.5);
      c.closePath(); c.fill();
    }
    // あめ玉の本体
    c.fillStyle = paint();
    c.beginPath(); c.arc(0,0,R,0,TAU); c.fill();
    // うずまき（顔のじゃまにならないよう うすく）
    c.save();
    c.beginPath(); c.arc(0,0,R*0.97,0,TAU); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = R*0.15; c.lineCap = 'round';
    c.beginPath();
    for (let i=0;i<22;i++){ const a=i*0.44, q=i*R*0.037; c.lineTo(Math.cos(a)*q, Math.sin(a)*q); }
    c.stroke();
    c.restore();

  } else if (kind === 'ice'){
    // アイスクリーム：したがコーン、うえがアイスのたま
    c.fillStyle = '#e5b075';
    c.beginPath();
    c.moveTo(-R*0.78, R*0.5); c.lineTo(R*0.78, R*0.5);
    c.quadraticCurveTo(R*0.2, R*1.5, 0, R*1.62);
    c.quadraticCurveTo(-R*0.2, R*1.5, -R*0.78, R*0.5);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(150,95,45,.32)'; c.lineWidth = R*0.055;
    for (const d of [-0.45,0,0.45]){
      c.beginPath(); c.moveTo(d*R, R*0.55); c.lineTo(d*R*0.2, R*1.5); c.stroke();
    }
    for (let i=1;i<=2;i++){
      const y = R*(0.5 + i*0.36), w = R*0.78*(1 - i*0.3);
      c.beginPath(); c.moveTo(-w, y); c.lineTo(w, y); c.stroke();
    }
    // アイスのたま（ここに顔がのる）。したがすこし たれている
    c.fillStyle = paint();
    c.beginPath();
    c.arc(0, 0, R, Math.PI*0.98, Math.PI*0.02);
    c.quadraticCurveTo(R*0.9, R*0.72, R*0.42, R*0.66);
    c.quadraticCurveTo(R*0.12, R*0.9, -R*0.18, R*0.62);
    c.quadraticCurveTo(-R*0.6, R*0.86, -R*0.98, R*0.16);
    c.closePath(); c.fill();

  } else if (kind === 'choco'){
    // チョコレートのいた。すこしかたむけて 立てかけてある
    c.save(); c.rotate(-0.1);
    c.fillStyle = paint();
    rr(-R*0.92, -R*1.12, R*1.84, R*2.16, R*0.2); c.fill();
    // わりめ
    c.strokeStyle = 'rgba(86,50,22,.42)'; c.lineWidth = R*0.075; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -R*1.0); c.lineTo(0, R*0.96);
    for (const y of [-R*0.4, R*0.28]){ c.moveTo(-R*0.8, y); c.lineTo(R*0.8, y); }
    c.stroke();
    // かじったあとは destination-out だと背景まで消えてしまうので置かない。
    // かわりに 右上の角を すこし明るくして いたの厚みを見せる
    c.fillStyle = 'rgba(255,255,255,.22)';
    rr(-R*0.92, -R*1.12, R*1.84, R*0.34, R*0.16); c.fill();
    c.restore();

  } else {
    // ほしのクッキー
    c.fillStyle = paint();
    c.beginPath();
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + i*TAU/5, b = a + Math.PI/5;
      c.lineTo(Math.cos(a)*R*1.55, Math.sin(a)*R*1.55);
      c.lineTo(Math.cos(b)*R*0.66, Math.sin(b)*R*0.66);
    }
    c.closePath(); c.fill();
    // さとうのつぶ
    c.fillStyle = 'rgba(255,255,255,.6)';
    for (const [x,y] of [[-0.5,-0.55],[0.55,-0.4],[0.1,0.62],[-0.6,0.4]]){
      c.beginPath(); c.arc(x*R, y*R, R*0.075, 0, TAU); c.fill();
    }
  }
}
/* てきも おかしの形にする。かんがえかたは sweetBody とおなじ。
   wob は ゆれのぐあい（図鑑では 0 でとまった絵になる） */
/* 形ごとに 顔をのせる大きさと たかさが ちがう ［大きさ, たかさ］ */
const ENEMY_FACE = { slime:[.80,.10], fast:[.70,-.05], tank:[.74,.02], crystal:[.68,-.10],
                     bat:[.86,.04], golem:[.76,-.34], boss:[.80,.10] };
function enemyBody(c, kind, R, color, dark, flat, wob){
  const TAU = 6.2832;
  const paint = () => {
    if (flat) return color;
    const g = c.createRadialGradient(-R*0.38,-R*0.48,R*0.03, -R*0.05,-R*0.05,R*1.35);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.07,'#ffffff');
    g.addColorStop(0.36,color); g.addColorStop(0.9,dark); g.addColorStop(1,dark);
    return g;
  };
  const rr = (x,y,w,h,rad) => {
    const k = Math.min(rad, w/2, h/2);
    c.beginPath(); c.moveTo(x+k,y);
    c.arcTo(x+w,y,x+w,y+h,k); c.arcTo(x+w,y+h,x,y+h,k);
    c.arcTo(x,y+h,x,y,k);     c.arcTo(x,y,x+w,y,k);
    c.closePath();
  };

  if (kind === 'slime'){
    // プリン：うえがせまく したがひろい。したのふちが ぷるぷるゆれる
    const w = Math.sin(wob*1.3)*R*0.07;
    c.fillStyle = paint();
    c.beginPath();
    c.moveTo(-R*0.6, -R*0.72);
    c.lineTo( R*0.6, -R*0.72);
    c.quadraticCurveTo(R*0.8, R*0.2, R*0.98, R*0.6+w);
    c.quadraticCurveTo(R*0.5, R*0.88-w, 0, R*0.8+w);
    c.quadraticCurveTo(-R*0.5, R*0.88-w, -R*0.98, R*0.6+w);
    c.quadraticCurveTo(-R*0.8, R*0.2, -R*0.6, -R*0.72);
    c.closePath(); c.fill();
    // カラメル
    c.fillStyle = dark;
    c.beginPath(); c.ellipse(0, -R*0.72, R*0.6, R*0.19, 0, 0, TAU); c.fill();
    for (const [x,len] of [[-0.34,0.3],[0.12,0.44],[0.42,0.22]]){
      rr(x*R - R*0.07, -R*0.72, R*0.14, R*len, R*0.07); c.fill();
    }

  } else if (kind === 'fast'){
    // アイスキャンディ：ぼうつき
    c.fillStyle = '#e5b075';
    rr(-R*0.15, R*0.62, R*0.3, R*0.92, R*0.13); c.fill();
    c.fillStyle = paint();
    rr(-R*0.7, -R*1.02, R*1.4, R*1.76, R*0.42); c.fill();
    // うえのなみ（とけかけ）
    c.fillStyle = 'rgba(255,255,255,.4)';
    c.beginPath();
    c.moveTo(-R*0.7, -R*0.6);
    c.quadraticCurveTo(-R*0.35,-R*0.86, 0,-R*0.6);
    c.quadraticCurveTo(R*0.35,-R*0.34, R*0.7,-R*0.6);
    c.lineTo(R*0.7, -R*0.98); c.lineTo(-R*0.7,-R*0.98);
    c.closePath(); c.fill();

  } else if (kind === 'tank'){
    // マカロン：うえとしたのかわに クリームをはさむ
    c.fillStyle = paint();
    c.beginPath();
    c.moveTo(-R*1.02, -R*0.3);
    c.quadraticCurveTo(-R*0.98, -R*1.06, 0, -R*1.06);
    c.quadraticCurveTo(R*0.98, -R*1.06, R*1.02, -R*0.3);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(-R*1.02, R*0.3);
    c.quadraticCurveTo(-R*0.98, R*1.06, 0, R*1.06);
    c.quadraticCurveTo(R*0.98, R*1.06, R*1.02, R*0.3);
    c.closePath(); c.fill();
    // あいだのクリーム
    c.fillStyle = '#fff3d8';
    rr(-R*1.06, -R*0.34, R*2.12, R*0.68, R*0.14); c.fill();
    // かわの ふちのぶつぶつ（ピエ）
    c.fillStyle = 'rgba(255,255,255,.35)';
    for (const s of [-1,1])
      for (let i=-2;i<=2;i++){
        c.beginPath(); c.arc(i*R*0.36, s*R*0.42, R*0.1, 0, TAU); c.fill();
      }

  } else if (kind === 'crystal'){
    // かき氷：カップに 山もり
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.moveTo(-R*0.74, R*0.2); c.lineTo(R*0.74, R*0.2);
    c.lineTo(R*0.5, R*1.04); c.lineTo(-R*0.5, R*1.04);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(140,190,220,.5)'; c.lineWidth = R*0.05;
    c.beginPath(); c.moveTo(-R*0.74, R*0.34); c.lineTo(R*0.74, R*0.34); c.stroke();
    c.fillStyle = paint();
    c.beginPath();
    c.moveTo(-R*0.94, R*0.24);
    c.quadraticCurveTo(-R*0.66,-R*0.42, -R*0.26,-R*0.66);
    c.quadraticCurveTo(0,-R*1.12, R*0.28,-R*0.64);
    c.quadraticCurveTo(R*0.66,-R*0.4, R*0.94, R*0.24);
    c.closePath(); c.fill();
    // シロップ
    c.fillStyle = 'rgba(120,200,240,.45)';
    c.beginPath();
    c.moveTo(-R*0.5,-R*0.32);
    c.quadraticCurveTo(-R*0.1,-R*0.72, R*0.16,-R*0.42);
    c.quadraticCurveTo(R*0.3,-R*0.2, R*0.02,-R*0.12);
    c.quadraticCurveTo(-R*0.28,-R*0.06, -R*0.5,-R*0.32);
    c.closePath(); c.fill();

  } else if (kind === 'bat'){
    // クッキーのこうもり：はねを ぱたぱた
    const fl = Math.sin(wob*1.6)*0.4;
    c.fillStyle = 'rgba(150,110,220,.75)';
    for (const s of [-1,1]){
      c.save(); c.translate(s*R*0.72, -R*0.05); c.rotate(s*(0.5 + fl));
      c.beginPath();
      c.moveTo(0,0);
      c.quadraticCurveTo(s*R*1.1, -R*0.8, s*R*1.3, -R*0.1);
      c.quadraticCurveTo(s*R*0.9, R*0.15, 0, R*0.2);
      c.closePath(); c.fill();
      c.restore();
    }
    // クッキー本体（ふちを すこしでこぼこに）
    c.fillStyle = paint();
    c.beginPath();
    for (let i=0;i<=24;i++){
      const a = i/24*TAU, q = R*(1 + Math.sin(a*6)*0.045);
      c.lineTo(Math.cos(a)*q, Math.sin(a)*q);
    }
    c.closePath(); c.fill();
    // チョコチップ
    c.fillStyle = dark;
    for (const [x,y] of [[-0.44,-0.3],[0.4,-0.46],[0.52,0.3],[-0.32,0.52],[0.04,-0.66]]){
      c.beginPath(); c.arc(x*R, y*R, R*0.11, 0, TAU); c.fill();
    }
    // とがったみみ
    for (const s of [-1,1]){
      c.beginPath();
      c.moveTo(s*R*0.66, -R*0.52); c.lineTo(s*R*0.3, -R*0.8); c.lineTo(s*R*0.84, -R*1.02);
      c.closePath(); c.fill();
    }

  } else if (kind === 'golem'){
    // かさねたケーキ：2段
    c.fillStyle = paint();
    rr(-R*1.0, R*0.02, R*2.0, R*0.94, R*0.16); c.fill();
    rr(-R*0.74, -R*0.98, R*1.48, R*1.04, R*0.14); c.fill();
    // クリーム。ギザギザだと やぶれて見えるので、まるく たれる形にする
    c.fillStyle = '#fff6e9';
    rr(-R*1.0, R*0.02, R*2.0, R*0.22, R*0.11); c.fill();
    c.beginPath();
    c.moveTo(-R*0.74, -R*0.98);
    c.lineTo( R*0.74, -R*0.98);
    c.lineTo( R*0.74, -R*0.66);
    c.quadraticCurveTo( R*0.56, -R*0.3,  R*0.37, -R*0.66);
    c.quadraticCurveTo( R*0.19, -R*0.24, 0,      -R*0.66);
    c.quadraticCurveTo(-R*0.19, -R*0.3, -R*0.37, -R*0.66);
    c.quadraticCurveTo(-R*0.56, -R*0.26,-R*0.74, -R*0.66);
    c.closePath(); c.fill();
    // いちごを ちょこんと
    c.fillStyle = '#ff6f9c';
    c.beginPath(); c.arc(0, -R*1.1, R*0.16, 0, TAU); c.fill();

  } else {
    // ボス：ホールケーキ＋おうかん
    c.fillStyle = paint();
    rr(-R*1.0, -R*0.44, R*2.0, R*1.34, R*0.18); c.fill();
    // うえのクリーム
    c.fillStyle = '#fff6e9';
    c.beginPath(); c.ellipse(0, -R*0.44, R*1.0, R*0.28, 0, 0, TAU); c.fill();
    rr(-R*1.0, -R*0.26, R*2.0, R*0.22, R*0.1); c.fill();
    // いちご
    c.fillStyle = '#ff6f9c';
    for (const x of [-0.52, 0, 0.52]){
      c.beginPath(); c.arc(x*R, -R*0.56, R*0.17, 0, TAU); c.fill();
    }
    // おうかん
    c.fillStyle = '#ffd76e'; c.strokeStyle = '#d99a1e'; c.lineWidth = R*0.05;
    c.beginPath();
    c.moveTo(-R*0.42, -R*0.78); c.lineTo(-R*0.42, -R*1.14); c.lineTo(-R*0.18, -R*0.96);
    c.lineTo(0, -R*1.26); c.lineTo(R*0.18, -R*0.96); c.lineTo(R*0.42, -R*1.14);
    c.lineTo(R*0.42, -R*0.78);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff6f9c';
    c.beginPath(); c.arc(0, -R*0.96, R*0.07, 0, TAU); c.fill();
  }
}
function glossyBall(R, color, dark){
  ctx.fillStyle = ballGrad(R, color, dark);
  ctx.beginPath(); ctx.arc(0,0,R,0,6.3); ctx.fill();
  shade3d(R);
  // ふちどりは引かない。線があると とたんに イラスト寄り・平たく見える
  ballGloss(R);
}

/* 顔（まばたき・二重ハイライトの目・まつげ・グラデほっぺ） */
function drawFace(R, ph, mood){
  const bk = blinkK(ph);

  for (const s of [-1,1]){
    const ch = ctx.createRadialGradient(s*R*0.52, R*0.2, 0, s*R*0.52, R*0.2, R*0.24);
    ch.addColorStop(0,'rgba(255,120,165,.5)');
    ch.addColorStop(1,'rgba(255,120,165,0)');
    ctx.fillStyle = ch;
    ctx.beginPath(); ctx.arc(s*R*0.52, R*0.2, R*0.24, 0, 6.3); ctx.fill();
  }

  // まゆ。おこりは きつく、いじわるは ゆるく つりあげる
  if (mood === 'angry' || mood === 'naughty'){
    const k = mood === 'angry' ? 1 : 0.6;
    ctx.strokeStyle = '#4a3348'; ctx.lineWidth = R*0.09; ctx.lineCap = 'round';
    for (const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*R*0.44, -R*(0.34 + 0.06*k));
      ctx.lineTo(s*R*0.15, -R*(0.32 - 0.05*k));
      ctx.stroke();
    }
  }

  if (bk > 0.2){
    for (const s of [-1,1]){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(s*R*0.28, -R*0.04, R*0.15, R*0.19*bk, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#503a52';
      ctx.beginPath(); ctx.ellipse(s*R*0.28, -R*0.02, R*0.105, R*0.145*bk, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s*R*0.24, -R*0.02 - R*0.07*bk, R*0.05, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(s*R*0.33, R*0.03, R*0.025, 0, 6.3); ctx.fill();
      ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.045; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s*R*0.41, -R*0.15);
      ctx.lineTo(s*R*0.49, -R*0.22);
      ctx.stroke();
      // わるいこは 目のうえに まぶたをかぶせて ほそめる
      if (mood === 'angry' || mood === 'naughty'){
        ctx.fillStyle = '#503a52';
        ctx.beginPath();
        ctx.ellipse(s*R*0.28, -R*(mood === 'angry' ? 0.15 : 0.13), R*0.17, R*0.07, s*0.35, 0, 6.3);
        ctx.fill();
      }
    }
  } else {
    ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.07; ctx.lineCap = 'round';
    for (const s of [-1,1]){
      ctx.beginPath();
      ctx.arc(s*R*0.28, -R*0.01, R*0.13, Math.PI*1.15, Math.PI*1.85);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#503a52'; ctx.lineWidth = R*0.07; ctx.lineCap = 'round';
  if (mood === 'angry'){
    ctx.beginPath(); ctx.arc(0, R*0.4, R*0.15, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
  } else if (mood === 'naughty'){
    // にやり。かたっぽうだけ上がった口に、ちいさなキバ
    ctx.beginPath();
    ctx.moveTo(-R*0.19, R*0.19);
    ctx.quadraticCurveTo(0, R*0.36, R*0.22, R*0.12);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(R*0.04, R*0.21); ctx.lineTo(R*0.16, R*0.17); ctx.lineTo(R*0.1, R*0.32);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, R*0.17, R*0.15, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  }
}

/* ちいさなリボン */
function drawBow(x, y, r, color){
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
  ctx.fillStyle = color;
  for (const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*r*1.25, -r*0.85, s*r*1.15, 0);
    ctx.quadraticCurveTo(s*r*1.25, r*0.85, 0, 0);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r*0.34, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(-r*0.38, -r*0.28, r*0.17, 0, 6.3); ctx.fill();
  ctx.restore();
}

function drawTower(t){
  const T = TOWERS[t.k];
  const sp = tSpan(t);
  const x = tcx(t), y = tcy(t);
  if (window.__dbg) window.__dbg._td = { cell:CELL, x:Math.round(x), y:Math.round(y),
    a:+(ctx.getTransform ? ctx.getTransform().a : -1).toFixed(2), cw:ctx.canvas.width };
  const bob = Math.sin(time*2.4 + t.ph) * CELL*0.035;
  const pop = 1 + t.pulse*0.16;
  const R = CELL*(0.31 + (t.lv-1)*0.022) * sp;

  // 選択中は射程を表示
  if (selTower === t){
    ctx.fillStyle = 'rgba(255,143,196,.14)';
    ctx.strokeStyle = 'rgba(255,143,196,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, rangeOf(t)*CELL, 0, 6.3); ctx.fill(); ctx.stroke();
  }

  // 影（ゆれても地面に残る）
  softShadow(x, y + R*1.02, R*0.8, .5);

  ctx.save(); ctx.translate(x, y + bob); ctx.scale(pop, pop);

  // ようせいのはねと マカロンの台座。
  // なかまと アバターは じぶんの すがたが あって 絵が こみあうので つけない
  if (!T.gen && !T.avatar && !(T.art && ART_SPRITE[T.art])){
    const flap = Math.sin(time*7 + t.ph);
    const wk = 1 + (t.lv-1)*0.18;
    for (const s of [-1,1]){
      ctx.save();
      ctx.translate(s*R*0.6, -R*0.1);
      ctx.rotate(s*(0.35 + flap*0.22));
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.beginPath(); ctx.ellipse(s*R*0.42*wk, -R*0.18*wk, R*0.46*wk, R*0.24*wk, s*0.5, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.65)';
      ctx.beginPath(); ctx.ellipse(s*R*0.34*wk, R*0.16*wk, R*0.3*wk, R*0.17*wk, s*0.85, 0, 6.3); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#fff';
    roundRect(-R*0.95, R*0.4, R*1.9, R*0.55, R*0.28); ctx.fill();
    ctx.fillStyle = 'rgba(224,95,158,.12)';
    roundRect(-R*0.95, R*0.63, R*1.9, R*0.32, R*0.16); ctx.fill();
    ctx.strokeStyle = 'rgba(160,120,160,.3)'; ctx.lineWidth = 1.5;
    roundRect(-R*0.95, R*0.4, R*1.9, R*0.55, R*0.28); ctx.stroke();
  }

  /* にじいろの秘薬を のんだ子は、色が まわる オーラを つける。
     絵の 色相だけを かえても 小さいと わかりにくいので、
     まわりの ひかりで「この子は 特別」と 見せる */
  if (t.rb){
    const hue = (time*90) % 360;
    const ag2 = ctx.createRadialGradient(0,0,R*0.5, 0,0,R*2.1);
    ag2.addColorStop(0,    'hsla(' + hue + ',100%,72%,0)');
    ag2.addColorStop(0.58, 'hsla(' + hue + ',100%,72%,.42)');
    ag2.addColorStop(1,    'hsla(' + ((hue+120)%360) + ',100%,72%,0)');
    ctx.fillStyle = ag2;
    ctx.beginPath(); ctx.arc(0,0,R*2.1,0,6.3); ctx.fill();
  }
  // 強化オーラ（Lv2でしろく、Lv4からきんいろに）
  if (t.lv >= 2){
    const pu = 0.75 + Math.sin(time*3.2 + t.ph)*0.25;
    const col = t.lv >= 4 ? '255,214,110' : '255,255,255';
    const ag = ctx.createRadialGradient(0,0,R*0.6, 0,0,R*1.8);
    ag.addColorStop(0, 'rgba('+col+',0)');
    ag.addColorStop(0.62, 'rgba('+col+','+(0.34*pu)+')');
    ag.addColorStop(1, 'rgba('+col+',0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,0,R*1.8,0,6.3); ctx.fill();
  }

  // 体と顔
  if (T.avatar && avMe){
    const px = R*TOWER_PX;
    ctx.drawImage(avSprite(avMe, px), -px/2, -px/2, px, px);
  } else if (T.gen){
    // なかまは コレクションの絵を そのまま つかう
    const px = R*TOWER_PX;
    const sp = genSprite(T.gen, px);
    ctx.drawImage(t.rb ? rbSprite(sp, px, 'g_'+T.gen.id) : sp, -px/2, -px/2, px, px);
  } else if (T.art && ART_SPRITE[T.art]){
    // コレクションと 同じ 絵。はね・だい・リボンは この あとも つくので
    // 「タワーの すがた」で あることは 見わけられる
    const px = R*TOWER_PX;
    const sp = ART_SPRITE[T.art];
    ctx.drawImage(t.rb ? rbSprite(sp, px, 'a_'+T.art) : sp, -px/2, -px/2, px, px);
  } else {
    sweetBody(ctx, t.k, R, T.color, T.dark, false);
    drawFace(R*SWEET_FACE[t.k], t.ph, 'smile');
  }

  /* 体そのものが おかしの形なので、頭のかざりは置かない。
     むかし ここに かざりの ctx.save() つきブロックが あり、消したときに
     対の restore() だけが 残っていた。タワーを 1体 えがくたびに 外がわの
     保存を 1つ よぶんに 食い、2体目で Phaser の 保存まで 食って 変換が
     等倍に もどり、**そのあとの 敵が ぜんぶ 小さく 左上に えがかれていた**。
     save と restore は かならず 同じ ブロックの 中で 対に すること */

  // むねのリボン（Lv4からきんいろ）。コレクションの子は もう かざりが 多いので つけない
  if (!T.gen && !T.avatar && !(T.art && ART_SPRITE[T.art]))
    drawBow(-R*0.6, -R*0.74, R*(0.3 + (t.lv-1)*0.05), t.lv >= 4 ? '#e8b12e' : T.dark);

  // Lv3からまわりを星がくるくるまわる（レベルで数がふえる）
  if (t.lv >= 3){
    const n = t.lv + 2;
    for (let i=0;i<n;i++){
      const a = time*2.4 + t.ph + i*Math.PI*2/n;
      const rr = R*(1.45 + 0.12*Math.sin(time*3 + i*1.7));
      sparkle(Math.cos(a)*rr, Math.sin(a)*rr*0.62 - R*0.1,
              R*(i%2 ? 0.09 : 0.14), a*2, i%2 ? '#ffffff' : '#ffe27a');
    }
  }

  ctx.restore();

  // レベルの星（さいだいのLv5で小さな王冠も）
  for (let i=0;i<t.lv;i++)
    sparkle(x - (t.lv-1)*CELL*0.06 + i*CELL*0.12, y + CELL*0.4, CELL*0.055, 0, '#ffd76e');
  if (t.lv >= 5){
    ctx.save(); ctx.translate(x + R*0.7, y + bob - R*1.25); ctx.rotate(0.35);
    ctx.fillStyle = '#ffd76e'; ctx.strokeStyle = '#d99a1e'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-R*0.2, R*0.12); ctx.lineTo(-R*0.2, -R*0.08); ctx.lineTo(-R*0.07, 0);
    ctx.lineTo(0, -R*0.15); ctx.lineTo(R*0.07, 0); ctx.lineTo(R*0.2, -R*0.08); ctx.lineTo(R*0.2, R*0.12);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

/* よこ向きの 絵が 左右どちらを 向いているか。1=右・-1=左。
   正面向きの子は のせない（うつしても 見た目が 変わらないため）。
   絵を 足したり 出しなおしたら、その子の 向きを **目で 見て** ここに 足すこと。
   機械の 推定（上3分の1の 重心）は 目安に しかならない——
   カタツムリは 殻が 重心を 持っていって ほぼ 0 に なった */
const EN_FACE = {
  turtle:1, gull:1, swan:1, eagle:1, armadillo:1, camel:1, salamander:1,
  clownfish:-1, hermit:-1, shark:-1,
  pig:-1, deer:-1, wolf:-1, kangaroo:-1, horse:-1, tiger:-1, zebra:-1,
  giraffe:-1, lizard:-1, fennec:-1, ostrich:-1, hedgehog:-1, scorpion:-1,
  lavasnail:-1, ghost:-1, firebird:-1, beetle:-1,
};

function drawEnemy(e){
  const E = ENEMIES[e.k];
  const p = posAt(e.d);
  const R = E.r*CELL;
  // ?dbg=1 のときだけ、えがいた瞬間の 実際の値を のこす（くいちがい しらべ用）
  if (window.__dbg && window.__dbg._as) window.__dbg._as.push(e.k + ':' + ctx.getTransform().a);
  const sq = Math.sin(e.wob)*0.1;

  /* あるく向きに 体を むける。よこ向きの 絵の子だけ、進む向きと
     絵の向きが 逆なら かがみ写しにする。上下は 絵が 1枚しか ないので
     変えられない（正面の絵のまま）。たてに 進む あいだは、さいごに
     よこへ 進んだ向きを おぼえておく（角で ぱたぱた しないように） */
  const q2 = posAt(Math.min(pathLen, e.d + CELL*0.3));
  const ddx = q2.x - p.x;
  if (Math.abs(ddx) > Math.abs(q2.y - p.y) * 0.7 && Math.abs(ddx) > 0.5)
    e.fdir = ddx > 0 ? 1 : -1;
  const nat = e.gi ? (EN_FACE[artKeyOf(e.gi)] || 0) : 0;
  const flip = nat !== 0 && e.fdir !== undefined && e.fdir !== nat;

  ctx.save(); ctx.translate(p.x, p.y);

  // 角丸のからだ（おもち・ゴーレム）だと、影が横にはみ出して見えるので ひかえめの幅に
  softShadow(0, R*0.97, R*0.62, .36);

  ctx.scale((flip ? -1 : 1) * (1+sq), 1-sq);

  if (e.av){
    const px = R*3.2;                              // ともだち本人は 大きめに 出す
    ctx.drawImage(avSprite(e.av, px), -px/2, -px/2, px, px);
  } else if (e.gi){
    // コレクションの子を そのまま 出す。大きい子（2マス・4マス）は 見た目も 大きく
    const k2 = e.gi.cells >= 4 ? 1.5 : e.gi.cells >= 2 ? 1.26 : 1.0;
    const px = R*2.9*k2;
    ctx.drawImage(genSprite(e.gi, px), -px/2, -px/2, px, px);
  } else {
    enemyBody(ctx, e.k, R, E.color, E.dark, false, e.wob);
    ballGloss(R);
    const ef = ENEMY_FACE[e.k];
    ctx.save(); ctx.translate(0, R*ef[1]);
    drawFace(R*ef[0], e.ph, (e.k === 'boss' || e.k === 'golem') ? 'angry' : 'naughty');
    ctx.restore();
  }

  // こおり状態
  if (e.slow > 0){
    ctx.fillStyle = 'rgba(160,220,255,.4)';
    ctx.beginPath(); ctx.arc(0,0,R*1.05,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = R*0.06; ctx.lineCap = 'round';
    for (let i=0;i<3;i++){
      const a = i*Math.PI/3 + time*0.8;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a)*R*0.42, -Math.sin(a)*R*0.42);
      ctx.lineTo(Math.cos(a)*R*0.42, Math.sin(a)*R*0.42);
      ctx.stroke();
    }
  }
  ctx.restore();

  // 足止め中は頭のうえで星がくるくる
  if (e.stun > 0){
    for (let i=0;i<3;i++){
      const a = time*4 + i*2.1;
      sparkle(p.x + Math.cos(a)*R*0.9, p.y - R*1.35 + Math.sin(a)*R*0.25, R*0.18, a, '#ffd76e');
    }
  }

  // ともだちは なまえを 出す。だれと たたかっているか わかるように
  if (e.av){
    ctx.save();
    ctx.font = '700 ' + Math.round(CELL*0.28) + "px 'Hiragino Maru Gothic ProN',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const w2 = ctx.measureText(e.av.n).width / 2 + CELL*0.1;
    const h2 = CELL*0.34;
    // ならんで あるくと なまえが かさなって よめない。ぶつかるあいだ 上へ ずらす
    let ny = p.y - R*1.5;
    for (let k = 0; k < 6; k++){
      const hit = nameRects.some(r2 =>
        Math.abs(r2.x - p.x) < r2.w + w2 && Math.abs(r2.y - ny) < h2);
      if (!hit) break;
      ny -= h2;
    }
    nameRects.push({ x: p.x, y: ny, w: w2 });
    ctx.lineWidth = CELL*0.11; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(e.av.n, p.x, ny);
    ctx.fillStyle = '#e05f9e';
    ctx.fillText(e.av.n, p.x, ny);
    ctx.restore();
  }

  // HPバー
  const w = R*1.9, h = Math.max(3, CELL*0.075), yy = p.y - R - h*2.4;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  roundRect(p.x-w/2, yy, w, h, h/2); ctx.fill();
  const ratio = Math.max(0, e.hp/e.max);
  ctx.fillStyle = ratio > .5 ? '#7fe0a8' : ratio > .25 ? '#ffd166' : '#ff7d9c';
  roundRect(p.x-w/2, yy, w*ratio, h, h/2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,120,.3)'; ctx.lineWidth = 1;
  roundRect(p.x-w/2, yy, w, h, h/2); ctx.stroke();
}

function drawShot(s){
  const T = TOWERS[s.k];
  const k = s.lv;
  const rad = CELL*(0.08 + (k-1)*0.03);

  // 軌跡（レベルで長く・太く）
  ctx.strokeStyle = T.color; ctx.lineWidth = CELL*(0.055 + k*0.02); ctx.lineCap='round';
  ctx.globalAlpha = .4;
  ctx.beginPath();
  s.trail.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.lineTo(s.x,s.y); ctx.stroke();
  ctx.globalAlpha = 1;

  // Lv2からまわりが光る
  if (k >= 2){
    const glow = ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,rad*3);
    glow.addColorStop(0, 'rgba(255,255,255,.6)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(s.x,s.y,rad*3,0,6.3); ctx.fill();
  }

  if (s.k === 'star'){
    sparkle(s.x, s.y, rad*2.1, time*7, k >= 3 ? '#ffffff' : '#fff2a8');
    if (k >= 2) sparkle(s.x, s.y, rad*1.2, -time*9, '#ffd76e');
  } else {
    ctx.fillStyle = T.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.3); ctx.fill();
    ctx.globalAlpha = .6; ctx.strokeStyle = T.dark; ctx.lineWidth = rad*0.32;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.3); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(s.x-rad*0.3, s.y-rad*0.32, rad*0.4, 0, 6.3); ctx.fill();
    // Lv3はキラキラをまとって飛ぶ
    if (k >= 3)
      sparkle(s.x + Math.cos(time*11)*rad*1.7, s.y + Math.sin(time*11)*rad*1.7, rad*0.55, time*6, '#ffffff');
  }
}

function render(){
  const W = COLS*CELL, H = ROWS*CELL;
  /* iOS は うらに まわった タブの canvas を すてることがある。もどってくると
     ctx の 変換が 1倍に もどっていて、DPR ぶん（さいだい2.5倍）小さい
     左上だけに ばんめんが えがかれ、のこりは 前の絵が こびりつく。
     resize() のときだけ かけていると 直せないので、まいフレーム かけなおす */
  /* 消すのは **canvas の 実寸で ぜんぶ**。W×H（CSSピクセル）で 消していたので、
     canvas の 大きさと W×H×DPR が ずれると **左上しか 消えず、
     古い絵が のこったまま 新しい絵だけ 小さく 左上に えがかれる**。
     （実機で これが おきて「キャラが 小さく 道を 外れて 歩く」に 見えた） */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (window.__dbg) window.__dbg._as = ['開始:' + ctx.getTransform().a];
  ctx.save();
  roundRect(0,0,W,H,20); ctx.clip();

  // 焼いておいた じめんを 貼る（角まるは 焼くときに入れてある）
  if (groundCv) ctx.drawImage(groundCv, 0, 0, W, H);
  if (window.__dbg) window.__dbg._as.push('じめん後:' + ctx.getTransform().a);
  drawBoardOverlay();
  if (window.__dbg) window.__dbg._as.push('ガイド後:' + ctx.getTransform().a);
  for (const t of towers){ drawTower(t);
    if (window.__dbg) window.__dbg._as.push(t.k + '後:' + ctx.getTransform().a); }
  if (window.__dbg) window.__dbg._as.push('タワー後:' + ctx.getTransform().a);
  nameRects.length = 0;                    // なまえの かさなり しらべは 1フレームごとに やりなおす
  for (const e of enemies) drawEnemy(e);
  for (const s of shots) drawShot(s);

  // 飛んでいくプレゼントキャンディ（行き先のワザの色でつつむ）
  for (const gf of gifts){
    const col = gf.it ? ITEM_BY_ID[gf.it].col : SKILLS.find(s => s.ch === gf.ch).color;
    const cr = CELL*0.16;
    ctx.save(); ctx.translate(gf.x, gf.y); ctx.rotate(gf.rot);
    ctx.fillStyle = col;
    for (const s2 of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s2*cr*0.8, 0);
      ctx.lineTo(s2*cr*1.5, -cr*0.6);
      ctx.lineTo(s2*cr*1.5,  cr*0.6);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(0, 0, cr, cr*0.78, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.ellipse(-cr*0.3, -cr*0.28, cr*0.34, cr*0.18, -0.5, 0, 6.3); ctx.fill();
    ctx.restore();
    sparkle(gf.x + CELL*0.16, gf.y - CELL*0.16, CELL*0.055, gf.rot*2, '#ffffff');
  }

  // ボーナスウェーブ：専用の夢見る背景に切りかえて、ふってくるおかしと のこりカウント
  if (bonus){
    const W2 = COLS*CELL, H2 = ROWS*CELL;
    // パステルの空（ステージの上にかぶせる、ここだけの景色）
    const bbg = ctx.createLinearGradient(0, 0, 0, H2);
    bbg.addColorStop(0,'rgba(255,214,236,.94)');
    bbg.addColorStop(0.5,'rgba(232,220,255,.94)');
    bbg.addColorStop(1,'rgba(255,246,224,.94)');
    ctx.fillStyle = bbg; ctx.fillRect(0, 0, W2, H2);
    // おおきなハートの光（まんなかにふんわり）
    const hg = ctx.createRadialGradient(W2/2, H2*0.45, 0, W2/2, H2*0.45, H2*0.42);
    hg.addColorStop(0,'rgba(255,255,255,.5)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W2, H2);
    // ゆっくりながれる雲
    for (let i=0;i<5;i++){
      const cx2 = ((time*10 + i*167) % (W2 + CELL*6)) - CELL*3;
      const cy2 = H2*(0.1 + (i*0.19) % 0.75);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#ffffff';
      for (const [dx,dy,r] of [[-1,0,.5],[0,-.3,.65],[1,0,.45],[0,.15,.75]]){
        ctx.beginPath();
        ctx.ellipse(cx2+dx*CELL*0.8, cy2+dy*CELL*0.5, CELL*r*1.15, CELL*r*0.58, 0, 0, 6.3);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // きらめき
    for (const s of sparks){
      ctx.globalAlpha = 0.5 + Math.sin(s.ph)*0.35;
      sparkle(s.x, s.y, s.r*1.3, s.ph*0.4, '#ffffff');
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (bonus.fail){
      // 「ざんねん〜」画面。おかしは消えていて、まんなかのカードだけが残る
      const bw = Math.min(W2*0.84, CELL*5.4), bh = CELL*2.7;
      const bx = (W2-bw)/2, by = H2*0.33;
      ctx.fillStyle = 'rgba(120,90,120,.18)';                 // 影は紫がかった半とうめい
      roundRect(bx, by + CELL*0.12, bw, bh, CELL*0.44); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.96)';
      roundRect(bx, by, bw, bh, CELL*0.44); ctx.fill();
      ctx.strokeStyle = '#ffd3e8'; ctx.lineWidth = CELL*0.07;
      roundRect(bx, by, bw, bh, CELL*0.44); ctx.stroke();
      // ぷるぷるさせて、止まって見えないようにする
      ctx.save();
      ctx.translate(W2/2, by + bh*0.36);
      ctx.rotate(Math.sin(time*7)*0.04);
      const sc = 1 + Math.sin(time*9)*0.03;
      ctx.scale(sc, 2 - sc);
      ctx.font = "800 " + (CELL*0.66) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      ctx.lineWidth = CELL*0.18; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
      ctx.strokeText('ざんねん〜', 0, 0);
      ctx.fillStyle = '#e05f9e';
      ctx.fillText('ざんねん〜', 0, 0);
      ctx.restore();
      ctx.font = "700 " + (CELL*0.3) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      ctx.fillStyle = '#b98ae0';
      ctx.fillText('お菓子を おとしちゃった…', W2/2, by + bh*0.68);
      ctx.fillText('ゲット ' + bonus.got + 'こ', W2/2, by + bh*0.88);
    } else {
      for (const it of bonus.items){
        ctx.save(); ctx.translate(it.x, it.y);
        ctx.rotate(Math.sin(it.ph)*0.25);
        ctx.font = (CELL*0.72) + 'px sans-serif';
        ctx.fillText(it.em, 0, 0);
        ctx.restore();
        sparkle(it.x + CELL*0.34, it.y - CELL*0.3, CELL*0.07, it.ph*2, '#ffffff');
      }
      const left = bonus.spawnLeft + bonus.items.length;
      const txt = '🎁 残り ' + left + 'こ';
      ctx.font = "800 " + (CELL*0.4) + "px 'Hiragino Maru Gothic ProN',sans-serif";
      ctx.lineWidth = CELL*0.12; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
      ctx.strokeText(txt, COLS*CELL/2, CELL*1.2);
      ctx.fillStyle = '#e05f9e';
      ctx.fillText(txt, COLS*CELL/2, CELL*1.2);
    }
  }

  // 応援パレード（なかまがふきだしつきで行進）
  for (const p of paraders){
    const bob = Math.abs(Math.sin(p.ph)) * CELL*0.18;
    ctx.drawImage(portraitOf(p.pid), p.x - 22, p.y - 22 - bob, 44, 44);
    if (p.msg){
      ctx.font = '800 ' + (CELL*0.28) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w2 = ctx.measureText(p.msg).width + CELL*0.4;
      const bx = p.x, by = p.y - CELL*1.05 - bob;
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      roundRect(bx - w2/2, by - CELL*0.26, w2, CELL*0.52, CELL*0.26); ctx.fill();
      ctx.strokeStyle = 'rgba(224,95,158,.4)'; ctx.lineWidth = 1.5;
      roundRect(bx - w2/2, by - CELL*0.26, w2, CELL*0.52, CELL*0.26); ctx.stroke();
      ctx.fillStyle = '#e05f9e';
      ctx.fillText(p.msg, bx, by);
    }
  }

  for (const p of parts){
    const k = 1 - p.age/p.life;
    ctx.globalAlpha = k;
    sparkle(p.x, p.y, p.r*k*1.6, p.rot, p.color);
  }
  ctx.globalAlpha = 1;
  for (const rg of rings){
    const k = rg.age/rg.life;
    ctx.globalAlpha = (1-k)*0.85;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = Math.max(1.5, CELL*0.1*(1-k));
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.3); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of floats){
    const k = f.age/f.life;
    ctx.globalAlpha = 1 - k*k;
    ctx.font = '800 ' + (CELL*0.42) + 'px system-ui,sans-serif';
    ctx.lineWidth = CELL*0.11; ctx.strokeStyle='#fff';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle=f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // お祝いの光芒（金色の光線がくるくる回る）
  if (celebT > 0){
    const a = Math.min(1, celebT) * 0.4;
    ctx.save();
    ctx.translate(W/2, H*0.42);
    ctx.rotate(time*0.6);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9a8';
    for (let i=0;i<12;i++){
      ctx.rotate(Math.PI/6);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0, 0, H*0.75, -0.09, 0.09);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,90,140,' + (flash*0.3) + ')';
    ctx.fillRect(0,0,W,H);
  }
  /* アイテムの ひかり。色を のせてから、まん中から わっかを ひろげる。
     まっ白に とばさないのは、どの アイテムを つかったかを 色で 見せたいため */
  if (iflash > 0){
    const W = COLS*CELL, H = ROWS*CELL;
    const rg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
    rg.addColorStop(0,   'rgba(' + iflashCol + ',' + (iflash*0.72) + ')');
    rg.addColorStop(0.55,'rgba(' + iflashCol + ',' + (iflash*0.38) + ')');
    rg.addColorStop(1,   'rgba(' + iflashCol + ',0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  if (iSweep > 0){
    const W = COLS*CELL, H = ROWS*CELL;
    const mx = Math.hypot(W, H) * 0.62;
    for (let i=0;i<3;i++){
      const t2 = iSweep - i*0.16;
      if (t2 <= 0) continue;
      ctx.strokeStyle = 'rgba(' + iflashCol + ',' + (t2*0.55) + ')';
      ctx.lineWidth = CELL*0.22*t2 + 2;
      ctx.beginPath(); ctx.arc(W/2, H/2, (1-t2)*mx, 0, 6.3); ctx.stroke();
    }
  }
  if (wflash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (wflash*0.7) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

/* ==========================================================
   じめんの焼きこみ

   じめんと道は うごかないので、1枚の絵に 1回だけ描いておいて
   毎フレーム 貼るだけにする。トッピングだけで110個あり、
   毎フレーム 描きなおすのは むだだから。
   ステージ・きせかえ・画面サイズが かわったときだけ 焼きなおす。
   ========================================================== */
let groundCv = null, groundKeyNow = '';

/* 焼くあいだだけ ctx を さしかえる。
   これまでの描画コードを 1行も変えずに 別の絵へ描けるようにするため */
function withCtx(g, fn){ const p = ctx; ctx = g; try{ fn(); } finally { ctx = p; } }

/* じめんの見た目が かわる条件。ここが変わったときだけ 焼きなおす */
/* 道の 形も 入れる。国・ます・DPR・周 だけだと、
   それらが 同じまま 道だけ 変わったときに 古い 道が 残る */
const groundKey = () => themeOf(wave).name + '/' + CELL + '/' + DPR + '/' + lapOf(wave)
                      + '/' + WAY.join(';');

function bakeGround(){
  const W = COLS*CELL, H = ROWS*CELL;
  if (!groundCv) groundCv = document.createElement('canvas');
  groundCv.width = Math.ceil(W*DPR); groundCv.height = Math.ceil(H*DPR);
  const g = groundCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  withCtx(g, () => {
    g.save();
    roundRect(0, 0, W, H, 20); g.clip();   // 角まるは 焼くときに入れておく
    drawGround();
    g.restore();
  });
  groundKeyNow = groundKey();
}

/* ==========================================================
   サイズ
   ========================================================== */
function resize(){
  const prevLen = pathLen;
  const appEl = document.getElementById('app');
  const wrapEl = document.getElementById('wrap');
  const hudEl = document.getElementById('hud');
  const w = Math.min(appEl.clientWidth - 20, 460);
  /* 盤面いがいが つかう 高さを **実際に はかる**。
     決めうちの 384 だと、UIを 足したり 文字の 大きさを 変えるたびに
     ここも 手で 直さないと ずれる（実際 --fs を 1.10に したとき 362→384 にした）。
     はかるのは「下の ブロックの 高さ」で、window.innerHeight では ない。
     ブロックの 高さは アドレスバーの 出入りで 変わらないので 安定している。
     （むかし ためして だめだったのは「はみ出し量」を はかる やりかた。
       あれは innerHeight が ゆれると いっしょに ゆれて、盤面が 縮み続けた）
     まだ レイアウトが できていない 起動直後は 0 に なるので、
     そのときだけ これまでの 384 を つかう */
  /* はかる あいだだけ パネルを ふだんの すがた（ショップバー）に もどす。
     タワーを えらぶと ショップが 情報カードに 入れかわって パネルが 高くなる。
     その 高さで はかると、タワーを 置いた とたんに 盤面が 縮む
     （実機で これが おきた。えらぶ・とじるで 盤面が びくびく 動くのも 防ぐ）。
     同期のうちに もどすので、画面が ちらつくことは ない */
  const infoWasOn = infoEl && infoEl.classList.contains('on');
  if (infoWasOn){ infoEl.classList.remove('on'); shopEl.style.display = ''; }
  let used = 0, shown = 0;
  for (const el of appEl.children){
    const st = getComputedStyle(el);
    // display:none の 画面は 場所も すきまも つくらないので 数えない
    if (st.display === 'none') continue;
    /* たまご・ショップ・おだいなどは position:absolute で 画面ぜんぶを 覆う。
       ながれの 外なので 場所を とらない。数えると、ひらいた とたんに
       盤面が つぶれる（そして 閉じても もどらない） */
    if (st.position === 'absolute' || st.position === 'fixed') continue;
    shown++;
