  /* ================= 4本あしの けもの =================
     ネコもイヌもクマも 骨ぐみは おなじ。
     みみ・しっぽ・はなさき・もよう・ずんぐり具合 で 見わける。
     じっさいの動物も そこで 見わけているので、これで 別の種になる。
     o.ear   : みみの形   o.tail : しっぽの形
     o.snout : はなさき   o.mark : もよう   o.stout: からだの ずんぐり
     o.mane  : たてがみ   o.horn : つの     o.trunk: はな（ゾウ） */

  quad: (g,S,x,y,r,c,m,c2,rc) => {
    const o = (rc && rc.opt) || {};
    const st = o.stout === undefined ? 1 : o.stout;   // 1=ふつう 1.3=ずんぐり 0.8=すらり
    const nk = o.neck || 0;                           // 首の長さ（キリンなど）
    y = y + r*nk*0.5;                                 // 首のぶん からだを 下げる（鳥と おなじ考え）
    const hx = x + r*(0.72 + nk*0.22), hy = y - r*(0.42 + nk);   // あたまの ばしょ
    // ふとい体は あたまを のみこむ。かおの ばしょは 動かせないので からだを 左へ にがす
    const ox = x - r*(o.headOut || 0);
    x = ox;
    const ac = c2 || c, dk = o.dark || 'rgba(90,70,110,.28)';

    // --- しっぽ（さきに 描いて うしろに まわす）
    g.fillStyle = c;
    if (o.tail === 'bushy'){                          // キツネ・リスの ふさふさ
      g.beginPath();
      g.moveTo(x-r*0.58,y+r*0.1);
      g.bezierCurveTo(x-r*1.5,y+r*0.1, x-r*1.6,y-r*0.9, x-r*0.9,y-r*1.0);
      g.bezierCurveTo(x-r*1.24,y-r*0.6, x-r*1.06,y-r*0.14, x-r*0.5,y+r*0.44);
      g.closePath(); g.fill();
      g.fillStyle = ac;
      g.beginPath(); g.ellipse(x-r*0.98,y-r*0.94,r*0.22,r*0.18,0.3,0,GTAU); g.fill();
    } else if (o.tail === 'long'){                    // ネコ・ヒョウの ながい しっぽ
      g.strokeStyle = c; g.lineWidth = r*0.15; g.lineCap='round';
      g.beginPath();
      g.moveTo(x-r*0.62,y+r*0.16);
      g.bezierCurveTo(x-r*1.3,y+r*0.16, x-r*1.34,y-r*0.6, x-r*0.94,y-r*0.86);
      g.stroke();
    } else if (o.tail === 'puff'){                    // ウサギの まるい しっぽ
      g.beginPath(); g.arc(x-r*0.72,y+r*0.16,r*0.24,0,GTAU); g.fill();
    } else if (o.tail === 'tuft'){                    // ライオン・ウシの ふさ つき
      g.strokeStyle = c; g.lineWidth = r*0.1; g.lineCap='round';
      g.beginPath();
      g.moveTo(x-r*0.62,y+r*0.06);
      g.quadraticCurveTo(x-r*1.24,y-r*0.1, x-r*1.16,y-r*0.6); g.stroke();
      g.fillStyle = o.tuftC || ac;
      g.beginPath(); g.ellipse(x-r*1.16,y-r*0.72,r*0.16,r*0.22,0,0,GTAU); g.fill();
    } else if (o.tail === 'curl'){                    // ブタの くるん
      g.strokeStyle = c; g.lineWidth = r*0.09; g.lineCap='round';
      g.beginPath();
      g.moveTo(x-r*0.6,y+r*0.02);
      g.bezierCurveTo(x-r*1.0,y-r*0.1, x-r*0.86,y-r*0.5, x-r*1.1,y-r*0.42);
      g.stroke();
    } else if (o.tail === 'short'){                   // クマ・パンダの みじかい
      g.beginPath(); g.arc(x-r*0.68,y+r*0.06,r*0.16,0,GTAU); g.fill();
    } else if (o.tail === 'thick'){                   // カンガルーの ふとい しっぽ
      g.beginPath();
      g.moveTo(x-r*0.5,y+r*0.1);
      g.bezierCurveTo(x-r*1.3,y+r*0.3, x-r*1.5,y+r*0.9, x-r*1.36,y+r*1.06);
      g.bezierCurveTo(x-r*1.2,y+r*0.66, x-r*0.9,y+r*0.6, x-r*0.44,y+r*0.6);

    g.fillStyle = c;
    if (o.legs === 'hop'){                            // カンガルー：うしろあしが 大きい
      g.beginPath(); g.ellipse(x-r*0.24, y+r*0.86, r*0.46, r*0.24, -0.16, 0, GTAU); g.fill();
      g.beginPath(); g.ellipse(x-r*0.06, y+r*0.5, r*0.28, r*0.4, -0.2, 0, GTAU); g.fill();
      g.beginPath(); g.ellipse(x+r*0.4, y+r*0.36, r*0.11, r*0.22, -0.3, 0, GTAU); g.fill();
    } else {
      const LG = o.shortLeg
        ? [[-0.44,0.62,0.19,0.26],[-0.12,0.66,0.18,0.22],[0.42,0.64,0.19,0.24],[0.74,0.66,0.18,0.2]]
        : [[-0.44,0.7,0.17,0.34],[-0.12,0.74,0.16,0.3],[0.42,0.72,0.17,0.32],[0.74,0.74,0.16,0.28]];
      for (const [dx,dy,w,h] of LG){
        g.beginPath(); g.ellipse(x+r*dx, y+r*dy, r*w, r*h, 0,0,GTAU); g.fill();
      }
      if (o.hoof){                                    // ひづめ（ブタ・ウシ・シカ）
        g.fillStyle = o.hoof;
        for (const [dx,dy,w,h] of LG){
          g.beginPath(); g.ellipse(x+r*dx, y+r*(dy+h*0.62), r*w*0.9, r*h*0.3, 0,0,GTAU); g.fill();
        }
        g.fillStyle = c;
      }
    }
    // --- どうたい
    if (o.legs === 'hop'){                            // カンガルーは たてに 長い体
      g.beginPath(); g.ellipse(x+r*0.1, y+r*0.16, r*0.5, r*0.66, -0.08, 0, GTAU); g.fill();
      g.fillStyle = o.pouchC || 'rgba(255,255,255,.4)';   // おなかの ふくろ
      g.beginPath(); g.ellipse(x+r*0.3, y+r*0.32, r*0.26, r*0.3, -0.1, 0, GTAU); g.fill();
      g.fillStyle = c;
    } else {
      const bh = o.flat === undefined ? st : o.flat;   // よこ長の 体（カバ・サイ）
      g.beginPath(); g.ellipse(x+r*0.06, y+r*0.24, r*0.78*st, r*0.5*bh, -0.04, 0, GTAU); g.fill();

      g.beginPath();
      g.moveTo(x+r*0.42, y-r*0.16);

      g.lineTo(x+r*0.78, y-r*0.1); g.closePath(); g.fill();

                small:[0.4,0.38,0], long:[0.56,0.42,0.1], flat:[0.54,0.44,0],
                boxy:[0.58,0.46,0] }[o.head || 'round'];
    g.beginPath(); g.ellipse(hx, hy, r*H[0], r*H[1], H[2], 0, GTAU); g.fill();
    if (o.head === 'boxy'){                           // ウシ：あごが 四角い
      gRR(g, hx-r*0.3, hy+r*0.1, r*0.9, r*0.5, r*0.14); g.fill();
    }
    if (o.ruff){                                      // オオカミ：くびの まわりの けば
      g.fillStyle = o.ruffC || c2 || c;
      for (let i=0;i<7;i++){
        const a2 = Math.PI*(0.42 + i*0.16);
        g.beginPath();
        g.arc(hx+Math.cos(a2)*r*0.5, hy+Math.sin(a2)*r*0.48, r*0.17, 0, GTAU); g.fill();
      }
      g.fillStyle = c;
      g.beginPath(); g.ellipse(hx, hy, r*H[0], r*H[1], H[2], 0, GTAU); g.fill();
    }
    if (o.faceRing){                                  // サル：かおの まわりだけ 色がちがう
      g.fillStyle = o.faceRing;
      g.beginPath(); g.ellipse(hx+r*0.06, hy+r*0.04, r*0.38, r*0.36, 0, 0, GTAU); g.fill();
      g.fillStyle = c;
    }
    if (o.nose){                                      // コアラ：大きな はな
      g.fillStyle = o.noseC || '#4a4450';
      g.beginPath(); g.ellipse(hx+r*0.22, hy+r*0.14, r*0.17, r*0.22, 0, 0, GTAU); g.fill();
      g.fillStyle = c;
    }
    if (o.whisker){                                   // アザラシ・カワウソ：ひげ
      g.strokeStyle = o.whiskerC || 'rgba(255,255,255,.85)';
      g.lineWidth = r*0.035; g.lineCap='round';
      for (let i=-1;i<=1;i++){
        g.beginPath();
        g.moveTo(hx+r*0.28, hy+r*0.16);
        g.lineTo(hx+r*0.86, hy+r*(0.06+i*0.16)); g.stroke();
      }
    }
    if (o.claw){                                      // ナマケモノ：ながい つめ
      g.strokeStyle = o.clawC || '#6b5a48'; g.lineWidth = r*0.06; g.lineCap='round';
      for (const [cx2,cy2] of [[-0.44,0.86],[0.42,0.88]])
        for (let i=-1;i<=1;i++){
          g.beginPath();
          g.moveTo(x+r*cx2, y+r*cy2);
          g.lineTo(x+r*(cx2+i*0.1), y+r*(cy2+0.34)); g.stroke();
        }
    }
    if (o.horn === 'ossicone'){                       // キリンの つの
      g.fillStyle = o.hornC || '#8a6440';
      for (const s2 of [-1,1]){
        g.beginPath(); g.ellipse(hx+s2*r*0.16, hy-r*0.5, r*0.06, r*0.16, 0,0,GTAU); g.fill();
        g.beginPath(); g.arc(hx+s2*r*0.16, hy-r*0.62, r*0.08, 0, GTAU); g.fill();
      }
      g.fillStyle = c;
    } else if (o.horn === 'rhino'){                   // サイの つの
      // ベジェで 三かくを 作ると 板に 見えるので、だんだん 小さくなる 丸を ならべて 円すいに する
      const cone = (bx,by,ex,ey,w) => {
        for (let i=0;i<=16;i++){
          const t=i/16;
          const px = bx + (ex-bx)*t - Math.sin(t*2.4)*r*0.1;   // すこし そらす
          const py = by + (ey-by)*t;
          g.beginPath(); g.arc(px, py, r*w*(1-t*0.92), 0, GTAU); g.fill();

      };
      const nx = hx + r*0.56, ny = hy + r*0.36;       // 鼻さきが つのの ねもと
      g.fillStyle = o.hornC || '#f2e8d4';
      cone(nx, ny, nx + r*0.3, ny - r*1.06, 0.24);
      g.fillStyle = 'rgba(255,255,255,.4)';           // 前がわの てり
      cone(nx + r*0.08, ny - r*0.06, nx + r*0.32, ny - r*1.0, 0.1);
      g.fillStyle = o.hornC || '#f2e8d4';
      cone(hx + r*0.14, hy - r*0.1, hx + r*0.24, hy - r*0.62, 0.14);   // うしろの 小さい つの
      g.strokeStyle = 'rgba(120,105,130,.4)'; g.lineWidth = r*0.05;    // 皮ふの ひだ
      g.beginPath(); g.moveTo(x-r*0.1, y-r*0.2);
      g.quadraticCurveTo(x-r*0.24, y+r*0.24, x-r*0.06, y+r*0.62); g.stroke();
      g.beginPath(); g.moveTo(x+r*0.34, y-r*0.22);
      g.quadraticCurveTo(x+r*0.24, y+r*0.24, x+r*0.38, y+r*0.64); g.stroke();
      g.fillStyle = c;
    } else if (o.horn === 'goat'){                    // ヤギの つの と あごひげ

        g.moveTo(hx+s2*r*0.24, hy-r*0.36);
        g.quadraticCurveTo(hx+s2*r*0.44, hy-r*0.86, hx+s2*r*0.2, hy-r*0.9);

        g.moveTo(hx+s2*r*0.1, hy-r*0.38);
        g.lineTo(hx+s2*r*0.5, hy-r*0.34); g.lineTo(hx+s2*r*0.3, hy-r*0.86);
        g.closePath(); g.fill(); });
      g.fillStyle = o.earIn || '#ffc2d4';
      ear(s2 => { g.beginPath();
        g.moveTo(hx+s2*r*0.18, hy-r*0.4);
        g.lineTo(hx+s2*r*0.4, hy-r*0.38); g.lineTo(hx+s2*r*0.29, hy-r*0.68);
        g.closePath(); g.fill(); });
      g.fillStyle = c;
    } else if (o.ear === 'round'){                    // クマ・パンダ・ネズミ
      const ek = o.earK || 1;
      ear(s2 => { g.beginPath(); g.arc(hx+s2*r*0.4, hy-r*0.4, r*0.2*ek, 0, GTAU); g.fill(); });
      if (o.earC){ g.fillStyle=o.earC;
        ear(s2 => { g.beginPath(); g.arc(hx+s2*r*0.4, hy-r*0.42, r*0.12*ek, 0, GTAU); g.fill(); });
        g.fillStyle=c; }
    } else if (o.ear === 'long'){                     // ウサギ
      ear(s2 => { g.save(); g.translate(hx+s2*r*0.2, hy-r*0.66); g.rotate(s2*0.2);
        g.beginPath(); g.ellipse(0,0,r*0.15,r*0.5,0,0,GTAU); g.fill();
        g.fillStyle = o.earIn || '#ffc2d4';
        g.beginPath(); g.ellipse(0,r*0.04,r*0.07,r*0.36,0,0,GTAU); g.fill();
        g.fillStyle = c; g.restore(); });
    } else if (o.ear === 'droop'){                    // イヌ（たれみみ）
      ear(s2 => { g.beginPath();
        g.ellipse(hx+s2*r*0.5, hy-r*0.04, r*0.18, r*0.34, s2*0.3, 0, GTAU); g.fill(); });
    } else if (o.ear === 'pigflop'){                  // ブタ：あたまより 大きい たれみみ
      ear(s2 => { g.beginPath();
        g.moveTo(hx+s2*r*0.02, hy-r*0.5);
        g.quadraticCurveTo(hx+s2*r*0.66, hy-r*0.96, hx+s2*r*0.62, hy-r*0.18);
        g.quadraticCurveTo(hx+s2*r*0.44, hy-r*0.36, hx+s2*r*0.0, hy-r*0.28);
        g.closePath(); g.fill(); });
      g.fillStyle = o.earIn || 'rgba(255,175,200,.8)';
      ear(s2 => { g.beginPath();
        g.moveTo(hx+s2*r*0.12, hy-r*0.48);
        g.quadraticCurveTo(hx+s2*r*0.54, hy-r*0.82, hx+s2*r*0.5, hy-r*0.28);
        g.closePath(); g.fill(); });
      g.strokeStyle = 'rgba(190,120,145,.4)'; g.lineWidth = r*0.04;
      ear(s2 => { g.beginPath();
        g.moveTo(hx+s2*r*0.02, hy-r*0.5);
        g.quadraticCurveTo(hx+s2*r*0.66, hy-r*0.96, hx+s2*r*0.62, hy-r*0.18); g.stroke(); });
      g.fillStyle = c;
    } else if (o.ear === 'big'){                      // ゾウ（みみが 体より 目だつ）

        g.beginPath();
        g.ellipse(hx+s2*r*0.6, hy-r*0.06, r*0.52, r*0.6, s2*0.24, 0, GTAU); g.fill();
        g.fillStyle = o.earIn || 'rgba(255,255,255,.3)';
        g.beginPath();
        g.ellipse(hx+s2*r*0.62, hy-r*0.04, r*0.34, r*0.4, s2*0.24, 0, GTAU); g.fill();
        g.fillStyle = c;
      });
    } else if (o.ear === 'horse'){                    // ウマ・シマウマ（ほそ長い たてみみ）
      ear(s2 => { g.save(); g.translate(hx+s2*r*0.26, hy-r*0.5); g.rotate(s2*0.24);

        g.fillStyle = o.earIn || 'rgba(255,255,255,.35)';
        g.beginPath(); g.ellipse(0,r*0.02,r*0.055,r*0.2,0,0,GTAU); g.fill();
        g.fillStyle = c; g.restore(); });

        g.moveTo(hx+s2*r*0.12, hy-r*0.36);
        g.quadraticCurveTo(hx+s2*r*0.56, hy-r*0.98, hx+s2*r*0.38, hy-r*0.3);
        g.closePath(); g.fill(); });
    }

    // --- つの
    if (o.horn === 'antler'){                         // シカ
      g.strokeStyle = o.hornC || '#b98a5a'; g.lineWidth=r*0.07; g.lineCap='round';
      ear(s2 => {

      g.fillStyle = 'rgba(255,255,255,.4)';
      g.beginPath(); g.ellipse(hx+r*0.36, hy+r*0.06, r*0.18, r*0.07, 0,0,GTAU); g.fill();
      g.fillStyle = 'rgba(150,90,110,.65)';

  /* ================= そら（鳥）=================
     くちばし・とさか・しっぽ・首の長さ・つばさ で 見わける */

  fowl: (g,S,x,y,r,c,m,c2,rc) => {
    const o=(rc&&rc.opt)||{}, ac=c2||c, beakC=o.beakC||'#ffb43f';
    const neck = o.neck || 0;                        // 首の長さ
    // 首が長い子は からだごと 下へさげる。でないと あたまが 上で切れる
    y = y + r*neck*0.62;
    const hx = x + r*0.24, hy = y - r*(0.52 + neck);
    g.strokeStyle = o.legC || beakC; g.lineWidth = r*(o.longLeg?0.07:0.09); g.lineCap='round';
    for (const s2 of [-1,1]){                        // あし

    }
    g.fillStyle = c;
    if (o.tail === 'fan'){                           // クジャク・ハトの ひろがる尾
      for (let i=-2;i<=2;i++){
        g.save(); g.translate(x-r*0.5,y+r*0.1); g.rotate(i*0.22+0.1);
        g.beginPath(); g.ellipse(-r*0.6,0,r*0.62,r*0.14,0,0,GTAU); g.fill();
        g.restore();
      }

      g.beginPath();
      g.moveTo(x-r*0.4,y+r*0.1);
      g.lineTo(x-r*1.5,y-r*0.34); g.lineTo(x-r*1.0,y+r*0.24);
      g.lineTo(x-r*1.44,y+r*0.68); g.closePath(); g.fill();
    } else if (o.tail === 'long'){                   // ハチドリ・インコの ながい尾
      g.beginPath();
      g.moveTo(x-r*0.4,y+r*0.06);
      g.lineTo(x-r*1.66,y+r*0.34); g.lineTo(x-r*0.42,y+r*0.42); g.closePath(); g.fill();
    } else {                                         // ふつうの みじかい尾

      g.stroke();
    } else if (neck > 0){                            // 首
      g.beginPath();
      g.moveTo(x+r*0.04,y-r*0.3);
      g.quadraticCurveTo(hx-r*0.1, hy+r*0.3, hx-r*0.02, hy+r*0.1);
      g.lineTo(hx+r*0.28, hy+r*0.14);
      g.quadraticCurveTo(hx+r*0.2, hy+r*0.5, x+r*0.4,y-r*0.24);
      g.closePath(); g.fill();
    }
    if (o.wing !== false){                           // たたんだ つばさ
      g.fillStyle = ac;
      g.beginPath(); g.ellipse(x-r*0.1,y+r*0.16,r*0.46,r*0.3,-0.24,0,GTAU); g.fill();
      g.strokeStyle='rgba(110,90,120,.28)'; g.lineWidth=r*0.04;
      for (let i=0;i<3;i++){
        g.beginPath();

    g.fillStyle = o.headC || c;                      // あたまだけ 色をかえる子（ハクトウワシ）
    g.beginPath(); g.ellipse(hx, hy, r*0.42, r*0.4, 0, 0, GTAU); g.fill();

      g.beginPath();
      g.moveTo(hx-r*0.3, hy+r*0.2); g.lineTo(hx+r*0.3, hy+r*0.24);

      g.lineTo(x, y-r*0.3);
      g.quadraticCurveTo(hx-r*0.14, hy+r*0.6, hx-r*0.3, hy+r*0.2);
      g.closePath(); g.fill();

    g.fillStyle = c;
    if (o.crest === 'spike'){                        // インコ・オウムの とさか
      g.fillStyle = o.crestC || ac;
      for (let i=-1;i<=1;i++){

    g.fillStyle = beakC;                             // くちばし

      g.lineTo(hx+r*0.22,hy+r*0.16); g.closePath(); g.fill();

      g.moveTo(hx+r*0.28,hy-r*0.08); g.lineTo(hx+r*0.72,hy+r*0.06);
      g.lineTo(hx+r*0.28,hy+r*0.2); g.closePath(); g.fill();
    }
    if (o.knob){                                     // ハクチョウ：くちばしの つけねの 黒い こぶ
      g.fillStyle = o.knob;
      g.beginPath(); g.ellipse(hx+r*0.26, hy-r*0.06, r*0.13, r*0.15, 0,0,GTAU); g.fill();
    }
    if (o.mark === 'belly'){
      g.fillStyle = o.markC || 'rgba(255,255,255,.7)';
      g.beginPath(); g.ellipse(x+r*0.12,y+r*0.4,r*0.44,r*0.26,0,0,GTAU); g.fill();
    }
  },

  /* ================= そら（むし）=================

  bug: (g,S,x,y,r,c,m,c2,rc) => {
    const o=(rc&&rc.opt)||{}, ac=c2||c;

      }
    }
    g.strokeStyle = o.legC || '#5b4a3e'; g.lineWidth = r*0.05; g.lineCap='round';
    for (const s2 of [-1,1]) for (let i=0;i<3;i++){  // あし6本

  /* ================= ゆめの生きもの =================
     人がたは 土台を ひとつにして、わっか・つの・はね・おめん・ひげ・
     さかなの尾 などで 見わける */

  hero: (g,S,x,y,r,c,m,c2,rc) => {

        g.beginPath();
        g.moveTo(x+s2*r*0.3,y-r*0.2);
        g.bezierCurveTo(x+s2*r*1.4,y-r*1.1, x+s2*r*1.32,y+r*0.16, x+s2*r*0.9,y+r*0.42);
        g.bezierCurveTo(x+s2*r*0.9,y+r*0.06, x+s2*r*0.6,y-r*0.06, x+s2*r*0.32,y-r*0.14);
        g.closePath(); g.fill();
      }
    } else if (o.wing === 'bat'){
      g.fillStyle=o.wingC||'#6b3a5a';
      for (const s2 of [-1,1]){
        g.beginPath();
        g.moveTo(x+s2*r*0.3,y-r*0.24);
        g.lineTo(x+s2*r*1.3,y-r*0.8); g.lineTo(x+s2*r*1.1,y-r*0.16);
        g.lineTo(x+s2*r*1.28,y+r*0.26); g.lineTo(x+s2*r*0.9,y+r*0.06);
        g.lineTo(x+s2*r*1.0,y+r*0.5); g.lineTo(x+s2*r*0.34,y+r*0.16);
        g.closePath(); g.fill();
      }
    }
    // --- あし または さかなの尾
    if (o.tail === 'fish'){
      g.fillStyle = ac;
      g.beginPath();
      g.moveTo(x-r*0.3,y+r*0.2);
      g.bezierCurveTo(x-r*0.6,y+r*0.9, x-r*0.1,y+r*1.1, x+r*0.16,y+r*1.06);
      g.bezierCurveTo(x+r*0.4,y+r*0.7, x+r*0.34,y+r*0.4, x+r*0.3,y+r*0.2);
      g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(x+r*0.02,y+r*1.0);
      g.quadraticCurveTo(x-r*0.6,y+r*1.2, x-r*0.72,y+r*1.5);
      g.quadraticCurveTo(x+r*0.02,y+r*1.3, x+r*0.7,y+r*1.5);
      g.quadraticCurveTo(x+r*0.5,y+r*1.16, x+r*0.02,y+r*1.0);
      g.closePath(); g.fill();
    } else {
      g.fillStyle = o.legC || c;
      for (const s2 of [-1,1]){
        gRR(g, x+s2*r*0.22-r*0.11, y+r*0.7, r*0.22, r*0.56, r*0.08); g.fill();
      }
      g.fillStyle = o.shoeC || '#5b4a5e';
      for (const s2 of [-1,1]){
        g.beginPath(); g.ellipse(x+s2*r*0.24, y+r*1.28, r*0.19, r*0.1, 0,0,GTAU); g.fill();
      }
    }
    // --- からだ（ローブ か 服）
    g.fillStyle = c;
    if (o.robe){
      g.beginPath();
      g.moveTo(x-r*0.28,y-r*0.2); g.lineTo(x+r*0.28,y-r*0.2);
      g.lineTo(x+r*0.66,y+r*1.06); g.lineTo(x-r*0.66,y+r*1.06);
      g.closePath(); g.fill();
    } else {
      gRR(g, x-r*0.36, y-r*0.22, r*0.72, r*1.0, r*0.14); g.fill();
    }
    if (o.sash){ g.fillStyle=o.sash; gRR(g, x-r*0.4, y+r*0.3, r*0.8, r*0.14, r*0.06); g.fill(); }
    // --- うで
    g.strokeStyle = o.sleeve || skin; g.lineWidth = r*0.14; g.lineCap='round';
    for (const s2 of [-1,1]){
      g.beginPath(); g.moveTo(x+s2*r*0.34,y-r*0.06); g.lineTo(x+s2*r*0.52,y+r*0.34); g.stroke();
    }
    // --- つえ
    if (o.staff){
      g.strokeStyle=o.staffC||'#b98a5a'; g.lineWidth=r*0.08;
      g.beginPath(); g.moveTo(x+r*0.56,y+r*0.5); g.lineTo(x+r*0.66,y-r*0.9); g.stroke();
      g.fillStyle=o.gemC||'#8fe3c4';
      g.beginPath(); g.arc(x+r*0.67,y-r*1.0,r*0.18,0,GTAU); g.fill();
    }
    // --- あたま
    g.fillStyle = skin;
    g.beginPath(); g.arc(x, y-r*0.54, r*0.38, 0, GTAU); g.fill();
    if (o.mask){                                      // にんじゃの おめん
      g.fillStyle = o.maskC || c;
      g.beginPath(); g.arc(x, y-r*0.54, r*0.4, 0, GTAU); g.fill();
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(x, y-r*0.56, r*0.32, r*0.16, 0,0,GTAU); g.fill();
    } else if (o.hair){                               // かみ
      g.fillStyle = o.hair;
      g.beginPath(); g.arc(x, y-r*0.6, r*0.44, Math.PI*1.02, Math.PI*1.98); g.fill();
      if (o.longHair) for (const s2 of [-1,1]){
        g.beginPath();
        g.moveTo(x+s2*r*0.4,y-r*0.66);
        g.bezierCurveTo(x+s2*r*0.66,y-r*0.1, x+s2*r*0.52,y+r*0.34, x+s2*r*0.3,y+r*0.28);
        g.bezierCurveTo(x+s2*r*0.4,y-r*0.1, x+s2*r*0.3,y-r*0.4, x+s2*r*0.22,y-r*0.62);
        g.closePath(); g.fill();
      }
    }
    if (o.beard){                                     // ながい ひげ
      g.fillStyle = o.beard;
      g.beginPath();
      g.moveTo(x-r*0.26,y-r*0.36);
      g.quadraticCurveTo(x, y+r*0.7, x+r*0.26,y-r*0.36);
      g.quadraticCurveTo(x, y-r*0.16, x-r*0.26,y-r*0.36);
      g.closePath(); g.fill();
    }
    if (o.horns){                                     // あくまの つの
      g.fillStyle = o.hornC || '#c9506a';
      for (const s2 of [-1,1]){
        g.beginPath();
        g.moveTo(x+s2*r*0.2,y-r*0.84); g.lineTo(x+s2*r*0.42,y-r*1.3);
        g.lineTo(x+s2*r*0.4,y-r*0.78); g.closePath(); g.fill();
      }
    }
    if (o.halo){                                      // てんしの わっか
      g.strokeStyle = o.haloC || '#ffe27a'; g.lineWidth = r*0.09;
      g.beginPath(); g.ellipse(x, y-r*1.12, r*0.32, r*0.1, 0, 0, GTAU); g.stroke();
    }
    if (o.hat === 'wizard'){                          // まほうつかいの ぼうし
      g.fillStyle = o.hatC || c;
      g.beginPath(); g.ellipse(x, y-r*0.88, r*0.7, r*0.16, 0,0,GTAU); g.fill();
      g.beginPath();
      g.moveTo(x-r*0.4,y-r*0.9);
      g.bezierCurveTo(x-r*0.16,y-r*1.7, x+r*0.16,y-r*1.9, x+r*0.42,y-r*1.86);
      g.lineTo(x+r*0.4,y-r*0.9); g.closePath(); g.fill();
    } else if (o.hat === 'ice'){                      // ゆきのじょおうの かんむり
      g.fillStyle = o.hatC || '#cfeaff';
      for (let i=-2;i<=2;i++){
        g.beginPath();
        g.moveTo(x+r*i*0.2-r*0.07, y-r*0.84);
        g.lineTo(x+r*i*0.2, y-r*(1.16+0.16*(1-Math.abs(i)*0.4)));
        g.lineTo(x+r*i*0.2+r*0.07, y-r*0.84); g.closePath(); g.fill();
      }
    }
  },

  kanga: (g,S,x,y,r,c,m,c2,rc) => {               // カンガルー（たてに 立つので 4本あしの型を つかわない）
    const o = (rc && rc.opt) || {};
    const ac = c2 || c, bel = o.bellyC || 'rgba(255,240,224,.6)';
    y = y + r*0.55;                                // たてに 長いぶん 下げないと みみが 切れる
    g.fillStyle = ac;
    g.beginPath();                                // ふとい しっぽ（体を ささえる）
    g.moveTo(x-r*0.3,y+r*0.36);
    g.bezierCurveTo(x-r*1.06,y+r*0.5, x-r*1.42,y+r*0.92, x-r*1.3,y+r*1.04);
    g.bezierCurveTo(x-r*1.1,y+r*0.8, x-r*0.66,y+r*0.8, x-r*0.2,y+r*0.8);
    g.closePath(); g.fill();
    g.fillStyle = c;
    g.beginPath();                                // うしろあし（L字に おれた 大きい あし）
    g.moveTo(x-r*0.24,y+r*0.18);
    g.bezierCurveTo(x-r*0.6,y+r*0.5, x-r*0.5,y+r*0.94, x-r*0.16,y+r*0.96);
    g.lineTo(x+r*0.62,y+r*0.96);
    g.bezierCurveTo(x+r*0.74,y+r*0.96, x+r*0.74,y+r*0.72, x+r*0.6,y+r*0.72);
    g.lineTo(x+r*0.16,y+r*0.72);
    g.bezierCurveTo(x+r*0.2,y+r*0.4, x+r*0.14,y+r*0.16, x-r*0.24,y+r*0.18);
    g.closePath(); g.fill();
    g.beginPath();                                // どうたい（上に いくほど ほそい なす形）
    g.moveTo(x-r*0.46,y+r*0.34);
    g.bezierCurveTo(x-r*0.6,y-r*0.3, x-r*0.26,y-r*0.72, x+r*0.04,y-r*0.74);
    g.bezierCurveTo(x+r*0.36,y-r*0.72, x+r*0.5,y-r*0.24, x+r*0.42,y+r*0.3);
    g.bezierCurveTo(x+r*0.34,y+r*0.6, x-r*0.36,y+r*0.6, x-r*0.46,y+r*0.34);
    g.closePath(); g.fill();
    g.fillStyle = bel;                            // おなかの ふくろ
    g.beginPath();
    g.ellipse(x+r*0.14, y+r*0.24, r*0.28, r*0.3, -0.1, 0, GTAU); g.fill();
    g.strokeStyle = 'rgba(120,90,60,.3)'; g.lineWidth = r*0.045;
    g.beginPath(); g.arc(x+r*0.14, y+r*0.24, r*0.29, -1.2, 1.6); g.stroke();
    g.fillStyle = c;
    g.beginPath();                                // みじかい 前あし（むねの 前で そろえる）
    g.ellipse(x+r*0.34,y-r*0.16,r*0.1,r*0.22,-0.5,0,GTAU); g.fill();
    g.ellipse(x+r*0.18,y-r*0.08,r*0.1,r*0.2,-0.4,0,GTAU); g.fill();
    g.beginPath();                                // くび と あたま（うえ向きに のびる）
    g.moveTo(x-r*0.1,y-r*0.62); g.lineTo(x+r*0.28,y-r*0.62);
    g.lineTo(x+r*0.36,y-r*1.0); g.lineTo(x-r*0.02,y-r*1.0);
    g.closePath(); g.fill();
    const hx = x+r*0.22, hy = y-r*1.16;
    g.beginPath(); g.ellipse(hx, hy, r*0.44, r*0.36, 0.1, 0, GTAU); g.fill();
    g.beginPath();                                // はな先が ながい（シカに にた かお）
    g.ellipse(hx+r*0.4, hy+r*0.14, r*0.24, r*0.17, 0.16, 0, GTAU); g.fill();
    g.fillStyle = '#4a4450';
    g.beginPath(); g.ellipse(hx+r*0.58, hy+r*0.08, r*0.08, r*0.07, 0,0,GTAU); g.fill();
    g.fillStyle = c;
    for (const s2 of [-1,1]){                     // ながい みみ
      g.save(); g.translate(hx-r*0.06+s2*r*0.16, hy-r*0.48); g.rotate(s2*0.26);
      g.beginPath(); g.ellipse(0,0,r*0.14,r*0.36,0,0,GTAU); g.fill();
      g.fillStyle = o.earIn || '#ffc2d4';
      g.beginPath(); g.ellipse(0,r*0.03,r*0.07,r*0.26,0,0,GTAU); g.fill();
      g.fillStyle = c; g.restore();
    }
  },

  ghost: (g,S,x,y,r,c,m,c2,rc) => {                   // おばけ
    const o = (rc && rc.opt) || {};
    // 左右対称の すそだと「ふきだし」に 見える。
    // からだは まめ型、下は **右がわ だけ** ひらひらと ながれる 形に する。
    // しっぽは 胴と ひとつづきの 線で 描く。太い線で 引くと ずんぐりして、
    // 胴に くっつけた べつの ものに 見えてしまう
    const P = (px,py) => [x+r*px, y+r*py];
    const bz = (c1x,c1y,c2x,c2y,ex,ey) =>
      g.bezierCurveTo(x+r*c1x, y+r*c1y, x+r*c2x, y+r*c2y, x+r*ex, y+r*ey);
    g.fillStyle = c;
    g.save(); g.translate(x-r*0.86, y+r*0.06); g.rotate(0.3);   // 左の て
    g.beginPath(); gRR(g, -r*0.2, -r*0.16, r*0.34, r*0.36, r*0.14); g.fill();
    g.restore();
    g.beginPath();
    g.moveTo(...P(-0.12, -1.15));
    bz( 0.62,-1.12,  0.86,-0.6,   0.8, -0.05);      // 右がわ
    bz( 0.78, 0.26,  0.72, 0.4,   0.62, 0.52);
    bz( 0.86, 0.28,  1.12, 0.3,   1.18, 0.56);      // しっぽ：うわがわ
    bz( 1.24, 0.76,  1.32, 0.78,  1.4,  0.62);      // 先の くるん
    bz( 1.5,  0.88,  1.3,  1.02,  1.14, 0.86);
    bz( 1.04, 0.74,  1.0,  0.72,  0.94, 0.82);      // しっぽ：したがわ
    bz( 0.86, 0.96,  0.7,  1.0,   0.5,  0.96);
    bz( 0.2,  1.14, -0.28, 1.14, -0.5,  0.9);       // したの まるみ
    bz(-0.78, 0.66, -0.86, 0.3,  -0.84,-0.1);       // 左がわ
    bz(-0.82,-0.62, -0.6, -1.12, -0.12,-1.15);
    g.closePath(); g.fill();
    // 手前の うで。ふちどりは シルエットにしか つかないので、ここだけ 線で 描く
    g.strokeStyle = o.line || 'rgba(120,100,140,.5)';
    g.lineWidth = r*0.07; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(...P(0.28,-0.2));
    g.bezierCurveTo(x-r*0.1, y+r*0.0, x-r*0.12, y+r*0.34, x+r*0.16, y+r*0.28);
    g.stroke();
    g.fillStyle = c2 || 'rgba(255,255,255,.5)';
    g.beginPath(); g.ellipse(x-r*0.42,y-r*0.66,r*0.24,r*0.14,-0.4,0,GTAU); g.fill();
  },

  slime: (g,S,x,y,r,c,m,c2) => {                      // スライム
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*1.0,y+r*0.76);
    g.bezierCurveTo(x-r*1.0,y-r*0.5, x-r*0.3,y-r*1.0, x,y-r*1.0);
    g.bezierCurveTo(x+r*0.3,y-r*1.0, x+r*1.0,y-r*0.5, x+r*1.0,y+r*0.76);
    g.quadraticCurveTo(x, y+r*1.06, x-r*1.0,y+r*0.76);
    g.closePath(); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(x-r*0.34,y-r*0.42,r*0.26,r*0.16,-0.4,0,GTAU); g.fill();
  },

  golem: (g,S,x,y,r,c,m,c2) => {                      // ゴーレム（岩のかたまり）
    g.fillStyle = c;
    for (const [dx,dy,w,h] of [[-0.5,0.86,0.3,0.3],[0.5,0.86,0.3,0.3],
                               [-0.94,0.06,0.26,0.4],[0.94,0.06,0.26,0.4]]){
      gRR(g, x+r*dx-r*w, y+r*dy-r*h, r*w*2, r*h*2, r*0.1); g.fill();
    }
    gRR(g, x-r*0.72, y-r*0.72, r*1.44, r*1.5, r*0.16); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.3)';
    for (const [dx,dy,w,h] of [[-0.4,-0.4,0.24,0.2],[0.34,-0.1,0.2,0.24],[-0.1,0.4,0.28,0.18]]){
      gRR(g, x+r*dx-r*w, y+r*dy-r*h, r*w*2, r*h*2, r*0.06); g.fill();
    }
  },

  robot: (g,S,x,y,r,c,m,c2) => {                      // ロボット
    g.strokeStyle = c2 || '#8a92a4'; g.lineWidth = r*0.13; g.lineCap='round';
    for (const s2 of [-1,1]){
      g.beginPath(); g.moveTo(x+s2*r*0.5,y+r*0.1); g.lineTo(x+s2*r*0.86,y+r*0.5); g.stroke();
      g.beginPath(); g.moveTo(x+s2*r*0.24,y+r*0.8); g.lineTo(x+s2*r*0.26,y+r*1.2); g.stroke();
    }
    g.fillStyle = c;
    gRR(g, x-r*0.56, y-r*0.16, r*1.12, r*1.0, r*0.14); g.fill();
    gRR(g, x-r*0.5, y-r*1.06, r*1.0, r*0.94, r*0.18); g.fill();
    g.strokeStyle = c2 || '#8a92a4'; g.lineWidth = r*0.07;
    g.beginPath(); g.moveTo(x,y-r*1.06); g.lineTo(x,y-r*1.4); g.stroke();
    g.fillStyle = m || '#ffd76e';
    g.beginPath(); g.arc(x,y-r*1.48,r*0.14,0,GTAU); g.fill();
    g.fillStyle = c2 || '#8fe3c4';
    for (let i=-1;i<=1;i++){ g.beginPath(); g.arc(x+r*i*0.24,y+r*0.4,r*0.09,0,GTAU); g.fill(); }
  },

  /* ================= お菓子（追加） ================= */

  cupcake: (g,S,x,y,r,c,m,c2) => {                // カップケーキ
    g.fillStyle = c2 || '#e8a0b8';
    g.beginPath();
    g.moveTo(x-r*0.72,y+r*0.1); g.lineTo(x+r*0.72,y+r*0.1);
    g.lineTo(x+r*0.5,y+r*1.0); g.lineTo(x-r*0.5,y+r*1.0); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=r*0.06;
    for (let i=-2;i<=2;i++){ g.beginPath();
      g.moveTo(x+r*i*0.26,y+r*0.12); g.lineTo(x+r*i*0.18,y+r*0.98); g.stroke(); }
    g.fillStyle = c;                               // しぼった クリーム
    for (let i=0;i<3;i++){
      g.beginPath(); g.ellipse(x, y-r*(0.06+i*0.34), r*(0.72-i*0.18), r*0.3, 0,0,GTAU); g.fill();
    }
    g.fillStyle='#ff5f8a';
    g.beginPath(); g.arc(x,y-r*0.98,r*0.14,0,GTAU); g.fill();
  },

  tart: (g,S,x,y,r,c,m,c2) => {                   // タルト
    g.fillStyle = c2 || '#e0b878';
    g.beginPath();
    g.moveTo(x-r*1.0,y-r*0.2); g.lineTo(x+r*1.0,y-r*0.2);
    g.lineTo(x+r*0.78,y+r*0.6); g.lineTo(x-r*0.78,y+r*0.6); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,255,255,.45)'; g.lineWidth=r*0.06;
    for (let i=-3;i<=3;i++){ g.beginPath();
      g.moveTo(x+r*i*0.28,y-r*0.18); g.lineTo(x+r*i*0.22,y+r*0.58); g.stroke(); }
    g.fillStyle = 'rgba(255,250,240,.9)';
    g.beginPath(); g.ellipse(x,y-r*0.24,r*1.0,r*0.2,0,0,GTAU); g.fill();
    g.fillStyle = c;                               // フルーツ
    for (const [dx,dy,rr] of [[-0.5,-0.32,0.2],[0,-0.42,0.22],[0.5,-0.32,0.2],[-0.24,-0.2,0.16],[0.26,-0.2,0.16]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*rr,0,GTAU); g.fill();
    }
  },

  eclair: (g,S,x,y,r,c,m,c2) => {                 // エクレア（シュー生地・クリーム・チョコがけ）
    const top = (dy) => {                          // うわ面の カーブ。チョコがけと 生地で 共用
      g.moveTo(x-r*1.06,y+r*0.12+dy);
      g.bezierCurveTo(x-r*1.14,y-r*0.42+dy, x-r*0.6,y-r*0.5+dy, x, y-r*0.48+dy);
      g.bezierCurveTo(x+r*0.6,y-r*0.5+dy, x+r*1.14,y-r*0.42+dy, x+r*1.06,y+r*0.12+dy);
    };
    g.fillStyle = c2 || '#f2d29c';                 // シュー生地（あかるい きつね色）
    g.beginPath(); top(0);
    g.bezierCurveTo(x+r*1.14,y+r*0.62, x+r*0.6,y+r*0.7, x, y+r*0.68);
    g.bezierCurveTo(x-r*0.6,y+r*0.7, x-r*1.14,y+r*0.62, x-r*1.06,y+r*0.12);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(150,100,55,.3)'; g.lineWidth = r*0.05;   // わりめ（クリームは のぞくだけ）
    g.beginPath();
    g.moveTo(x-r*0.98,y+r*0.36);
    for (let i=-3;i<=3;i++) g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.44:0.3), x+r*i*0.3, y+r*0.38);
    g.lineTo(x+r*0.98,y+r*0.36); g.stroke();
    // チョコがけ。うわ面の 4わり だけに して、下は 生地を のこす
    g.fillStyle = c;
    g.beginPath(); top(0);
    g.lineTo(x+r*1.0,y+r*0.04);
    for (let i=3;i>=-3;i--)
      g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.1:-0.06), x+r*i*0.3, y-r*0.02);
    g.lineTo(x-r*1.0,y+r*0.04);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)';          // チョコの てり
    g.beginPath(); g.ellipse(x-r*0.3,y-r*0.32,r*0.4,r*0.1,0.04,0,GTAU); g.fill();
  },

  cream: (g,S,x,y,r,c,m,c2) => {                  // シュークリーム
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<=14;i++){
      const a=i/14*GTAU, rr=r*(0.94+0.08*Math.sin(i*3));
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*0.88;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || 'rgba(255,250,235,.9)';    // わったところの クリーム
    g.beginPath();
    g.moveTo(x-r*0.92,y+r*0.1);
    for (let i=-3;i<=3;i++) g.quadraticCurveTo(x+r*(i*0.3+0.15), y+r*(i%2?0.34:0.02), x+r*i*0.3, y+r*0.18);
    g.lineTo(x+r*0.92,y+r*0.1); g.lineTo(x+r*0.9,y+r*0.32); g.lineTo(x-r*0.9,y+r*0.32);
    g.closePath(); g.fill();
  },

  roll: (g,S,x,y,r,c,m,c2) => {                   // ロールケーキ（よこに ねた 円柱。だんめんの うずが 主役）
    const ec = c2 || '#f2d29c';
    g.fillStyle = ec;
    // よこに ながい 円柱に する。まるいと ただの ボールに 見える
    g.beginPath();
    g.moveTo(x-r*0.62,y-r*0.86); g.lineTo(x+r*0.72,y-r*0.86);
    g.bezierCurveTo(x+r*1.14,y-r*0.86, x+r*1.14,y+r*0.86, x+r*0.72,y+r*0.86);
    g.lineTo(x-r*0.62,y+r*0.86); g.closePath(); g.fill();
    g.fillStyle = 'rgba(150,105,60,.22)';          // おくがわの かげ
    g.beginPath();
    g.moveTo(x+r*0.5,y-r*0.86); g.lineTo(x+r*0.72,y-r*0.86);
    g.bezierCurveTo(x+r*1.14,y-r*0.86, x+r*1.14,y+r*0.86, x+r*0.72,y+r*0.86);
    g.lineTo(x+r*0.5,y+r*0.86); g.closePath(); g.fill();
    const cx2 = x - r*0.6;
    g.fillStyle = ec;                              // 手まえの だんめん
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.fill();
    g.save();                                      // うずは だんめんから はみ出させない
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.clip();
    for (const [w,col] of [[0.26,'rgba(255,250,238,.98)'],[0.15,c]]){
      g.strokeStyle = col; g.lineWidth = r*w; g.lineCap='round';
      g.beginPath();
      for (let i=0;i<=72;i++){
        const t=i/72, a2=t*GTAU*1.8 - 1.4, rr=0.66*(1-t*0.86);
        const px=cx2+Math.cos(a2)*r*rr*0.62, py=y+Math.sin(a2)*r*rr*1.1;
        i? g.lineTo(px,py) : g.moveTo(px,py);
      }
      g.stroke();
    }
    g.restore();
    g.fillStyle='#ff5f8a';                         // まん中の いちご
    g.beginPath(); g.ellipse(cx2, y, r*0.11, r*0.15, 0,0,GTAU); g.fill();
    g.strokeStyle='rgba(160,110,60,.35)'; g.lineWidth=r*0.05;
    g.beginPath(); g.ellipse(cx2, y, r*0.5, r*0.88, 0,0,GTAU); g.stroke();
    g.fillStyle='rgba(255,250,238,.98)';           // 上の 生クリーム
    g.beginPath(); g.ellipse(x+r*0.36, y-r*0.92, r*0.24, r*0.16, 0, Math.PI, 0); g.fill();
    g.fillStyle='#ff3f6b';
    g.beginPath(); g.ellipse(x+r*0.36, y-r*1.12, r*0.15, r*0.18, 0,0,GTAU); g.fill();
    g.fillStyle='#5fb35f';
    g.beginPath(); g.ellipse(x+r*0.36, y-r*1.26, r*0.12, r*0.05, 0,0,GTAU); g.fill();
  },

  baum: (g,S,x,y,r,c,m,c2) => {                   // バウムクーヘン
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y,r*1.0,r*0.92,0,0,GTAU); g.fill();
    g.strokeStyle = c2 || 'rgba(255,240,215,.8)'; g.lineWidth = r*0.07;
    for (let i=1;i<=3;i++){
      g.beginPath(); g.ellipse(x,y,r*(1.0-i*0.24),r*(0.92-i*0.22),0,0,GTAU); g.stroke();
    }
    g.globalCompositeOperation='destination-out';
    g.beginPath(); g.ellipse(x,y,r*0.22,r*0.2,0,0,GTAU); g.fill();
    g.globalCompositeOperation='source-over';
  },

  mont: (g,S,x,y,r,c,m,c2) => {                   // モンブラン（そうめん状の マロンクリーム）
    g.fillStyle = '#e0b878';                       // タルトの 土台
    gRR(g, x-r*0.96, y+r*0.42, r*1.92, r*0.5, r*0.1); g.fill();
    g.fillStyle = 'rgba(150,100,50,.28)';          // 土台の ぎざぎざ
    for (let i=0;i<9;i++){
      g.beginPath(); g.moveTo(x-r*0.96+i*r*0.215, y+r*0.42);
      g.lineTo(x-r*0.96+i*r*0.215+r*0.06, y+r*0.92);
      g.lineTo(x-r*0.96+i*r*0.215+r*0.12, y+r*0.42); g.closePath(); g.fill();
    }
    const dome = () => {
      g.beginPath();
      g.moveTo(x-r*0.9,y+r*0.46);
      g.bezierCurveTo(x-r*0.84,y-r*0.44, x-r*0.36,y-r*0.9, x, y-r*0.92);
      g.bezierCurveTo(x+r*0.36,y-r*0.9, x+r*0.84,y-r*0.44, x+r*0.9,y+r*0.46);
      g.closePath();
    };
    g.fillStyle = c; dome(); g.fill();
    g.save(); dome(); g.clip();
    // すじを むきも 長さも ばらして かさねる。そろえると かごの あみ目に なる
    g.lineCap = 'round'; g.lineWidth = r*0.1;
    const TONE = [c2 || 'rgba(150,100,50,.4)', 'rgba(255,255,255,.4)',
                  'rgba(150,100,50,.22)', 'rgba(255,255,255,.22)'];
    for (let i=0;i<70;i++){
      const u = Math.sin(i*12.9898)*43758.5453, v = u - Math.floor(u);      // ばらつきの たね
      const w = Math.sin(i*78.233)*12345.6789, q = w - Math.floor(w);
      const px = x + (v*2-1)*r*0.88, py = y + (q*1.5-0.62)*r*0.92;
      const ang = (v+q)*3.6 - 1.8;                 // すじの むき
      const len = r*(0.4 + q*0.5);
      g.strokeStyle = TONE[i%4];
      g.beginPath();
      g.moveTo(px - Math.cos(ang)*len, py - Math.sin(ang)*len*0.5);
      g.quadraticCurveTo(px, py + r*0.1, px + Math.cos(ang)*len, py + Math.sin(ang)*len*0.5);
      g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.14)';         // 左上からの ひかり
    g.beginPath(); g.ellipse(x-r*0.32, y-r*0.4, r*0.4, r*0.5, -0.4, 0, GTAU); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,250,238,.98)';         // てっぺんの 生クリーム
    g.beginPath(); g.arc(x, y-r*0.9, r*0.25, 0, GTAU); g.fill();
    g.fillStyle = '#8a5a30';                       // マロン
    g.beginPath(); g.ellipse(x, y-r*1.14, r*0.2, r*0.17, 0,0,GTAU); g.fill();
    g.fillStyle = '#c98a54';
    g.beginPath(); g.ellipse(x, y-r*1.2, r*0.18, r*0.08, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';          // こなざとう
    for (let i=0;i<10;i++){
      const a2=i*2.399;
      g.beginPath();
      g.arc(x+Math.cos(a2)*r*0.62, y-r*0.14+Math.sin(a2)*r*0.44, r*0.04, 0, GTAU); g.fill();
    }
  },

  mille: (g,S,x,y,r,c,m,c2) => {                  // ミルフィーユ（パイと クリームの そう）
    for (let i=0;i<3;i++){
      const ly = y - r*0.92 + i*r*0.7;
      g.fillStyle = c2 || '#e8c090';               // パイ生地
      gRR(g, x-r*0.94, ly, r*1.88, r*0.3, r*0.05); g.fill();
      g.strokeStyle = 'rgba(160,110,60,.45)'; g.lineWidth = r*0.035;
      for (let k=0;k<3;k++){
        g.beginPath();
        g.moveTo(x-r*0.9, ly+r*0.08+k*r*0.07); g.lineTo(x+r*0.9, ly+r*0.08+k*r*0.07); g.stroke();
      }
      if (i < 2){                                  // クリームと いちご
        g.fillStyle = 'rgba(255,250,240,.97)';
        gRR(g, x-r*0.9, ly+r*0.3, r*1.8, r*0.24, r*0.05); g.fill();
        for (let k=-3;k<=3;k++){
          g.beginPath(); g.arc(x+r*k*0.26, ly+r*0.54, r*0.15, Math.PI, 0); g.fill();
        }
        g.fillStyle = '#ff5f8a';
        for (let k=-2;k<=2;k++){
          g.beginPath(); g.ellipse(x+r*k*0.38, ly+r*0.46, r*0.11, r*0.14, 0,0,GTAU); g.fill();
        }
      }
    }
    g.fillStyle = 'rgba(255,255,255,.9)';          // こなざとう
    for (let i=-4;i<=4;i++){
      g.beginPath(); g.arc(x+r*i*0.2, y-r*0.98, r*0.04, 0, GTAU); g.fill();
    }
    g.fillStyle = '#ff3f6b';                       // てっぺんの いちご
    g.beginPath();
    g.moveTo(x+r*0.52, y-r*0.84);
    g.bezierCurveTo(x+r*0.2,y-r*1.12, x+r*0.28,y-r*1.44, x+r*0.52,y-r*1.42);
    g.bezierCurveTo(x+r*0.76,y-r*1.44, x+r*0.84,y-r*1.12, x+r*0.52,y-r*0.84);
    g.closePath(); g.fill();
    g.fillStyle = '#5fb35f';
    g.beginPath(); g.ellipse(x+r*0.52,y-r*1.42,r*0.17,r*0.07,0,0,GTAU); g.fill();
  },

  waffle: (g,S,x,y,r,c,m,c2) => {                 // ワッフル
    g.fillStyle = c;
    gRR(g, x-r*0.94, y-r*0.8, r*1.88, r*1.6, r*0.16); g.fill();
    g.fillStyle = c2 || 'rgba(150,105,60,.4)';
    for (let a=0;a<3;a++) for (let b=0;b<3;b++){
      gRR(g, x-r*0.78+a*r*0.56, y-r*0.64+b*r*0.5, r*0.4, r*0.34, r*0.05); g.fill();
    }
  },

  pancake: (g,S,x,y,r,c,m,c2) => {                // パンケーキ（3まい・バター・シロップ）
    g.fillStyle = 'rgba(255,255,255,.92)';        // おさら
    g.beginPath(); g.ellipse(x, y+r*1.04, r*1.26, r*0.24, 0,0,GTAU); g.fill();
    for (let i=2;i>=0;i--){                        // 3まい かさねる
      const cy2 = y + r*(0.7 - i*0.44);
      g.fillStyle = c2 || '#d8a050';               // 側面（やけ色）
      gRR(g, x-r*0.92, cy2-r*0.2, r*1.84, r*0.44, r*0.2); g.fill();
      g.fillStyle = c;                             // 上の面
      g.beginPath(); g.ellipse(x, cy2-r*0.2, r*0.92, r*0.21, 0,0,GTAU); g.fill();
    }
    g.fillStyle = 'rgba(185,105,35,.8)';           // シロップ
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.42);
    g.quadraticCurveTo(x, y-r*0.12, x+r*0.8,y-r*0.42);
    g.quadraticCurveTo(x+r*0.9,y+r*0.24, x+r*0.66,y+r*0.42);
    g.quadraticCurveTo(x+r*0.64,y-r*0.06, x+r*0.34,y-r*0.08);
    g.quadraticCurveTo(x,y+r*0.1, x-r*0.34,y-r*0.08);
    g.quadraticCurveTo(x-r*0.58,y+r*0.3, x-r*0.72,y+r*0.06);
    g.quadraticCurveTo(x-r*0.9,y-r*0.16, x-r*0.8,y-r*0.42);
    g.closePath(); g.fill();
    g.fillStyle = '#ffe08a';                       // バター
    gRR(g, x-r*0.26, y-r*0.72, r*0.52, r*0.32, r*0.05); g.fill();
    g.fillStyle = '#ffcf52';
    gRR(g, x-r*0.26, y-r*0.5, r*0.52, r*0.12, r*0.03); g.fill();
  },

  pretzel: (g,S,x,y,r,c,m,c2) => {                // プレッツェル
    g.strokeStyle = c; g.lineWidth = r*0.24; g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    g.moveTo(x-r*0.3,y+r*0.78);
    g.bezierCurveTo(x-r*1.3,y+r*0.2, x-r*1.0,y-r*0.96, x-r*0.16,y-r*0.5);
    g.bezierCurveTo(x+r*0.3,y-r*0.28, x-r*0.3,y-r*0.28, x+r*0.16,y-r*0.5);
    g.bezierCurveTo(x+r*1.0,y-r*0.96, x+r*1.3,y+r*0.2, x+r*0.3,y+r*0.78);
    g.stroke();
    g.fillStyle = c2 || 'rgba(255,255,255,.7)';
    for (const [dx,dy] of [[-0.7,0.1],[0.7,0.1],[-0.2,-0.5],[0.2,0.6]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*0.06,0,GTAU); g.fill();
    }
  },

  churro: (g,S,x,y,r,c,m,c2) => {                 // チュロス（紙コップに 3本。みぞと さとう）
    // 1本を えがく。ほし形の だんめんを たてみぞ で あらわす
    const stick = (bx, by, rot, len) => {
      g.save(); g.translate(bx, by); g.rotate(rot);
      g.fillStyle = c;
      gRR(g, -r*0.24, -len, r*0.48, len, r*0.24); g.fill();
      g.strokeStyle = c2 || 'rgba(150,95,45,.55)'; g.lineWidth = r*0.06;
      for (const dx of [-0.13, 0.0, 0.13]){
        g.beginPath(); g.moveTo(r*dx, -len+r*0.16); g.lineTo(r*dx, -r*0.1); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.3)';        // 左はしの てり
      gRR(g, -r*0.22, -len+r*0.14, r*0.08, len-r*0.3, r*0.04); g.fill();
      g.fillStyle = 'rgba(255,255,255,.9)';        // シナモンシュガー
      for (let i=0;i<9;i++){
        g.beginPath();
        g.arc(r*(-0.16+0.08*(i%4)), -len+r*0.24+i*(len-r*0.4)/9, r*0.042, 0, GTAU); g.fill();
      }
      g.restore();
    };
    stick(x-r*0.34, y+r*0.5, -0.34, r*1.7);
    stick(x+r*0.34, y+r*0.5,  0.34, r*1.7);
    stick(x,        y+r*0.56, 0.0,  r*1.86);
    // 紙コップ（赤と白の しま）
    g.fillStyle = '#fdfaff';
    g.beginPath();
    g.moveTo(x-r*0.6,y+r*0.34); g.lineTo(x+r*0.6,y+r*0.34);
    g.lineTo(x+r*0.42,y+r*1.14); g.lineTo(x-r*0.42,y+r*1.14);
    g.closePath();
    g.save(); g.clip(); g.fill();
    g.fillStyle = '#ff8fa8';
    for (let i=-3;i<=3;i++){
      g.save(); g.translate(x+r*i*0.3, y+r*0.7); g.rotate(0.1);
      g.fillRect(-r*0.07, -r*0.6, r*0.14, r*1.2); g.restore();
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.95)';         // コップの ふち
    gRR(g, x-r*0.64, y+r*0.28, r*1.28, r*0.16, r*0.08); g.fill();
  },

  popcorn: (g,S,x,y,r,c,m,c2) => {                // ポップコーン
    g.fillStyle = c2 || '#e8503f';
    g.beginPath();
    g.moveTo(x-r*0.76,y+r*0.02); g.lineTo(x+r*0.76,y+r*0.02);
    g.lineTo(x+r*0.56,y+r*1.06); g.lineTo(x-r*0.56,y+r*1.06); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.75)';
    for (let i=-1;i<=1;i++){ gRR(g, x+r*i*0.4-r*0.1, y+r*0.06, r*0.2, r*1.0, r*0.04); g.fill(); }
    g.fillStyle = c;                               // はじけた つぶ
    for (const [dx,dy] of [[-0.5,-0.16],[0,-0.36],[0.5,-0.16],[-0.24,-0.62],[0.28,-0.6],[0,-0.86]]){
      for (let k=0;k<4;k++){
        const a=k*GTAU/4+0.4;
        g.beginPath(); g.arc(x+r*dx+Math.cos(a)*r*0.14, y+r*dy+Math.sin(a)*r*0.14, r*0.17,0,GTAU); g.fill();
      }
    }
  },

  marshmallow: (g,S,x,y,r,c,m,c2) => {            // マシュマロ
    g.fillStyle = c;
    gRR(g, x-r*0.86, y-r*0.6, r*1.72, r*1.2, r*0.4); g.fill();
    g.fillStyle = c2 || 'rgba(255,255,255,.6)';
    g.beginPath(); g.ellipse(x,y-r*0.44,r*0.72,r*0.2,0,0,GTAU); g.fill();
  },

  gummy: (g,S,x,y,r,c,m,c2) => {                  // グミ（くまの形）
    g.globalAlpha = 0.88;
    g.fillStyle = c;
    g.beginPath(); g.arc(x,y-r*0.5,r*0.42,0,GTAU); g.fill();
    for (const s2 of [-1,1]) { g.beginPath(); g.arc(x+s2*r*0.36,y-r*0.8,r*0.18,0,GTAU); g.fill(); }
    g.beginPath(); g.ellipse(x,y+r*0.3,r*0.52,r*0.6,0,0,GTAU); g.fill();
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(x+s2*r*0.6,y+r*0.14,r*0.2,r*0.3,s2*0.4,0,GTAU); g.fill();
      g.beginPath(); g.ellipse(x+s2*r*0.34,y+r*0.92,r*0.2,r*0.26,s2*0.2,0,GTAU); g.fill();
    }
    g.globalAlpha = 1;
  },

  jelly2: (g,S,x,y,r,c,m,c2) => {                 // ゼリー
    g.globalAlpha = 0.85;
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.6); g.lineTo(x+r*0.8,y-r*0.6);
    g.lineTo(x+r*0.6,y+r*0.86); g.lineTo(x-r*0.6,y+r*0.86); g.closePath(); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = c2 || 'rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(x,y-r*0.6,r*0.8,r*0.18,0,0,GTAU); g.fill();
    g.beginPath(); g.ellipse(x-r*0.34,y-r*0.06,r*0.16,r*0.3,0.2,0,GTAU); g.fill();
  },
  /* --- 和菓子 --- */

  monaka: (g,S,x,y,r,c,m,c2) => {                 // もなか
    g.fillStyle = c;
    gRR(g, x-r*0.92, y-r*0.56, r*1.84, r*1.12, r*0.22); g.fill();
    g.fillStyle = c2 || '#5b3a4a';
    gRR(g, x-r*0.86, y-r*0.12, r*1.72, r*0.26, r*0.08); g.fill();
    g.strokeStyle='rgba(160,120,80,.45)'; g.lineWidth=r*0.05;
    for (let i=-2;i<=2;i++){
      g.beginPath(); g.moveTo(x+r*i*0.32,y-r*0.5); g.lineTo(x+r*i*0.32,y-r*0.16); g.stroke();
      g.beginPath(); g.moveTo(x+r*i*0.32,y+r*0.16); g.lineTo(x+r*i*0.32,y+r*0.5); g.stroke();
    }
  },

  kintsuba: (g,S,x,y,r,c,m,c2) => {               // きんつば
    g.fillStyle = c;
    gRR(g, x-r*0.86, y-r*0.66, r*1.72, r*1.32, r*0.1); g.fill();
    g.fillStyle = c2 || 'rgba(255,250,240,.75)';
    g.lineWidth=r*0.08; g.strokeStyle=c2||'rgba(255,250,240,.75)';
    gRR(g, x-r*0.86, y-r*0.66, r*1.72, r*1.32, r*0.1); g.stroke();
    g.fillStyle='rgba(60,40,55,.35)';
    for (const [dx,dy] of [[-0.34,-0.2],[0.2,0.1],[-0.1,0.42],[0.4,-0.34]]){
      g.beginPath(); g.arc(x+r*dx,y+r*dy,r*0.11,0,GTAU); g.fill();
    }
  },

  ohagi: (g,S,x,y,r,c,m,c2) => {                  // おはぎ
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.06,r*0.92,r*0.8,0,0,GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(90,55,70,.45)';
    for (let i=0;i<26;i++){
      const a=i*2.399, rr=r*0.78*Math.sqrt(i/26);
      g.beginPath(); g.arc(x+Math.cos(a)*rr, y+r*0.06+Math.sin(a)*rr*0.86, r*0.09,0,GTAU); g.fill();
    }
  },

  warabi: (g,S,x,y,r,c,m,c2) => {                 // わらびもち
    g.globalAlpha=0.9; g.fillStyle = c;
    for (const [dx,dy] of [[-0.42,0.1],[0.42,0.1],[0,-0.3],[0,0.5]]){
      gRR(g, x+r*dx-r*0.36, y+r*dy-r*0.32, r*0.72, r*0.64, r*0.16); g.fill();
    }
    g.globalAlpha=1;
    g.fillStyle = c2 || '#8a6a4a';                 // きなこ
    for (let i=0;i<24;i++){
      const a=i*2.399, rr=r*0.9*Math.sqrt(i/24);
      g.beginPath(); g.arc(x+Math.cos(a)*rr, y+Math.sin(a)*rr, r*0.05,0,GTAU); g.fill();
    }
  },

  sakuramochi: (g,S,x,y,r,c,m,c2) => {            // さくらもち
    g.fillStyle = c2 || '#6f9e5e';                 // さくらの は
    g.beginPath();
    g.moveTo(x-r*1.1,y+r*0.2);
    g.quadraticCurveTo(x, y-r*0.9, x+r*1.1,y+r*0.2);
    g.quadraticCurveTo(x, y+r*0.9, x-r*1.1,y+r*0.2);
    g.closePath(); g.fill();
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.06,r*0.72,r*0.56,0,0,GTAU); g.fill();
  },

  manju: (g,S,x,y,r,c,m,c2) => {                  // まんじゅう
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x,y+r*0.12,r*0.94,r*0.72,0,0,GTAU); g.fill();
    g.fillStyle = c2 || '#e8503f';                 // やきいん
    g.beginPath(); g.arc(x,y-r*0.06,r*0.26,0,GTAU); g.fill();
    g.fillStyle='rgba(255,255,255,.6)';
    g.beginPath(); g.arc(x,y-r*0.06,r*0.14,0,GTAU); g.fill();
  },

  senbei: (g,S,x,y,r,c,m,c2) => {                 // せんべい
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<=18;i++){
      const a=i/18*GTAU, rr=r*(0.98+0.04*Math.sin(i*4));
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || '#3a2c20';                 // のり
    gRR(g, x-r*0.34, y-r*1.0, r*0.68, r*2.0, r*0.04); g.fill();
  },

  castella: (g,S,x,y,r,c,m,c2) => {               // カステラ（上下の こげと ざらめ）
    const bx = x-r*0.98, by = y-r*0.72, bw = r*1.96, bh = r*1.5;
    g.fillStyle = c;                               // きじ（あわい たまご色）
    gRR(g, bx, by, bw, bh, r*0.1); g.fill();
    const crust = c2 || '#a0602a';
    g.save(); gRR(g, bx, by, bw, bh, r*0.1); g.clip();
    g.fillStyle = crust;                           // 上の こげ
    g.fillRect(bx, by, bw, r*0.26);
    g.fillStyle = 'rgba(255,255,255,.25)';
    g.fillRect(bx, by+r*0.2, bw, r*0.07);
    g.fillStyle = crust;                           // 下の こげ（ざらめが つく ところ）
    g.fillRect(bx, y+r*0.36, bw, r*0.42);
    // きめ（あわの あな）。カステラは たてに ながい あなが ならぶ
    g.fillStyle = 'rgba(190,140,70,.28)';
    for (let i=0;i<22;i++){
      const a2=i*2.399, rr=r*0.82*Math.sqrt(i/22);
      g.beginPath();
      g.ellipse(x+Math.cos(a2)*rr, y-r*0.06+Math.sin(a2)*rr*0.42, r*0.045, r*0.07, 0,0,GTAU); g.fill();
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.85)';         // ざらめの つぶ
    for (let i=0;i<11;i++){
      g.beginPath();
      g.arc(x-r*0.86+i*r*0.172, y+r*(0.6+0.06*Math.sin(i*2.1)), r*0.055, 0, GTAU); g.fill();
    }
    g.strokeStyle = 'rgba(160,110,50,.4)'; g.lineWidth = r*0.05;   // ふちを しめる
    gRR(g, bx, by, bw, bh, r*0.1); g.stroke();
  },

  konpeito: (g,S,x,y,r,c,m,c2) => {               // こんぺいとう
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<18;i++){
      const a=i*GTAU/18, rr=r*(i%2?0.6:1.0);
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
  },

  anmitsu: (g,S,x,y,r,c,m,c2) => {                // あんみつ（うつわに かんてん・くだもの・あん）
    g.fillStyle = 'rgba(226,242,252,.95)';         // ガラスの おわん
    g.beginPath();
    g.moveTo(x-r*1.06,y-r*0.34);
    g.bezierCurveTo(x-r*1.0,y+r*0.72, x-r*0.6,y+r*0.94, x, y+r*0.94);
    g.bezierCurveTo(x+r*0.6,y+r*0.94, x+r*1.0,y+r*0.72, x+r*1.06,y-r*0.34);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';          // ふちの あつみ
    g.beginPath(); g.ellipse(x, y-r*0.34, r*1.06, r*0.2, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(190,220,240,.7)';          // 台（高台）
    gRR(g, x-r*0.16, y+r*0.86, r*0.32, r*0.2, r*0.04); g.fill();
    g.beginPath(); g.ellipse(x, y+r*1.06, r*0.44, r*0.13, 0,0,GTAU); g.fill();
    // かんてんの さいころ。すきとおる ので ふちを 白く のこす
    for (const [dx,dy,cc] of [[-0.56,0.06,'#a8e8d4'],[-0.2,0.3,'#ffe0b0'],
                              [0.2,0.3,'#a8dcf4'],[0.56,0.06,'#d8f0ff'],
                              [-0.4,0.56,'#c9f0d8'],[0.06,0.62,'#ffd0e0'],[0.44,0.56,'#e8ddff']]){
      g.fillStyle = cc;
      gRR(g, x+r*dx-r*0.19, y+r*dy-r*0.19, r*0.38, r*0.38, r*0.07); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)';
      gRR(g, x+r*dx-r*0.14, y+r*dy-r*0.15, r*0.2, r*0.1, r*0.03); g.fill();
    }
    g.fillStyle = c2 || '#4a2f3c';                 // あん（つやのある 山）
    g.beginPath(); g.ellipse(x-r*0.02, y-r*0.14, r*0.42, r*0.34, 0,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';
    g.beginPath(); g.ellipse(x-r*0.14, y-r*0.26, r*0.18, r*0.08, -0.3,0,GTAU); g.fill();
    g.fillStyle = '#ffa54a';                       // みかん
    g.beginPath(); g.ellipse(x-r*0.64, y-r*0.36, r*0.26, r*0.18, 0.25,0,GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)';
    for (let i=0;i<4;i++){ g.beginPath(); g.moveTo(x-r*0.64,y-r*0.36);
      g.arc(x-r*0.64, y-r*0.36, r*0.24, 2.9+i*0.34, 3.0+i*0.34); g.fill(); }
    g.fillStyle = '#fdfaff';                       // しらたま
    g.beginPath(); g.arc(x+r*0.5, y-r*0.4, r*0.2, 0, GTAU); g.fill();
    g.fillStyle = '#ff3f6b';                       // さくらんぼ
    g.beginPath(); g.arc(x+r*0.14, y-r*0.62, r*0.19, 0, GTAU); g.fill();
    g.strokeStyle='#5fb35f'; g.lineWidth=r*0.05; g.lineCap='round';
    g.beginPath(); g.moveTo(x+r*0.14,y-r*0.78);
    g.quadraticCurveTo(x+r*0.3,y-r*1.04, x+r*0.5,y-r*1.0); g.stroke();
  },

  tower: (g,S,x,y,r,c,m,c2) => {                  // マカロンタワー（まるい マカロンを つみあげる）
    const mac = (mx,my,mr,col) => {
      g.fillStyle = col;
      g.beginPath(); g.ellipse(mx,my-mr*0.36,mr,mr*0.44,0,0,GTAU); g.fill();
      g.beginPath(); g.ellipse(mx,my+mr*0.36,mr,mr*0.44,0,0,GTAU); g.fill();
      g.fillStyle = 'rgba(255,250,240,.95)';
      gRR(g, mx-mr*0.94, my-mr*0.14, mr*1.88, mr*0.28, mr*0.13); g.fill();
    };
    const cols = [c, c2 || '#c9a7ff', '#8fe3c4', '#ffd9a8'];
    for (let row=0; row<4; row++){
      const n = 4 - row, mr = r*0.27, gap = r*0.6;
      for (let i=0;i<n;i++)
        mac(x + (i-(n-1)/2)*gap, y + r*(1.0 - row*0.5), mr, cols[(row+i)%4]);
    }
    g.fillStyle = m || '#ffd76e';                  // てっぺんの ほし
    g.beginPath();
    for (let i=0;i<10;i++){
      const a2=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.09:r*0.22;
      i? g.lineTo(x+Math.cos(a2)*rr, y-r*1.2+Math.sin(a2)*rr)
       : g.moveTo(x+Math.cos(a2)*rr, y-r*1.2+Math.sin(a2)*rr);
    }
    g.closePath(); g.fill();
  },

  dango: (g,S,x,y,r,c,m,c2) => {                  // 三色だんご
    g.strokeStyle = '#d8b98a'; g.lineWidth = r*0.14; g.lineCap='round';
    g.beginPath(); g.moveTo(x, y+r*1.24); g.lineTo(x, y-r*1.0); g.stroke();
    const cols = [c, c2 || '#c9e8a8', '#ffc2d4'];
    for (let i=0;i<3;i++){
      g.fillStyle = cols[i];
      g.beginPath(); g.arc(x, y+r*0.7 - i*r*0.7, r*0.44, 0, GTAU); g.fill();
    }
  },

  daifuku: (g,S,x,y,r,c,m,c2) => {                // だいふく（もちと 中の あん）
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x, y+r*0.06, r*1.02, r*0.84, 0, 0, GTAU); g.fill();
    g.fillStyle = c2 || 'rgba(200,160,180,.35)';  // 中の あんが すける
    g.beginPath(); g.ellipse(x, y+r*0.16, r*0.5, r*0.36, 0, 0, GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.6)';         // もちとり粉
    for (let i=0;i<10;i++){
      const a2=i*2.399, rr=r*0.8*Math.sqrt(i/10);
      g.beginPath(); g.arc(x+Math.cos(a2)*rr, y+Math.sin(a2)*rr*0.8, r*0.045,0,GTAU); g.fill();
    }
  },

  youkan: (g,S,x,y,r,c,m,c2) => {                 // ようかん（つやのある 直方体）
    g.fillStyle = c;
    g.beginPath();                                 // 上の面（おくゆき）
    g.moveTo(x-r*0.8,y-r*0.5); g.lineTo(x+r*0.62,y-r*0.72);
    g.lineTo(x+r*0.94,y-r*0.44); g.lineTo(x-r*0.5,y-r*0.22); g.closePath(); g.fill();
    g.fillStyle = c2 || '#3a2430';                 // 手まえの 面
    g.beginPath();
    g.moveTo(x-r*0.8,y-r*0.5); g.lineTo(x-r*0.5,y-r*0.22);
    g.lineTo(x-r*0.5,y+r*0.72); g.lineTo(x-r*0.8,y+r*0.46); g.closePath(); g.fill();
    g.fillStyle = c;
    gRR(g, x-r*0.5, y-r*0.24, r*1.44, r*0.96, r*0.05); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';         // つや
    gRR(g, x-r*0.4, y-r*0.14, r*1.24, r*0.16, r*0.04); g.fill();
  },

  dorayaki: (g,S,x,y,r,c,m,c2) => {               // どらやき
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x, y-r*0.36, r*1.0, r*0.46, 0, 0, GTAU); g.fill();
    g.beginPath(); g.ellipse(x, y+r*0.36, r*1.0, r*0.46, 0, 0, GTAU); g.fill();
    g.fillStyle = c2 || '#6b4530';                 // あんこ
    gRR(g, x-r*0.92, y-r*0.16, r*1.84, r*0.32, r*0.14); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)';         // やけの てり
    g.beginPath(); g.ellipse(x-r*0.3, y-r*0.5, r*0.34, r*0.1, 0, 0, GTAU); g.fill();
  },

  taiyaki: (g,S,x,y,r,c,m,c2) => {                // たいやき
    g.fillStyle = c;
    g.beginPath(); g.ellipse(x-r*0.12, y, r*1.0, r*0.72, 0, 0, GTAU); g.fill();
    g.beginPath();                                 // おびれ
    g.moveTo(x+r*0.66,y);
    g.lineTo(x+r*1.34,y-r*0.54); g.lineTo(x+r*1.2,y);
    g.lineTo(x+r*1.34,y+r*0.54); g.closePath(); g.fill();
    g.strokeStyle = c2 || '#c98a44'; g.lineWidth = r*0.06;
    g.beginPath(); g.ellipse(x-r*0.12, y, r*0.86, r*0.6, 0, 0, GTAU); g.stroke();
    for (let i=0;i<3;i++){                         // うろこ
      g.beginPath();
      g.arc(x-r*(0.1+i*0.3), y+r*0.16, r*0.24, Math.PI*1.15, Math.PI*1.85); g.stroke();
    }
  },

  cookie: (g,S,x,y,r,c,m,c2) => {                 // まるいクッキー
    g.fillStyle = c;
    g.beginPath();
    for (let i=0;i<=20;i++){
      const a2=i/20*GTAU, rr=r*(0.98+0.03*Math.sin(i*3));
      const px=x+Math.cos(a2)*rr, py=y+Math.sin(a2)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.fillStyle = c2 || '#8a5a30';                 // チョコチップ
    for (const [dx,dy,rr] of [[-0.4,-0.3,0.14],[0.35,-0.12,0.12],[-0.12,0.4,0.13],
                              [0.44,0.4,0.11],[0.06,-0.5,0.1],[-0.52,0.2,0.1]]){
      g.beginPath(); g.arc(x+r*dx, y+r*dy, r*rr, 0, GTAU); g.fill();
    }
  },

  donut: (g,S,x,y,r,c,m,c2) => {                  // ドーナツ（グレーズと スプレー）
    g.fillStyle = c;
    g.beginPath(); g.arc(x,y,r,0,GTAU); g.arc(x,y,r*0.34,0,GTAU,true); g.fill();
    g.fillStyle = c2 || '#ff9ec9';                 // うえの グレーズ（ふちが たれる）
    g.beginPath();
    for (let i=0;i<=24;i++){
      const a2=i/24*GTAU, rr=r*(0.86+0.1*Math.sin(i*2.2));
      const px=x+Math.cos(a2)*rr, py=y+Math.sin(a2)*rr;
      i? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.arc(x,y,r*0.36,0,GTAU,true); g.fill();
    const spr=['#ffffff','#ffd76e','#8fe3c4','#9ed8ff'];   // スプレー
    for (let i=0;i<12;i++){
      const a2=i*2.1, rr=r*(0.5+0.24*((i*7)%3)/2);
      g.save(); g.translate(x+Math.cos(a2)*rr, y+Math.sin(a2)*rr); g.rotate(a2*1.7);
      g.fillStyle = spr[i%4];
      gRR(g, -r*0.09, -r*0.03, r*0.18, r*0.06, r*0.03); g.fill();
      g.restore();
    }
  },

  purin: (g,S,x,y,r,c,m,c2) => {                  // プリン（カラメルつき）
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(x-r*0.98,y+r*0.74);
    g.lineTo(x-r*0.62,y-r*0.66); g.lineTo(x+r*0.62,y-r*0.66);
    g.lineTo(x+r*0.98,y+r*0.74); g.closePath(); g.fill();
    g.fillStyle = c2 || '#c98a4a';                 // 上の カラメル
    g.beginPath(); g.ellipse(x, y-r*0.66, r*0.62, r*0.22, 0, 0, GTAU); g.fill();
    g.beginPath();                                 // よこに たれる カラメル
    g.moveTo(x-r*0.62,y-r*0.62);
    g.quadraticCurveTo(x-r*0.5,y-r*0.1, x-r*0.66,y+r*0.1);
    g.quadraticCurveTo(x-r*0.74,y-r*0.24, x-r*0.66,y-r*0.6);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';          // てっぺんの クリーム
    g.beginPath(); g.arc(x+r*0.3, y-r*0.78, r*0.18, Math.PI, 0); g.fill();
  },

  soft: (g,S,x,y,r,c,m,c2) => {                   // ソフトクリーム（うずまき）
    g.fillStyle = '#e8b979';                       // コーン（あみ目）
    g.beginPath(); g.moveTo(x-r*0.5,y+r*0.42);
    g.lineTo(x+r*0.5,y+r*0.42); g.lineTo(x,y+r*1.5); g.closePath(); g.fill();
    g.strokeStyle='rgba(150,105,55,.5)'; g.lineWidth=r*0.04;
    for (let i=-2;i<=2;i++){
      g.beginPath(); g.moveTo(x+r*i*0.2, y+r*0.44); g.lineTo(x+r*i*0.1-r*0.1, y+r*1.4); g.stroke();

/* よこを むいている子。よこから 見て 目が2つ 見えることは ないので、
   目は 1つだけに する。むきは かおの ずらし（GFX）と おなじ向き。
   +1 は 右むき、-1 は 左むき */
const GSIDE = { quad:1, fowl:1, kanga:1, unicorn:1,
                clownfish:1, hermit:1, seal:1, shark:1,
                whale:1, dolphin:1, orca:1, turtle:1,
                seahorse:-1 };
/* からだが こい子は 黒い目が しずんで 見えない。
   目を おく ところの 色を **実際に 見て** 決める。
   からだの色（pal[0]）だけで 決めると、ワシのように あたまだけ 白い子や、
   パンダのように 場所で 色が ちがう子を まちがえる。
   一覧を 手で もつのも キャラを 足すたびに 入れわすれるので しない */
function eyeInkAt(g, x, y){
  try{
    const m = g.getTransform();                    // ずらし・拡大を かけた ほんとうの いち
    const px = Math.round(m.a*x + m.c*y + m.e), py = Math.round(m.b*x + m.d*y + m.f);
    const d = g.getImageData(px, py, 1, 1).data;
    if (d[3] < 40) return '#4a3348';               // なにも 塗られていない
    return (0.299*d[0] + 0.587*d[1] + 0.114*d[2]) < 118 ? '#fdfaff' : '#4a3348';
  }catch(e){ return '#4a3348'; }
}

/* 白っぽい子は うすい背景に とけて かたちが 見えない。
   1つ1つの かたちに 線を 引くと、かたちの数が 多くて かならず もれるし、
   かさなった ところにも 線が 出る。そこで からだを 1回 べつの canvas に
   えがき、その かげを 8方向に ずらして 下に しく（ステッカーの ふちどり）。
   こうすると どの型でも 外がわだけに 線が つく */
function drawOutlined(g, S, draw, col){
  const t = document.createElement('canvas'); t.width = t.height = S;
  draw(t.getContext('2d'));
  const sil = document.createElement('canvas'); sil.width = sil.height = S;
  const sg = sil.getContext('2d');
  sg.drawImage(t, 0, 0);
  sg.globalCompositeOperation = 'source-in';     // かたちの中だけを 線の色で ぬる
  sg.fillStyle = col; sg.fillRect(0, 0, S, S);
  const w = S*0.009;
  for (let i=0;i<8;i++){
    const a = i*Math.PI/4;
    g.drawImage(sil, Math.cos(a)*w, Math.sin(a)*w);
  }
  g.drawImage(t, 0, 0);
}

/* かお。図鑑のカードは小さいので 点の目とまるいほっぺ。
   side に 向き（±1）が 入っていたら よこ顔（目は1つ）*/
function gface(g,S,x,y,r,mood,side,ink){
  const dk = ink || '#4a3348';
  if (side){
    const s2 = side;
    g.fillStyle = 'rgba(255,120,165,.4)';                     // ほっぺ
    g.beginPath(); g.arc(x + s2*r*0.5, y + r*0.24, r*0.16, 0, GTAU); g.fill();
    if (mood === 'angry' || mood === 'naughty'){              // まゆ
      const k = mood === 'angry' ? 1 : 0.6;
      g.strokeStyle = dk; g.lineWidth = r*0.09; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x + s2*r*0.4, y - r*(0.36+0.06*k));
      g.lineTo(x + s2*r*0.06, y - r*(0.34-0.05*k));
      g.stroke();
    }
    const ex = x + s2*r*0.22, ey = y - r*0.06;
    g.fillStyle = dk;                                          // 目（1つ）
    g.beginPath(); g.arc(ex, ey, r*0.13, 0, GTAU); g.fill();
    if (dk === '#4a3348'){                                     // こい目：白いひかり
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(ex - s2*r*0.05, ey - r*0.05, r*0.05, 0, GTAU); g.fill();
    } else {                                                   // 白い目：ひとみを 入れる。
      g.fillStyle = '#4a3348';                                 // でないと まっ白の 板に 見える
      g.beginPath(); g.arc(ex + s2*r*0.02, ey + r*0.01, r*0.07, 0, GTAU); g.fill();
    }
    return;
  }
  g.fillStyle = 'rgba(255,120,165,.4)';
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.52, y+r*0.2, r*0.17, 0, GTAU); g.fill(); }
  if (mood === 'angry' || mood === 'naughty'){
    const k = mood === 'angry' ? 1 : 0.6;
    g.strokeStyle = dk; g.lineWidth = r*0.09; g.lineCap='round';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(x+s*r*0.46, y-r*(0.36+0.06*k));
      g.lineTo(x+s*r*0.16, y-r*(0.34-0.05*k));
      g.stroke();
    }
  }
  g.fillStyle = dk;
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.3, y-r*0.08, r*0.11, 0, GTAU); g.fill(); }
  g.fillStyle = dk === '#4a3348' ? '#fff' : 'rgba(90,70,95,.7)';
  for (const s of [-1,1]){ g.beginPath(); g.arc(x+s*r*0.3-r*0.04, y-r*0.12, r*0.045, 0, GTAU); g.fill(); }
  g.strokeStyle = dk; g.lineWidth = r*0.075; g.lineCap='round';
  g.beginPath();
  if (mood === 'angry') { g.moveTo(x-r*0.14,y+r*0.28); g.lineTo(x+r*0.14,y+r*0.28); }
  else g.arc(x, y+r*0.14, r*0.16, 0.25, Math.PI-0.25);
  g.stroke();
}

/* 4方向にとがった キラキラ */
function gspark(g,x,y,r,rot,col){
  g.save(); g.translate(x,y); g.rotate(rot||0); g.fillStyle = col||'#fff';
  g.beginPath();
  for (let i=0;i<4;i++){
    const a=i*Math.PI/2;
    g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    g.quadraticCurveTo(0,0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
  }
  g.closePath(); g.fill(); g.restore();
}

/* Gemini に えがいてもらった 絵を ためしに はる（tools/gen-art.mjs）。
   いまは クマ・おばけ・ヒツジ の3体だけ。読めた子から さしかわり、
   読めなければ これまでどおり コードで えがく。

   にじいろ版も 同じ 絵を つかう。色は drawGenFx が あとから
   合成で 変えるので、絵は 1枚で 足りる */
const ART_SPRITE = {};

/* ワザを もつ なかま（12）と でんせつ（3）が つかう 絵。
   pid は もとの キャラの id の まま（SKILLS と セーブが これで つながって
   いるので 変えられない）。絵の キーだけ 新しい キャラの ものに 向ける。
   **whale を そのまま つかうと コレクションの クジラの 絵が 出る。**
   ART_SPRITE['whale'] は クジラなので、ここで kujaku へ 向けなおす */
const DEX_ART = {
  purin:'koori',   choco:'kaminari', gumgum:'watagumo', donut:'shizuku',
  taffy:'tsumuji', cake:'hanabi',    fairy:'hikari',    prince:'yotsuba',
  apple:'futaba',  queen:'sunadokei', king:'taiyou',    rpurin:'nagareboshi',
  kagero:'kagero',
  whale:'kujaku',  phoenix:'ryu',    chronos:'sphinx',
};

/* どの 絵を つかうかを 決める キー。
   **buildRoster が id を 作るのと 同じ 規則**（opt.key、なければ body）。
   2か所に 書くと ずれる。実際 drawGen が opt.key だけを 見ていた あいだ、
   opt.key を もたない 66体が 絵を もったまま コードで えがかれて いた。
   だから 式は ここ 1つに して、検査（__chk.artKeyOf）にも これを わたす */
/* タワーに はる 絵の 大きさ（R の 何ばいか）。
   ばんめん・バー・図鑑の ぜんぶが これを つかう。
   ちらばらせると 「基本4つだけ 大きい」のような ずれが 起きる。

   絵は わくの 8わりを つかう（fit の きまり）ので、1マスに 対しては
   だいたい こう なる。

     2.7  Lv1 0.67マス / Lv5 0.86マス   はねが あった ころの 大きさ
     3.2  Lv1 0.79マス / Lv5 1.02マス   ← いま。はねを はずした ぶん 上げた
     3.6  Lv1 0.89マス / Lv5 1.15マス   Lv5 が となりに かかりはじめる

   はねと 台座を はずすと まわりが すくので、その ぶんを 絵に まわす。
   3.2 より 上げると 育てた タワーが となりの マスに はみ出す */
const TOWER_PX = 3.2;

const artKeyOf = rc => (rc.opt && rc.opt.key ? rc.opt.key : rc.body);

/* ---------- ① 立体感をつける前に えがく（からだと かお） ---------- */
function drawGen(g, S, rc){
  /* 絵が ある子は はって おしまい。かげ（portraitShade）と
     にじいろ（drawGenFx）は この あとも これまでどおり かかる。

     **にじいろ版も 絵を つかう。**drawGenFx の にじいろは
     globalCompositeOperation:'color' で 「キャンバスの 中みの 色相だけ」を
     ぬりかえる 作りなので、中みが 絵でも そのまま かかる。
     切りぬきも かける前の 中みを mask に して destination-in するので、
     PNG の すきとおりが のこる。
     はじめは 「1枚の絵に すると 色が 変わらなくなる」と 思って よけていたが、
     色を 変えているのは 絵では なく この あとの 合成の ほうだった */
  /* キーは **buildRoster が id を 作るのと 同じ 式**で 出す。
     opt.key が ない子は body が キーに なる。
     opt.key だけを 見ていた あいだ、opt.key を もたない 66体
     （クラゲ・おかしの ほとんど・スライムなど）は 絵が あるのに
     つかわれず、コードで えがかれた ままだった。
     check-chars は わくの はみ出しを 見るので、どちらで えがいても とおる。
     __dbg.art() も「読めた 絵」しか 数えないので 気づけない。
     だから __dbg.artAudit() で「絵が あるのに つかわれない子」を 数える */
  const art = ART_SPRITE[artKeyOf(rc)] || null;
  if (art){ g.drawImage(art, 0, 0, S, S); return; }
  const M = S/2, R = S*0.285, L = LV[rc.lv];   // からだで見わけるので 大きめに
  // 色は その子じたいの色（シャチなら 黒と白）。レベルでは 変えない。
  // 生きものが ほんとうの色をしていないと、ただの色ちがいに 見えてしまうから
  const pal = rc.pal || L.c;
  const c0 = pal[0], c1 = pal[1] || pal[0], c2 = pal[2] || c1;
  const yy = M + S*0.02;
  // 首の長い鳥は からだごと 下がるので、かおと かざりも 同じだけ 下げる
  const nk = (rc.opt && rc.opt.neck) || 0;
  const nkq = rc.body === 'quad' ? nk : 0;   // けものは 下げ幅が ちがう
  // たてに長い子・よこに長い子は わくから はみ出す。
  // からだの形を いじると 別の子まで くずれるので、1体ごとに ずらして 入れる
  const dx = (rc.opt && rc.opt.dx) || 0, dy = (rc.opt && rc.opt.dy) || 0;
  const sc = (rc.opt && rc.opt.sc) || 1;   // 小さすぎる子・大きすぎる子を わくに あわせる
  g.save(); g.translate(S*dx, S*dy);
  if (sc !== 1){ g.translate(M, M); g.scale(sc, sc); g.translate(-M, -M); }
  (GBACK[rc.back] || GBACK.none)(g, S, M, yy, R, c1, L.metal, c2, rc);
  const drawBody = tg => (GBODY[rc.body] || GBODY.ball)(tg, S, M, yy, R, c0, L.metal, c2, rc);
  if (rc.opt && rc.opt.line) drawOutlined(g, S, drawBody, rc.opt.line);
  else drawBody(g);
  (GHEAD[rc.head] || GHEAD.none)(g, S,
     M + R*(GHX[rc.body] || 0), yy + R*((GHY[rc.body] || 0) - nk*(nkq?0.5:0.38)),
     R*(GFR[rc.body] ? GFR[rc.body]*1.25 : 1), c1, L.metal, c2);
  // あたまの形を かえた子は、かおも その大きさに 合わせる。
  // でないと 小さい頭から かおが はみ出す
  const HF = { small:0.74, flat:0.94, wide:1.14, big:1.26, boxy:1.06, long:1.0, round:1 };
  const hk = HF[(rc.opt && rc.opt.head) || 'round'] || 1;
  const fx = M + R*(GFX[rc.body] || 0), fy = yy + R*((GFY[rc.body] || 0) - nk*(nkq?0.5:0.38));
  const fr = R*(GFR[rc.body] || 0.74) * hk;
  // からだが こい子は、かおまわりを 明るくしてから えがく。
  // でないと こい目が こい体に しずんで、顔が 見えなくなる
  const gs = GSIDE[rc.body] || 0;                 // よこ向きか（0なら 前むき）
  /* 目を おく ところが こければ 白い目に する。
     前むきの子は かこい（fbg）で 明るくするので ふつうは そのままで よいが、
     パンダのように こい もようの 上に 目が のる子は 読まないと 目が 消える。
     **かおの まん中ではなく、目そのものの いちを 読む**こと。
     まん中を 読むと、クマのように はなが こい子で まちがえる */
  const ink = (gs || rc.body === 'teddy')
    ? eyeInkAt(g, fx + (gs ? gs*0.22 : -0.3) * fr, fy - fr*0.07)
    : '#4a3348';
  // よこ顔は 目が1つだけなので、まわりを 明るくしなくても 白い目で 見える。
  // かこいを 出すと そこだけ 色が ぬけて 見えるので、前むきの子だけに する
  if (rc.fbg && !gs){
    // かおの まわりだけ 明るくする。ひろげすぎると 体の色まで 白くとんで、
    // チョコが 灰色の板に 見えてしまう
    const fg = g.createRadialGradient(fx, fy, 0, fx, fy, fr*1.05);
    fg.addColorStop(0,   'rgba(255,255,255,.8)');
    fg.addColorStop(0.5, 'rgba(255,255,255,.55)');
    fg.addColorStop(1,   'rgba(255,255,255,0)');
    g.fillStyle = fg;
    g.beginPath(); g.ellipse(fx, fy, fr*1.05, fr*0.95, 0, 0, GTAU); g.fill();
  }
  gface(g, S, fx, fy, fr, rc.mood, gs, ink);
  (GHOLD[rc.hold] || GHOLD.none)(g, S, M, yy, R, c1, L.metal, c2);
  g.restore();
}

/* ---------- ② 立体感をつけた あとに かさねる（レベルの見せかた） ----------
   かけ算のかげは 色もキラキラも 暗くしてしまうので、
   レベルらしさは 立体感のあとに のせる。
   これをしないと レベル7のにじいろが いちばん くすんで見える */
function drawGenFx(g, S, rc){
  const M = S/2, L = LV[rc.lv], RB = rc.rainbow || L.rainbow;

  // レベル7：にじいろ。「色相だけ」をかえる合成をつかう。
  // ふつうに色をかぶせると 明るさまで変わって、かおも つやも 消えてしまう。
  // ただし この合成は すきとおった外がわまで ぬってしまうので、
  // かける前の形を とっておいて あとで 切りぬく
  if (RB){
    const cv2 = g.canvas;
    const mask = document.createElement('canvas');
    mask.width = cv2.width; mask.height = cv2.height;
    mask.getContext('2d').drawImage(cv2, 0, 0);

    g.save();
    g.globalCompositeOperation = 'color';
    // にじが 1体のなかに ぜんぶ おさまるように、
    // キャンバス全体ではなく キャラのいる範囲に かける。
    // ひろげすぎると 1体につき 1〜2色しか通らず、ただの色ちがいに見える
    const r = g.createLinearGradient(S*0.22, S*0.76, S*0.78, S*0.24);
    // やわらかい にじにするのは 色の「まざりかた」で。
    // ここで うすい色をつかうと 彩度まで うつってしまい、灰色に にごる
    // （この合成は 色あいと 彩度を そのまま もっていくため）。
    // シリーズのパステルを そのままつかうのが ちょうどよい
    const st = ['#ff9ec9','#ffbe8f','#ffd76e','#8fe3c4','#9ed8ff','#c9a7ff','#ff9ec9'];
    const off = (rc.c0 || 0) % st.length;
    for (let k=0;k<st.length;k++) r.addColorStop(k/(st.length-1), st[(k+off)%st.length]);
    g.globalAlpha = 1;
    g.fillStyle = r; g.fillRect(0,0,S,S);
    // ななめの帯だけだと しまに見えるので、まるい色も かさねて にじませる
    const r2 = g.createRadialGradient(S*0.36, S*0.32, 0, S*0.5, S*0.5, S*0.46);
    r2.addColorStop(0, st[(off+3)%st.length]);
    r2.addColorStop(0.6, 'rgba(255,255,255,0)');
    g.globalAlpha = 0.7;
    g.fillStyle = r2; g.fillRect(0,0,S,S);
    g.restore();

    g.save();                                  // もとの形で 切りぬく
    g.globalCompositeOperation = 'destination-in';
    g.setTransform(1,0,0,1,0,0);
    g.drawImage(mask, 0, 0);
    g.restore();

    g.save();                                  // にじの上に 白い照りを もどす
    g.globalCompositeOperation = 'source-atop';
    const w = g.createRadialGradient(M-S*0.19, M-S*0.23, 0, M-S*0.05, M-S*0.05, S*0.4);
    w.addColorStop(0,'rgba(255,255,255,.5)'); w.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = w; g.fillRect(0,0,S,S);
    g.restore();
  }

  // レベル5から：下から金の照りかえしを かるく のせて とくべつ感を出す
  if (L.metal){
    g.save();
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = 0.2;
    const m = g.createLinearGradient(0, S*0.86, 0, S*0.42);
    m.addColorStop(0, L.metal); m.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = m; g.fillRect(0,0,S,S);
    g.restore();
  }

  // キラキラ。レベルが上がるほど 数も大きさも ふえる
  const n = L.sp;
  for (let i=0;i<n;i++){
    const a = i*2.399 + (rc.c0||0)*0.7;
    const rr = S*(0.33 + 0.09*Math.sin(i*1.7 + (rc.c1||0)));
    const big = i % 3 === 0;
    gspark(g, M + Math.cos(a)*rr, M + Math.sin(a)*rr*0.9,
           S*(big ? 0.062 : 0.034), a*2,
           RB ? (i%2 ? '#ffffff' : '#fff0a0') : (big && L.metal ? L.metal : '#ffffff'));
  }
}

   からだの形を いじると おなじ型を つかう別の子まで くずれるので、
   ここでは 1体ずつ ずらし（dx/dy）と 大きさ（sc）だけを 上書きする。
   数字は check.mjs --fit の 自動あわせで 出したもの。手で いじらなくてよい */
const FIT = {
  'おはぎ':{sc:1.223},
  'まじょ':{dy:0.02},
  'まほうつかい':{dy:0.028},
  'まんじゅう':{sc:1.193},
  'もなか':{sc:1.223},

  'わらびもち':{sc:1.28},
  'イルカ':{dx:0.005},
  'カンガルー':{dy:0.013},
  'クジラ':{dx:0.01},
  'クラゲ':{dy:-0.105},
  'コアラ':{dx:-0.042},
  'シャチ':{dx:0.005},
  'ゼリー':{sc:1.371},
  'タツノオトシゴ':{sc:1.185},
  'ハクチョウ':{dx:0.085},
  'マシュマロ':{sc:1.306},
  'ユニコーン':{dy:0.065},
  'ワシ':{dx:0.11},
  'ワッフル':{sc:1.193},
};

function buildRoster(){
  const out = [];
  for (const [body, name, pal, lv, side, opt] of CREATURES){
    const fopt = FIT[name] ? Object.assign({}, opt, FIT[name]) : opt;
    out.push({ id:'c_'+(opt && opt.key ? opt.key : body), name, body, pal, lv, side, opt:fopt,
               head:'none', back:'none', hold:'none',
               // からだが こい子は かおまわりを 明るくする
               // からだが こい子は かおまわりを 明るくする（でないと 目が しずむ）
               fbg: ['orca','butterfly','penguin','manta','clownfish',
                     'ohagi','youkan','golem'].includes(body)
                    || (opt && ['ladybug','tiger','wolf',
                                'owl','eagle','zebra','devil','wizard'].includes(opt.key))
                    || ['golem'].includes(body),
               mood: side === 'en' ? 'naughty' : 'smile',
               cells: lv >= 5 ? 2 : 1 });
  }
  return out;
}
