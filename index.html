   1着ずつ 胴の形・そで・すそから 別々に えがくことにした。

   ぜんぶ (g, o) を うけとる。o = { M, by, R, wear, skin }。
   あしと くつは これより 先に えがいてあるので、すそを かぶせると
   ももが 下に もぐって「ふくと あしが はなれている」ように 見えない。
   ========================================================== */
/* ふくの こい色・うすい色。上下で 少しだけ 色を ずらすと、
   1まいの ぬのでなく「上着とズボン」の 組みあわせに 見える */
function avShade(hex, t){
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.round(t < 0 ? v*(1+t) : v + (255-v)*t);
  return 'rgb(' + f((n>>16)&255) + ',' + f((n>>8)&255) + ',' + f(n&255) + ')';
}
const AV_LINE = 'rgba(120,90,120,.22)';   // 胴と おなじ色の そでが とけないように 引く ふち

/* ズボン。2本に わけると、ワンピースとの ちがいが ひとめで わかる */
function avPants(g, o, col, len, hipW){
  const { M, by, R } = o;
  g.fillStyle = col;
  for (const s of [-1,1]){ gRR(g, M + s*R*0.42 - R*0.3, by + R*0.04, R*0.6, len, R*0.16); g.fill(); }
  const w = hipW === undefined ? R*1.36 : hipW;
  gRR(g, M - w/2, by - R*0.06, w, R*0.38, R*0.13); g.fill();
}

/* うで。そでの形で 服の印象が いちばん 変わるので、1着ずつ えらぶ */
function avArm(g, o, kind){
  const { M, by, R, wear, skin } = o;
  g.strokeStyle = AV_LINE; g.lineWidth = R*0.05;
  for (const s of [-1,1]){
    if (kind === 'bare'){                 // そでなし
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(M + s*R*0.84, by - R*0.24, R*0.15, R*0.46, s*0.3, 0, GTAU); g.fill();
    } else if (kind === 'wide'){          // ふりそで・ローブ：手もとが ひろがる
      g.fillStyle = wear;
      g.beginPath();
      g.moveTo(M + s*R*0.6,  by - R*0.76);
      g.quadraticCurveTo(M + s*R*1.06, by - R*0.5,  M + s*R*1.12, by + R*0.3);
      g.quadraticCurveTo(M + s*R*0.84, by + R*0.42, M + s*R*0.56, by + R*0.16);
      g.closePath(); g.fill(); g.stroke();
    } else if (kind === 'puff'){          // ぱふそで：かたが まるく ふくらむ
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(M + s*R*0.9, by - R*0.06, R*0.13, R*0.34, s*0.3, 0, GTAU); g.fill();
      // まるごと ふちを引くと、胴に かさなった ところに 線が のこって
      // そでが 宙に うかんで 見える。外がわの かげだけで 立体を 出す
      g.fillStyle = wear;
      g.beginPath(); g.arc(M + s*R*0.72, by - R*0.56, R*0.28, 0, GTAU); g.fill();
      g.fillStyle = 'rgba(120,90,120,.12)';
      g.beginPath(); g.arc(M + s*R*0.72, by - R*0.56, R*0.28, s>0 ? -0.5 : 1.4, s>0 ? 1.7 : 3.6); g.fill();
    } else if (kind === 'short'){         // はんそで
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(M + s*R*0.88, by, R*0.13, R*0.32, s*0.3, 0, GTAU); g.fill();
      g.fillStyle = wear;
      g.beginPath(); g.ellipse(M + s*R*0.74, by - R*0.5, R*0.21, R*0.28, s*0.2, 0, GTAU); g.fill(); g.stroke();
    } else if (kind === 'cuff'){          // ながそで＋そでぐち
      g.fillStyle = wear;
      g.beginPath(); g.ellipse(M + s*R*0.84, by - R*0.3, R*0.19, R*0.48, s*0.3, 0, GTAU); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.7)';
      g.beginPath(); g.ellipse(M + s*R*0.94, by + R*0.04, R*0.15, R*0.1, s*0.3, 0, GTAU); g.fill();
    } else {                              // ながそで（ふつう）
      g.fillStyle = wear;
      g.beginPath(); g.ellipse(M + s*R*0.84, by - R*0.28, R*0.18, R*0.46, s*0.3, 0, GTAU); g.fill(); g.stroke();
    }
  }
  g.fillStyle = skin;                     // て は そでの さきに
  for (const s of [-1,1]){
    g.beginPath(); g.arc(M + s*R*1.0, by + R*0.16, R*0.17, 0, GTAU); g.fill();
  }
}

/* AV_WEAR の ならびと そろえること（0=ワンピース … 11=エプロン）*/
const AV_WEAR_DRAW = [
  /* 0 ワンピース：むねから すそへ ゆるやかな Aライン。こしに リボン */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = wear;
    g.beginPath();
    g.moveTo(M - R*0.56, by - R*0.84);
    g.lineTo(M - R*0.5, by - R*0.02);
    g.quadraticCurveTo(M - R*0.92, by + R*0.4, M - R*0.96, by + R*0.76);
    g.quadraticCurveTo(M, by + R*0.96, M + R*0.96, by + R*0.76);
    g.quadraticCurveTo(M + R*0.92, by + R*0.4, M + R*0.5, by - R*0.02);
    g.lineTo(M + R*0.56, by - R*0.84);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';                 // まるい えり
    g.beginPath(); g.ellipse(M, by - R*0.82, R*0.34, R*0.17, 0, 0, Math.PI); g.fill();
    g.fillStyle = avShade(wear, -0.3);                    // こしの リボン
    gRR(g, M - R*0.52, by - R*0.14, R*1.04, R*0.18, R*0.08); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(M + s*R*0.15, by - R*0.05, R*0.14, R*0.09, s*0.5, 0, GTAU); g.fill();
    }
    // すその ふちどりは 線で 引く。四角で のせると すそから はみ出す
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = R*0.08;
    g.beginPath(); g.moveTo(M - R*0.93, by + R*0.72);
    g.quadraticCurveTo(M, by + R*0.9, M + R*0.93, by + R*0.72); g.stroke();
    avArm(g, o, 'puff');
  },

  /* 1 パーカー：四角い ゆったりした 胴＋ハーフパンツ。フードと ひも */
  (g, o) => { const { M, by, R, wear } = o;
    const dk = avShade(wear, -0.3);
    avPants(g, o, avShade(wear, -0.5), R*0.62, R*1.4);
    g.fillStyle = dk;                                     // うしろの フード
    g.beginPath(); g.ellipse(M, by - R*0.76, R*0.62, R*0.3, 0, 0, GTAU); g.fill();
    g.fillStyle = wear;
    gRR(g, M - R*0.78, by - R*0.8, R*1.56, R*1.2, R*0.26); g.fill();
    g.fillStyle = dk;                                     // すその リブ
    gRR(g, M - R*0.78, by + R*0.24, R*1.56, R*0.16, R*0.07); g.fill();
    g.fillStyle = 'rgba(120,90,120,.14)';                 // おなかの ポケット
    gRR(g, M - R*0.46, by - R*0.18, R*0.92, R*0.36, R*0.12); g.fill();
    g.fillStyle = dk;                                     // フードの うちがわ
    g.beginPath(); g.ellipse(M, by - R*0.78, R*0.44, R*0.2, 0, 0, Math.PI); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = R*0.07; g.lineCap = 'round';
    for (const s of [-1,1]){
      g.beginPath(); g.moveTo(M + s*R*0.16, by - R*0.58); g.lineTo(M + s*R*0.2, by - R*0.24); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.92)';
    for (const s of [-1,1]){ g.beginPath(); g.arc(M + s*R*0.2, by - R*0.22, R*0.06, 0, GTAU); g.fill(); }
    avArm(g, o, 'cuff');
  },

  /* 2 セーラー：みじかい 上着＋プリーツスカート。大きな えりと スカーフ */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = avShade(wear, -0.3);
    g.beginPath();                                        // 台形の スカート
    g.moveTo(M - R*0.6, by + R*0.04); g.lineTo(M + R*0.6, by + R*0.04);
    g.lineTo(M + R*0.98, by + R*0.72); g.lineTo(M - R*0.98, by + R*0.72);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.32)'; g.lineWidth = R*0.05;   // ひだ
    for (const d of [-0.62,-0.31,0,0.31,0.62]){
      g.beginPath(); g.moveTo(M + R*d*0.6, by + R*0.1); g.lineTo(M + R*d, by + R*0.7); g.stroke();
    }
    g.fillStyle = wear;
    gRR(g, M - R*0.66, by - R*0.84, R*1.32, R*0.98, R*0.2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.94)';                // セーラーえり
    g.beginPath();
    g.moveTo(M - R*0.72, by - R*0.82); g.lineTo(M + R*0.72, by - R*0.82);
    g.lineTo(M + R*0.5, by - R*0.2); g.lineTo(M, by + R*0.02); g.lineTo(M - R*0.5, by - R*0.2);
    g.closePath(); g.fill();
    g.fillStyle = '#ff5f8a';                              // スカーフ
    g.beginPath();
    g.moveTo(M, by - R*0.36); g.lineTo(M + R*0.16, by - R*0.12);
    g.lineTo(M, by + R*0.3); g.lineTo(M - R*0.16, by - R*0.12);
    g.closePath(); g.fill();
    avArm(g, o, 'short');
  },

  /* 3 ドレス：こしで きゅっと しぼって、そこから 大きく ひろがる。
     ワンピースと ちがうのは この しぼりと すその 長さ */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = wear;
    g.beginPath();
    g.moveTo(M - R*0.58, by - R*0.8);
    g.quadraticCurveTo(M - R*0.46, by - R*0.3, M - R*0.36, by - R*0.02);   // こしの しぼり
    g.bezierCurveTo(M - R*0.9, by + R*0.3, M - R*1.14, by + R*0.6, M - R*1.2, by + R*0.9);
    g.quadraticCurveTo(M, by + R*1.14, M + R*1.2, by + R*0.9);
    g.bezierCurveTo(M + R*1.14, by + R*0.6, M + R*0.9, by + R*0.3, M + R*0.36, by - R*0.02);
    g.quadraticCurveTo(M + R*0.46, by - R*0.3, M + R*0.58, by - R*0.8);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.3)';                 // 上の だんの すそ
    g.beginPath();
    g.moveTo(M - R*0.6, by + R*0.16);
    g.bezierCurveTo(M - R*0.86, by + R*0.32, M - R*0.94, by + R*0.44, M - R*0.96, by + R*0.56);
    for (let i=-3;i<=3;i++){                              // スカラップ（なみの すそ）
      g.arc(M + R*i*0.32, by + R*0.58, R*0.17, Math.PI, 0, true);
    }
    g.bezierCurveTo(M + R*0.94, by + R*0.44, M + R*0.86, by + R*0.32, M + R*0.6, by + R*0.16);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // むねの ハートがた
    g.beginPath();
    g.moveTo(M - R*0.52, by - R*0.76);
    g.quadraticCurveTo(M - R*0.26, by - R*0.4, M, by - R*0.54);
    g.quadraticCurveTo(M + R*0.26, by - R*0.4, M + R*0.52, by - R*0.76);
    g.closePath(); g.fill();
    g.fillStyle = '#ffd76e';                              // こしの かざり
    g.beginPath(); g.arc(M, by - R*0.02, R*0.12, 0, GTAU); g.fill();
    for (const [dx,dy] of [[-0.5,0.24],[0.48,0.36],[0.04,0.62],[-0.22,0.5]])
      gspark(g, M + R*dx, by + R*dy, R*0.12, 0.4, 'rgba(255,255,255,.9)');
    avArm(g, o, 'puff');
  },

  /* 4 まほうのローブ：かたに マント、すそは とがる。ふりそで */
  (g, o) => { const { M, by, R, wear } = o;
    const dk = avShade(wear, -0.34);
    g.fillStyle = wear;                                   // 下へ ひろがり、すそが とがる
    g.beginPath();
    g.moveTo(M - R*0.58, by - R*0.82);
    g.lineTo(M - R*0.96, by + R*0.6);
    g.lineTo(M - R*0.62, by + R*0.5); g.lineTo(M - R*0.31, by + R*0.9);
    g.lineTo(M, by + R*0.5);          g.lineTo(M + R*0.31, by + R*0.9);
    g.lineTo(M + R*0.62, by + R*0.5); g.lineTo(M + R*0.96, by + R*0.6);
    g.lineTo(M + R*0.58, by - R*0.82);
    g.closePath(); g.fill();
    g.fillStyle = avShade(wear, 0.3);                     // まえの あわせ
    g.beginPath();
    g.moveTo(M - R*0.2, by - R*0.3); g.lineTo(M + R*0.2, by - R*0.3);
    g.lineTo(M + R*0.14, by + R*0.52); g.lineTo(M - R*0.14, by + R*0.52);
    g.closePath(); g.fill();
    g.fillStyle = dk;                                     // かたに かける みじかい マント
    g.beginPath();
    g.moveTo(M - R*0.8, by - R*0.72);
    g.quadraticCurveTo(M, by - R*0.94, M + R*0.8, by - R*0.72);
    g.quadraticCurveTo(M + R*0.5, by - R*0.34, M, by - R*0.26);
    g.quadraticCurveTo(M - R*0.5, by - R*0.34, M - R*0.8, by - R*0.72);
    g.closePath(); g.fill();
    g.fillStyle = '#ffd76e';                              // えりの とめ具
    g.beginPath(); g.arc(M, by - R*0.66, R*0.11, 0, GTAU); g.fill();
    g.fillStyle = dk;                                     // ベルト
    gRR(g, M - R*0.6, by + R*0.02, R*1.2, R*0.16, R*0.06); g.fill();
    for (const [dx,dy] of [[-0.5,0.4],[0.46,0.32],[0.02,0.48],[0.26,0.6]])
      gspark(g, M + R*dx, by + R*dy, R*0.13, 0.4, 'rgba(255,255,255,.85)');
    avArm(g, o, 'wide');
  },

  /* 5 パジャマ：ゆったりした 上着＋ながズボン。しましまと かえりえり */
  (g, o) => { const { M, by, R, wear } = o;
    const lt = avShade(wear, 0.24);
    avPants(g, o, lt, R*0.94, R*1.4);
    g.fillStyle = 'rgba(255,255,255,.5)';                 // すそぐち
    for (const s of [-1,1]){ gRR(g, M + s*R*0.42 - R*0.3, by + R*0.86, R*0.6, R*0.12, R*0.06); g.fill(); }
    g.fillStyle = wear;
    gRR(g, M - R*0.74, by - R*0.82, R*1.48, R*1.0, R*0.2); g.fill();
    g.save();                                             // しましまは 上着の中だけに
    gRR(g, M - R*0.74, by - R*0.82, R*1.48, R*1.0, R*0.2); g.clip();
    g.fillStyle = 'rgba(255,255,255,.42)';
    for (let i=0;i<4;i++){ gRR(g, M - R*0.74, by - R*0.64 + i*R*0.28, R*1.48, R*0.12, R*0.06); g.fill(); }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.9)';                 // かえりえり
    g.beginPath();
    g.moveTo(M - R*0.46, by - R*0.82); g.lineTo(M, by - R*0.3); g.lineTo(M + R*0.46, by - R*0.82);
    g.lineTo(M + R*0.2, by - R*0.86); g.lineTo(M, by - R*0.5); g.lineTo(M - R*0.2, by - R*0.86);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(120,90,120,.26)';                 // ボタン
    for (let i=0;i<3;i++){ g.beginPath(); g.arc(M, by - R*0.2 + i*R*0.24, R*0.06, 0, GTAU); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.7)';                 // むねの おつきさま
    g.beginPath(); g.arc(M - R*0.44, by - R*0.36, R*0.14, 0.7, 4.3); g.fill();
    avArm(g, o, 'cuff');
  },

  /* 6 きもの：ひろがらない まっすぐな シルエット。あわせと おび、ふりそで */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = wear;
    g.beginPath();
    g.moveTo(M - R*0.64, by - R*0.82); g.lineTo(M - R*0.52, by + R*0.86);
    g.lineTo(M + R*0.52, by + R*0.86); g.lineTo(M + R*0.64, by - R*0.82);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // えりの あわせ
    g.beginPath();
    g.moveTo(M - R*0.46, by - R*0.8); g.lineTo(M, by - R*0.1);
    g.lineTo(M + R*0.46, by - R*0.8); g.lineTo(M + R*0.22, by - R*0.86);
    g.lineTo(M, by - R*0.4); g.lineTo(M - R*0.22, by - R*0.86);
    g.closePath(); g.fill();
    g.fillStyle = '#e8506f';                              // おび
    gRR(g, M - R*0.58, by - R*0.06, R*1.14, R*0.3, R*0.06); g.fill();
    g.fillStyle = '#ffd76e';                              // おびじめ
    gRR(g, M - R*0.58, by + R*0.08, R*1.14, R*0.08, R*0.04); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)';                 // すそもよう
    for (const [dx,dy] of [[-0.3,0.62],[0.06,0.74],[0.34,0.58]]){
      g.beginPath(); g.arc(M + R*dx, by + R*dy, R*0.11, 0, GTAU); g.fill();
    }
    avArm(g, o, 'wide');
  },

  /* 7 Tシャツ：みじかい 箱がたの 上＋ショートパンツ。むねに ほし */
  (g, o) => { const { M, by, R, wear } = o;
    avPants(g, o, avShade(wear, -0.5), R*0.5, R*1.3);
    g.fillStyle = wear;
    gRR(g, M - R*0.72, by - R*0.84, R*1.44, R*1.0, R*0.16); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // まるい えりぐり
    g.beginPath(); g.ellipse(M, by - R*0.84, R*0.3, R*0.15, 0, 0, Math.PI); g.fill();
    gspark(g, M, by - R*0.24, R*0.32, 0.5, 'rgba(255,255,255,.95)');
    g.strokeStyle = 'rgba(120,90,120,.18)'; g.lineWidth = R*0.05;   // すその ぬいめ
    g.beginPath(); g.moveTo(M - R*0.64, by + R*0.06); g.lineTo(M + R*0.64, by + R*0.06); g.stroke();
    avArm(g, o, 'short');
  },

  /* 8 コート：ひざ下まで ある 前あき。おおきな えりと ベルト */
  (g, o) => { const { M, by, R, wear } = o;
    const dk = avShade(wear, -0.3), lt = avShade(wear, 0.32);
    g.fillStyle = lt;                                     // 中に 着ている ふく
    gRR(g, M - R*0.44, by - R*0.8, R*0.88, R*1.3, R*0.14); g.fill();
    g.fillStyle = wear;                                   // 前あきなので 左右 べつに
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.08, by - R*0.84);
      g.lineTo(M + s*R*0.7, by - R*0.84);
      g.quadraticCurveTo(M + s*R*0.96, by + R*0.3, M + s*R*0.88, by + R*0.84);
      g.lineTo(M + s*R*0.07, by + R*0.84);
      g.closePath(); g.fill();
    }
    g.fillStyle = dk;                                     // おおきな えり
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.05, by - R*0.84); g.lineTo(M + s*R*0.7, by - R*0.84);
      g.lineTo(M + s*R*0.24, by - R*0.16);
      g.closePath(); g.fill();
    }
    g.fillStyle = dk;                                     // ベルト
    gRR(g, M - R*0.84, by + R*0.06, R*1.68, R*0.2, R*0.08); g.fill();
    g.fillStyle = '#ffd76e';                              // バックル
    gRR(g, M - R*0.13, by + R*0.04, R*0.26, R*0.24, R*0.06); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // ふたならびの ボタン
    for (const s of [-1,1]) for (let i=0;i<2;i++){
      g.beginPath(); g.arc(M + s*R*0.32, by - R*0.34 + i*R*0.24, R*0.07, 0, GTAU); g.fill();
    }
    avArm(g, o, 'cuff');
  },

  /* 9 チュチュ：ぴったりの レオタード＋よこに ひろがる すそ。
     ふわふわを 下に たらすと ドレスと 見わけが つかないので、
     バレエらしく 水平に つき出す */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = wear;
    gRR(g, M - R*0.44, by - R*0.82, R*0.88, R*1.02, R*0.22); g.fill();
    // 白いだけだと 背景に とけて 見えないので、服の色を ふちに のこす
    g.fillStyle = avShade(wear, 0.3);
    g.beginPath(); g.ellipse(M, by + R*0.38, R*1.16, R*0.34, 0, 0, GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';
    g.beginPath(); g.ellipse(M, by + R*0.36, R*1.0, R*0.26, 0, 0, GTAU); g.fill();
    g.fillStyle = avShade(wear, 0.55);
    g.beginPath(); g.ellipse(M, by + R*0.28, R*0.8, R*0.22, 0, 0, GTAU); g.fill();
    g.fillStyle = wear;                                   // こしの おび
    gRR(g, M - R*0.46, by + R*0.1, R*0.92, R*0.16, R*0.07); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // むねの かた ひも（Vに かける）
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = R*0.09; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(M - R*0.34, by - R*0.8); g.lineTo(M, by - R*0.44); g.lineTo(M + R*0.34, by - R*0.8);
    g.stroke();
    g.fillStyle = '#ff9ec9';                              // むねの ちいさな リボン
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(M + s*R*0.1, by - R*0.4, R*0.1, R*0.07, s*0.5, 0, GTAU); g.fill();
    }
    for (const [dx,dy] of [[-0.78,0.2],[0.76,0.24],[0,0.56]])
      gspark(g, M + R*dx, by + R*dy, R*0.12, 0.4, 'rgba(255,255,255,.9)');
    avArm(g, o, 'bare');
  },

  /* 10 スポーツ：かたひもの タンクトップ＋ハーフパンツ。よこ ライン */
  (g, o) => { const { M, by, R, wear } = o;
    const dk = avShade(wear, -0.36);
    avPants(g, o, dk, R*0.56, R*1.24);
    g.fillStyle = wear;
    g.beginPath();
    g.moveTo(M - R*0.42, by - R*0.86); g.lineTo(M - R*0.2, by - R*0.86);
    g.quadraticCurveTo(M, by - R*0.62, M + R*0.2, by - R*0.86);
    g.lineTo(M + R*0.42, by - R*0.86);
    g.quadraticCurveTo(M + R*0.68, by - R*0.46, M + R*0.64, by + R*0.14);
    g.lineTo(M - R*0.64, by + R*0.14);
    g.quadraticCurveTo(M - R*0.68, by - R*0.46, M - R*0.42, by - R*0.86);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';                 // よこの ライン
    for (const s of [-1,1]){ gRR(g, M + s*R*0.54 - R*0.04, by - R*0.4, R*0.08, R*0.54, R*0.04); g.fill(); }
    gRR(g, M - R*0.62, by + R*0.02, R*1.24, R*0.09, R*0.045); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)';                // ゼッケン
    g.beginPath(); g.arc(M, by - R*0.3, R*0.2, 0, GTAU); g.fill();
    g.fillStyle = dk;
    g.beginPath(); g.arc(M, by - R*0.3, R*0.1, 0, GTAU); g.fill();
    avArm(g, o, 'bare');
  },

  /* 11 エプロン：下に ワンピース、上に むねあて＋こしリボン */
  (g, o) => { const { M, by, R, wear } = o;
    g.fillStyle = wear;
    g.beginPath();
    g.moveTo(M - R*0.56, by - R*0.84);
    g.quadraticCurveTo(M - R*0.66, by + R*0.2, M - R*0.92, by + R*0.76);
    g.quadraticCurveTo(M, by + R*0.94, M + R*0.92, by + R*0.76);
    g.quadraticCurveTo(M + R*0.66, by + R*0.2, M + R*0.56, by - R*0.84);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.94)';                // むねあてと すそ
    g.beginPath();
    g.moveTo(M - R*0.3, by - R*0.74); g.lineTo(M + R*0.3, by - R*0.74);
    g.lineTo(M + R*0.34, by - R*0.08); g.lineTo(M + R*0.6, by + R*0.68);
    g.quadraticCurveTo(M, by + R*0.84, M - R*0.6, by + R*0.68);
    g.lineTo(M - R*0.34, by - R*0.08);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.94)'; g.lineWidth = R*0.1; g.lineCap = 'round';
    for (const s of [-1,1]){                              // かたひも
      g.beginPath(); g.moveTo(M + s*R*0.26, by - R*0.72);
      g.quadraticCurveTo(M + s*R*0.44, by - R*0.88, M + s*R*0.5, by - R*0.8); g.stroke();
    }
    g.fillStyle = 'rgba(120,90,120,.14)';                 // ポケット
    gRR(g, M - R*0.26, by + R*0.2, R*0.52, R*0.26, R*0.08); g.fill();
    g.fillStyle = avShade(wear, -0.32);                   // こしの リボン
    gRR(g, M - R*0.54, by - R*0.1, R*1.08, R*0.16, R*0.07); g.fill();
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(M + s*R*0.16, by - R*0.02, R*0.15, R*0.1, s*0.5, 0, GTAU); g.fill();
    }
    avArm(g, o, 'short');
  },
];


/* かみの けを ふさっと えがく。まるを かさねると 手がきの やわらかさが 出る */
function avHairBlob(g, x, y, rx, ry, rot){
  g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, GTAU); g.fill();
}

function drawAvatar(g, S, av){
  const M = S/2;
  const R = S*0.2;                        // あたまの 半けい（2頭身の かわいい ばらんす）
  const hy = M - S*0.17;                  // あたまの まん中
  const by = M + S*0.193;                 // からだの まん中（くつが 下で 切れない ぎりぎり）
  const skin = AV_SKIN[av.s % AV_SKIN.length];
  const hair = AV_HAIRC[av.hc % AV_HAIRC.length];
  const wear = AV_WEARC[av.wc % AV_WEARC.length];
  const H = av.h % AV_HAIR.length, W = av.w % AV_WEAR.length, A = av.a % AV_ACC.length;

  /* ---- うしろがみ（からだより おく）---- */
  g.fillStyle = hair;
  if (H === 1 || H === 7){                // ロング・うしろがみ
    g.beginPath();
    // ぜんぶ おおうと マトリョーシカに 見えるので、はばを つめて こしで とめる
    g.moveTo(M - R*1.0, hy);
    g.bezierCurveTo(M - R*1.18, hy + R*1.1, M - R*1.02, hy + R*1.7, M - R*0.8, hy + R*1.88);
    g.quadraticCurveTo(M, hy + R*2.12, M + R*0.8, hy + R*1.88);
    g.bezierCurveTo(M + R*1.02, hy + R*1.7, M + R*1.18, hy + R*1.1, M + R*1.0, hy);
    g.closePath(); g.fill();
  } else if (H === 2){                    // ツインテール
    for (const s of [-1,1]){
      avHairBlob(g, M + s*R*1.24, hy + R*0.44, R*0.4, R*0.82, s*0.3);
      avHairBlob(g, M + s*R*1.38, hy + R*1.34, R*0.32, R*0.62, s*0.2);
    }
  } else if (H === 4){                    // ポニーテール
    g.beginPath();
    g.moveTo(M + R*0.8, hy - R*0.3);
    g.bezierCurveTo(M + R*1.76, hy - R*0.2, M + R*1.66, hy + R*1.5, M + R*1.02, hy + R*1.82);
    g.bezierCurveTo(M + R*1.3, hy + R*0.96, M + R*1.14, hy + R*0.3, M + R*0.7, hy + R*0.2);
    g.closePath(); g.fill();
  } else if (H === 6){                    // みつあみ
    for (const s of [-1,1]) for (let i=0;i<3;i++)
      avHairBlob(g, M + s*R*1.1, hy + R*(0.46 + i*0.56), R*0.27, R*0.32, 0);
  } else if (H === 8){                    // ぱっつん：かたに つく まっすぐな かみ
    g.beginPath();
    g.moveTo(M - R*1.02, hy);
    g.lineTo(M - R*1.02, hy + R*1.34);
    g.quadraticCurveTo(M, hy + R*1.56, M + R*1.02, hy + R*1.34);
    g.lineTo(M + R*1.02, hy);
    g.closePath(); g.fill();
  } else if (H === 9){                    // ボブ：あごの あたりで まるく
    g.beginPath();
    g.moveTo(M - R*1.04, hy);
    g.bezierCurveTo(M - R*1.14, hy + R*0.8, M - R*0.8, hy + R*1.12, M, hy + R*1.14);
    g.bezierCurveTo(M + R*0.8, hy + R*1.12, M + R*1.14, hy + R*0.8, M + R*1.04, hy);
    g.closePath(); g.fill();
  } else if (H === 10){                   // サイドテール：かた がわだけ
    avHairBlob(g, M + R*1.22, hy + R*0.3, R*0.42, R*0.66, 0.34);
    avHairBlob(g, M + R*1.42, hy + R*1.1, R*0.34, R*0.56, 0.2);
    avHairBlob(g, M + R*1.5,  hy + R*1.78, R*0.26, R*0.4, 0.1);
  } else if (H === 11){                   // ドリル：まきげ（まるを らせんに）
    for (const s of [-1,1]) for (let i=0;i<4;i++){
      const t = i/3;
      avHairBlob(g, M + s*R*(1.1 + Math.sin(i*1.9)*0.16), hy + R*(0.4 + i*0.5),
                 R*(0.4 - t*0.13), R*(0.4 - t*0.13), 0);
    }
  } else if (H === 12){                   // はねっけ：えりあしが そとへ はねる
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.7, hy + R*0.2);
      g.quadraticCurveTo(M + s*R*1.5, hy + R*0.66, M + s*R*1.44, hy + R*1.02);
      g.quadraticCurveTo(M + s*R*1.06, hy + R*0.7, M + s*R*0.6, hy + R*0.7);
      g.closePath(); g.fill();
    }
  } else if (H === 13){                   // アップ：まとめた かみが 上に
    avHairBlob(g, M, hy - R*1.12, R*0.58, R*0.5, 0);
    for (const s of [-1,1])               // おくれ毛
      avHairBlob(g, M + s*R*1.0, hy + R*0.44, R*0.2, R*0.5, s*0.16);
  }

  /* ---- あしと くつ ----
     ふくより 先に えがいて、ももを すその 下に もぐりこませる。
     あとから えがくと、すその 下はしと あしの 上はしの あいだが
     すき間に なって「ふくと あしが はなれている」ように 見える */
  g.fillStyle = skin;
  for (const s of [-1,1]){
    g.beginPath();
    g.ellipse(M + s*R*0.3, by + R*0.95, R*0.17, R*0.42, 0, 0, GTAU); g.fill();
  }
  g.fillStyle = '#8a6d8d';                // くつ
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*0.3, by + R*1.32, R*0.22, R*0.14, 0, 0, GTAU); g.fill();
  }

  /* ---- からだ（ふく）----
     もようだけを 差しかえていたころは、どれも おなじ シルエットで
     ならべると「ぜんぶ 同じ服」に 見えていた。だから 1着ずつ
     胴の形・そで・すその 形から 別々に えがく（AV_WEAR_DRAW）*/
  (AV_WEAR_DRAW[W] || AV_WEAR_DRAW[0])(g, { M, by, R, wear, skin });

  /* ---- くび と あたま ---- */
  g.fillStyle = skin;
  gRR(g, M - R*0.2, hy + R*0.68, R*0.4, R*0.44, R*0.12); g.fill();
  g.beginPath(); g.ellipse(M, hy, R*1.02, R*0.98, 0, 0, GTAU); g.fill();
  /* みみ */
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*1.0, hy + R*0.12, R*0.16, R*0.22, 0, 0, GTAU); g.fill();
  }

  /* ---- まえがみ ----
     かみを かおの上に かぶせると 目が かくれてしまう。
     「かみで あたまを おおう → かおを 出す → ひたいに まえがみを かける」の順にする */
  g.fillStyle = hair;
  if (H === 5){                           // くるくる：大きめの まるを ふんわり
    for (const s2 of [[-0.92,-0.3,0.46],[-0.58,-0.72,0.42],[0,-0.86,0.44],
                      [0.58,-0.72,0.42],[0.92,-0.3,0.46]])
      avHairBlob(g, M + R*s2[0], hy + R*s2[1], R*s2[2], R*s2[2]*0.92, 0);
    avHairBlob(g, M, hy - R*0.24, R*1.06, R*0.86, 0);
  } else if (H === 3){                    // おだんご
    avHairBlob(g, M, hy - R*0.16, R*1.06, R*0.88, 0);
    avHairBlob(g, M, hy - R*1.16, R*0.44, R*0.42, 0);
  } else if (H === 11){                   // ドリル：てっぺんも ふんわり
    avHairBlob(g, M, hy - R*0.2, R*1.08, R*0.94, 0);
  } else {
    avHairBlob(g, M, hy - R*0.14, R*1.06, R*0.9, 0);
  }
  /* かおを 出す（かみは まわりの ふちとして のこる）*/
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(M, hy + R*0.22, R*0.84, R*0.78, 0, 0, GTAU); g.fill();
  /* ひたいの まえがみ。かおの 上がわに ゆるく かける */
  g.fillStyle = hair;
  g.beginPath();
  if (H === 8 || H === 9){                // ぱっつん・ボブ：まっすぐ そろえた まえがみ
    g.moveTo(M - R*0.88, hy - R*0.06);
    g.quadraticCurveTo(M, hy + R*0.06, M + R*0.88, hy - R*0.06);
    g.lineTo(M + R*0.88, hy - R*0.7); g.lineTo(M - R*0.88, hy - R*0.7);
  } else if (H === 13){                   // アップ：ひたいを ひろく 見せる
    g.moveTo(M - R*0.86, hy - R*0.3);
    g.quadraticCurveTo(M - R*0.2, hy + R*0.06, M + R*0.5, hy - R*0.34);
    g.quadraticCurveTo(M + R*0.76, hy - R*0.2, M + R*0.86, hy - R*0.4);
    g.lineTo(M + R*0.86, hy - R*0.7); g.lineTo(M - R*0.86, hy - R*0.7);
  } else {
    g.moveTo(M - R*0.86, hy - R*0.2);
    g.quadraticCurveTo(M - R*0.5, hy + R*0.24, M - R*0.16, hy - R*0.06);
    g.quadraticCurveTo(M + R*0.2, hy + R*0.3, M + R*0.56, hy - R*0.1);
    g.quadraticCurveTo(M + R*0.78, hy + R*0.1, M + R*0.86, hy - R*0.2);
    g.lineTo(M + R*0.86, hy - R*0.7); g.lineTo(M - R*0.86, hy - R*0.7);
  }
  g.closePath(); g.fill();
  /* かみの つや（左上からの ひかり）*/
  g.fillStyle = 'rgba(255,255,255,.28)';
  g.beginPath(); g.ellipse(M - R*0.4, hy - R*0.6, R*0.34, R*0.13, -0.3, 0, GTAU); g.fill();

  /* ---- かお ---- */
  const fy = hy + R*0.16, ex = R*0.38, er = R*0.19;
  g.fillStyle = '#4a3a4a';
  const E = av.e % AV_EYE.length;
  const shut = (x) => {                    // とじた目（にこ・ウインクで つかう）
    g.strokeStyle = '#4a3a4a'; g.lineWidth = R*0.09; g.lineCap='round';
    g.beginPath(); g.arc(x, fy + er*0.4, er*0.9, Math.PI*1.15, Math.PI*1.85); g.stroke();
  };
  for (const s of [-1,1]){
    const x = M + s*ex;
    if (E === 1 || (E === 5 && s > 0)){    // にこ／ウインク（右だけ とじる）
      shut(x); continue;
    }
    if (E === 3){                          // おすまし（ほそめ）
      g.fillStyle = '#4a3a4a';
      gRR(g, x - er*0.9, fy - er*0.22, er*1.8, er*0.44, er*0.22); g.fill();
      continue;
    }
    if (E === 6){                          // ハートの ひとみ
      g.fillStyle = '#ff5f8a';
      g.beginPath();
      g.moveTo(x, fy + er*1.0);
      g.bezierCurveTo(x - er*1.3, fy + er*0.1, x - er*0.7, fy - er*1.0, x, fy - er*0.3);
      g.bezierCurveTo(x + er*0.7, fy - er*1.0, x + er*1.3, fy + er*0.1, x, fy + er*1.0);
      g.closePath(); g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x - er*0.34, fy - er*0.24, er*0.26, 0, GTAU); g.fill();
      continue;
    }
    g.fillStyle = '#4a3a4a';
    g.beginPath(); g.ellipse(x, fy, er*(E===4?1.0:0.86), er*(E===4?1.2:1.05), 0, 0, GTAU); g.fill();
    if (E === 7){                          // ねむい：上まぶたを かぶせる
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(x, fy - er*0.9, er*1.3, er*0.9, 0, 0, GTAU); g.fill();
      g.strokeStyle = '#4a3a4a'; g.lineWidth = R*0.06; g.lineCap='round';
      g.beginPath(); g.moveTo(x - er*0.9, fy - er*0.2); g.lineTo(x + er*0.9, fy - er*0.28); g.stroke();
      continue;
    }
    g.fillStyle = '#ffffff';               // ハイライト（かならず 入れる）
    g.beginPath(); g.arc(x - er*0.3, fy - er*0.36, er*0.34, 0, GTAU); g.fill();
    if (E === 2 || E === 4){
      g.beginPath(); g.arc(x + er*0.3, fy + er*0.3, er*0.2, 0, GTAU); g.fill();
    }
    if (E === 2) gspark(g, x + er*1.1, fy - er*1.1, er*0.5, 0.5, '#fff0a0');
  }
  /* ほっぺ（ピンクの はんとうめい）*/
  g.fillStyle = 'rgba(255,143,196,.42)';
  for (const s of [-1,1]){
    g.beginPath(); g.ellipse(M + s*R*0.66, fy + R*0.26, R*0.2, R*0.14, 0, 0, GTAU); g.fill();
  }
  /* くち */
  const MO = av.m % AV_MOUTH.length, my = fy + R*0.44;
  g.strokeStyle = '#c05f7a'; g.lineWidth = R*0.075; g.lineCap='round';
  if (MO === 0){ g.beginPath(); g.arc(M, my - R*0.06, R*0.16, 0.25, Math.PI-0.25); g.stroke(); }
  else if (MO === 1){ g.beginPath(); g.arc(M, my - R*0.02, R*0.08, 0.2, Math.PI-0.2); g.stroke(); }
  else if (MO === 2){
    g.fillStyle = '#c05f7a';
    g.beginPath(); g.ellipse(M, my, R*0.19, R*0.15, 0, 0, GTAU); g.fill();
    g.fillStyle = '#ffd0dc';
    g.beginPath(); g.ellipse(M, my + R*0.05, R*0.11, R*0.07, 0, 0, GTAU); g.fill();
  } else if (MO === 3){ g.beginPath(); g.moveTo(M - R*0.11, my); g.lineTo(M + R*0.11, my); g.stroke(); }
  else if (MO === 4){                      // べー（したを 出す）
    g.beginPath(); g.arc(M, my - R*0.06, R*0.16, 0.25, Math.PI-0.25); g.stroke();
    g.fillStyle = '#ff8fa8';
    g.beginPath(); g.ellipse(M + R*0.06, my + R*0.12, R*0.1, R*0.09, 0.2, 0, GTAU); g.fill();
  } else if (MO === 5){                    // にっこり（口を あけて わらう）
    g.fillStyle = '#c05f7a';
    g.beginPath(); g.arc(M, my - R*0.06, R*0.2, 0.12, Math.PI-0.12); g.closePath(); g.fill();
    g.fillStyle = '#ffffff';
    gRR(g, M - R*0.16, my - R*0.07, R*0.32, R*0.07, R*0.03); g.fill();
  } else {                                 // ハートの くち
    g.fillStyle = '#ff5f8a';
    g.beginPath();
    g.moveTo(M, my + R*0.14);
    g.bezierCurveTo(M - R*0.2, my - R*0.02, M - R*0.1, my - R*0.14, M, my - R*0.04);
    g.bezierCurveTo(M + R*0.1, my - R*0.14, M + R*0.2, my - R*0.02, M, my + R*0.14);
    g.closePath(); g.fill();
  }

  /* ---- かざり ---- */
  if (A === 1){                            // リボン
    g.fillStyle = '#ff5f8a';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + R*0.5, hy - R*0.78);
      g.quadraticCurveTo(M + R*0.5 + s*R*0.5, hy - R*1.16, M + R*0.5 + s*R*0.46, hy - R*0.66);
      g.quadraticCurveTo(M + R*0.5 + s*R*0.2, hy - R*0.6, M + R*0.5, hy - R*0.78);
      g.closePath(); g.fill();
    }
    g.beginPath(); g.arc(M + R*0.5, hy - R*0.78, R*0.12, 0, GTAU); g.fill();
  } else if (A === 2){                     // ぼうし
    g.fillStyle = wear;
    g.beginPath(); g.ellipse(M, hy - R*0.62, R*1.34, R*0.24, 0, 0, GTAU); g.fill();
    g.beginPath(); g.ellipse(M, hy - R*0.98, R*0.78, R*0.46, 0, 0, GTAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    gRR(g, M - R*0.8, hy - R*0.74, R*1.6, R*0.16, R*0.08); g.fill();
  } else if (A === 3){                     // めがね
    g.strokeStyle = 'rgba(90,70,100,.8)'; g.lineWidth = R*0.07;
    for (const s of [-1,1]){
      g.beginPath(); g.arc(M + s*ex, fy, er*1.5, 0, GTAU); g.stroke();
    }
    g.beginPath(); g.moveTo(M - ex + er*1.5, fy); g.lineTo(M + ex - er*1.5, fy); g.stroke();
  } else if (A === 4){                     // かんむり
    g.fillStyle = '#ffd76e';
    g.beginPath();
    g.moveTo(M - R*0.6, hy - R*0.72); g.lineTo(M - R*0.6, hy - R*1.1);
    g.lineTo(M - R*0.3, hy - R*0.88); g.lineTo(M, hy - R*1.26);
    g.lineTo(M + R*0.3, hy - R*0.88); g.lineTo(M + R*0.6, hy - R*1.1);
    g.lineTo(M + R*0.6, hy - R*0.72);
    g.closePath(); g.fill();
    g.fillStyle = '#ff5f8a';
    g.beginPath(); g.arc(M, hy - R*0.86, R*0.1, 0, GTAU); g.fill();
  } else if (A === 5){                     // ねこみみ
    g.fillStyle = hair;
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.3, hy - R*0.72);
      g.lineTo(M + s*R*0.78, hy - R*0.6); g.lineTo(M + s*R*0.52, hy - R*1.2);
      g.closePath(); g.fill();
    }
    g.fillStyle = '#ffc2d4';
    for (const s of [-1,1]){
      g.beginPath();
      g.moveTo(M + s*R*0.4, hy - R*0.72);
      g.lineTo(M + s*R*0.68, hy - R*0.66); g.lineTo(M + s*R*0.52, hy - R*1.02);
      g.closePath(); g.fill();
    }
  } else if (A === 6){                     // ヘッドホン
    g.strokeStyle = '#c9a7ff'; g.lineWidth = R*0.13;
    g.beginPath(); g.arc(M, hy - R*0.1, R*1.06, Math.PI*1.1, Math.PI*1.9); g.stroke();
    g.fillStyle = '#c9a7ff';
    for (const s of [-1,1]){
      gRR(g, M + s*R*1.06 - R*0.19, hy - R*0.22, R*0.38, R*0.56, R*0.16); g.fill();
    }
  } else if (A === 7){                     // ヘアピン
    g.fillStyle = '#ffd76e';
    for (let i=0;i<2;i++){
      g.save();
      g.translate(M - R*0.56, hy - R*0.34 + i*R*0.22); g.rotate(-0.5);
      gRR(g, -R*0.22, -R*0.045, R*0.44, R*0.09, R*0.045); g.fill();
      g.restore();
    }
    g.fillStyle = '#ff8fa8';
    g.beginPath(); g.arc(M - R*0.74, hy - R*0.3, R*0.09, 0, GTAU); g.fill();
  } else if (A === 8){                     // おはな
    g.fillStyle = '#ff8fa8';
    for (let i=0;i<5;i++){
      const a2 = i*GTAU/5 - 1.2;
      g.beginPath();
      g.ellipse(M + R*0.66 + Math.cos(a2)*R*0.14, hy - R*0.56 + Math.sin(a2)*R*0.14,
                R*0.12, R*0.09, a2, 0, GTAU); g.fill();
    }
    g.fillStyle = '#ffd76e';
    g.beginPath(); g.arc(M + R*0.66, hy - R*0.56, R*0.07, 0, GTAU); g.fill();
  } else if (A === 9){                     // てんしのわ
    g.strokeStyle = '#ffd76e'; g.lineWidth = R*0.1;
    g.beginPath(); g.ellipse(M, hy - R*1.18, R*0.42, R*0.14, 0, 0, GTAU); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = R*0.04;
    g.beginPath(); g.ellipse(M, hy - R*1.2, R*0.42, R*0.14, 0, Math.PI*1.1, Math.PI*1.7); g.stroke();
  } else if (A === 10){                    // うさみみ
    g.fillStyle = hair;
    for (const s of [-1,1]){
      g.save(); g.translate(M + s*R*0.32, hy - R*0.96); g.rotate(s*0.22);
      g.beginPath(); g.ellipse(0, 0, R*0.19, R*0.5, 0, 0, GTAU); g.fill();
      g.fillStyle = '#ffc2d4';
      g.beginPath(); g.ellipse(0, R*0.04, R*0.09, R*0.36, 0, 0, GTAU); g.fill();
      g.fillStyle = hair; g.restore();
    }
  } else if (A === 11){                    // マフラー
    g.fillStyle = wear;
    gRR(g, M - R*0.42, hy + R*0.7, R*0.84, R*0.3, R*0.14); g.fill();
    g.beginPath();
    g.moveTo(M + R*0.2, hy + R*0.86);
    g.quadraticCurveTo(M + R*0.56, hy + R*1.3, M + R*0.44, hy + R*1.62);
    g.lineTo(M + R*0.16, hy + R*1.5);
    g.quadraticCurveTo(M + R*0.24, hy + R*1.16, M + R*0.06, hy + R*0.9);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)';
    for (let i=0;i<3;i++){ gRR(g, M - R*0.42, hy + R*0.74 + i*R*0.09, R*0.84, R*0.04, R*0.02); g.fill(); }
  }
}

/* ==========================================================
   ずかん（あつめた記録はブラウザに残る）
   dex[id] = { w:入手ウェーブ, d:入手日, lv:とうたつレベル(おかしのみ) }
   ========================================================== */
let dex = {};
try{ dex = JSON.parse(localStorage.getItem('sweetTD.dex') || '{}') || {}; }catch(e){}
// 旧バージョンのセーブ（なかまID配列）からの引っこし
try{
  const old = JSON.parse(localStorage.getItem('sweetTD.col') || '[]');
  for (const id of old) if (CHARS.some(c => c.id === id) && !dex['ch_'+id]) dex['ch_'+id] = {};
  if (old.length){ localStorage.removeItem('sweetTD.col'); saveDex(); }
}catch(e){}
function saveDex(){ try{ localStorage.setItem('sweetTD.dex', JSON.stringify(dex)); }catch(e){} }
/* 前の版で 'tw_c_xxx' という ありもしない id を ためてしまっていたので かたづける。
   ほんとうの id（c_xxx）に つけかえて、あつめた ぶんを むだにしない */
(function fixDexIds(){
  let dirty = false;
  for (const k of Object.keys(dex)){
    if (!k.startsWith('tw_c_')) continue;
    const real = k.slice(3);
    if (!dex[real]) dex[real] = dex[k];
    delete dex[k]; dirty = true;
  }
  // でんせつの 出会った ウェーブを 条件の ウェーブに そろえる。
  // 前は やりなおした直後の ウェーブが そのまま 入っていた
  for (const L of LEGENDS){
    const e = dex['lg_' + L.id];
    if (e && e.w !== L.wave){ e.w = L.wave; dirty = true; }
  }
  if (dirty) saveDex();
})();
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
/* はじめての登録なら true。いつ手に入れたかも残す */
function unlock(id){
  if (dex[id]) return false;
  dex[id] = { w: wave, d: dateStr() };
  saveDex();
  checkComplete();   // これが最後のひとりだったら、おかしの国がかんせいする
  return true;
}

/* ステージクリア（20ウェーブ）ごとのごほうび。なかまを1人むかえて、次のステージへ */
function stageClear(){
  const stageNo = wave / STAGE_WAVES;
  // 今週のおだい中は ごほうびを わたさない。ふだんより 短いプレイで
  // たまごや 💗を ためる ぬけ道に なってしまうため
  if (weekly){
    celebrate({ rays: 3, conf: 120, rings: true, fanfare: 1 });
    floatTx(COLS*CELL/2, ROWS*CELL/2, 'ステージ' + stageNo + ' クリア！🎉', '#e05f9e');
    return;
  }
  healHearts(3 + (hasCh('apple') ? 3 : 0));   // ごほうびにハートを回復（ためた💗はへらさない）
  const ch = CHARS.find(c => !dex['ch_'+c.id]);
  if (ch){
    unlock('ch_' + ch.id);
    // おためし用にストックを1つプレゼントし、あきがあればタスクバーにも自動ではる
    if (SKILLS.some(s => s.ch === ch.id)){
      skStock[ch.id] = Math.min(ITEM_MAX, skStock[ch.id] + 1);
      saveSkStock();
      if (pins.length < PIN_MAX && !pins.includes(ch.id)){ pins.push(ch.id); savePins(); }
    }
  }
  // ステージが すすむほど いい たまごが もらえる
  const eggIdx = stageNo >= 6 ? 2 : stageNo >= 3 ? 1 : 0;
  const gift = eggDraw(EGGS[eggIdx]);
  const got = CHARS.filter(c => dex['ch_'+c.id]).length;
  const done = got >= CHARS.length;
  ovT.textContent = (done && ch) ? 'おかしの国 完成！🏰' : 'ステージ ' + stageNo + ' クリア！🎉';
  ovB.innerHTML = '';
  if (ch){
    // どの国の子かを ここで 見せる。CHARS の ならびは 国に そろえてあるので、
    // 「こおりのくに → こおりのつぶ」が つながって 見える。
    // 国は ステージ番号ではなく その子の ならび順から 出すこと。
    // まけて やりなおすと、ステージ1の クリアで 5人目が 来ることが あり、
    // ステージ番号で 出すと「シュガーガーデンの子」と うそを 言ってしまう
    ovB.insertAdjacentHTML('beforeend',
      '<div style="font-size:calc(11px * var(--fs));color:#b98ae0">「' +
      themeOfStage(CHARS.indexOf(ch) + 1).name + '」の子が やってきた！</div>');
    const th = charThumb(ch, 96);
    th.style.display = 'block'; th.style.margin = '0 auto 4px';
    ovB.append(th);
  }
  /* アイテムも 1こ。はじめての人が つかいかたを おぼえられるように、
     たまごと ちがって かならず もらえる形に する */
  {
    const pool = ITEMS.filter(it => gear[it.id] < ITEM_CAP);
    if (pool.length){
      const it = pool[(Math.random()*pool.length)|0];
      giveItem(it.id, 1);
      ovB.insertAdjacentHTML('beforeend',
        '<div style="font-size:calc(12.5px * var(--fs));color:var(--pink-d)">' +
        it.ic + ' アイテム「' + it.name + '」+1</div>');
    }
  }
  // ステージクリアの ごほうびの たまご
  if (gift){
    const gth = genThumb(gift.o, 72);
    gth.style.cssText = 'display:block;margin:6px auto 2px';
    ovB.append(gth);
    ovB.insertAdjacentHTML('beforeend',
      '<div style="font-size:calc(12.5px * var(--fs));color:var(--pink-d)">🥚 ' + EGGS[eggIdx].name + 'から ' +
      gift.o.name + '（★' + gift.o.lv + '）' +
      (gift.dup ? '<br><span style="opacity:.7">すでにいるので 🩷かけら+' + gift.shard + '</span>'
                : '<br>仲間になった！✨') + '</div>');
  }
  // Lv解放の節目なら いっしょにお知らせ
  let unlockMsg = '';
  // 強化レベルの上限は もぐったウェーブで のびる。節目ごとに いまの上限を知らせる
  unlockMsg = '<br>🔓 強化レベルの上限は いま <b>Lv' + maxLv() + '</b>';
  const d = document.createElement('div');
  d.innerHTML = (ch
    ? '<b>' + ch.name + '</b>（' + ch.title + '）が仲間になった！<br>✨ ' + ch.fx + ' ✨<br>仲間 ' + got + ' / ' + CHARS.length +
      (done ? '<br>全員 集まりました！ あなたは 伝説の英雄 ✨' : '')
    : 'ハートが回復しました 💗<br>次のステージも がんばろう！') + unlockMsg;
  ovB.append(d);
  buildSkillBar();   // 新しいなかまのワザをすぐ使えるように
  ovAlt.style.display = 'none';
  ovBtn.innerHTML = '次のステージへ ' + PLAY;
  // とじた直後に、なかまの応援パレードがよく見えるように
  ovBtn.onclick = () => {
    ov.classList.remove('on');
    parade();
    confettiBurst(40);
    checkLegends();      // クリアの節目がでんせつの条件と重なったとき用
  };
  ovShare.style.display = '';
  ov.classList.add('on');
  celebrate({ rays: 3.5, conf: done ? 220 : 120, rings: true, flash: true, fanfare: done ? 2 : 1 });
  syncHUD();
}

/* ---------- でんせつとの出会い ---------- */
/* とうたつ記録が条件をこえていたら、でんせつが降臨する（1体ずつ） */
function checkLegends(){
  if (over || ov.classList.contains('on')) return;
  const L = LEGENDS.find(l => rec.bw >= l.wave && !dex['lg_' + l.id]);
  if (L) legendArrival(L);
}
function legendArrival(L, preview){
  if (!preview){
    unlock('lg_' + L.id);              // 撮影プレビューでは図鑑にとうろくしない
    // でんせつは「ベストが とどいた」ごほうびなので、じっさいに 出会うのは

    // ウェーブ1が 記録されて、図鑑に「ウェーブ1」と 出てしまう。
    // 出会う 条件の ウェーブ（クジラなら60）を 記録する
    dex['lg_' + L.id].w = L.wave;
    saveDex();
  }
  ovT.textContent = '✨ 伝説との出会い ✨';
  ovB.innerHTML = '';

  th.style.display = 'block'; th.style.margin = '0 auto 4px';
  ovB.append(th);

    '<span style="display:inline-block;background:linear-gradient(90deg,#ffe9b8,#ffd9ec);' +
    'border:2px solid #ffd76e;border-radius:999px;padding:6px 14px;margin:7px 0;color:#c9821e">' +
    L.fx + '</span><br>これからは ときどき空を飛んでくれます';

  ovBtn.textContent = 'ありがとう ✨';

  celebrate({ rays: 4, conf: 240, rings: true, flash: true, fanfare: 2 });

}

/* 図鑑にのる全カード。pid は似顔絵の描き分けキー */
/* ずかんの 見た目だけの 仕分け。ゲームの gen.side は 変えない。
   ゆきのじょおうは 3つの国の ボスの ままだが、見た目は 仲間の ならびが
   にあう（おひめさま・まほうつかいの なかま）ので ここで うつす */
const DEX_SIDE = { snowqueen: 'ch' };
/* 図鑑で「伝説」タブに ならぶ子（見た目だけ。たまご・国のボスは そのまま）。
   ものさしは 神話・幻想の 存在か どうか。まほうつかい・まじょは 人間なので 仲間 */
const DEX_LEGEND = new Set(['unicorn', 'snowqueen', 'mermaid', 'angel', 'firebird', 'yukionna']);
/* 金の わくの子。にじ（でんせつ）の 下、銀（★5〜6）の 上。
   ものさしは「その国の いちばん おく」。ならびの ★だけで 決めると
   ★6が 9体も ならんで 金が ありがたく なくなる。
   わくの色を 変えるだけでは いけない ——【手に入りにくさは わくの色と
   そろえる】ので、たまごの 出かた（GOLD_RATE）と たおしたときの
   図鑑入り（GOLD_KEEP）も いっしょに しぶくして ある */
const DEX_GOLD = new Set([
  // 仲間（10）
  'whale', 'wedding', 'wizard',                          // ★6
  'fairy', 'bigparfait', 'purinpafe', 'tower', 'king', 'queen', 'orca',   // ★5
  // 敵（9）
  'golem', 'lion', 'tutankhamun', 'oni',                 // ★6
  'cleopatra', 'pharaoh', 'shark',                       // ★5
  'lavagolem', 'devil',                                  // ★4（★では なく めずらしさで えらぶ）
]);
/* 銀の わくは ふだん ★5〜6 で 決まるが、そこから はずれる子を ここに書く。
   銀と ピンクは **手に入りかたが おなじ**（たまごは 均等・たおせば 図鑑に入る）
   ので、この2つの あいだの 引っこしは 見た目だけで すむ。
   金・にじへ うつすときは 出かたも しぶくすること（DEX_GOLD の ところに 書いた） */
const DEX_SILVER = new Set([
  'cake', 'princess', 'prince', 'dolphin',                  // 仲間（★4だが 銀）
  'panda', 'lavasnail', 'koala', 'scorpion', 'salamander',  // 敵（★4〜3）
  'onibi', 'ghost', 'hinotama',                             // 敵（★2〜1）
]);
const DEX_PINK   = new Set(['baum', 'tart']);                 // ★5だが ピンク
const __lookKey = o => o.gen ? artKeyOf(o.gen) : '';
/* わくの 4段階を 1か所で。ならび（rank）も 見た目（tierOf）も ここを 見る */
const dexTier = o => {
  /* 精霊（ステージクリアの子・ながれぼし）は 銀。★は 強化のレベルなので
     ものさしに ならないが、12国を 1つずつ クリアしないと そろわないので
     たまごから 均等に 出る子より 手に入りにくい。
     お菓子タワーは 毎回 ⭐で 買えるので わくを つけない */
  if (!o.gen) return o.item ? 'gold' : o.cat === 'ch' ? 'silv' : 'none';
  const k = artKeyOf(o.gen);
  if (o.legend || DEX_LEGEND.has(k)) return 'rain';
  if (DEX_GOLD.has(k))   return 'gold';
  if (DEX_PINK.has(k))   return 'pink';
  if (DEX_SILVER.has(k)) return 'silv';
  return o.gen.lv >= 5 ? 'silv' : 'pink';
};
function dexList(){

/* ぜんぶ つくるのに 少し時間がかかるので、1回だけ 作って ためておく */

function genSprite(o, px){

  const k = o.id + '@' + px;

  const c = document.createElement('canvas');
  const d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = px*d; c.height = px*d;
  const g = c.getContext('2d');
  g.setTransform(d,0,0,d,0,0); drawGen(g, px, o);
  g.setTransform(d,0,0,d,0,0); portraitShade(g, px);
  g.setTransform(d,0,0,d,0,0); drawGenFx(g, px, o);
  genSpriteCache.set(k, c);
  return c;
}

/* なかま（コレクションの味方）を おかしと おなじ「タワー」に する。
   77体ぶんの つよさを 手で 書くと 調整できなくなるので、
   ★の高さから 計算し、attack の くせだけ 4つの型から えらぶ。
   こうすると 置く・つよくする・売る・たまを とばす しくみは そのまま つかえる */
const ALLY_ARCH = ['candy','ice','choco','star'];
/* おなじ ねだんでも 型で こうげきの 数字が だいぶ ちがう（アイスは 弱いかわりに おそくする）。
   数字だけ ならべると 損に 見えるので、なにが とくいな子かも 出す */
const ALLY_ROLE = { candy:'連射', ice:'減速', choco:'範囲', star:'遠距離' };
const ALLY_COST = { 1:60, 2:100, 3:150, 4:230, 5:340, 6:500 };
function allyArchOf(id){                              // id から いつも おなじ型を えらぶ
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) & 0x7fffffff;
  return ALLY_ARCH[h % ALLY_ARCH.length];
}
for (const o of GEN_LIST){
  if (o.side !== 'ch') continue;
  const A = TOWERS[allyArchOf(o.id)];
  const k = 1 + (o.lv - 1) * 0.62;                    // ★が上がるほど こうげきが つよい
  TOWERS[o.id] = {
    ...A, name:o.name, gen:o, ally:true, cells:o.cells, role:ALLY_ROLE[allyArchOf(o.id)],
    cost: ALLY_COST[o.lv],
    dmg:   Math.round(A.dmg * k * (o.cells >= 4 ? 1.5 : o.cells >= 2 ? 1.2 : 1)),
    rate:  +(A.rate / (1 + (o.lv - 1) * 0.05)).toFixed(3),
    range: +(A.range * (1 + (o.lv - 1) * 0.04)).toFixed(2),
    desc: '★' + o.lv + 'の仲間。' + A.desc + (o.cells >= 4 ? '（4マスつかう）' : ''),
  };
}
/* 4マスの子は 2×2 を つかう。ふさがっている ますを かぞえるのに つかう */
const spanOf = k => (TOWERS[k] && TOWERS[k].cells >= 4) ? 2 : 1;
const tSpan  = t => spanOf(t.k);
/* 2×2 の子の まん中は ますの かど。たまの 出どころも 射程の 中心も ここ */
const tcx = t => cx(t.c) + (tSpan(t) - 1) * CELL / 2;
const tcy = t => cy(t.r) + (tSpan(t) - 1) * CELL / 2;
/* (c,r) を ふさいでいる タワーを さがす（2×2 も 見る） */
function towerAt(c, r){
  return towers.find(t => { const s2 = tSpan(t); return c >= t.c && c < t.c + s2 && r >= t.r && r < t.r + s2; });
}

/* てきの 見た目を コレクションの子から えらぶ。
   つよさ（HP・そくど）は これまでどおり ENEMIES のまま。
   見た目と 名前だけ さしかえるので、ゲームの つりあいは 変わらない */
const EN_BY_LV = {};
for (const o of GEN_LIST) if (o.side === 'en') (EN_BY_LV[o.lv] = EN_BY_LV[o.lv] || []).push(o);

/* その国に すんでいそうな子だけが 出る。ならびは THEMES と おなじ順。
   1人が いくつの国に いても よい（ウサギは のはらにも 雪山にも いる）。
   どの国にも 入れなかった子は 一生 出てこないので、
   tools/check-chars.mjs の「出ない てき」が それを 見つける */
const EN_THEME = [
  /* 0 シュガーガーデン     */ ['ladybug','rabbit','slime','bee','hedgehog','turtle','butterfly','swan','giraffe','lion'],
  /* 1 いちごのおかしばたけ */ ['ladybug','mouse','bee','sheep','pig','butterfly','kangaroo','horse'],
  /* 2 マカロンのもり       */ ['rabbit','mouse','squirrel','hedgehog','koala','monkey','redpanda','sloth','owl','deer','panda','bear'],
  /* 3 チョコレートのたに   */ ['mouse','slime','squirrel','pig','redpanda','panda','zebra','devil','tiger','golem'],
  /* 4 こおりのくに         */ ['rabbit','sheep','penguin','swan','seal','yukionna','golem','snowqueen'],
  /* 5 ゆきのケーキやま     */ ['rabbit','sheep','penguin','deer','wolf','eagle','bear','yukionna','snowqueen'],
  /* 6 ソーダのうみべ       */ ['jelly','starfish','clownfish','hermit','seahorse','crab','turtle','gull','octopus','seal','shark','manta'],
  /* 7 キャラメルのさばく   */ ['mouse','hedgehog','turtle','monkey','kangaroo','zebra','horse','tiger','giraffe','lion'],
  /* 8 さばくのくに         */ ['cactus','sandcat','lizard','meerkat','scorpion','fennec','ostrich','armadillo','mummy','camel','cleopatra','pharaoh','cobra','tutankhamun'],
  /* 9 ひのくに             */ ['hinotama','bat','onibi','salamander','beetle','lavasnail','lavagolem','firebird','oni'],
  /* 10 よぞらのくに        */ ['ghost','butterfly','bat','onibi','owl','wolf','devil','snowqueen'],
  /* 11 にじのてんくう      */ ['ladybug','ghost','butterfly','gull','swan','eagle','firebird','manta'],
];
/* [国][★] = その国の その★の子。国ごとに ★べつに ならべておく */
const EN_BY_TH = EN_THEME.map(keys => {
  const by = {};
  for (const o of GEN_LIST){
    if (o.side !== 'en' || !keys.includes(artKeyOf(o))) continue;
    (by[o.lv] = by[o.lv] || []).push(o);
  }
  return by;
});
/* その★に 子が いなければ 近い★へ。下から さがすので、
   ★7を たのまれた国は その国の いちばん つよそうな子を かえす */
function nearLv(by, lv){
  for (let d = 0; d < 7; d++){
    const p = by[lv - d] || by[lv + d];
    if (p && p.length) return p;
  }
  return null;
}
/* かたい子・ボスは 見た目も 強そうに する */
const EN_BUMP = { slime:0, fast:0, tank:1, crystal:1, bat:0, golem:2, boss:2 };
function enemyLook(k, n, i){
  /* 見た目の ★は「国の中の どこまで きたか」で 上がる。国が かわると また 小さい子から。
     ウェーブで 上げると ウェーブ72で 上限に はりついて、そこから先は
     ★6の 4体しか 出なくなる（何百ウェーブ あそんでも 顔が 4つ）。
     国ごとに 上げなおすと、どの国でも 小さい子 → ボスの ながれに なる */
  const lv = Math.min(7, 1 + Math.floor(((n - 1) % STAGE_WAVES) / 4) + (EN_BUMP[k] || 0));
  const pool = nearLv(EN_BY_TH[themeIdxOf(n)], lv) || nearLv(EN_BY_LV, lv);
  if (!pool || !pool.length) return null;
  // おなじウェーブなら いつも おなじ顔ぶれに する（あつめる目あてが 立つように）
  // 周が かわると 顔ぶれも ずれる。おなじ道を 何周も 見るので、ここで 変化をつける
  return pool[(n * 7 + i * 3 + lapOf(n) * 5) % pool.length];
}
/* 見た目を えがく。えがく じゅんばんは drawGen → かげ → にじいろ の 順 */
function genThumb(o, size){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = size*dpr; c.height = size*dpr;
  c.style.width = size + 'px'; c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); drawGen(g, size, o);
  g.setTransform(dpr,0,0,dpr,0,0); portraitShade(g, size);
  g.setTransform(dpr,0,0,dpr,0,0); drawGenFx(g, size, o);
  return c;
}
/* ぜんぶを いちどに えがくと 開くたびに かたまるので、
   スクロールで 見えたものから えがく */
let colIo = null;
function lazyThumb(o, size){
  const box = document.createElement('div');
  box.style.cssText = 'width:' + size + 'px;height:' + size + 'px;margin:0 auto';
  box.__draw = () => box.replaceWith(o.gen ? genThumb(o.gen, size) : charThumb(o, size));
  colIo.observe(box);
  return box;
}

/* 札に 入る 大きさまで 数字を 縮める。
   フォントの はばは 端末で ちがう（iPhone の 丸ゴシックは Linux の
   代わりのフォントより 広い）ので、決めうちの px では はみ出す。
   実際、393px で 大丈夫に 見えていたのに iPhone では おりかえしていた。
   はかって 合わせるのが いちばん たしか */
function fitStat(el){
  el.style.fontSize = '';
  const w = el.clientWidth;
  if (!w) return;                                   // まだ 出ていない
  // 小数で 引くと 0.65 が 0.6499… に なって 1だん 手前で 止まる。整数で かぞえる
  for (let k = 95; k >= 55 && el.scrollWidth > w; k -= 5)
    el.style.fontSize = 'calc(15px * var(--fs) * ' + (k/100) + ')';
}
function buildColGrid(){
  // じぶんの きろくは どの タブでも 出す
  colStats.innerHTML =
    /* 3つの 見出しは かならず 1行に おさめること。1つでも おりかえすと
       その札だけ 数字が 下がって、3つの 数字が よこに そろわなくなる。
       せまい画面（320・375px）で 実際に そうなっていた。
       🏆は 金色の 札そのものが「いちばん」を あらわしているので いらない */
    '<div class="cst best"><div class="ck">自己ベスト</div><div class="cn">ウェーブ' + rec.bw + '</div></div>' +
    '<div class="cst"><div class="ck">倒した数</div><div class="cn">' + fmtN(rec.kills) + '</div></div>' +
    '<div class="cst"><div class="ck">順位の目安</div><div class="cn">' + (rec.bw > 0 ? '上位' + rankPct() + '%' : '—') + '</div></div>';
  colStats.querySelectorAll('.cn').forEach(fitStat);
  if (colTab === 'fr'){ buildFriendGrid(); return; }
  const all = dexList();
  if (colIo) colIo.disconnect();
  colIo = new IntersectionObserver(es => {
    for (const e of es){
      if (!e.isIntersecting || !e.target.__draw) continue;
      const f = e.target.__draw; e.target.__draw = null;
      colIo.unobserve(e.target); f();
    }
  }, { root: colOv, rootMargin: '240px' });
  /* 「敵」「仲間」の タブは、ウェーブに 出てくる7体・ステージクリアの子だけでなく
     コレクションの子も その分けかた（gen.side）で いっしょに 出す。
     ここを 分けたままだと、なかまと敵を 分けなおしても タブの中身が
     変わらず、直っていないように 見える */
  const sideOf = o => DEX_SIDE[__lookKey(o)] || o.gen.side;
  const isLeg = o => o.gen && DEX_LEGEND.has(__lookKey(o));
  const inTab = o =>
    colTab === 'en' ? (o.cat === 'en' || (o.gen && sideOf(o) === 'en' && !isLeg(o))) :
    colTab === 'ch' ? (o.cat === 'tw' || o.cat === 'ch' || (o.gen && sideOf(o) === 'ch' && !isLeg(o))) :
    colTab === 'lg' ? (o.cat === 'lg' || isLeg(o)) :
    o.cat === colTab;
  const list = all.filter(inTab);
  /* ならびは わくの つよい順（にじ → 金 → 銀 → ピンク）、おなじ わくなら ★の
     大きい順。ほしい子ほど 上に 来るので、スクロールせずに めあてが 見える。
     お菓子タワー・精霊・アイテムは わくの ものさしに のらない（★は 強化の
     レベルで、めずらしさでは ない）ので いちばん下に まとめる。
     むかしは 先頭に 置いていたが、17枚も 先に あって 金の子まで
     6行 スクロールしないと 見えなかった */
  const RANK = { rain:4, gold:3, silv:2, pink:1, none:0 };
  const rank = o => RANK[dexTier(o)];
  list.sort((a, b) => rank(b) - rank(a)
                   || (b.gen ? b.gen.lv : 0) - (a.gen ? a.gen.lv : 0));
  colCount.textContent = list.filter(o => dex[o.id]).length + ' / ' + list.length;
  colHint.style.display = (colTab === 'ch') ? '' : 'none';
  /* ワザを もつ子は ならびの 中に ちらばる（精霊は 銀、お菓子タワーは わくなし）
     ので、ばしょでは なく 見た目（✨の行）で さがしてもらう */
  colHint.innerHTML = '📌 仲間をタップでバーに貼る／はがす（' + pins.length + '/' + PIN_MAX + '）<br>ワザをもつ子には <b>✨</b> がついています';

  const TIER = { rain:' tRain', gold:' tGold', silv:' tSilv', pink:'', none:'' };
  const tierOf = o => TIER[o.legend ? 'rain' : dexTier(o)];
  for (const o of list){
    const rec = dex[o.id];
    const d = document.createElement('div');
    d.className = 'cCard' + (rec ? '' : ' no') + tierOf(o);
    if (rec && o.item){
      // アイテムは キャラでは ないので、絵（または 絵文字）と のこり数を 出す
      const box = document.createElement('div');
      box.style.cssText = 'height:64px;display:flex;align-items:center;justify-content:center;font-size:40px';

      d.append(box);
      d.insertAdjacentHTML('beforeend',

        '<div class="cLv" style="color:var(--pink-d)">×' + gear[o.pid] + ' 所持</div>' +
        '<div class="cTt">' + o.title + '</div>' +
        '<div class="cTt" style="color:#b98ae0">✨' + o.fx + '</div>');
      colGrid.append(d);
      continue;
    }
    if (rec){
      d.append(lazyThumb(o, 64));
      let html = '<div class="cNm">' + o.name + '</div>';
      if (o.cat === 'tw' && rec.lv) html += '<div class="cLv">' + '★'.repeat(rec.lv) + '</div>';
      const isSk = o.cat === 'ch' && SKILLS.some(s => s.ch === o.pid);
      if (isSk) html += '<div class="cLv" style="color:var(--pink-d)">×' + (skStock[o.pid] || 0) + ' 所持</div>';
      html += '<div class="cTt">' + o.title + '</div>';
      if (o.fx) html += '<div class="cTt" style="color:#b98ae0">✨' + o.fx + '</div>';
      if (rec.d) html += '<div class="cGet">' + (rec.w ? 'ウェーブ' + rec.w + '・' : '') + rec.d + '</div>';
      d.insertAdjacentHTML('beforeend', html);
      // なかまはタップでワザバーに はる／はがす。0こなら おほしさまで買い足せる
      if (isSk){
        if (pins.includes(o.pid)) d.insertAdjacentHTML('beforeend', '<div class="cPin">📌</div>');
        d.style.cursor = 'pointer';
        d.onclick = () => {
          const sDef = SKILLS.find(s => s.ch === o.pid);
          if (!pins.includes(o.pid) && (skStock[o.pid] || 0) < 1){
            // 2回タップで1こ購入（スターの使い道）
            const cost = skillCost(sDef);
            if (buyWait === o.pid){
              buyWait = null;
              if (stars < cost){
                colHint.textContent = 'おほしさまが足りません（⭐' + cost + '）';
                beep(160,.09,'square',.03,.7);
              } else {
                stars -= cost;
                skStock[o.pid] = Math.min(ITEM_MAX, (skStock[o.pid]||0) + 1); saveSkStock();
                beep(760,.1,'triangle',.05); syncHUD(); buildColGrid();
                colHint.innerHTML = o.name + 'を1こ買いました！<br>もう一度タップで貼れます';
              }
            } else {
              buyWait = o.pid;
              colHint.innerHTML = '⭐' + cost + 'で ' + o.name + 'を1こ買いますか？<br>（もう一度タップで決定）';
              beep(600,.06,'triangle',.04);
            }
            return;
          }
          buyWait = null;
          const r2 = togglePin(o.pid);
          beep(r2 === 'off' ? 480 : 760, .08, 'triangle', .04);
          buildColGrid();
          if (r2 === 'off'){
            colHint.textContent = o.name + 'を図鑑に戻しました';
          } else if (r2 && r2.swap){
            const sw = r2.swap === 'rpurin' ? 'ながれぼし' : (CHARS.find(c => c.id === r2.swap) || {}).name;
            colHint.innerHTML = o.name + 'を貼りました！<br>（' + sw + 'は図鑑に戻りました）';
          }
        };
      }
    } else if (o.legend){
      // でんせつはシルエットで「なにかがいる」感を出して期待させる
      d.append(silhouetteThumb(o.pid, 64));
      d.insertAdjacentHTML('beforeend',
        '<div class="cNm">？？？</div><div class="cTt" style="color:#b98ae0">✨' + o.hint + '</div>');
    } else {
      // まだ いない子も うすく 見せる。だれが のこっているか わかると、
      // どの たまごを ひらくか・何を すれば いいかが わかる。
      // 「？」だけだと 何が あるのかも わからない
      d.classList.add('yet');

        '<div class="cTt">' + o.title + '</div>' +
        '<div class="cTt" style="color:#b98ae0">' + o.hint + '</div>');
    }
    colGrid.append(d);
  }
  const gotAll = all.filter(o => dex[o.id]).length;
  colTotal.textContent = '合計 ' + gotAll + ' / ' + all.length + ' 登録';
}

/* 1こ わたす。はじめて 手に 入れたら ずかんにも のこす */
function giveItem(id, n){
  if (!ITEM_BY_ID[id]) return 0;
  const before = gear[id];
  gear[id] = Math.min(ITEM_CAP, before + (n || 1));
  saveGear(); unlock('it_' + id);
  return gear[id] - before;
}

/* はる／はがすの切り替え。'on'／'off'／'none'／{swap:もどったなかま} を返す。
   はがしても数はへらない（ずかんにもどるだけ）。へるのはワザを使ったときだけ。
   バーがいっぱいのときは、いちばん左の仲間が図鑑に戻って交代 */
function togglePin(ch){
  const i = pins.indexOf(ch);
  if (i >= 0){ pins.splice(i, 1); savePins(); buildSkillBar(); return 'off'; }
  if (skStock[ch] < 1) return 'none';
  let swapped = null;
  if (pins.length >= PIN_MAX) swapped = pins.shift();
  pins.push(ch); savePins(); buildSkillBar();
  return swapped ? { swap: swapped } : 'on';
}

/* たおした敵がプレゼントを落とす確率。大物ほど落としやすい。
   ながれぼし（ログインボーナス7日目のなかま）がいると1.5倍 */
const DROP_RATE = { golem:0.35, boss:0.6 };
const dropRate = k => (DROP_RATE[k] || 0.07) * (dex['sp_rpurin'] ? 1.5 : 1);

/* プレゼントキャンディがワザバーへ飛んでいく演出 */
let gifts = [];
/* アイテムが 落ちる わりあい。ワザより ずっと めずらしい。
   これが 主な 入手ルート＝あそんでいれば ためられる。
   「待てば無料」を くずさないために、ここを 0 に しないこと */
const ITEM_DROP = 0.08;
function spawnGift(x, y){
  // ときどき ワザでは なく アイテムが 落ちる
  if (Math.random() < ITEM_DROP){
    const pool = ITEMS.filter(it => gear[it.id] < ITEM_CAP);
    if (pool.length){
      const it = pool[(Math.random()*pool.length)|0];
      gifts.push({ sx:x, sy:y, x, y,
                   tx: COLS*CELL*0.08, ty:ROWS*CELL - CELL*0.15,
                   t:0, life:0.8, it:it.id, rot:Math.random()*6.3 });
      return;
    }
  }
  const opts = SKILLS.filter(s => hasCh(s.ch) && skStock[s.ch] < ITEM_MAX);   // 99こでカンスト
  if (!opts.length) return;
  const s = opts[(Math.random()*opts.length)|0];
  // はってあるスロットの位置へ飛ばす（はっていないワザは中央へ）
  const pi = pins.indexOf(s.ch);
  const frac = pi >= 0 ? (Math.min(pi, PIN_MAX-1) + 0.5) / PIN_MAX : 0.5;
  gifts.push({ sx:x, sy:y, x, y,
               tx: frac * COLS*CELL, ty:ROWS*CELL - CELL*0.15,
               t:0, life:0.8, ch:s.ch, rot:Math.random()*6.3 });
}

function useSkill(s){
  if (over || !hasCh(s.ch) || skCd[s.ch] > 0) return;
  if (s.needEnemy && !enemies.length){ tapSel(false); return; }
  if (skStock[s.ch] < 1){ tapSel(false); return; }
  skStock[s.ch]--; saveSkStock();          // 1回つかうと1こへる
  skCd[s.ch] = s.cd;

  } else if (s.ch === 'taffy'){

/* えらんでいる アイテム（にじいろの秘薬）。
   盤面の 仲間を タップして かける。ボーナス中の キャッチと おなじ しくみ */
let aimItem = null;

/* にじいろに した 絵を 焼いておく。毎フレーム 合成すると おもい。
   色相だけ かける やりかたは drawGenFx と 同じ（明るさを 変えると 顔が 消える） */
const rbCache = new Map();
function rbSprite(src, px, tag){
  px = Math.max(24, Math.round(px/8)*8);
  const k = tag + '@' + px;
  const hit = rbCache.get(k); if (hit) return hit;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = px*d; c.height = px*d;
  const g = c.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.drawImage(src, 0, 0, px, px);
  // 色相の 合成は すきとおった 外がわまで ぬるので、形を とっておいて あとで 切りぬく
  const mask = document.createElement('canvas');
  mask.width = c.width; mask.height = c.height;
  mask.getContext('2d').drawImage(c, 0, 0);
  g.globalCompositeOperation = 'color';
  const r = g.createLinearGradient(px*0.22, px*0.76, px*0.78, px*0.24);
  const st = ['#ff9ec9','#ffbe8f','#ffd76e','#8fe3c4','#9ed8ff','#c9a7ff','#ff9ec9'];
  for (let i=0;i<st.length;i++) r.addColorStop(i/(st.length-1), st[i]);
  g.fillStyle = r; g.fillRect(0, 0, px, px);
  g.globalCompositeOperation = 'destination-in';
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(mask, 0, 0);
  rbCache.set(k, c);
  return c;
}

/* アイテムを つかう。ワザ（useSkill）と 分けてあるのは、
   ワザは「HPをけずる」、アイテムは「たおす」で 効きめの しゅるいが ちがうため */
function useItem(it){
  if (over || gear[it.id] < 1) return;
  if (it.need && !enemies.length){ tapSel(false); return; }
  const W = COLS*CELL, H = ROWS*CELL;

  // 秘薬だけは「だれに かけるか」を えらんでから へらす
  if (it.id === 'elixir'){
    const able = towers.filter(t => !t.rb);
    if (!able.length){
      floatTx(W/2, H*0.45, 'にじいろに できる仲間が いません', '#b98ae0');
      tapSel(false); return;
    }
    aimItem = (aimItem === 'elixir') ? null : 'elixir';
    selTool = null; selTower = null; closeInfo(); syncShop(); syncSkills();
    /* かける相手を えらぶ モードに 入った／出た。まだ 秘薬は へっていないので、
       つかった ときの 音とは 分ける（えらんだ だけ、と 分かるように）*/
    if (aimItem){
      floatTx(W/2, H*0.42, 'にじいろに する仲間を タップ！', '#b98ae0');
      beep(880,.07,'triangle',.04); setTimeout(()=>beep(1180,.09,'triangle',.04),70);
      vib([12,40,12]);
    } else { beep(520,.06,'triangle',.03); vib(10); }
    return;
  }

  gear[it.id]--; saveGear();
  iflash = 1; iSweep = 1; iflashCol = hexRgb(it.col);
  vib(it.vib);
  playSnd(it.snd);      // 音は ITEMS の snd（6つとも 形が ちがう）

  if (it.id === 'ball'){
    // 画面の敵を ぜんぶ たおす。HPを けずるのでは なく たおすので、
    // 後半の かたい敵にも おなじだけ 効く（そこが ワザとの ちがい）
    for (const e of [...enemies]){ const q = posAt(e.d); killEnemy(e, q.x, q.y); }
    for (let i=0;i<40;i++) mote(W/2 + (Math.random()-0.5)*W, H/2 + (Math.random()-0.5)*H, '#c9a7ff');
    ring(W/2, H/2, '#c9a7ff', H*0.9);
    floatTx(W/2, H*0.42, 'にじいろボール！ ぜんめつ！', '#8f66d8');

  } else if (it.id === 'bolt'){
    // いちばん 敵が こんでいる よこの おびを 落とす
    const band = CELL*1.6;
    let best = H/2, bn = -1;
    for (const e of enemies){
      const q = posAt(e.d);
      const n = enemies.filter(o => Math.abs(posAt(o.d).y - q.y) <= band/2).length;
      if (n > bn){ bn = n; best = q.y; }
    }
    for (const e of [...enemies]){
      const q = posAt(e.d);
      if (Math.abs(q.y - best) <= band/2) killEnemy(e, q.x, q.y);
    }
    for (let i=0;i<26;i++) mote(Math.random()*W, best + (Math.random()-0.5)*band, '#ffd76e');
    floatTx(W/2, best - CELL*0.6, 'いなずま！', '#e0a52e');

  } else if (it.id === 'hammer'){
    // ボス1体だけを 落とす。HPの いちばん 多い子
    let tgt = null;
    for (const e of enemies) if (!tgt || e.hp > tgt.hp) tgt = e;
    if (tgt){
      const q = posAt(tgt.d);
      killEnemy(tgt, q.x, q.y);
      ring(q.x, q.y, '#ff9ec9', CELL*2.6);
      for (let i=0;i<20;i++) puff(q.x, q.y, '#ff9ec9');
      floatTx(q.x, q.y - CELL*0.8, 'ハンマー！', '#e05f9e');
    }

  } else if (it.id === 'freeze'){
    for (const e of enemies){ e.stun = 8; const q = posAt(e.d); for (let i=0;i<4;i++) mote(q.x, q.y, '#bfe8ff'); }
    ring(W/2, H/2, '#9ed8ff', H*0.8);
    floatTx(W/2, H*0.42, 'こおりのつぼ！ 8秒 ストップ！', '#4a9ed8');

  } else if (it.id === 'rain'){
    // ⭐は そのウェーブの かせぎに 合わせる。決めうちの 数字だと
    // 後半で ただの ごみに なる（W60で293、W380で6,228 もらえるため）
    const gain = Math.max(120, goldOf('golem') * 10);
    stars += gain;
    floatTx(W/2, H*0.42, '⭐+' + fmtN(gain), '#e0a52e');
    for (let i=0;i<34;i++) mote(Math.random()*W, Math.random()*H*0.6, '#ffe08a');
    saveRun();   // ⭐は saveRun でしか のこらない
  }
  syncHUD(); syncSkills(); syncShop();
}
/* '#c9a7ff' → '201,167,255'。ひかりの 色は rgba() で つくるため */
function hexRgb(h){
  const n = parseInt(h.slice(1), 16);
  return ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255);
}
/* 秘薬を 1人に かける */
function applyElixir(t){
  if (!t || t.rb || gear.elixir < 1) return false;
  gear.elixir--; saveGear();
  t.rb = true;
  aimItem = null;
  const x = tcx(t), y = tcy(t);
  iflash = 1; iSweep = 1; iflashCol = hexRgb(ITEM_BY_ID.elixir.col);
  vib(ITEM_BY_ID.elixir.vib);
  ring(x, y, '#8fe3c4', CELL*3);
  for (let i=0;i<26;i++) mote(x, y, ['#ff9ec9','#ffd76e','#8fe3c4','#9ed8ff','#c9a7ff'][i%5]);
  floatTx(x, y - CELL*0.9, TOWERS[t.k].name + ' が にじいろに！ 攻撃2倍', '#b98ae0');
  playSnd(ITEM_BY_ID.elixir.snd);
  saveRun(); syncSkills(); syncHUD();
  return true;
}

function buildSkillBar(){
  // つかいきったなかまはバーからはずれる（この整理では1こへらさない）
  const alive = pins.filter(ch => SKILLS.some(s => s.ch === ch) && hasCh(ch) && skStock[ch] > 0);
  if (alive.length !== pins.length){ pins = alive; savePins(); }
  skillBar.innerHTML = '';
  /* 持っている アイテムを 左はしに 出す。バーは 横スクロールなので
     高さは ふえない（下のボタンが 画面の外に 出ない） */
  for (const it of ITEMS){
    if (gear[it.id] < 1) continue;
    const b = document.createElement('button');
    b.className = 'sk it';
    b.dataset.it = it.id;
    b.innerHTML = '<div class="itIc">' + it.ic + '</div>' +
                  '<div class="skN">' + it.sn + '</div><div class="skC"></div>';
    const ic = b.querySelector('.itIc');
    if (ART_SPRITE[it.art]){
      ic.textContent = '';
      const im = document.createElement('img');
      im.src = ART_SPRITE[it.art].src; im.width = 38; im.height = 38;
      ic.append(im);
    }
    b.onclick = () => useItem(it);
    skillBar.append(b);
  }
  // はってあるなかまのワザボタン（さいだい7こ・横スクロール）
  for (const ch of pins){
    const s = SKILLS.find(x => x.ch === ch);
    const b = document.createElement('button');
    b.className = 'sk';
    b.dataset.ch = ch;
    b.append(charThumb({ pid:ch }, 38));
    b.insertAdjacentHTML('beforeend',
      '<div class="skN">' + s.name + '</div><div class="skC"></div>' +
      '<div class="skCd" style="display:none"></div>');
    // タップで発動、ながおし（0.55秒）でずかんにもどす
    let lpTimer = null, lpFired = false;
    const cancelLp = () => { if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; } };
    b.addEventListener('pointerdown', () => {
      lpFired = false;
      lpTimer = setTimeout(() => {
        lpFired = true;
        const nm = ch === 'rpurin' ? 'ながれぼし' : (CHARS.find(c => c.id === ch) || {}).name;
        togglePin(ch);
        floatTx(COLS*CELL/2, ROWS*CELL - CELL*0.6, nm + 'を図鑑に戻した', '#b98ae0');
        beep(480,.1,'triangle',.04); vib([18,40,18]);
      }, 550);
    });
    b.addEventListener('pointerup', cancelLp);
    b.addEventListener('pointerleave', cancelLp);
    b.addEventListener('pointercancel', cancelLp);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.onclick = () => {
      if (lpFired){ lpFired = false; return; }
      // つかえない（クールダウン中・0こ）ときは 低い音＋ふるえで 知らせる
      if (b.disabled || skCd[ch] > 0 || (skStock[ch] || 0) < 1){ tapSel(false); return; }
      useSkill(s);
    };
    skillBar.append(b);
  }
  // のこりは「はれる」空きスロット
  for (let i = pins.length; i < PIN_MAX; i++){
    const b = document.createElement('button');
    b.className = 'sk empty';
    b.disabled = true;
    b.innerHTML = '<div style="font-size:21px;line-height:38px">＋</div><div class="skN">図鑑から貼る</div>';
    skillBar.append(b);
  }
  syncSkills();
}
function syncSkills(){
  for (const b of skillBar.children){
    if (b.dataset.it){
      const it = ITEM_BY_ID[b.dataset.it];
      b.querySelector('.skC').textContent = '×' + gear[it.id];
      b.classList.toggle('off', over || gear[it.id] < 1);
      // えらんでいる あいだは 光らせる（どれを かけるか わからなくなるため）
      b.classList.toggle('aim', aimItem === it.id);
      continue;
    }
    if (!b.dataset.ch) continue;
    const s = SKILLS.find(x => x.ch === b.dataset.ch);
    if (!hasCh(s.ch)) continue;
    const st = skStock[s.ch];
    b.querySelector('.skC').textContent = '残り ×' + st;
    const cd = skCd[s.ch], cdEl = b.querySelector('.skCd');
    cdEl.style.display = cd > 0 ? '' : 'none';
    if (cd > 0) cdEl.textContent = Math.ceil(cd);
    // disabled属性だと「ながおしではがす」もできなくなるので、見た目だけ無効化
    // （発動条件はuseSkill側でチェックずみ）
    b.classList.toggle('off', over || cd > 0 || st < 1);
  }
}

/* ==========================================================
   プレイのオートセーブ（とちゅうのウェーブから再開できる）
   ========================================================== */
function saveRun(w){
  if (weekly) return;   // おだい中は ふだんの進行を 上書きしない
  try{
    localStorage.setItem('sweetTD.run', JSON.stringify({
      w: (w !== undefined ? w : wave), st: stars, hp: hearts, lf: life,
      cu: continueUsed ? 1 : 0,
      tw: towers.map(t => {
        return t.rb ? { k:t.k, c:t.c, r:t.r, lv:t.lv, rb:1 }
                        : { k:t.k, c:t.c, r:t.r, lv:t.lv };
      }),
    }));
  }catch(e){}
}
function clearRun(){ try{ localStorage.removeItem('sweetTD.run'); }catch(e){} setNextHeartAt(0); }
/* 回復までのカウントダウン。時間がきたらボタンが「つづきから」にかわる */
function armLifeButton(fromBoot){
  if (lifeTimer){ clearInterval(lifeTimer); lifeTimer = null; }
  const tick = () => {
    applyRegen();      // 時間がたっていれば💗をふやす
    syncHUD();         // HUDのハート表示も一緒に更新
    if (hearts >= 1){
      // 1こでもあれば、そのぶんを持って すぐ再開できる
      ovBtn.disabled = false;
      ovBtn.innerHTML = '続きから ' + PLAY + '（💗' + hearts + '）';
      ovBtn.onclick = () => continueRun(hearts, fromBoot);
    } else {
      // まだ0こ：つぎの💗までの残り時間をボタンに出す
      ovBtn.disabled = true;
      ovBtn.onclick = null;
      const at = nextHeartAt();
      if (at){
        const sec = Math.max(0, Math.ceil((at - Date.now())/1000));
        ovBtn.textContent = '次の💗まで あと ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
      } else {
        ovBtn.textContent = '💗がたまるまで待ってね';
      }
    }
  };
  tick();
  lifeTimer = setInterval(tick, 1000);
}
/* 起動時：回復まちの途中なら、そのつづきの画面を出す */
function checkLife(){
  if (!nextHeartAt()) return;
  let rn = null;
  try{ rn = JSON.parse(localStorage.getItem('sweetTD.run') || 'null'); }catch(e){}
  if (!rn){ setNextHeartAt(0); return; }   // 進行セーブがないなら回復まちも意味がない
  over = true; running = false; continueUsed = true;
  applyRegen(); syncHUD();   // とじているあいだにたまった💗を反映
  ovT.textContent = 'おかしの国は おやすみ中';
  ovB.innerHTML = 'ウェーブ <b>' + wave + '</b> から続けられます。<br>' +
    '<span style="opacity:.75">' + REGEN_MIN + '分ごとに💗が1こずつ回復（最大' + maxHearts() + '）</span>';
  ovShare.style.display = 'none';
  ovAlt.textContent = '最初からやり直す';
  ovAlt.style.display = '';
  ovAlt.onclick = () => { clearRun(); reset(); };
  ov.classList.add('on');
  armLifeButton(true);
}
/* 起動時：セーブがあれば、そのウェーブから再開する */
function tryResume(){
  let rn = null;
  try{ rn = JSON.parse(localStorage.getItem('sweetTD.run') || 'null'); }catch(e){}
  if (!rn) return;
  wave = Math.max(0, rn.w | 0);
  applyLayout(wave);              // タワーの おき場所を しらべる前に 道を そろえる
  stars = Math.max(0, rn.st | 0);
  hearts = Math.min(HEART_STOCK_MAX, Math.max(0, rn.hp | 0));   // のこり回数は そのまま 引きつぐ
  // むかしの セーブには げんきが 入っていないので、そのときは 満タンから
  life = rn.lf === undefined ? maxLife() : Math.min(maxLife(), Math.max(1, rn.lf | 0));
  towers = (rn.tw || [])
    .filter(t => TOWERS[t.k] && !pathCells.has(key(t.c, t.r)))
    .map(t => ({ k:t.k, c:t.c, r:t.r, lv:Math.min(5, Math.max(1, t.lv|0)), rb:!!t.rb,
                 cd:0, ang:-Math.PI/2, pulse:0, ph:Math.random()*6.3 }));
  continueUsed = !!rn.cu;
  floatTx(COLS*CELL/2, ROWS*CELL/2, '続きから再開！', '#b98ae0');
  syncHUD();
}
/* ゲームオーバーからの「つづきから」：たまっている💗の数だけ持って、そのウェーブから再開
   keepWave は起動時の再開用（保存の時点でウェーブがもどしてあるので、二重にもどさない） */
function continueRun(refill, keepWave){
  over = false; running = false;
  enemies = []; shots = []; spawnQ = []; gifts = [];
  if (!keepWave) wave = Math.max(0, wave - 1);
  applyLayout(wave);              // ウェーブが もどって 周が かわることが ある

function todayStartStars(){

function applyLoginReward(day){
  // 毎日 💎を すこしだけ。買えないうちも ショップが 動くようにしておく。
  // 課金を つないだら、ここの数は 見なおすこと
  gems += 2; saveGems();
  const addStart = n => {
    try{ localStorage.setItem('sweetTD.todayStars', JSON.stringify({ d: dateStr(), n })); }catch(e){}
    stars += n;                          // いま遊んでいるぶんにもすぐ足す
    return '今日は スタートおほしさま <b>+' + n + '</b>！';
  };
  const owned = SKILLS.filter(s => hasCh(s.ch));
  const addStock = n => {
    if (!owned.length) return addStart(50 + 50*n);   // まだワザがないうちはおほしさまに
    const names = [];
    for (let i=0;i<n;i++){
      const s = owned[(Math.random()*owned.length)|0];
      skStock[s.ch] = Math.min(ITEM_MAX, skStock[s.ch] + 1);
      names.push(s.name);
    }
    saveSkStock();
    return 'ワザのストック <b>+' + n + '</b>（' + names.join('・') + '）！';
  };
  switch(day){
    case 1: return addStart(100);
    case 2: return addStock(1);
    case 3: return addStart(200);
    case 4: return addStock(2);
    case 5: return addStart(300);
    case 6:
      if (!owned.length) return addStart(300);
      for (const s of owned) skStock[s.ch] = Math.min(ITEM_MAX, skStock[s.ch] + 1);
      saveSkStock();
      return '所持しているワザのストック <b>全部+1</b>！';
    default:
      if (!dex['sp_rpurin']){
        unlock('sp_rpurin');
        if (pins.length < PIN_MAX && !pins.includes('rpurin')){ pins.push('rpurin'); savePins(); }
        return '伝説の仲間 <b>ながれぼし</b> が仲間に！！<br>✨ プレゼントが おちやすくなる ✨';
      }
      return addStart(500);
  }
}

function checkLogin(){
  const today = dateStr();
  let lg = { last:'', streak:0 };
  try{ lg = JSON.parse(localStorage.getItem('sweetTD.login') || '{"last":"","streak":0}'); }catch(e){}
  if (lg.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.getFullYear() + '/' + String(y.getMonth()+1).padStart(2,'0') + '/' + String(y.getDate()).padStart(2,'0');
  const day = (lg.last === yest) ? (lg.streak % 7) + 1 : 1;   // 途切れたら1日目から
  lg.last = today; lg.streak = day;
  try{ localStorage.setItem('sweetTD.login', JSON.stringify(lg)); }catch(e){}
  let msg = applyLoginReward(day);
  msg += passDaily();   // パスポートの ぶんは ログインボーナスの あとに たす
  buildSkillBar();      // ごほうびのストックや新しいなかまをバーへ反映
  let st = '<div style="display:flex;gap:5px;justify-content:center;margin:8px 0">';
  for (let i=1;i<=7;i++){
    const on = i <= day;
    st += '<div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--fs));' +
      (on ? 'background:linear-gradient(180deg,#ffb3dc,#ff8fc4);color:#fff;box-shadow:0 2px 0 #e05f9e'
          : 'background:rgba(255,255,255,.75);opacity:.6') +
      (i === day ? ';outline:3px solid #ffd76e' : '') + '">' + (on ? '✓' : i) + '</div>';
  }
  st += '</div>';
  ovT.textContent = '今日のプレゼント🎁';
  ovB.innerHTML = '<b>' + day + '日目</b>の ログインボーナス！' + st + msg +
    (day === 6 ? '<br><span style="opacity:.7">あしたは 伝説の仲間が…！？</span>' : '');
  ovShare.style.display = 'none';
  ovAlt.style.display = 'none';
  ovBtn.textContent = '受け取る ✨';
  ovBtn.onclick = () => { ov.classList.remove('on'); syncHUD(); };
  ov.classList.add('on');
  // 7日目（でんせつのなかま）はとびきり盛大に
  if (day >= 7) celebrate({ rays: 3, conf: 160, flash: true, fanfare: 2 });
  else celebrate({ conf: 24 + day*6 });
  beep(700,.12,'triangle',.05);
  setTimeout(()=>beep(930,.15,'triangle',.05),130);
}

   SNSシェアカード（Canvasで画像を作ってそのまま共有）
   ========================================================== */
function makeShareCard(){
  const W2 = 1200, H2 = 630;
  const c = document.createElement('canvas');
  c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, H2);
  bg.addColorStop(0,'#ffe6f3'); bg.addColorStop(0.55,'#f3e8ff'); bg.addColorStop(1,'#e6f6ff');
  g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
  // キラキラ
  for (let i=0;i<45;i++){
    const x = Math.random()*W2, y = Math.random()*H2, r = 5 + Math.random()*12;
    g.save(); g.translate(x, y); g.rotate(Math.random()*6.3);
    g.fillStyle = 'rgba(255,255,255,' + (0.35 + Math.random()*0.5) + ')';
    g.beginPath();
    for (let j=0;j<4;j++){
      const a = j*Math.PI/2;
      g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      g.quadraticCurveTo(0, 0, Math.cos(a+Math.PI/4)*r*0.22, Math.sin(a+Math.PI/4)*r*0.22);
    }
    g.closePath(); g.fill(); g.restore();
  }
  g.textAlign = 'center';
  g.fillStyle = '#e05f9e';
  g.font = "800 48px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('まほうのおかしの国をまもって', W2/2, 120);
  g.fillStyle = '#6b4a63';
  g.font = "800 92px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('ウェーブ ' + Math.max(1, wave, rec.bw) + ' 到達！', W2/2, 260);
  const got = dexList().filter(o => o.cat === 'ch' && dex[o.id]).length;
  g.font = "800 38px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillText('👑 仲間 ' + got + '人　⭐ 倒した数 ' + rec.kills, W2/2, 340);
  // なかまの似顔絵をならべる（いなければおかしのようせい）
  const picks = dexList().filter(o => o.cat === 'ch' && dex[o.id]).map(o => o.pid);
  const fill = ['tw_candy','tw_ice','tw_choco','tw_star'];
  while (picks.length < 5) picks.push(fill[picks.length % 4]);
  picks.slice(0, 5).forEach((pid, i) => {
    const pc = document.createElement('canvas');
    pc.width = pc.height = 150;
    drawPortrait(pc.getContext('2d'), pid, 150);
    g.drawImage(pc, W2/2 - 375 + i*150, 380);
  });
  g.font = "800 28px 'Hiragino Maru Gothic ProN',sans-serif";
  g.fillStyle = '#b98ae0';
  g.fillText('okashi-no-kuni.github.io', W2/2, H2 - 35);
  return c;
}

/* セーフエリア（ホームバーの ぶん）を じっさいに 測る。
   env() は CSS の 中でしか つかえないので、その高さの 目に 見えない
   はこを 1つ 作って 高さを 読む */
function safeBottom(){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;visibility:hidden;' +
                    'height:env(safe-area-inset-bottom,0px)';
  document.body.append(d);
  const v = Math.round(d.getBoundingClientRect().height);
  d.remove();
  return v;
}
/* ガイドの いちばん下に 画面の 数字を 出す。
   「写真だと 余白が あるのに 実機だと ない」のような、
   こちらでは 再現できない ときに ここを 読んでもらう */
function showDiag(){
  const el = $('hDiag'); if (!el) return;
  const c = $('ctrl').getBoundingClientRect();
  const vv = window.visualViewport;
  const sb = safeBottom();
  const gap = Math.round((vv ? vv.height : window.innerHeight) - c.bottom);
  el.innerHTML = 'はいしん: ' + document.lastModified +
    '<br>まど ' + window.innerHeight +
    ' ／ 見えてる ' + (vv ? Math.round(vv.height) : '-') +
    ' ／ ホームバー ' + sb +
    ' ／ 下のすき間 ' + gap + (gap >= sb + 8 ? ' ✅' : ' ⚠はみ出し');
}

/* 図鑑の 2行（見出し・タブ）は、中みを **みんな おなじ大きさ**で ならべる。
   はこの 幅は flex:1 1 0 で 等分するので CSS だけで そろうが、
   中の 文字が 入るかどうかは 画面の はばと フォントで 変わる。
   **決めうちの @media では 実機で はみ出す** ——Linuxで 測った幅は
   iPhone の 丸ゴシックより せまいため。だから 出したあとに 測って きめる
   （横に ならぶ札の fitStat() と 同じ 考えかた）。

   見出し … 名前を 長い順に けずる（今週のおだい → おだい → 🏅だけ）
   タブ  … --fsTab を さげて、いちばん長い「アイテム」が 入るまで 小さくする */
const FSTAB_MIN = 0.6;                    // これ以上は 小さくしない（320pxで ここまで 要る）
function fitHead(){
  const head = $('colHead'), ov = $('colOv');
  if (!head || !ov) return;
  // はこから 文字が あふれているか。overflow:hidden なので scrollWidth で 分かる
  const over = el => [...el.querySelectorAll('button')].some(b => b.scrollWidth > b.clientWidth + 1);
  const show = (cls, on) =>
    document.querySelectorAll('.' + cls).forEach(e => e.style.display = on ? '' : 'none');

  // タブは 7つ 等分なので「アイテム」が いちばん きつい。入るまで 文字を 小さく
  let k = 1;
  ov.style.setProperty('--fsTab', k);
  while (over(colTabsEl) && k > FSTAB_MIN){
    k = Math.round((k - 0.04) * 100) / 100;
    ov.style.setProperty('--fsTab', k);
  }
  // 2. 見出しの 名前は 長い順に けずる（✕の 幅は CSS で きまっている）
  show('pwTx', true); show('wkLong', true);   // いちばん長い形から ためす
  if (over(head)){
    show('wkLong', false);                    // 「今週の」を おとす → おだい
    if (over(head)) show('pwTx', false);      // 名前ごと おとす → 絵文字だけ
  }
}

/* 月曜はじまりの 週ばんごう。1970-01-05（月）からの 週かず */
let weekDbg = null;      // ?dbg=1 の 見た目たしかめ用。ふだんは null
function weekNo(){
  if (weekDbg !== null) return weekDbg;
  const d = new Date();
  const utc = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((utc - Date.UTC(1970,0,5)) / 604800000);
}

  { id:'many',  name:'大群',         desc:'敵の数が 1.6倍。まとめて攻撃できる仲間が 強い',    many:1.6 },
  { id:'boss',  name:'ボスだらけ',   desc:'5ウェーブごとに ボスが来ます',                     boss:5 },
  { id:'rush',  name:'はやい大群',   desc:'数1.3倍・速さ1.2倍。とにかく手数が いります',      many:1.3, spd:1.2 },
];
const weekRule = () => WEEK_RULES[weekNo() % WEEK_RULES.length];
const weekWay  = () => makeWay(1000 + weekNo());     // ふだんの周とは かぶらない たね
/* 今週の きろく。週が かわると まっさらに もどる */
