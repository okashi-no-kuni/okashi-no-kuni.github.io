    if (el !== wrapEl) used += el.getBoundingClientRect().height;
  }
  const cs = getComputedStyle(appEl);
  used += parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0)
        + parseFloat(cs.rowGap || cs.gap || 0) * Math.max(0, shown - 1);
  if (infoWasOn){ infoEl.classList.add('on'); shopEl.style.display = 'none'; }
  // 起動直後は レイアウトが まだ なくて 0 になるので、そのときだけ 決めうち。
  // 下のUIを つめたら この数字も 直すこと（説明文を消して 382 → 298 になった）
  /* ここは innerHeight の まま。visualViewport に かえると iOS の
     バーの 出入りで ばんめんが ちぢみつづける（上の コメントの 失敗）。
     下が 足りない ときは 余白（#app の padding-bottom）で 取ること */
  // 起動直後（レイアウト前）は 決めうち。ホームバーの ぶんは 足しておく
  const h = window.innerHeight - (used > 200 ? Math.ceil(used) : 298 + safeBottom());
  const applyCell = () => {
    const W = COLS*CELL, H = ROWS*CELL;
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    /* Phaser の 立ちあがりは 非同期。`game` に 入っていても canvas は
       まだ ないことが あり、その とちゅうで scale.resize を よぶと 落ちる
       （表紙を とじた ときの resize で 実際に おきた）*/
    if (game && game.isBooted && game.canvas){
      // 中みは こまかく（DPR倍）、見た目は CSSピクセルで
      game.scale.resize(W*DPR, H*DPR);
      game.canvas.style.width = W + 'px';
      game.canvas.style.height = H + 'px';
      /* Phaser が すぐに 変えないことが あるので、canvas そのものにも 入れる。
         ここが ずれたままだと 消しのこりが 出る（render を 見ること） */
      const cw = Math.round(W*DPR), ch = Math.round(H*DPR);
      if (game.canvas.width !== cw || game.canvas.height !== ch){
        game.canvas.width = cw; game.canvas.height = ch;
      }
    }
  };
  /* ばんめんの 大きさは innerHeight から そのまま 決める。
     はみ出しを はかって 自動で ちぢめる やりかたも ためしたが、
     iOS は アドレスバーの 出入りで innerHeight と レイアウトの 高さが
     ずれるので、ばんめんが 小さくなりすぎた。ここは さわらない */
  CELL = Math.max(24, Math.floor(Math.min(w/COLS, h/ROWS)));
  applyCell();
  measurePath();
  if (typeof fitHead === 'function') fitHead();   // よこ向きに したときも 名前を あわせなおす
  /* てきの すすみぐあい e.d は ピクセルで もっている。マスが 小さくなると
     道も みじかくなるので、そのままだと「もう ゴールに ついている」あつかいに
     なって、まだ とちゅうの子まで いっせいに 通りぬけ、💗が いっきに 0になる。
     スマホは アドレスバーの 出入りで innerHeight が かわるため、
     ふつうに あそんでいるだけで これが おきる。
     道の長さの ひりつで すすみを つけかえて、見た目の いちを 保つ */
  if (prevLen > 0 && pathLen > 0 && prevLen !== pathLen){
    const k = pathLen / prevLen;
    for (const e of enemies) e.d *= k;
  }
  const W = COLS*CELL, H = ROWS*CELL;
  for (const s of sparks){ s.x = Math.min(s.x, W); s.y = Math.min(s.y, H); }
  bakeGround();
}
window.addEventListener('resize', resize);
/* **起動直後に 1回 はかるだけでは 足りない。**
   iOS は セーフエリア（ホームバーの ぶん＝env(safe-area-inset-bottom)）を
   すぐには 返さない。0の まま はかると 34px ぶん 見のがして、そのぶん
   下が 画面の 外に 出る（実機の 報告：ホームバー34なのに
   下のすき間が 31しか なかった＝ボタンが ホームバーの 帯の 中）。
   落ちついてから はかりなおす。何回 よんでも 同じ 結果に なる関数なので
   ただしくなったら それ以上 動かない */
window.addEventListener('load', resize);
setTimeout(resize, 300);
setTimeout(resize, 1200);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});
/* iOS は うらに まわると canvas の中みを すてることがある。
   もどってきたら 焼いてある じめんも 消えているので、焼きなおす */
document.addEventListener('visibilitychange', () => { if (!document.hidden) bakeGround(); });

/* ==========================================================
   Phaser（ゲームの土台）

   絵は いまのところ Canvas 2D のまま。Phaser の描画APIには
   グラデーションも 合成モードもなく、いまの立体感や つやが出せないため、
   レンダラは CANVAS を えらんでいる。
   キャラを 画像素材に かえたら AUTO（WebGL）に かえられる。
   Phaser 3 は どちらの レンダラも もっているので、のせかえは 1行ですむ。

   Phaser には ループ・入力・画面サイズを まかせる。
   ========================================================== */
let game = null;

/* Phaser の中で、これまでの Canvas 2D の描画を そのまま動かすための入れもの。
   カメラの変換は かからないので、じぶんで CSSピクセル系に そろえる */
class Painter extends Phaser.GameObjects.GameObject {
  constructor(sc, fn){
    super(sc, 'Painter');
    this.fn = fn;
    this.setActive(true);
    this.renderFlags = 0xF;      // これを立てないと Phaser が えがきに来ない
  }
  renderCanvas(renderer){
    const c = renderer.currentContext || renderer.gameContext;
    const prev = ctx;
    c.save(); c.setTransform(DPR, 0, 0, DPR, 0, 0); ctx = c;
    try{ this.fn(); } finally { ctx = prev; c.restore(); }
  }
}

const BoardScene = {
  key: 'board',
  create(){
    this.add.existing(new Painter(this, render));
    // Phaser が タッチとマウスを 同じように あつかってくれる。
    // 座標は デバイスピクセルで来るので CSSピクセルに もどす
    this.input.on('pointerdown', p => boardTap(p.x/DPR, p.y/DPR));
  },
  update(_t, dtMs){
    const dt = Math.min(0.05, dtMs/1000);
    if (!over) for (let i=0;i<speed;i++) update(dt);
    if (!over) bonusUpdate(dt);   // ボーナスは実時間（速度倍率のえいきょうなし）
    /* ますの 大きさか 道の 形が 変わったのに はかりなおしていなければ、
       ここで 直す。どこか 1か所でも measurePath() を よび わすれると
       敵が 道の 外を あるくので、さいごの とりでを おいておく */
    /* canvas の 実寸が W×H×DPR と ずれていたら 合わせる。
       Phaser の scale.resize() が すぐに 反映されないことが あるため。
       **render の 中では やらないこと**——あそこは Phaser の save/restore の
       内がわで、canvas を つくりなおすと Phaser の 状態が こわれる */
    if (game && game.canvas){
      const cw = Math.round(COLS*CELL*DPR), ch = Math.round(ROWS*CELL*DPR);
      if (game.canvas.width !== cw || game.canvas.height !== ch){
        game.scale.resize(cw, ch);
        game.canvas.width = cw; game.canvas.height = ch;
        game.canvas.style.width = (COLS*CELL) + 'px';
        game.canvas.style.height = (ROWS*CELL) + 'px';
      }
    }
    if (pathCell !== CELL || pathWay !== WAY.join(';')){
      const prev = pathLen;
      measurePath();
      if (prev > 0 && pathLen > 0 && prev !== pathLen){
        const k = pathLen / prev;
        for (const e of enemies) e.d *= k;
      }
    }
    if (groundKey() !== groundKeyNow) bakeGround();   // ステージが かわった
  },
};

/* ==========================================================
   表紙（タイトル画面）
   本でいう 表紙。「まほうの おかしの国」の 入り口。
   絵は ぜんぶ コードで えがく（画像を 1まいも 足さない）。
   Web版は 読みこみの おそさが そのまま 出るので、
   表紙のためだけに 大きな 絵を 置きたくないためです。
   ========================================================== */
const titleOv = $('titleOv'), titleCv = $('titleCv'), titleIn = $('titleIn');
let titleRaf = 0, titleT0 = 0, titleExit = 0;   // titleExit は とじる 演出の 始まり

/* 表紙に 立つ子。x は 画面はばに 対する いち、s は 大きさの 倍率。
   絵が まだ 読めていない子は とばす（rAF で えがきつづけるので、
   読めた つぎの フレームから ひとりでに 出てくる） */
const TITLE_CAST = [
  /* おく（小さく うすく）→ 手まえ（大きく）。おなじ大きさで 横に ならべると
     「キャラえらび」に 見えるので、大きさと こさで おくゆきを つける。
     **人数を ふやしすぎない。**8人に したら ごちゃごちゃに 見えました。
     `k` が ない子は コードで えがく（`draw`）*/
  { k:'macaron', x:0.815, y:0.040, s:0.50, a:0.82, ph:1.7 },
  { k:'choco',   x:0.145, y:0.048, s:0.54, a:0.85, ph:2.4 },
  { k:'rabbit',  x:0.335, y:0.092, s:0.70, a:0.92, ph:0.0 },
  { draw:'lolly',x:0.870, y:0.108, s:0.90, a:0.96, ph:3.1 },
  { k:'unicorn', x:0.185, y:0.150, s:1.00, a:1.00, ph:1.1 },
  { k:'bear',    x:0.735, y:0.156, s:1.02, a:1.00, ph:0.6 },
];

/* おかしの城。cx=まん中・base=足もと・w=はば。
   ひかりは 左うえから 当てる。どの パーツも 左が あかるく 右が かげ */
let CASTLE_WINS = [], CASTLE_POP = null;

/* 城の うごく ぶん（まどの あかり・うずまきの まわり）。
   焼きこみの 上に 毎フレーム のせる。**グラデは つかわない**
   ——小さいので べた塗りの まる 2つで 十分で、そのほうが 速い */
function titleCastleLive(g, t){
  const TAU = 6.2832;
  for (let i=0;i<CASTLE_WINS.length;i++){
    const o = CASTLE_WINS[i];
    const lit = 0.30 + 0.55*Math.abs(Math.sin(t*0.95 + i*0.85));
    g.fillStyle = 'rgba(255,236,186,' + (lit*0.30).toFixed(3) + ')';
    g.beginPath(); g.arc(o.x, o.y, o.r*1.45, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,244,206,' + (lit*0.85).toFixed(3) + ')';
    g.beginPath(); g.arc(o.x, o.y, o.r*0.55, 0, TAU); g.fill();
  }
  const p = CASTLE_POP; if (!p) return;
  g.save(); g.translate(p.px, p.py); g.rotate(t*0.6);
  g.strokeStyle = '#f28cb6'; g.lineWidth = p.pr*0.26; g.lineCap = 'round';
  g.beginPath();
  const TURN = TAU*1.9;
  for (let a=0; a<=TURN; a+=0.10){ const r = p.pr*0.10 + (a/TURN)*p.pr*0.74;
    g.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  g.stroke(); g.restore();
  g.lineCap = 'butt';
}

function titleCastle(g, cx, base, w){
  CASTLE_WINS = []; CASTLE_POP = null;
  const TAU = 6.2832;
  const gold = 'rgba(214,176,110,.55)';        // うすい 金。ふとい ふちどりは しない

  /* かげは 黒ではなく 紫がかった 半とうめい */
  g.fillStyle = 'rgba(120,90,120,.09)';
  g.beginPath(); g.ellipse(cx, base + w*0.020, w*0.58, w*0.040, 0, 0, TAU); g.fill();

  /* 胴。**ふとい ふちどりでは なく、うすい 金の けい線 1本**で 締める */
  const body = (x, y, ww, hh, r) => {
    const gr = g.createLinearGradient(x, y, x + ww, y);
    gr.addColorStop(0, '#fffdf8'); gr.addColorStop(0.48, '#fff3e2'); gr.addColorStop(1, '#e8cdb8');
    g.fillStyle = gr; roundRect(x, y, ww, hh, r); g.fill();
    g.strokeStyle = gold; g.lineWidth = Math.max(0.6, w*0.0035); g.stroke();
    /* つやの おび */
    g.save(); roundRect(x, y, ww, hh, r); g.clip();
    const sh = g.createLinearGradient(x + ww*0.06, 0, x + ww*0.42, 0);
    sh.addColorStop(0, 'rgba(255,255,255,0)');
    sh.addColorStop(0.5, 'rgba(255,255,255,.55)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(x, y, ww, hh);
    g.restore();
  };

  /* とんがり屋根。見本は **たかく ほそい 円すい**＋うろこ模様＋玉と はた */
  const roof = (rx, ry, rw, rh, tw) => {
    const gr = g.createLinearGradient(rx - rw/2, ry, rx + rw/2, ry + rh);
    gr.addColorStop(0, '#ffbcd8'); gr.addColorStop(0.55, '#f79ac0'); gr.addColorStop(1, '#e07ba4');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + rw/2, ry + rh); g.lineTo(rx - rw/2, ry + rh);
    g.closePath(); g.fill();
    /* うろこ。細かい 線で 密度を 出す（大きな もようは 置かない）*/
    g.save();
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + rw/2, ry + rh); g.lineTo(rx - rw/2, ry + rh);
    g.closePath(); g.clip();
    g.strokeStyle = 'rgba(255,255,255,.42)'; g.lineWidth = Math.max(0.5, rw*0.020);
    for (let i=1;i<=3;i++){
      const yy = ry + rh*i/3.4, hw = rw/2*i/3.4;
      g.beginPath();
      for (let k=-3;k<=3;k++)
        g.arc(rx + hw*k/3, yy, hw*0.17, Math.PI, 0);
      g.stroke();
    }
    g.restore();
    /* 屋根の すそに しぼった クリーム */
    g.fillStyle = 'rgba(255,252,246,.95)';
    const n = Math.max(3, Math.round(rw/6));
    for (let i=0;i<n;i++)
      { g.beginPath(); g.arc(rx - rw/2 + rw*(i+0.5)/n, ry + rh, rw/n*0.46, 0, TAU); g.fill(); }
    /* てっぺんの 金の 玉と ちいさな はた */
    g.fillStyle = '#f2cf82';
    g.beginPath(); g.arc(rx, ry - rw*0.055, rw*0.075, 0, TAU); g.fill();
    g.strokeStyle = '#e9b8cf'; g.lineWidth = Math.max(0.6, tw*0.055); g.lineCap = 'round';
    g.beginPath(); g.moveTo(rx, ry - rw*0.10); g.lineTo(rx, ry - rw*0.42); g.stroke();
    g.fillStyle = '#ff9dc2';
    g.beginPath(); g.moveTo(rx, ry - rw*0.40);
    g.quadraticCurveTo(rx + tw*0.52, ry - rw*0.46, rx + tw*0.66, ry - rw*0.24);
    g.quadraticCurveTo(rx + tw*0.42, ry - rw*0.16, rx, ry - rw*0.20);
    g.closePath(); g.fill();
  };

  /* 細い アーチまど。あかりは 焼かず、毎フレーム 上に のせる */
  const win = (x, y, r) => {
    g.fillStyle = '#a98ad6';
    g.beginPath();
    g.moveTo(x-r, y+r*1.35); g.lineTo(x-r, y);
    g.arc(x, y, r, Math.PI, 0); g.lineTo(x+r, y+r*1.35);
    g.closePath(); g.fill();
    g.strokeStyle = gold; g.lineWidth = Math.max(0.5, w*0.003); g.stroke();
    CASTLE_WINS.push({ x, y: y + r*0.40, r });
  };

  /* とう。ほそく たかく。まどを たてに ならべて 密度を 出す */
  const tower = (tx, tw, th, wn) => {
    const ty = base - th;
    body(tx - tw/2, ty, tw, th, tw*0.30);
    for (let i=0;i<wn;i++) win(tx, ty + th*(0.22 + i*0.235), tw*0.155);
    const rh = tw*1.15;
    roof(tx, ty - rh, tw*1.28, rh, tw);
    return ty - rh;
  };

  /* かべ。とうを つなぐ 高さに。こしの おびと まどで 1つの 建物に 見せる */
  const ww = w*0.88, wh = w*0.56, wx = cx - ww/2, wy = base - wh;
  body(wx, wy, ww, wh, w*0.022);
  g.fillStyle = 'rgba(214,176,110,.20)'; g.fillRect(wx, wy + wh*0.58, ww, w*0.008);
  for (let i=0;i<7;i++) win(wx + ww*(i+0.5)/7, wy + wh*0.20, w*0.021);
  for (let i=0;i<7;i++) win(wx + ww*(i+0.5)/7, wy + wh*0.52, w*0.021);
  const mn = 13, mw = ww/mn*0.56;
  for (let i=0;i<mn;i++){
    const x = wx + ww*(i+0.5)/mn;
    const gr = g.createLinearGradient(x-mw/2, wy, x+mw/2, wy);
    gr.addColorStop(0, '#fffdf8'); gr.addColorStop(1, '#e6c9b2');
    g.fillStyle = gr; roundRect(x-mw/2, wy - mw*0.80, mw, mw*0.92, mw*0.26); g.fill();
    g.strokeStyle = gold; g.lineWidth = Math.max(0.5, w*0.0028); g.stroke();
  }

  tower(cx - w*0.415, w*0.100, w*0.68, 3);
  tower(cx + w*0.415, w*0.100, w*0.68, 3);
  const apL = tower(cx - w*0.235, w*0.115, w*0.92, 4);
  const apR = tower(cx + w*0.235, w*0.115, w*0.92, 4);
  const apC = tower(cx,           w*0.150, w*1.26, 5);
  void apL; void apR;

  /* 入り口。**とうより あとに えがくこと** ——
     まん中の とうは 入り口より 太いので、先に 引くと まるごと かくれます */
  const dw = w*0.140, dh = w*0.260;
  g.fillStyle = '#9b78c9';
  g.beginPath();
  g.moveTo(cx-dw/2, base); g.lineTo(cx-dw/2, base-dh+dw/2);
  g.arc(cx, base-dh+dw/2, dw/2, Math.PI, 0);
  g.lineTo(cx+dw/2, base); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(214,176,110,.75)'; g.lineWidth = Math.max(0.8, w*0.006); g.stroke();
  const dg = g.createLinearGradient(cx, base-dh, cx, base);
  dg.addColorStop(0, 'rgba(255,238,196,.55)'); dg.addColorStop(1, 'rgba(255,238,196,0)');
  g.fillStyle = dg;
  g.beginPath();
  g.moveTo(cx-dw/2, base); g.lineTo(cx-dw/2, base-dh+dw/2);
  g.arc(cx, base-dh+dw/2, dw/2, Math.PI, 0);
  g.lineTo(cx+dw/2, base); g.closePath(); g.fill();

  /* てっぺんの ぺろぺろキャンディ。この国の めじるし。
     うずまきの 半けいは かならず 玉の 中に おさめること */
  const pr = w*0.058, px = cx, py = apC - w*0.135;
  g.strokeStyle = '#fffaf0'; g.lineWidth = w*0.013; g.lineCap = 'round';
  g.beginPath(); g.moveTo(px, py); g.lineTo(px, apC + w*0.01); g.stroke();
  g.fillStyle = '#fffaf0';
  g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
  CASTLE_POP = { px, py, pr };
  g.lineCap = 'butt';
}

/* わたあめの くも。**べた塗りの まるを ならべない。**
   1つ1つを ラジアルグラデにして ふちを ぼかすと、すきとおって 見える */
function titleCloud(g, x, y, r, a){
  const TAU = 6.2832;
  const puff = (dx, dy, rr, tint) => {
    const c = tint ? '255,224,240' : '255,255,255';
    const gr = g.createRadialGradient(x+dx, y+dy-rr*0.22, rr*0.08, x+dx, y+dy, rr);
    gr.addColorStop(0.00, 'rgba(' + c + ',.95)');
    gr.addColorStop(0.58, 'rgba(' + c + ',.60)');
    gr.addColorStop(1.00, 'rgba(' + c + ',0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x+dx, y+dy, rr, 0, TAU); g.fill();
  };
  g.save(); g.globalAlpha = a;
  puff(-r*0.86, r*0.16, r*0.70); puff(r*0.88, r*0.20, r*0.58);
  puff(-r*0.18, -r*0.26, r*0.98); puff(r*0.42, -r*0.04, r*0.76);
  puff(-r*0.24, r*0.36, r*0.58, 1); puff(r*0.56, r*0.36, r*0.46, 1);
  g.restore();
}

/* おか。ふもとを 少し うすくして 空気えんきん法（おくほど かすむ）を 出す */
function titleHill(g, top, H, W, col, k, fade, al){
  const path = () => {
    g.beginPath(); g.moveTo(-2, top + H*k*0.5);
    g.bezierCurveTo(W*0.22, top - H*k, W*0.52, top + H*k*0.9, W*0.74, top - H*k*0.25);
    g.bezierCurveTo(W*0.88, top - H*k*0.6, W*0.96, top + H*k*0.2, W+2, top - H*k*0.15);
  };
  const gr = g.createLinearGradient(0, top - H*k, 0, top + H*0.34);
  gr.addColorStop(0, col); gr.addColorStop(1, fade || col);
  g.save(); g.globalAlpha = al == null ? 1 : al;   // すかすと 空の 色が すけて 見える
  g.fillStyle = gr;
  path(); g.lineTo(W+2, H+2); g.lineTo(-2, H+2); g.closePath(); g.fill();
  g.restore();
  /* てっぺんの あかるい ふち。これが ないと 色の おびが ならんだだけに 見える */
  g.strokeStyle = 'rgba(255,255,255,.42)'; g.lineWidth = 1.6;
  path(); g.stroke();
}

/* おなじ いちに 出したいので、乱数では なく 番号から 決める */
const tRnd = i => { const v = Math.sin(i*127.1 + 11.3)*43758.5453; return v - Math.floor(v); };

/* 草の ひとむら。3本の 葉を すこしずつ ちがう 向きへ */
function titleGrass(g, x, y, s, col){
  g.strokeStyle = col; g.lineWidth = Math.max(1, s*0.17); g.lineCap = 'round';
  const lean = [-0.62, 0.06, 0.58];
  for (const k of lean){
    g.beginPath(); g.moveTo(x + k*s*0.26, y);
    g.quadraticCurveTo(x + k*s*0.55, y - s*0.62, x + k*s*1.05, y - s*1.05);
    g.stroke();
  }
}

/* ぐるぐるキャンディ。この子だけ art/sprites/ に 絵が ないので コードで えがく。
   顔は うずまきの **上に** のせる（うずまきごと まわすと 顔まで まわる）。
   目・ほっぺ・口を かならず 入れるのは この シリーズの きまり */
function titleLolly(g, cx, cy, s){
  const TAU = 6.2832;
  const gy = cy + s*0.46;                      // 足もと
  const r  = s*0.30, hy = gy - s*0.34 - r;     // あめ玉の まん中
  /* ぼう */
  g.strokeStyle = '#fff6e6'; g.lineWidth = s*0.085; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, gy); g.lineTo(cx, hy + r*0.70); g.stroke();
  g.strokeStyle = 'rgba(190,146,120,.30)'; g.lineWidth = Math.max(1, s*0.011);
  g.beginPath(); g.moveTo(cx, gy); g.lineTo(cx, hy + r*0.70); g.stroke();
  /* あめ玉 */
  const gr = g.createRadialGradient(cx - r*0.32, hy - r*0.36, r*0.08, cx, hy, r);
  gr.addColorStop(0, '#fffdf8'); gr.addColorStop(1, '#ffeadc');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, hy, r, 0, TAU); g.fill();
  /* うずまき。半けいは かならず 玉の 中に おさめる */
  g.save(); g.beginPath(); g.arc(cx, hy, r*0.97, 0, TAU); g.clip();
  g.strokeStyle = '#f58cb6'; g.lineWidth = r*0.24; g.lineCap = 'round';
  g.beginPath();
  const TURN = TAU*1.9;
  for (let a=0; a<=TURN; a+=0.09){
    const rr = r*0.12 + (a/TURN)*r*0.78;
    g.lineTo(cx + Math.cos(a)*rr, hy + Math.sin(a)*rr);
  }
  g.stroke(); g.restore();
  /* 顔の したじ。うずまきの 上に そのまま 顔を のせると 目が 読めない */
  g.fillStyle = 'rgba(255,252,246,.48)';
  g.beginPath(); g.ellipse(cx, hy + r*0.10, r*0.74, r*0.56, 0, 0, TAU); g.fill();
  /* うすい ふちどり。白っぽいので 地に とけないように */
  g.strokeStyle = 'rgba(214,138,170,.55)'; g.lineWidth = Math.max(1, s*0.018);
  g.beginPath(); g.arc(cx, hy, r, 0, TAU); g.stroke();
  /* つや */
  g.fillStyle = 'rgba(255,255,255,.60)';
  g.beginPath(); g.ellipse(cx - r*0.38, hy - r*0.44, r*0.26, r*0.15, -0.6, 0, TAU); g.fill();
  /* 顔 */
  const ey = hy + r*0.06, ex = r*0.30;
  g.fillStyle = '#5a3a4a';
  for (const d of [-1, 1]){ g.beginPath(); g.ellipse(cx + d*ex, ey, r*0.105, r*0.135, 0, 0, TAU); g.fill(); }
  g.fillStyle = '#ffffff';
  for (const d of [-1, 1]){ g.beginPath(); g.arc(cx + d*ex - r*0.038, ey - r*0.052, r*0.040, 0, TAU); g.fill(); }
  g.fillStyle = 'rgba(255,148,190,.55)';
  for (const d of [-1, 1]){ g.beginPath(); g.ellipse(cx + d*r*0.52, ey + r*0.20, r*0.135, r*0.085, 0, 0, TAU); g.fill(); }
  g.strokeStyle = '#5a3a4a'; g.lineWidth = Math.max(1, r*0.055); g.lineCap = 'round';
  g.beginPath(); g.arc(cx, ey + r*0.15, r*0.13, 0.34, Math.PI - 0.34); g.stroke();
}

/* 字づめを 手で 入れる。canvas の letterSpacing は
   古い iOS Safari に ないので、1文字ずつ 置く */
function titleSpaced(g, text, cx, y, ls){
  const ws = [...text].map(ch => g.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + ls*(ws.length - 1);
  let x = cx - total/2;
  g.textAlign = 'left';
  for (let i=0;i<ws.length;i++){ g.fillText([...text][i], x, y); x += ws[i] + ls; }
  g.textAlign = 'center';
}

/* 題字の かんばん。
   見本（ChatGPT の イメージ）に あわせて 組んでいます。ねらいは 4つ。
   ① バラバラの かざりの あつまりに せず、**1つの かんばん**に 見せる
   ② ふとい 金の ふちどりを へらし、**うすい金・白・もも・藤の 多層**に する
   ③ 白い 大きな 楕円を やめ、**まわりの 色に なじむ うすい わく**に する
   ④ 大きな かざりでは なく、**こまかい 宝石・星・曲線**で 密度を 上げる */
const LOGO_FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Noto Sans JP",system-ui,sans-serif';

/* 字づめを 手で 入れる。canvas の letterSpacing は
   古い iOS Safari に ないので、1文字ずつ 置く */
function titleSpaced(g, text, cx, y, ls){
  const ch = [...text];
  const ws = ch.map(c => g.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + ls*(ws.length - 1);
  let x = cx - total/2;
  g.textAlign = 'left';
  for (let i=0;i<ws.length;i++){ g.fillText(ch[i], x, y); x += ws[i] + ls; }
  g.textAlign = 'center';
}

/* かんばんの わく。まくらのように 上下が すこし ふくらんだ 四角 */
function titleFramePath(g, cx, cy, hw, hh, r){
  g.beginPath();
  g.moveTo(cx - hw + r, cy - hh);
  g.quadraticCurveTo(cx, cy - hh - hh*0.13, cx + hw - r, cy - hh);
  g.quadraticCurveTo(cx + hw, cy - hh, cx + hw, cy - hh + r);
  g.lineTo(cx + hw, cy + hh - r);
  g.quadraticCurveTo(cx + hw, cy + hh, cx + hw - r, cy + hh);
  g.quadraticCurveTo(cx, cy + hh + hh*0.13, cx - hw + r, cy + hh);
  g.quadraticCurveTo(cx - hw, cy + hh, cx - hw, cy + hh - r);
  g.lineTo(cx - hw, cy - hh + r);
  g.quadraticCurveTo(cx - hw, cy - hh, cx - hw + r, cy - hh);
  g.closePath();
}

/* ちいさな 宝石。大きな かざりでは なく これを たくさん 置いて 密度を 出す */
function titleGem(g, x, y, r, c1, c2){
  g.fillStyle = c2;
  g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r*0.72, y); g.lineTo(x, y + r); g.lineTo(x - r*0.72, y);
  g.closePath(); g.fill();
  g.fillStyle = c1;
  g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r*0.72, y); g.lineTo(x, y + r*0.10); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.beginPath(); g.moveTo(x - r*0.16, y - r*0.62); g.lineTo(x + r*0.16, y - r*0.34);
  g.lineTo(x - r*0.06, y - r*0.10); g.lineTo(x - r*0.30, y - r*0.34); g.closePath(); g.fill();
}

function titleLogo(g, cx, top, w){
  const TAU = 6.2832, h = w*0.58;
  const goldL = 'rgba(226,196,140,.90)';     // うすい金
  const goldD = 'rgba(198,158,96,.80)';

  const fcy = top + h*0.555, fhw = w*0.445, fhh = h*0.372, fr = w*0.050;

  /* --- わくの 中み。**白い 楕円に しない。**まわりの 色に なじませて、
     世界の 中に 立っている ように 見せる --- */
  g.save();
  titleFramePath(g, cx, fcy, fhw, fhh, fr);
  const fg = g.createLinearGradient(0, fcy - fhh, 0, fcy + fhh);
  fg.addColorStop(0.00, 'rgba(255,251,252,.52)');
  fg.addColorStop(0.45, 'rgba(255,242,248,.34)');
  fg.addColorStop(1.00, 'rgba(252,228,240,.26)');
  g.fillStyle = fg; g.fill();
  /* うちがわの ひかり（うえだけ）*/
  g.clip();
  const ig = g.createLinearGradient(0, fcy - fhh, 0, fcy - fhh*0.15);
  ig.addColorStop(0, 'rgba(255,255,255,.42)'); ig.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = ig; g.fillRect(cx - fhw, fcy - fhh, fhw*2, fhh);
  g.restore();

  /* --- わくの ふち。**ほそい 線を 3本**。ふとい 金の おびは つかわない --- */
  const line = (inset, col, lw) => {
    titleFramePath(g, cx, fcy, fhw - inset, fhh - inset*0.9, fr);
    g.strokeStyle = col; g.lineWidth = lw; g.stroke();
  };
  line(0,          goldD, Math.max(0.8, w*0.0055));
  line(w*0.013, 'rgba(255,255,255,.85)', Math.max(0.8, w*0.0075));
  line(w*0.026,    goldL, Math.max(0.6, w*0.0035));
  line(w*0.040, 'rgba(255,196,224,.55)', Math.max(0.6, w*0.0030));

  /* --- ふちの 玉かざり。**わくの 曲線に そって** 置くこと。
     まっすぐ ならべると ただの 点線に 見えます --- */
  {
    const qz = (a, b, c, u) => { const v = 1-u; return v*v*a + 2*v*u*b + u*u*c; };
    const ins = w*0.020;
    g.fillStyle = 'rgba(255,252,246,.95)';
    for (let i=0;i<=22;i++){
      const u = i/22;
      const x = qz(cx - fhw + fr, cx, cx + fhw - fr, u);
      const yT = qz(fcy - fhh, fcy - fhh - fhh*0.13, fcy - fhh, u) + ins;
      const yB = qz(fcy + fhh, fcy + fhh + fhh*0.13, fcy + fhh, u) - ins;
      g.beginPath(); g.arc(x, yT, w*0.0062, 0, TAU); g.fill();
      g.beginPath(); g.arc(x, yB, w*0.0062, 0, TAU); g.fill();
    }
  }

  /* --- 四すみの 金の からくさ --- */
  const curl = (sx2, sy2, dx, dy) => {
    g.save(); g.translate(sx2, sy2); g.scale(dx, dy);
    g.strokeStyle = goldL; g.lineWidth = Math.max(0.7, w*0.0055); g.lineCap = 'round';
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(w*0.075, -h*0.010, w*0.098, h*0.055, w*0.050, h*0.070);
    g.bezierCurveTo(w*0.018, h*0.080, w*0.014, h*0.030, w*0.044, h*0.028);
    g.stroke();
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-w*0.012, h*0.055, w*0.028, h*0.085, w*0.010, h*0.110);
    g.stroke();
    g.fillStyle = goldL;
    g.beginPath(); g.arc(w*0.044, h*0.028, w*0.0075, 0, TAU); g.fill();
    g.restore();
  };
  curl(cx - fhw + w*0.020, fcy - fhh + h*0.030,  1,  1);
  curl(cx + fhw - w*0.020, fcy - fhh + h*0.030, -1,  1);
  curl(cx - fhw + w*0.020, fcy + fhh - h*0.030,  1, -1);
  curl(cx + fhw - w*0.020, fcy + fhh - h*0.030, -1, -1);

  /* --- 宝石を わくに はめる --- */
  const GEMS = [[-0.445,0.00,'#ffd6ea','#f08cbe'],[0.445,0.00,'#ffd6ea','#f08cbe'],
                [-0.300,-0.97,'#e2d6ff','#a98ad6'],[0.300,-0.97,'#e2d6ff','#a98ad6'],
                [-0.300, 0.99,'#d6f2ff','#8fc9e8'],[0.300, 0.99,'#d6f2ff','#8fc9e8']];
  for (const [gx, gy, c1, c2] of GEMS)
    titleGem(g, cx + w*gx, fcy + fhh*gy, w*0.019, c1, c2);

  /* --- 王かんむり。**小さく 上品に**。大きいと 幼く 見える --- */
  {
    const kw = w*0.100, ky = top + h*0.190, kh = kw*0.66;
    const kg = g.createLinearGradient(cx - kw/2, ky - kh, cx + kw/2, ky);
    kg.addColorStop(0, '#fff0c8'); kg.addColorStop(0.5, '#f2c86e'); kg.addColorStop(1, '#dda94a');
    g.fillStyle = kg;
    g.beginPath();
    g.moveTo(cx - kw/2, ky);
    g.lineTo(cx - kw*0.40, ky - kh*0.86);
    g.lineTo(cx - kw*0.17, ky - kh*0.38);
    g.lineTo(cx,           ky - kh*1.12);
    g.lineTo(cx + kw*0.17, ky - kh*0.38);
    g.lineTo(cx + kw*0.40, ky - kh*0.86);
    g.lineTo(cx + kw/2, ky);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = Math.max(0.5, w*0.0025); g.stroke();
    g.fillStyle = '#fff6dc';
    for (const [dx, dy] of [[-0.40,-0.86],[0,-1.12],[0.40,-0.86]]){
      g.beginPath(); g.arc(cx + kw*dx, ky + kh*dy, kw*0.070, 0, TAU); g.fill();
    }
    titleGem(g, cx, ky - kh*0.16, kw*0.15, '#ffd6ea', '#e878ac');
  }

  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.lineJoin = 'round'; g.lineCap = 'round';

  /* --- 「魔法の」。ちいさな リボンの 帯に のせて かんばんと 一体に --- */
  {
    const fs = Math.round(w*0.076);
    g.font = '700 ' + fs + 'px ' + LOGO_FONT;
    const y = top + h*0.305;
    const bw = g.measureText('魔法の').width*0.5 + fs*0.60, bh = fs*0.86;
    /* おび */
    g.fillStyle = 'rgba(255,250,240,.88)';
    roundRect(cx - bw, y - bh*0.86, bw*2, bh*1.22, bh*0.50); g.fill();
    g.strokeStyle = goldL; g.lineWidth = Math.max(0.6, w*0.0035); g.stroke();
    /* すその 三角（リボンの はし）*/
    g.fillStyle = 'rgba(248,214,232,.92)';
    for (const d of [-1, 1]){
      g.beginPath();
      g.moveTo(cx + d*bw*0.94, y - bh*0.52);
      g.lineTo(cx + d*(bw + fs*0.52), y - bh*0.78);
      g.lineTo(cx + d*(bw + fs*0.52), y + bh*0.06);
      g.closePath(); g.fill();
      g.strokeStyle = goldL; g.lineWidth = Math.max(0.5, w*0.0028); g.stroke();
    }
    g.fillStyle = '#b8455f'; g.fillText('魔法の', cx, y);
  }

  /* --- 「おかしの国」。**ふとい 金の おびを やめ、ほそい 線を 4本**
     （うすい金 → 白 → もも → 藤）かさねて 中を ぬる --- */
  const label = 'おかしの国';
  let fs = Math.round(w*0.205);
  g.font = '800 ' + fs + 'px ' + LOGO_FONT;
  const wide = g.measureText(label).width, room = w*0.775;
  if (wide > room){ fs = Math.max(12, Math.floor(fs * room / wide)); g.font = '800 ' + fs + 'px ' + LOGO_FONT; }
  const by = top + h*0.735;

  /* ぼんやりした ひかり。**焼きこみの 中だけ**（毎フレームの shadowBlur は 重い）*/
  g.save();
  g.shadowColor = 'rgba(255,168,220,.75)'; g.shadowBlur = fs*0.50;
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = fs*0.26;
  g.strokeText(label, cx, by);
  g.restore();

  g.strokeStyle = 'rgba(176,130,64,.95)';  g.lineWidth = fs*0.38; g.strokeText(label, cx, by);
  g.strokeStyle = '#fffaf0';               g.lineWidth = fs*0.29; g.strokeText(label, cx, by);
  g.strokeStyle = 'rgba(246,190,222,.95)'; g.lineWidth = fs*0.16; g.strokeText(label, cx, by);
  g.strokeStyle = 'rgba(222,206,255,.90)'; g.lineWidth = fs*0.075; g.strokeText(label, cx, by);

  /* 中みは ミルキーな たてグラデ（もも → 藤 → 水色）。
     **グラデの はんいは 字の 高さに 合わせること。**
     ベースラインから 決めうちで とると、字の 上はしが
     グラデの 手まえに 来て、いちばん こい 色が つかわれません */
  const gTop = by - fs*0.78, gBot = by + fs*0.06;
  const tg = g.createLinearGradient(0, gTop, 0, gBot);
  tg.addColorStop(0.00, '#ff92c4');
  tg.addColorStop(0.24, '#f65fa8');
  tg.addColorStop(0.52, '#9c6ce0');
  tg.addColorStop(0.78, '#3f9bd4');
  tg.addColorStop(1.00, '#82ccf0');
  g.fillStyle = tg; g.fillText(label, cx, by);

  /* つやは **おびに する**。上から べたに かけると 白ぬきに 見えます */
  const sg = g.createLinearGradient(0, gTop, 0, gTop + (gBot - gTop)*0.52);
  sg.addColorStop(0.00, 'rgba(255,255,255,.10)');
  sg.addColorStop(0.34, 'rgba(255,255,255,.52)');
  sg.addColorStop(0.80, 'rgba(255,255,255,.04)');
  sg.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = sg; g.fillText(label, cx, by);

  /* --- ローマ字。**はばを 決めてから 字づめを 逆算する** --- */
  {
    const txt = 'OKASHI NO KUNI', n = txt.length, room2 = w*0.48;
    let lfs = Math.round(w*0.027);
    g.font = '600 ' + lfs + 'px ' + LOGO_FONT;
    let base = [...txt].reduce((a, c) => a + g.measureText(c).width, 0);
    if (base > room2){ lfs = Math.max(7, Math.floor(lfs * room2 / base));
      g.font = '600 ' + lfs + 'px ' + LOGO_FONT;
      base = [...txt].reduce((a, c) => a + g.measureText(c).width, 0); }
    const ls = Math.max(0, (room2 - base) / (n - 1));
    const ly = top + h*0.895;
    g.fillStyle = '#b08048';
    titleSpaced(g, txt, cx, ly, ls);
    for (const d of [-1, 1]){
      const x0 = cx + d*(room2/2 + w*0.028), x1 = cx + d*(room2/2 + w*0.120);
      const lg = g.createLinearGradient(x0, 0, x1, 0);
      lg.addColorStop(0, 'rgba(186,140,86,.60)'); lg.addColorStop(1, 'rgba(186,140,86,0)');
      g.strokeStyle = lg; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x0, ly - lfs*0.34); g.lineTo(x1, ly - lfs*0.34); g.stroke();
      titleGem(g, cx + d*(room2/2 + w*0.017), ly - lfs*0.34, w*0.012, '#ffe6f2', '#efa8c8');
    }
  }

  /* --- ちいさな つつみキャンディと 星。数を おおく、1つ1つは 小さく --- */
  const bonbon = (x, y, r, c1, c2) => {
    g.fillStyle = c2;
    for (const d of [-1, 1]){
      g.beginPath(); g.moveTo(x + d*r*0.75, y);
      g.lineTo(x + d*r*1.70, y - r*0.70); g.lineTo(x + d*r*1.70, y + r*0.70);
      g.closePath(); g.fill();
    }
    const bg = g.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, c1);
    g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  };
  bonbon(cx - w*0.372, fcy - fhh*0.46, w*0.021, '#ffb0d4', '#ff8fc4');
  bonbon(cx + w*0.372, fcy + fhh*0.50, w*0.021, '#c9a7ff', '#b98fff');
  bonbon(cx - w*0.360, fcy + fhh*0.66, w*0.018, '#a8e8d4', '#6fd4b0');
  for (const [gx, gy, r] of [[-0.400,-0.70,0.012],[0.400,-0.64,0.012],
                             [-0.150,-0.62,0.009],[0.150,-0.62,0.009],
                             [-0.412, 0.28,0.010],[0.412, 0.22,0.010]])
    titleGem(g, cx + w*gx, fcy + fhh*gy, w*r, '#fff2fa', '#f0c8de');
}

/* 題字の うごく ところ（こまかい きらめき）。ほかは 焼きこみ */
function titleLogoLive(g, cx, top, w, t){
  const h = w*0.58, TAU = 6.2832;
  for (let i=0;i<13;i++){
    const a = tRnd(i+9100)*TAU, d = w*(0.16 + 0.30*tRnd(i+9500));
    g.globalAlpha = 0.30 + 0.55*Math.abs(Math.sin(t*1.6 + i*1.7));
    sparkle(cx + Math.cos(a)*d, top + h*0.55 + Math.sin(a)*d*0.56,
            w*(0.008 + 0.009*tRnd(i+9900)), t*0.5 + i, '#ffffff');
  }
  g.globalAlpha = 1;
}

/* ==========================================================
   表紙の 焼きこみ
   動かない ところ（空・にじ・おか・道・草・題字）は 毎フレーム
   えがきなおすと iPhone で 重くなります。じめんの `bakeGround()` と
   おなじ考えで、**1回だけ 別canvas に えがいて あとは 貼るだけ**に します。
   焼きなおすのは 画面サイズ・DPR・ボタンの いちが かわったときだけ。
   ========================================================== */
/* ==========================================================
   表紙の 絵の 差しかえ口
   絵筆の 質感・奥の ぼけ・手がきの 宝石は Canvas 2D の 図形では 出せません。
   そこは **画像に 差しかえる 前提**で 継ぎ目を 3つ 作ってあります。
   ファイルを 置けば その場から 画像が つかわれ、無ければ コードで えがきます。

   | キー     | ファイル              | 何を 出すか                     | 大きさの めやす |
   |----------|-----------------------|---------------------------------|-----------------|
   | `bg`     | art/title/bg.png      | 空・にじ・くも・おか（城より うしろ）| 1290x2796・不透明 |
   | `castle` | art/title/castle.png  | おかしの城だけ                   | 900x1100・透過   |
   | `logo`   | art/title/logo.png    | 題字の かんばん ひとそろい       | 1200x700・透過   |

   どれも 独立して 差しかえられます（1つだけ 画像に しても 平気）。
   いちと 大きさは コードがわが 決めるので、**PNG の 中みは
   わくいっぱいに 描いて もらってください**（よぶんな 余白を 入れない）。
   ========================================================== */
/* **画像を 置いたら ここに キーを 足すこと。**
   ためしに 読みに 行く 作りには しません。無いときに 404 が 出て、
   `tools/check-chars.mjs` の「JSエラー」に かぞえられます。
   `poster` は **1まいの 絵を まるごと 表紙に する** 特別あつかい。
   これが あると bg/castle/logo と コードの 絵は つかわれません。
   不透明なので JPEG/WebP で よい（1.9MBの PNG が 315KBに なった） */
const TITLE_ART_FILES = { poster: 'title_full.webp' };
/* 絵の 中の きまった いち。**ボタンが 絵に 焼きこまれている**ので、
   DOM の ボタンを その上に かさねます（下の titleBakePoster）。
   絵を さしかえたら この4つも 直すこと */
const TITLE_IW = 941, TITLE_IH = 1672;
const TITLE_BTN = { x:180, y:1420, w:585, h:152 };
const TITLE_ART = {};
for (const k in TITLE_ART_FILES){
  const im = new Image();
  im.onload = () => { TITLE_ART[k] = im; titleBake.key = ''; };   // 読めたら 焼きなおす
  im.src = 'art/title/' + TITLE_ART_FILES[k];
}

const titleBake = { key:'', scene:null, logo:null, geom:null, cloud:new Map() };
/* ぼんやりした ひかりは **1つ 焼いて 大きさを 変えて 貼る**。
   毎フレーム createRadialGradient を 何十回も よぶと iPhone で 落ちます */
const titleSprites = new Map();
function titleSprite(key, draw){
  let c = titleSprites.get(key); if (c) return c;
  const S = 64, o = titleCanvas(S, S);
  withCtx(o.g, () => draw(o.g, S/2, S/2, S/2));
  titleSprites.set(key, o.c); return o.c;
}
function titleGlow(key, stops){
  return titleSprite(key, (g, x, y, r) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    for (const [p, c] of stops) gr.addColorStop(p, c);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  });
}

/* 表紙は やわらかい 絵なので DPR は 2 で 足ります。
   2.5 に すると たて横で 1.56ばいの ピクセルを 毎フレーム なめることに なり、
   iPhone で フレームが 落ちます。字が いちばん 細かい ロゴだけは 別canvas */
const TDPR = Math.min(DPR, 2);

function titleCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w*TDPR)); c.height = Math.max(1, Math.round(h*TDPR));
  const g = c.getContext('2d');
  g.setTransform(TDPR, 0, 0, TDPR, 0, 0);
  return { c, g };
}

/* 画面の 骨ぐみ。ちへいせん・草原・題字の いちは ぜんぶ ここで 決めます */
function titleGeom(W, H){
  /* **ボタンの いちは offsetTop で とること。**
     getBoundingClientRect は ふわふわの アニメ（transform）を ふくむので、
     毎フレーム 数px ずれ、焼きなおしの 合図が 毎フレーム 立ちます
     （実際に これで フレームが 落ちていました）*/
  const btn = $('titleGo');
  const btnTop = btn.offsetTop || btn.getBoundingClientRect().top || H*0.86;
  /* 見本では 題字が いちばん 大きく、城は もっと 小さく おくに ある。
     その 大小の さが「商用ゲームの タイトル」らしさに なる */
  const logoW = Math.min(W*0.92, 462);
  const logoH = logoW*0.58;
  const logoTop = btnTop - H*0.022 - logoH;
  const txTop = logoTop;
  const hz = Math.min(H*0.605, txTop - H*0.195);
  const cs = Math.min(W*0.180, H*0.096);
  const dyC = Math.min(0, (txTop - cs*0.60) - (hz + H*0.150));
  const meadow = hz + H*0.128 + dyC;
  /* 道の 折れ線（3次ベジエ）。光が のぼる いちにも つかう */
  const P = [[W*0.08, H+12], [W*0.14, hz+H*0.30], [W*0.56, hz+H*0.25], [W*0.600, hz+H*0.024]];
  const bez = u => { const v = 1-u;
    return [ v*v*v*P[0][0] + 3*v*v*u*P[1][0] + 3*v*u*u*P[2][0] + u*u*u*P[3][0],
             v*v*v*P[0][1] + 3*v*v*u*P[1][1] + 3*v*u*u*P[2][1] + u*u*u*P[3][1] ]; };
  return { W, H, hz, cs, dyC, meadow, logoW, logoH, logoTop, txTop,
           sx:W*0.62, sy:hz - H*0.175, P, bez,
           castleW: Math.min(W*0.42, H*0.200) };
}

/* わたあめの くも。1つ 焼いて つかいまわす（毎フレーム グラデを 作らない）*/
function titleCloudSprite(r){
  const k = Math.round(r);
  let c = titleBake.cloud.get(k);
  if (c) return c;
  const pad = r*2.2;
  const o = titleCanvas(pad*2, pad*1.5);
  withCtx(o.g, () => titleCloud(o.g, pad, pad*0.75, r, 1));
  c = { cv:o.c, ox:pad, oy:pad*0.75, w:pad*2, h:pad*1.5 };
  if (titleBake.cloud.size > 8) titleBake.cloud.clear();
  titleBake.cloud.set(k, c);
  return c;
}

/* --- 空・城・じめん を **1まいに まとめて** 焼く。
   毎フレームの 貼りつけが 1回で すみます（3回だと iPhone で おちる）。
   ながれる くもは 城より 上に しか 来ないので、あとから 上に のせて 平気 --- */
/* 1まいの 絵を まるごと 貼る モード。
   絵は 9:16、画面は もっと たて長なので、**足りない 上下は
   ふちの色を はかって グラデで つぎたす**。継ぎ目は 40pxの ぼかしで つなぐ。

   ボタンは **絵の中に 焼きこまれている**。だから DOM の ボタンを
   その上に ぴったり かさねて、見た目は 絵・タップは DOM に する。
   canvas に 当たり判定を 持たせない のは、DOM なら :active も
   セーフエリアも --fs も ただで ついてくるから（CLAUDE.md の「UIはDOM」）。

   **いちを 決めるのは DOM がわ。絵を そこへ 合わせる。**
   逆にすると、下の余白を CSS で 持てなくなって 実機の
   ホームバーに ボタンが かぶります */
function titleBakePoster(G, g){
  const { W, H } = G;
  const im = TITLE_ART.poster;
  const s  = W / TITLE_IW;
  const ih = TITLE_IH * s;
  const btn = $('titleGo');
  /* 当たり判定を 絵の ボタンと 同じ 大きさに する。
     **先に 大きさを 決めてから いちを 読むこと**（flex-end なので
     高さが 変わると offsetTop も 動く）*/
  const bw = TITLE_BTN.w * s, bh = TITLE_BTN.h * s;
  btn.style.width = bw + 'px'; btn.style.height = bh + 'px';
  const btnTop = btn.offsetTop || H*0.86;
  /* 絵の ボタンの まん中を、DOM の ボタンの まん中に そろえる */
  const iy = btnTop + bh/2 - (TITLE_BTN.y + TITLE_BTN.h/2) * s;
  g.drawImage(im, 0, iy, W, ih);
  /* ふちの 平均色を 実際に はかる（絵を 差しかえても 合うように） */
  const avg = (yCss) => {
    const yy = Math.max(0, Math.min(g.canvas.height - 1, Math.round(yCss*TDPR)));
    const d = g.getImageData(0, yy, g.canvas.width, 1).data;
    let r=0, gg=0, bb=0, n = g.canvas.width;
    for (let x=0;x<n;x++){ r+=d[x*4]; gg+=d[x*4+1]; bb+=d[x*4+2]; }
    return [Math.round(r/n), Math.round(gg/n), Math.round(bb/n)];
  };
  const mix = (c, w2, k) => c.map((v,i) => Math.round(v*(1-k) + w2[i]*k));
  const rgb = c => 'rgb(' + c.join(',') + ')';
  if (iy > 0){
    /* --- つぎたしの 空 ---
       ここは 3回 やりなおしています。おとし穴が 2つ あって、
       **どちらか片方だけを 直すと もう片方に 落ちます。**

       ① 元絵の 上の行を そのまま たてに のばす → **縦の筋**
          元絵の 上端は 横に 大きく 色が ちがい（実測で 最大57。
          まん中が 青く 両はしが ピンク）、たてに のばすと その差が
          そのまま カーテンのような 帯に 見えます。
       ② 1色で ぬりつぶす → **境めの 段差**
          こんどは その57の さが、まるごと 境めの 線に なります。

       なので **小さな canvas（24×3）を 引きのばして、たて・よこ
       両方の グラデに します**。下の段は 元絵の 上端を 縮めた もの
       （縮小で 横に ならされるので、筋の もとに なる こまかい ムラは
       消え、大きな 色の ながれだけ のこる）。上の段へ いくほど
       空の色を かぶせて 1色に 寄せ、すこし 青く 明るく する。
       拡大は なめらかに 補間されるので、
         下 … 元絵の 横の 色の ながれに 合う → 境めが 消える
         上 … なめらかに 1色へ 溶ける   → 縦筋が 出ない

       **getImageData を つかわない**のも わざとです。file:// で
       ひらいた ときに 絵を 読んだ canvas は よごれ扱いに なり、
       画素を 読むと 例外で 表紙ごと 落ちます（README は
       「index.html を ブラウザで ひらくだけ」と 書いている）。
       drawImage と かぶせ塗りだけなら その心配が ありません。

       焼きこみの 中で 1回 やるだけ。毎フレームの 負担は ありません */
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';

    /* ① たての グラデだけで 空ぜんぶを ぬる（よこの ムラは 入れない）。
       **はば1の canvas を 引きのばす**のが みそ。元絵を はば1に 縮めると
       それが そのまま「上端の 平均色」に なるので、画素を 読まずに
       絵に 合った 色が 手に入ります。よこ方向は 完全に 平らなので、
       ここからは 縦筋が 出ようが ありません。

       かぶせる 空の色は 元絵の 上端より すこし **深く** すること。
       元絵は 上端が いちばん 暗く、下へ いくほど 明るい（実測 172→207）。
       ここで 上へ 明るくすると 境めが「暗さの谷」に なり、
       色の 段差が ゼロでも 線に 見えます（実際に そう 見えました）。
       上へ 深い 青に すれば 明るさが 境めを またいで ひとつづきに 下がる。
       空は 高いほど 青が 深い ものなので、絵としても 自然です */
    const va = document.createElement('canvas');
    va.width = 1; va.height = 3;
    const vg = va.getContext('2d');
    vg.imageSmoothingEnabled = true; vg.imageSmoothingQuality = 'high';
    vg.drawImage(im, 0, 0, TITLE_IW, 6, 0, 0, 1, 3);   // 横に つぶす＝平均色
    vg.fillStyle = 'rgb(150,158,224)';
    vg.globalAlpha = 0.55; vg.fillRect(0, 1, 1, 1);    // 中ほど
    vg.globalAlpha = 0.92; vg.fillRect(0, 0, 1, 1);    // てっぺん
    vg.globalAlpha = 1;
    g.drawImage(va, 0, 0, 1, 3, 0, 0, W, iy + 2);

    /* ② 境めの ちかくだけ、元絵の よこの 色の ながれを かさねて 段差を 消す。
       **上へ いくらか で 消えきる ことが 大事。**元絵の 上端は
       左右で 最大57も ちがい（にじの はしが 明るい）、これを 空の
       てっぺんまで のばすと、その 明るい ところが そのまま
       光の柱に なります（実際に 何本も 立ちました）。
       56px で 消えるなら、境めは 合うのに 柱には 見えません */
    /* N は 少ないほど よこの 変化が ゆるくなる。24 だと 帯の 中に
       まだ 細い 筋が 見えたので 12 まで 粗くした。境めを 合わせるのに
       必要なのは 大きな 色の ながれだけで、細かさは 要らない */
    const FADE = Math.min(iy, 44), N = 12, FH = 32;
    const fb = document.createElement('canvas');
    fb.width = N; fb.height = FH;
    const fg2 = fb.getContext('2d');
    fg2.imageSmoothingEnabled = true; fg2.imageSmoothingQuality = 'high';
    fg2.drawImage(im, 0, 0, TITLE_IW, 6, 0, 0, N, FH);
    /* 上へ 消えていく すきとおりを、マスクで 焼きつける */
    const mk = fg2.createLinearGradient(0, 0, 0, FH);
    mk.addColorStop(0, 'rgba(0,0,0,0)'); mk.addColorStop(1, 'rgba(0,0,0,1)');
    fg2.globalCompositeOperation = 'destination-in';
    fg2.fillStyle = mk; fg2.fillRect(0, 0, N, FH);
    fg2.globalCompositeOperation = 'source-over';
    g.drawImage(fb, 0, 0, N, FH, 0, iy - FADE, W, FADE + 2);
  }
  const seam = iy + ih;
  if (seam < H){
    const bot = avg(seam - 3);
    const deep = mix(bot, [216,160,196], 0.30);         // 下は すこし こく
    const gnd = g.createLinearGradient(0, seam - 1, 0, H);
    gnd.addColorStop(0, rgb(bot)); gnd.addColorStop(1, rgb(deep));
    g.fillStyle = gnd; g.fillRect(0, seam - 1, W, H - seam + 2);
    const fe2 = g.createLinearGradient(0, seam + 1, 0, seam - 40);
    fe2.addColorStop(0, rgb(bot)); fe2.addColorStop(1, 'rgba(' + bot.join(',') + ',0)');
    g.fillStyle = fe2; g.fillRect(0, seam - 40, W, 42);
  }
  return { iy, ih };
}

function titleBakeScene(G){
  const { W, H, hz, sx, sy, meadow, bez } = G;
  const o = titleCanvas(W, H), g = o.g;
  if (TITLE_ART.poster){
    CASTLE_WINS = []; CASTLE_POP = null;
    titleOv.classList.add('poster');     // ボタンの 見た目を 絵に ゆずる
    let pr = null;
    withCtx(g, () => { pr = titleBakePoster(G, g); });
    titleBake.poster = pr;
    return o.c;
  }
  titleOv.classList.remove('poster');
  titleBake.poster = null;
  withCtx(g, () => {
    const blob = (x, y, r, rgb, al) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0.00, 'rgba(' + rgb + ',' + al + ')');
      gr.addColorStop(0.50, 'rgba(' + rgb + ',' + (al*0.44).toFixed(3) + ')');
      gr.addColorStop(1.00, 'rgba(' + rgb + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    };
    /* 空がわの 画像が あれば、城より うしろは それ 1まいで すませる */
    if (TITLE_ART.bg) g.drawImage(TITLE_ART.bg, 0, 0, W, H); else {
    /* 空。したじは うすく。色は このあと 玉で のせる */
    const sky = g.createLinearGradient(0, 0, 0, hz + H*0.10);
    sky.addColorStop(0.00, '#dfe4fb'); sky.addColorStop(0.30, '#f0dcf8');
    sky.addColorStop(0.60, '#ffdcec'); sky.addColorStop(0.82, '#ffe4dc');
    sky.addColorStop(1.00, '#fff3e4');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    /* さむい色を かならず 入れる。ピンクと 藤だけでは くすむ */
    blob(W*0.14, H*0.10, W*0.85, '150,225,255', 0.50);
    blob(W*0.88, H*0.06, W*0.70, '255,244,180', 0.44);
    blob(W*0.06, H*0.42, W*0.72, '165,244,214', 0.40);
    blob(W*0.92, H*0.40, W*0.78, '255,190,220', 0.46);
    blob(W*0.50, H*0.30, W*0.62, '210,180,255', 0.34);
    /* 城の うしろの ひかり */
    const sun = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H)*0.40);
    sun.addColorStop(0.00, 'rgba(255,248,225,.66)');
    sun.addColorStop(0.28, 'rgba(255,232,208,.24)');
    sun.addColorStop(1.00, 'rgba(255,232,208,0)');
    g.fillStyle = sun; g.fillRect(0, 0, W, H);
    /* ひかりの すじ */
    for (let i=0;i<7;i++){
      g.save(); g.translate(sx, sy); g.rotate((i-3)*0.21);
      const gr = g.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, 'rgba(255,250,232,.17)'); gr.addColorStop(1, 'rgba(255,250,232,0)');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(-W*0.045, H); g.lineTo(W*0.045, H); g.closePath(); g.fill();
      g.restore();
    }
    /* にじ。表紙の 主役。ふとさを 変えて 3回 かさねて ふちを ぼかす */
    const bowCols = ['#ff9ec6','#ffc48f','#fff29a','#9ff0c6','#8fdcff','#c8b2ff'];
    const bow = (bx, by, rad, bwd, al, from, to) => {
      bowCols.forEach((c, i) => {
        const r = rad - i*bwd;
        [[bwd*2.2, 0.26],[bwd*1.30, 0.40],[bwd*0.62, 0.72]].forEach(([lw, k]) => {
          g.globalAlpha = al*k; g.lineWidth = lw; g.strokeStyle = c;
          g.beginPath(); g.arc(bx, by, r, from, to); g.stroke();
        });
      });
      g.globalAlpha = 1;
    };
    const bcx = W*0.34, bcy = hz + H*0.16, brd = W*1.05, bwd = W*0.040;
    bow(bcx, bcy, brd, bwd, 0.50, Math.PI*1.00, Math.PI*2.00);
    bow(bcx, bcy, brd - bwd*8.4, bwd*0.52, 0.30, Math.PI*1.06, Math.PI*1.94);
    /* ちへいせんの くも。城が 雲の 上に うかんで 見える */
    for (let i=0;i<7;i++)
      titleCloud(g, W*(-0.06 + i*0.19), hz - H*0.028 + ((i*37)%11)*H*0.004,
                 W*(0.090 + (i%3)*0.022), 0.60);
    /* おくの おか。おくほど うすく（空気えんきん法）*/
    /* ミルキーな パステルに する。**彩度を 少し おとす**と
       「子どもむけ Webゲーム」から「商用タイトル」の 色味に 近づく */
    g.fillStyle = 'rgba(255,250,252,.14)'; g.fillRect(0, 0, W, H);
    titleHill(g, hz - H*0.030, H, W, '#cdc3e4', 0.042, '#dad2ee');
    titleHill(g, hz + H*0.008, H, W, '#e3d0e8', 0.030, '#ecdcf0');
    }

    /* --- 城。画像が あれば そちらを つかう --- */
    {
      const cw = G.castleW, ch = cw*1.30, ccx = W*0.600, cby = hz + H*0.014;
      /* 足もとの かすみ。城が 風景の 中に 立って 見える */
      const hz2 = g.createRadialGradient(ccx, cby, 0, ccx, cby, cw*0.85);
      hz2.addColorStop(0, 'rgba(255,246,250,.50)'); hz2.addColorStop(1, 'rgba(255,246,250,0)');
      g.fillStyle = hz2;
      g.beginPath(); g.ellipse(ccx, cby, cw*0.85, cw*0.26, 0, 0, 6.2832); g.fill();
      if (TITLE_ART.castle) g.drawImage(TITLE_ART.castle, ccx - cw/2, cby - ch, cw, ch);
      else titleCastle(g, ccx, cby, cw);
    }

    /* 手まえの おか。ピンク → 草原（ユニコーンの 足もとから 下だけ）*/
    titleHill(g, hz + H*0.058, H, W, '#f2c6d9', 0.024, '#edb6ce', 0.93);
    titleHill(g, meadow,       H, W, '#c8e6d6', 0.018, '#d3ecdf', 0.93);
    /* クッキーの道。城の 足もとまでは 引かない（入り口が かくれる）*/
    const rEx = W*0.600, rEy = hz + H*0.024;
    const seg = (lw, col) => {
      g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
      g.beginPath(); g.moveTo(W*0.08, H + 12);
      g.bezierCurveTo(W*0.14, hz + H*0.30, W*0.56, hz + H*0.25, rEx, rEy);
      g.stroke();
    };
    seg(W*0.076, '#eccfa4'); seg(W*0.054, '#fff0d6');
    g.save(); g.globalAlpha = 0.50; g.strokeStyle = '#fffdf4';
    g.lineWidth = W*0.013; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W*0.064, H + 12);
    g.bezierCurveTo(W*0.124, hz + H*0.30, W*0.544, hz + H*0.25, rEx - W*0.016, rEy);
    g.stroke(); g.restore();
    const sp = ['#f293bd','#b79bea','#8fd8bd','#f2c56b'];
    for (let i=0;i<26;i++){
      const [bx, by] = bez(i/25);
      const off = ((i*37)%100/100 - 0.5) * W*0.034;
      g.globalAlpha = 0.85; g.fillStyle = sp[i%4];
      g.save(); g.translate(bx+off, by); g.rotate(i*1.3);
      roundRect(-W*0.0065, -W*0.0027, W*0.013, W*0.0054, W*0.0027); g.fill(); g.restore();
    }
    g.globalAlpha = 1;
    /* じめんにも 空と おなじ 色を のせる。**城より 下だけ**。
       ちへいせんから かけると 城の 足もとが 白く とんで とうが 消える */
    g.save(); g.beginPath(); g.rect(0, hz + H*0.024, W, H); g.clip();
    blob(W*0.10, hz + H*0.08, W*0.62, '150,232,255', 0.34);
    blob(W*0.94, hz + H*0.14, W*0.64, '255,240,178', 0.28);
    blob(W*0.52, hz + H*0.32, W*0.75, '255,178,220', 0.30);
    g.restore();
    g.save(); g.beginPath(); g.rect(0, hz + H*0.045, W, H); g.clip();
    const sn = g.createLinearGradient(0, hz, W*0.95, H);
    sn.addColorStop(0.00, 'rgba(255,255,255,0)');
    sn.addColorStop(0.42, 'rgba(255,255,255,.15)');
    sn.addColorStop(1.00, 'rgba(255,255,255,0)');
    g.fillStyle = sn; g.fillRect(0, hz, W, H);
    g.restore();
    /* 草原。道の 上には 生やさない */
    const rd = []; for (let i=0;i<=22;i++) rd.push(bez(i/22));
    const onRoad = (x, y, m) => rd.some(p => Math.abs(p[0]-x) < m && Math.abs(p[1]-y) < m*0.8);
    const gcol = ['#96d9b6','#a8e2c4','#88cfa8'];
    for (let i=0;i<34;i++){
      const gx = tRnd(i)*W*1.04 - W*0.02, u = tRnd(i+300);
      const gy = meadow + H*0.008 + u*H*0.24, gs = W*(0.014 + 0.028*u);
      if (onRoad(gx, gy, W*0.055 + gs)) continue;
      titleGrass(g, gx, gy, gs, gcol[i%3]);
    }
  });
  return o.c;
}

/* --- 題字の ロゴ。**まわりに 余白を とること。**
   王かんむりと ひかりは わくの 外に はみ出すので、
   ぴったりの 大きさで 焼くと 上が 切れます --- */
function titleBakeLogo(G){
  const px = G.logoW*0.07, py = G.logoH*0.24;
  const o = titleCanvas(G.logoW + px*2, G.logoH + py*2), g = o.g;
  withCtx(g, () => titleLogo(g, px + G.logoW/2, py, G.logoW));
  return { cv:o.c, px, py, w:G.logoW + px*2, h:G.logoH + py*2 };
}

function titleEnsure(G){
  const key = [G.W, G.H, TDPR, Math.round(G.logoTop)].join('/');
  if (titleBake.key === key && titleBake.scene) return;
  titleBake.key   = key;
  titleBake.geom  = G;
  titleBake.scene = titleBakeScene(G);
  titleBake.logo  = titleBakeLogo(G);
}

function paintTitle(t){
  const cv = titleCv; if (!cv) return;
  const g = cv.getContext('2d');
  const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
  const pw = Math.round(W*TDPR), ph = Math.round(H*TDPR);
  if (cv.width !== pw || cv.height !== ph){
    cv.width = pw; cv.height = ph;
    cv.style.width = W+'px'; cv.style.height = H+'px';
  }
  g.setTransform(TDPR, 0, 0, TDPR, 0, 0);
  /* 消すのは 実寸で ぜんぶ。CSSピクセルで 消すと 消しのこる */
  g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height); g.restore();

  const G = titleGeom(W, H);
  titleEnsure(G);
  const { hz, cs, dyC, meadow, logoW, logoH, logoTop, txTop, bez } = G;

  withCtx(g, () => {
    const TAU = 6.2832;

    /* --- 空・にじ・城・じめん（焼きこみ・1まい）--- */
    g.drawImage(titleBake.scene, 0, 0, W, H);

    /* --- 1まいの 絵の モード。絵は そのまま、上に のせるのは
       きらめきと 玉ボケと 流れ星だけ（絵を こわさない）--- */
    if (titleBake.poster){
      const PST = titleBake.poster;
      /* 星は 上の つぎたしの 中だけ */
      g.fillStyle = '#ffffff';
      for (let i=0;i<26;i++){
        const d = 1.4 + tRnd(i+1900)*2.6;
        g.globalAlpha = 0.16 + 0.40*Math.abs(Math.sin(t*0.9 + i*1.7));
        g.fillRect(tRnd(i+50)*W - d/2, tRnd(i+900)*Math.max(40, PST.iy)*0.98 - d/2, d, d);
      }
      g.globalAlpha = 1;
      /* ながれる くも（上の つぎたしの 中だけ）。絵の 雲と けんかしない よわさで */
      if (PST.iy > 90){
        const CL2 = [[0.16,0.30,0.060,0.40],[0.70,0.14,0.048,0.32],[0.44,0.55,0.038,0.26]];
        CL2.forEach(([bx, by, br, a], i) => {
          const x = (((bx + t*(0.0045 + i*0.0012)) % 1.30) - 0.15) * W;
          const y = PST.iy*by + Math.sin(t*0.4 + i)*2.5;
          const sp2 = titleCloudSprite(W*br);
          g.globalAlpha = a;
          g.drawImage(sp2.cv, x - sp2.ox, y - sp2.oy, sp2.w, sp2.h);
        });
        g.globalAlpha = 1;
      }
      /* 流れ星（上の そらだけ） */
      {
        const PER = 6.2, k = Math.floor(t / PER), u = (t % PER) / 1.15;
        const skyH = Math.max(H*0.14, PST.iy);
        if (u <= 1){
          const a0 = 0.30 + tRnd(k*7+3)*0.26;
          const x0 = W*(0.06 + tRnd(k*7+1)*0.60), y0 = skyH*(0.10 + tRnd(k*7+2)*0.55);
          const len = W*0.55, px = x0 + Math.cos(a0)*len*u, py = y0 + Math.sin(a0)*len*u;
          const tl = W*0.18, fade = Math.sin(u*Math.PI);
          const gr4 = g.createLinearGradient(px - Math.cos(a0)*tl, py - Math.sin(a0)*tl, px, py);
          gr4.addColorStop(0, 'rgba(255,255,255,0)');
          gr4.addColorStop(1, 'rgba(255,255,255,' + (fade*0.85).toFixed(3) + ')');
          g.strokeStyle = gr4; g.lineWidth = W*0.005; g.lineCap = 'round';
          g.beginPath(); g.moveTo(px - Math.cos(a0)*tl, py - Math.sin(a0)*tl); g.lineTo(px, py); g.stroke();
          g.globalAlpha = fade; sparkle(px, py, W*0.014, t*3, '#ffffff'); g.globalAlpha = 1;
        }
      }
      /* 玉ボケ */
      const boke2 = ['255,255,255','200,242,255','255,246,200','255,206,232','214,196,255'];
      for (let i=0;i<12;i++){
        const bx = ((i*0.1637 + 0.06) % 1) * W;
        const by = (((i*0.2113 + 0.20 - t*0.011) % 1.25) + 1.25) % 1.25 * H - H*0.12;
        const br = W*(0.013 + (i%5)*0.011), c = boke2[i%5];
        const sp6 = titleGlow('bok'+(i%5), [[0,'rgba('+c+',.24)'],[0.66,'rgba('+c+',.16)'],
                                            [0.90,'rgba('+c+',.36)'],[1,'rgba('+c+',0)']]);
        g.drawImage(sp6, bx - br, by - br, br*2, br*2);
      }
      /* キラキラ。ひかえめに */
      for (let i=0;i<12;i++){
        const px = ((i*0.1873 + 0.04 + t*0.008*(1 + i%3)) % 1.1 - 0.05) * W;
        const py = ((i*0.2437 + 0.05) % 1) * H*0.94;
        g.globalAlpha = 0.22 + 0.30*Math.abs(Math.sin(t*1.5 + i));
        sparkle(px, py, W*(0.0040 + (i%3)*0.0026), t*0.5 + i, i%2 ? '#ffffff' : '#fff2c8');
      }
      g.globalAlpha = 1;
      return titleFinish(g, t, W, H);
    }

    /* --- にじの キラキラ。こまかい 粉を たくさん --- */
    const bcx = W*0.34, bcy = hz + H*0.16, brd = W*1.05, bwd = W*0.040;
    g.fillStyle = '#ffffff';
    for (let i=0;i<90;i++){
      const ang = Math.PI*1.01 + tRnd(i)*Math.PI*0.98;
      const rr2 = brd - bwd*(tRnd(i+700)*6.3);
      const d = W*(0.0032 + 0.0048*tRnd(i+1400));
      g.globalAlpha = (0.18 + 0.72*Math.abs(Math.sin(t*1.9 + i*2.3))) * 0.85;
      g.fillRect(bcx + Math.cos(ang)*rr2 - d/2, bcy + Math.sin(ang)*rr2 - d/2, d, d);
    }
    for (let i=0;i<10;i++){
      const ang = Math.PI*1.05 + (i/9)*Math.PI*0.90;
      const rr2 = brd - bwd*(0.8 + (i*2.7 % 5.0));
      g.globalAlpha = 0.35 + 0.50*Math.abs(Math.sin(t*1.3 + i*1.9));
      sparkle(bcx + Math.cos(ang)*rr2, bcy + Math.sin(ang)*rr2,
              W*(0.005 + (i%3)*0.0035), t*0.4 + i, '#ffffff');
    }
    /* --- ちいさな 星 --- */
    g.fillStyle = '#ffffff';
    for (let i=0;i<52;i++){
      const d = 1.6 + tRnd(i+1900)*3;
      g.globalAlpha = 0.16 + 0.44*Math.abs(Math.sin(t*0.9 + i*1.7));
      g.fillRect(tRnd(i+50)*W - d/2, tRnd(i+900)*hz*0.98 - d/2, d, d);
    }
    g.globalAlpha = 1;

    /* --- ながれる くも。焼いた 1まいを 貼るだけ --- */
    const CL = [[0.18,0.115,0.076,0.72],[0.74,0.062,0.056,0.54],[0.46,0.205,0.042,0.38]];
    CL.forEach(([bx, by, br, a], i) => {
      const x = (((bx + t*(0.0055 + i*0.0014)) % 1.36) - 0.18) * W;
      const y = H*by + Math.sin(t*0.45 + i)*3;
      const sp2 = titleCloudSprite(W*br);
      g.globalAlpha = a;
      g.drawImage(sp2.cv, x - sp2.ox, y - sp2.oy, sp2.w, sp2.h);
      g.globalAlpha = 1;
    });

    /* --- 城の まどの あかりと、まわる うずまき --- */
    titleCastleLive(g, t);

    /* --- 道を のぼる 光。城へ みちびく「まほうの ともしび」 --- */
    {
      const u = (t*0.20) % 1.35;
      if (u <= 1){
        const fade = Math.sin(u*Math.PI);
        const sp3 = titleGlow('road', [[0,'rgba(255,252,226,1)'],[1,'rgba(255,244,196,0)']]);
        for (let k=0;k<9;k++){
          const uu = Math.max(0, u - k*0.020);
          const [lx, ly] = bez(uu);
          const rr = W*(0.020 - k*0.0016);
          if (rr <= 0) break;
          g.globalAlpha = fade * (1 - k/9) * 0.55;
          g.drawImage(sp3, lx - rr, ly - rr, rr*2, rr*2);
        }
        g.globalAlpha = 1;
        const [lx, ly] = bez(u);
        g.globalAlpha = fade; sparkle(lx, ly, W*0.014, t*2.2, '#fffdf0'); g.globalAlpha = 1;
      }
    }

    /* --- 光の玉。ホタルのように ふわふわ --- */
    {
      const sp4 = titleGlow('orb', [[0,'rgba(255,252,224,.85)'],
        [0.24,'rgba(255,238,198,.32)'],[1,'rgba(255,238,198,0)']]);
      for (let i=0;i<9;i++){
        const ox = W*(0.06 + 0.88*tRnd(i+5200)) + Math.sin(t*0.34 + i*1.7)*W*0.045;
        const oy = hz + H*(0.02 + 0.26*tRnd(i+6100)) + Math.cos(t*0.29 + i*2.3)*H*0.020;
        const orr = W*(0.010 + 0.010*tRnd(i+7000))*3.2;
        g.globalAlpha = 0.30 + 0.45*Math.abs(Math.sin(t*0.8 + i*1.9));
        g.drawImage(sp4, ox - orr, oy - orr, orr*2, orr*2);
      }
      g.globalAlpha = 1;
    }

    /* --- 流れ星。6.2秒に 1回 --- */
    {
      const PER = 6.2, k = Math.floor(t / PER), u = (t % PER) / 1.15;
      if (u <= 1){
        const a0 = 0.34 + tRnd(k*7+3)*0.30;
        const x0 = W*(0.08 + tRnd(k*7+1)*0.62), y0 = hz*(0.04 + tRnd(k*7+2)*0.34);
        const len = W*0.62, px = x0 + Math.cos(a0)*len*u, py = y0 + Math.sin(a0)*len*u;
        const tl = W*0.20, fade = Math.sin(u*Math.PI);
        const gr4 = g.createLinearGradient(px - Math.cos(a0)*tl, py - Math.sin(a0)*tl, px, py);
        gr4.addColorStop(0, 'rgba(255,255,255,0)');
        gr4.addColorStop(1, 'rgba(255,255,255,' + (fade*0.85).toFixed(3) + ')');
        g.strokeStyle = gr4; g.lineWidth = W*0.006; g.lineCap = 'round';
        g.beginPath(); g.moveTo(px - Math.cos(a0)*tl, py - Math.sin(a0)*tl); g.lineTo(px, py); g.stroke();
        g.globalAlpha = fade; sparkle(px, py, W*0.016, t*3, '#ffffff'); g.globalAlpha = 1;
      }
    }

    /* --- なかま。大きさと こさで おく・なか・手まえを つくる --- */
    for (const c of TITLE_CAST){
      const im = c.k ? ART_SPRITE[c.k] : null;
      if (c.k && !im) continue;                 // 絵が まだ 読めていない子は とばす
      const s = cs*c.s, x = W*c.x, y0 = hz + H*c.y + dyC;
      const y = y0 + Math.sin(t*1.4 + c.ph)*s*0.055;
      g.save();
      g.globalAlpha = c.a;
      g.fillStyle = 'rgba(120,90,120,.16)';
      g.beginPath(); g.ellipse(x, y0 + s*0.46, s*0.30, s*0.075, 0, 0, TAU); g.fill();
      if (im) g.drawImage(im, x - s/2, y - s/2, s, s);
      else titleLolly(g, x, y, s);
      g.restore();
    }

    /* --- 手まえの かすみ。題字の 下じきにも なる --- */
    const hazeTop = txTop - H*0.10;
    const hg = g.createLinearGradient(0, hazeTop, 0, H);
    hg.addColorStop(0, 'rgba(255,216,230,0)'); hg.addColorStop(1, 'rgba(250,188,213,.62)');
    g.fillStyle = hg; g.fillRect(0, hazeTop, W, H - hazeTop);

    /* --- 題字（焼きこみ）＋ うごく ところだけ 上に --- */
    const LG = titleBake.logo;
    g.drawImage(LG.cv, W*0.5 - logoW/2 - LG.px, logoTop - LG.py, LG.w, LG.h);
    titleLogoLive(g, W*0.5, logoTop, logoW, t);

    /* --- シャボン玉。ゆっくり のぼる --- */
    {
      const sp5 = titleSprite('bubble', (gg, x, y, r) => {
        const gr = gg.createRadialGradient(x, y, r*0.20, x, y, r);
        gr.addColorStop(0.00, 'rgba(255,255,255,0)');
        gr.addColorStop(0.70, 'rgba(214,236,255,.45)');
        gr.addColorStop(0.90, 'rgba(255,224,244,1)');
        gr.addColorStop(1.00, 'rgba(255,255,255,0)');
        gg.fillStyle = gr; gg.beginPath(); gg.arc(x, y, r, 0, 6.2832); gg.fill();
        gg.fillStyle = 'rgba(255,255,255,.95)';
        gg.beginPath(); gg.ellipse(x - r*0.36, y - r*0.40, r*0.17, r*0.11, -0.6, 0, 6.2832); gg.fill();
      });
      for (let i=0;i<6;i++){
        const bx2 = W*(0.06 + 0.88*tRnd(i+11000)) + Math.sin(t*0.22 + i*2.1)*W*0.030;
        const by2 = (((tRnd(i+12000) + 1 - t*0.020) % 1.2) + 1.2) % 1.2 * H - H*0.10;
        const br2 = W*(0.026 + 0.020*tRnd(i+13000));
        g.globalAlpha = 0.22 + 0.16*Math.abs(Math.sin(t*0.6 + i));
        g.drawImage(sp5, bx2 - br2, by2 - br2, br2*2, br2*2);
      }
      g.globalAlpha = 1;
    }

    /* --- 玉ボケ。白だけに しない。ふちを 明るくすると 玉ボケらしくなる --- */
    const boke = ['255,255,255','200,242,255','255,246,200','255,206,232','214,196,255'];
    for (let i=0;i<14;i++){
      const bx = ((i*0.1637 + 0.06) % 1) * W;
      const by = (((i*0.2113 + 0.20 - t*0.011) % 1.25) + 1.25) % 1.25 * H - H*0.12;
      const br = W*(0.014 + (i%5)*0.012), c = boke[i%5];
      /* ふちを 明るく すると ほんものの 玉ボケらしく なる */
      const sp6 = titleGlow('bok'+(i%5), [[0,'rgba('+c+',.24)'],[0.66,'rgba('+c+',.16)'],
                                          [0.90,'rgba('+c+',.36)'],[1,'rgba('+c+',0)']]);
      g.drawImage(sp6, bx - br, by - br, br*2, br*2);
    }

    /* --- キラキラと こまかい 粉 --- */
    for (let i=0;i<15;i++){
      const px = ((i*0.1873 + 0.04 + t*0.008*(1 + i%3)) % 1.1 - 0.05) * W;
      const py = ((i*0.2437 + 0.05) % 1) * H*0.96;
      g.globalAlpha = 0.26 + 0.36*Math.abs(Math.sin(t*1.5 + i));
      sparkle(px, py, W*(0.0045 + (i%3)*0.0028), t*0.5 + i, i%2 ? '#ffffff' : '#fff2c8');
    }
    g.fillStyle = '#ffffff';
    for (let i=0;i<26;i++){
      const d = 1.6 + tRnd(i+4000)*2.8;
      g.globalAlpha = 0.12 + 0.42*Math.abs(Math.sin(t*1.6 + i*2.1));
      g.fillRect(tRnd(i+2600)*W - d/2, hz*0.9 + tRnd(i+3300)*H*0.30 - d/2, d, d);
    }
    g.globalAlpha = 1;

    titleFinish(g, t, W, H);
  });
}

/* とじる 演出と まわりを おとすのは、どちらの モードでも 共通 */
function titleFinish(g, t, W, H){
  withCtx(g, () => {
    const TAU = 6.2832;
    /* --- 「はじめる」を おしたら、光の わっかが ひろがって 国へ 入る --- */
    if (titleExit){
      const ex = (performance.now() - titleExit) / 1000, EX = 0.46;
      const u = Math.min(1, ex / EX);
      const b = $('titleGo').getBoundingClientRect();
      const bx = b.left + b.width/2, by = b.top + b.height/2;
      const maxR = Math.hypot(Math.max(bx, W-bx), Math.max(by, H-by));
      /* わっかは 白では なく 色を つけること。白い とばしと かさなって 消えます */
      g.save();
      g.globalAlpha = (1 - u) * 0.95;
      g.strokeStyle = '#ff9ecf'; g.lineWidth = W*0.055*(1 - u*0.55);
      g.beginPath(); g.arc(bx, by, maxR*u*1.02, 0, TAU); g.stroke();
      g.strokeStyle = '#b98fff'; g.lineWidth = W*0.026*(1 - u*0.55);
      g.beginPath(); g.arc(bx, by, maxR*u*0.80, 0, TAU); g.stroke();
      g.strokeStyle = '#8fe3ff'; g.lineWidth = W*0.014*(1 - u*0.55);
      g.beginPath(); g.arc(bx, by, maxR*u*0.60, 0, TAU); g.stroke();
      g.restore();
      /* 白い とばしは わっかより あと。はじめから かけると わっかが 見えない */
      const fu = Math.max(0, (u - 0.30) / 0.70);
      const fl = g.createRadialGradient(bx, by, 0, bx, by, maxR);
      fl.addColorStop(0, 'rgba(255,255,255,' + (fu*0.96).toFixed(3) + ')');
      fl.addColorStop(Math.min(0.98, 0.20 + fu*0.75), 'rgba(255,244,252,' + (fu*0.60).toFixed(3) + ')');
      fl.addColorStop(1, 'rgba(255,244,252,0)');
      g.fillStyle = fl; g.fillRect(0, 0, W, H);
      for (let i=0;i<22;i++){
        const a = i/22*TAU + 0.2, d = maxR*u*(0.55 + 0.45*tRnd(i+8100));
        g.globalAlpha = (1 - u);
        sparkle(bx + Math.cos(a)*d, by + Math.sin(a)*d*0.8,
                W*(0.010 + 0.010*tRnd(i+8800)), t*2 + i, i%2 ? '#ffffff' : '#ffe6f6');
      }
      g.globalAlpha = 1;
    }

    /* --- まわりを ほんの少し おとす。まん中に 目が いく --- */
    const vg = g.createRadialGradient(W*0.5, H*0.44, Math.min(W,H)*0.34,
                                      W*0.5, H*0.44, Math.max(W,H)*0.76);
    vg.addColorStop(0, 'rgba(120,90,120,0)'); vg.addColorStop(1, 'rgba(120,90,120,.13)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  });
}

function titleLoop(ts){
  if (!titleT0) titleT0 = ts;
  paintTitle((ts - titleT0)/1000);
  titleRaf = requestAnimationFrame(titleLoop);
}
function openTitle(){
  titleExit = 0; titleOv.classList.remove('out');
  /* ?dbg=1 は 検査どうぐの 入り口。表紙は 画面ぜんぶを おおうので、
     出したままだと tools/check-path.mjs が 盤面を さわれません */
  if (location.search.includes('dbg=1')) return;
  titleOv.classList.add('on');
  titleT0 = 0;
  if (!titleRaf) titleRaf = requestAnimationFrame(titleLoop);
}
function closeTitle(){
  titleOv.classList.remove('on');
  if (titleRaf){ cancelAnimationFrame(titleRaf); titleRaf = 0; }
  resize();      // セーフエリアが 出そろってから もう一度 はかる
}
$('titleGo').onclick = () => {
  if (titleExit) return;                 // 2度おしで 演出が 重ならないように
  /* ここが その回 はじめての タップ。
     WebAudio は 手を ふれるまで 鳴らせないので、この音で ふうを ときます */
  playSnd([[660,.10,'triangle',.05,1.5],[880,.14,'triangle',.05,1.6,90],
           [1320,.22,'sine',.045,1.8,180]]);
  vib([12, 40, 22]);
  /* うごきを へらす せっていの人は 演出なしで すぐ とじる */
  const slow = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (slow){ closeTitle(); return; }
  titleExit = performance.now();
  titleOv.classList.add('out');          // 文字は すっと 消す
  setTimeout(closeTitle, 460);
};
/* 画面の むきが かわったら 1まい えがきなおす（とじていても 害はない） */
window.addEventListener('resize', () => { if (titleRaf) paintTitle(0); });

checkLife();      // 💗の回復まちの途中なら、その画面にもどす
hintGuide();      // はじめての人には 📕 を 光らせて ガイドの ありかを 教える
openTitle();      // 表紙（本でいう 表紙）から はじまる

game = new Phaser.Game({
  type: Phaser.CANVAS,        // 絵は Canvas 2D で描くので いまは WebGL にしない
  parent: 'cv',
  width: COLS*CELL*DPR, height: ROWS*CELL*DPR,
  transparent: true,          // 角まるの 外がわを すかすため
  scene: BoardScene,
  scale: { mode: Phaser.Scale.NONE, zoom: 1/DPR },
  banner: false,
  audio: { noAudio: true },   // 音は じぶんの WebAudio でならす
});

/* 検査ツール（tools/check-chars.mjs）から えがく関数を よべるようにする。
   ゲーム本体は 外から さわられたくないので、検査に いる2つだけ 出す */
window.__chk = {
  buildRoster, drawGen,
  /* 絵に さしかえた子の キー。検査で 「絵が あるのに つかわれない子」を
     数える ために 出す。drawGen と おなじ 式で キーを 作る こと */
  artKeyOf,                                   // drawGen が つかう ものと 同じ 関数
  artHas: k => !!ART_SPRITE[k],
  /* てきの 顔ぶれ。国ごとに しぼっているので、どの国にも 入れ わすれた子は
     一生 出てこない。それを 検査で 見つける ために 出す */
  enemyLook, enemyKinds: () => Object.keys(ENEMIES), LAP_WAVES,
  eggs: () => EGGS,
  eggPick, eggPool, eggOdds, artKeyOf2: artKeyOf, isLegKey: k => DEX_LEGEND.has(k),
  isGoldKey: k => DEX_GOLD.has(k),
  openEgg: () => openEggScreen(''),
  artKeys: () => ART_KEYS,
  themeOfStage, chars: () => CHARS.map(c => c.name),
  // アバターも キャラなので おなじ検査に かける。
  // ぜんぶの くみあわせは 何万とおりも あるので、各こうもくを もれなく 1回は とおす数だけ 作る
  avatarSamples: () => {
    const N = Math.max(AV_SKIN.length, AV_HAIR.length, AV_HAIRC.length, AV_EYE.length,
                       AV_MOUTH.length, AV_WEAR.length, AV_WEARC.length, AV_ACC.length);
    const out = [];
    for (let i = 0; i < N * 3; i++)
      // かけ算で ずらすと 約数の ぶんだけ 出ない番号が できる（3と12なら 4つしか 出ない）。
      // ぜんぶ とおすために、そのまま あまりを つかう
      out.push({ n:'見本' + i, s:i%AV_SKIN.length, h:i%AV_HAIR.length, hc:i%AV_HAIRC.length,
                 e:i%AV_EYE.length, m:i%AV_MOUTH.length, w:i%AV_WEAR.length,
                 wc:(i+3)%AV_WEARC.length, a:i%AV_ACC.length });
    return out;
  },
  drawAvatar, portraitShade,
  /* つりあいの 検査（tools/sim.mjs）用。数字を いじったら かならず かけなおす */
  bal: { hpScale, goldWave, upMul, waveList, waveMod, ENEMIES, TOWERS, maxLvAt: w => 3 + Math.floor(w/10),
         makeWay, wayMeasure, LAP_WAVES },
  AV_HAIR, AV_WEAR, AV_ACC, AV_EYE, AV_MOUTH,
};
/* 見た目の たしかめ用。?dbg=1 のときだけ 出す。
   ふつうに あそぶときに ウェーブを とばせてしまうと 自己ベストの いみが なくなる */
if (location.search.includes('dbg=1')) window.__dbg = {
  /* ぜんぶ IIFE の 中なので、外から 見るには ここに 出すしか ない。
     画像に さしかわった子が どれか（＝ 絵が 読めたか）を たしかめる */
  art: () => Object.keys(ART_SPRITE),
  /* 似顔絵（drawPortrait）を 1つ えがいて 画像で かえす。
     __dbg.draw は コレクション（drawGen）用なので べつに いる */
  portrait: (id, S) => {
    S = S || 130;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const g = c.getContext('2d');
    drawPortrait(g, id, S); portraitShade(g, S);
    return c.toDataURL('image/png');
  },
  /* 絵が あるのに つかわれていない子を さがす。
     drawGen が 見る キーと、id を 作る キーが ちがうと そうなる */
  artAudit: () => GEN_LIST.filter(o => !o.rainbow).map(o => {
    const k = o.opt && o.opt.key ? o.opt.key : o.body;   // drawGen と 同じ 式
    return { n:o.name, body:o.body, key:k, has:!!ART_SPRITE[k], used:!!ART_SPRITE[k] };
  }),
  /* 1体を えがいて 画像で かえす。ぜんぶ IIFE の 中なので、
     外から 見た目を たしかめるには ここを とおすしか ない。
     にじいろが 絵に かかっているかを 見るのに つかった */
  draw: (id, S) => {
    const o = GEN_BY_ID[id]; if (!o) return null;
    S = S || 130;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const g = c.getContext('2d');
    drawGen(g, S, o); portraitShade(g, S); drawGenFx(g, S, o);
    return c.toDataURL('image/png');
  },
  setWave: w => { wave = w; syncHUD(); },
  /* クリア画面の 見た目を たしかめる。ステージNまで あそばずに 出せる */
  stageClear: n => { wave = n * STAGE_WAVES; stageClear(); },
  /* ワザを 1つ ためす。バーは 7こまでなので、はっていない子は 押せない */
  skill: ch => { const s = SKILLS.find(x => x.ch === ch);
                 if (!s) return 'そのワザは ない';
                 skStock[ch] = Math.max(skStock[ch], 1); skCd[ch] = 0; useSkill(s); return 'つかった'; },
  enemyD: () => enemies.map(e => Math.round(e.d)),
  /* 敵が 道の 上に いるか。posAt が かえす いちが pathCells に 入っているかで しらべる */
  enemyPos: () => enemies.map(e => {
    const p = posAt(e.d);
    const c = Math.floor(p.x/CELL), r = Math.floor(p.y/CELL);
    return { d:Math.round(e.d), x:Math.round(p.x), y:Math.round(p.y), c, r,
             道の上: pathCells.has(key(c, r)) };
  }),
  way: () => ({ WAY, CELL, pathLen: Math.round(pathLen), cells: pathCells.size }),
  /* 焼いた じめんの 色を よむ。敵の 絵が かぶらないので、
     「その いちが 道か じめんか」を 正しく しらべられる */
  groundAt: (x, y) => {
    if (!groundCv) return null;
    const g = groundCv.getContext('2d');
    const p = g.getImageData(Math.round(x*DPR), Math.round(y*DPR), 1, 1).data;
    return [p[0], p[1], p[2]];
  },
  cellPx: () => CELL,
  /* わざと ますの 大きさだけ 変えて、まもりが 直すかを ためす */
  breakCell: () => { CELL = CELL + 14; return CELL; },
  /* わざと canvas を 大きくして 赤で ぬり、消しのこりが 出ないかを ためす */
  breakCanvas: () => { const c = game.canvas;
    c.width = c.width * 2; c.height = c.height * 2;
    const g = c.getContext('2d'); g.setTransform(1,0,0,1,0,0);
    g.fillStyle = '#ff0000'; g.fillRect(0,0,c.width,c.height);
    return c.width + 'x' + c.height; },
  canvasSize: () => game.canvas.width + 'x' + game.canvas.height,
  wantSize: () => Math.round(COLS*CELL*DPR) + 'x' + Math.round(ROWS*CELL*DPR),
  camSize: () => { const sc = game.scene.scenes[0];
    const c = sc && sc.cameras ? sc.cameras.main : null;
    return c ? c.width + 'x' + c.height + ' zoom' + c.zoom + ' scroll' + c.scrollX + ',' + c.scrollY : 'なし'; },
  redLeft: () => { const c = game.canvas, g = c.getContext('2d');
    const d = g.getImageData(0,0,c.width,c.height).data; let n = 0;
    for (let i=0;i<d.length;i+=4) if (d[i]>200 && d[i+1]<60 && d[i+2]<60) n++;
    return n; },
  /* 焼いた じめんを 1マスずつ よんで、道に ぬられているかを しらべる。
     その国の 道の色（p1/p2）と じめんの色（g1/g2）の どちらに 近いかで 見る。
     色を きめうちに すると 国ごとに ちがうので まちがえる */
  groundAudit: () => {
    if (!groundCv) return { err:'まだ 焼いていない' };
    const g = groundCv.getContext('2d');
    const T = themeOf(wave);
    const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const road = [hex(T.p1), hex(T.p2)], dirt = [hex(T.g1), hex(T.g2)];
    const near = (p, list) => Math.min(...list.map(q => Math.hypot(p[0]-q[0], p[1]-q[1], p[2]-q[2])));
    const ng = [];
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      const d = g.getImageData(Math.round(cx(c)*DPR), Math.round(cy(r)*DPR), 1, 1).data;
      const p = [d[0], d[1], d[2]];
      const 見た目 = near(p, road) < near(p, dirt);
      const 論理 = pathCells.has(key(c, r));
      if (見た目 !== 論理) ng.push({ c, r, 論理, 見た目, rgb:p.join(',') });
    }
    return { ng, CELL, way: WAY.join(';'), theme: T.name };
  },
  /* アイテムを ためす */
  give: (id, n) => { if (id) giveItem(id, n||1); else for (const it of ITEMS) giveItem(it.id, n||3);
                     buildSkillBar(); return JSON.stringify(gear); },
  gear: () => ({ ...gear }),
  useItem: id => { const it = ITEM_BY_ID[id]; if (!it) return 'ない'; useItem(it); return 'つかった'; },
  towersRb: () => towers.map(t => ({ k:t.k, rb:!!t.rb, dmg:Math.round(dmgOf(t)) }),),
  setStars: n => { stars = n; syncHUD(); syncShop(); },
  setTool: k => { selTool = k; },
  towers: () => towers.map(t => ({ k:t.k, c:t.c, r:t.r, sp:tSpan(t), lv:t.lv })),
  friendWave: () => friendWave,
  flyerTest: () => {   // どの でんせつが とぶか（見た目の たしかめ用）
    const owned = LEGENDS.filter(l => dex['lg_' + l.id]);
    const next = LEGENDS.find(l => !dex['lg_' + l.id]);
    const near = next && wave >= next.wave - 15;
    const canOwned = owned.length && wave >= 5;
    if (canOwned) return '所持ずみ';
    if (near) return next.name + 'の影';
    return 'なし';
  },
  life: () => life,
  setWeek: n => { weekDbg = n; },
  setGems: n => { gems = n; saveGems(); },
  giveTheme: id => { if (!bought.includes(id)) bought.push(id); saveBought();
                     themeSel = id; saveThemeSel(); applyThemeSel(); },
  themes: () => Object.keys(SP_THEMES).filter(hasTheme),
  gems: () => gems,
  weekly: () => weekly && weekly.name,
  pass: () => passLeft(),
  spent: () => monthSpent(),
  // レシートが 入ったときの ふるまいを ためす（本番は サーバーが 書く）
  setReceipt: r => { try{ r ? localStorage.setItem('sweetTD.receipt', JSON.stringify(r))
                            : localStorage.removeItem('sweetTD.receipt'); }catch(e){}
                     applyThemeSel(); },
  owned: () => SHOP_THEMES.map(t => t.id).filter(owns).concat(owns('pack_start') ? ['pack_start'] : []),
  setSpent: n => { try{ localStorage.setItem('sweetTD.spend', JSON.stringify({ m: monthKey(), yen: n })); }catch(e){} },
  setPass: d => setPassUntil(d ? Date.now() + d*86400000 : 0),
  leaveWeek: () => { closePanels(); leaveWeekly(); },
  queue: () => spawnQ.slice(),
  wave: () => wave,
  way: () => JSON.stringify(WAY),
  clear: () => { enemies.length = 0; spawnQ.length = 0; },
  setWay: a => { WAY = a; buildPath(); measurePath(); bakeGround(); },
  free: () => { let n=0; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!pathCells.has(key(c,r))) n++; return n; },
  pathLen: () => pathLen,
  setLife: v => { life = v; },
  stars: () => stars,
  shards: () => shards,
  bunch: () => {   // ともだちを ぎゅっと ならべて なまえの かさなりを 見る
    enemies = []; spawnSeq = 0; friendWave = true;
    for (let i = 0; i < avFriends.length; i++){
      spawnEnemy('golem', pathLen*0.42 + i*CELL*0.75);
      spawnSeq += 2;
    }
  },
  enemies: () => enemies.map(e => ({ k:e.k, av:e.av ? e.av.n : null, gi:e.gi ? e.gi.name : null })),
  run: () => { running = true; },
  fill: () => {
    enemies = []; spawnSeq = 0;
    const q = waveList(wave);
    for (let i = 0; i < 9; i++) spawnEnemy(q[i % q.length], (i + 0.6) / 10 * pathLen);
  },
};

})();
</script>
</body>
</html>
