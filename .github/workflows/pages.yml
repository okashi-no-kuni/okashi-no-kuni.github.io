name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ走らせる。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # sw.js が 古いまま 出ると、**直したのに 遊ぶ人には 古いままが 出ます。**
      # エラーも 出ないので 報告されるまで 気づけない。ここで 止めます
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sw.js が 最新か たしかめる
        run: node tools/build-sw.mjs --check

      # enablement: true で、設定画面を触らずに Pages を有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
